<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Clasptek Finance Management System</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary: #14213D;
      --primary-hover: #1f325c;
      --accent: #C1272D;
      --accent-hover: #a51f25;
      --success: #107C41;
      --success-bg: #EAF7EE;
      --warning: #B25E02;
      --warning-bg: #FFF4E5;
      --danger: #D13438;
      --danger-bg: #FDE7E9;
      --info: #0078D4;
      --info-bg: #EFF6FC;
      --neutral-bg: #F8F9FA;
      --surface-0: #FFFFFF;
      --surface-1: #FFFFFF;
      --surface-2: #F4F5F7;
      --border: #E2E8F0;
      --border-strong: #CBD5E1;
      --text-primary: #0F172A;
      --text-secondary: #475569;
      --text-muted: #94A3B8;
      --radius-sm: 6px;
      --radius-md: 10px;
      --radius-lg: 14px;
      --shadow-sm: 0 1px 3px rgba(0,0,0,0.06), 0 1px 2px rgba(0,0,0,0.04);
      --shadow-md: 0 4px 6px -1px rgba(0,0,0,0.08), 0 2px 4px -1px rgba(0,0,0,0.04);
      --shadow-lg: 0 10px 15px -3px rgba(0,0,0,0.1), 0 4px 6px -2px rgba(0,0,0,0.05);
      --font-sans: 'Inter', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      --sidebar-width: 260px;
      --sidebar-collapsed-width: 72px;
      --header-height: 64px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: var(--neutral-bg); color: var(--text-primary); font-family: var(--font-sans); line-height: 1.5; -webkit-font-smoothing: antialiased; }

    #root { min-height: 100vh; display: flex; }

    /* Main App Layout */
    .cp-layout { display: flex; width: 100%; min-height: 100vh; }

    /* Left Sidebar */
    .cp-sidebar {
      width: var(--sidebar-width);
      background: #FFFFFF;
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      position: sticky;
      top: 0;
      height: 100vh;
      transition: width 0.2s ease;
      z-index: 100;
      flex-shrink: 0;
    }

    .cp-sidebar.collapsed {
      width: var(--sidebar-collapsed-width);
    }

    .cp-sidebar.collapsed .cp-sidebar-brand-text,
    .cp-sidebar.collapsed .cp-nav-label,
    .cp-sidebar.collapsed .cp-nav-section-title,
    .cp-sidebar.collapsed .cp-user-info-text,
    .cp-sidebar.collapsed .cp-conn-text {
      display: none;
    }

    .cp-sidebar.collapsed .cp-sidebar-header {
      justify-content: center;
      padding: 16px 8px;
    }

    .cp-sidebar.collapsed .cp-nav-item {
      justify-content: center;
      padding: 10px;
    }

    .cp-sidebar-header {
      padding: 18px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--border);
      gap: 10px;
    }

    .cp-sidebar-brand {
      display: flex;
      align-items: center;
      gap: 10px;
      text-decoration: none;
      color: inherit;
    }

    .cp-sidebar-logo {
      height: 34px;
      width: auto;
      object-fit: contain;
    }

    .cp-sidebar-brand-text {
      display: flex;
      flex-direction: column;
    }

    .cp-brand-name {
      font-size: 13.5px;
      font-weight: 700;
      color: var(--primary);
      line-height: 1.2;
    }

    .cp-brand-sub {
      font-size: 10.5px;
      color: var(--text-muted);
      font-weight: 500;
    }

    .cp-collapse-btn {
      background: transparent;
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      color: var(--text-secondary);
      width: 28px;
      height: 28px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 13px;
      transition: all 0.15s ease;
    }
    .cp-collapse-btn:hover { background: var(--surface-2); color: var(--primary); }

    /* Navigation Menu */
    .cp-sidebar-nav {
      flex: 1;
      overflow-y: auto;
      padding: 14px 10px;
    }

    .cp-nav-section {
      margin-bottom: 16px;
    }

    .cp-nav-section-title {
      font-size: 10.5px;
      font-weight: 700;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.6px;
      padding: 4px 10px 6px;
    }

    .cp-nav-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 8.5px 12px;
      border-radius: var(--radius-sm);
      color: var(--text-secondary);
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      text-decoration: none;
      transition: all 0.15s ease;
      margin-bottom: 2px;
      user-select: none;
    }

    .cp-nav-item:hover {
      background: var(--surface-2);
      color: var(--primary);
    }

    .cp-nav-item.active {
      background: rgba(20, 33, 61, 0.08);
      color: var(--primary);
      font-weight: 600;
    }

    .cp-nav-icon {
      font-size: 15px;
      width: 20px;
      text-align: center;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .cp-nav-badge {
      margin-left: auto;
      background: var(--surface-2);
      color: var(--text-secondary);
      padding: 2px 7px;
      border-radius: 10px;
      font-size: 11px;
      font-weight: 600;
    }

    .cp-nav-item.active .cp-nav-badge {
      background: var(--primary);
      color: #fff;
    }

    /* Sidebar Footer */
    .cp-sidebar-footer {
      padding: 12px 14px;
      border-top: 1px solid var(--border);
      background: #FAFAFA;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .cp-conn-pill {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 11.5px;
      font-weight: 600;
      padding: 4px 8px;
      border-radius: 20px;
      background: var(--surface-2);
      border: 1px solid var(--border);
      color: var(--text-secondary);
    }

    .cp-conn-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #94A3B8;
    }

    .cp-conn-dot.connected { background: var(--success); }
    .cp-conn-dot.fallback { background: var(--warning); }

    .cp-user-card {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    .cp-user-info {
      display: flex;
      align-items: center;
      gap: 8px;
      overflow: hidden;
    }

    .cp-user-avatar {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background: var(--primary);
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 12.5px;
      flex-shrink: 0;
    }

    .cp-user-info-text {
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .cp-user-name {
      font-size: 12.5px;
      font-weight: 700;
      color: var(--primary);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .cp-user-role {
      font-size: 11px;
      color: var(--text-secondary);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .cp-signout-btn {
      background: transparent;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      font-size: 15px;
      padding: 4px;
      border-radius: var(--radius-sm);
      transition: color 0.15s ease;
    }
    .cp-signout-btn:hover { color: var(--danger); }

    /* Main Area */
    .cp-main-area {
      flex: 1;
      display: flex;
      flex-direction: column;
      min-width: 0;
      overflow-x: hidden;
    }

    /* Topbar Header */
    .cp-topbar {
      height: var(--header-height);
      background: #FFFFFF;
      border-bottom: 1px solid var(--border);
      padding: 0 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: sticky;
      top: 0;
      z-index: 90;
      gap: 16px;
    }

    .cp-topbar-left {
      display: flex;
      align-items: center;
      gap: 16px;
      flex: 1;
    }

    .cp-breadcrumb {
      font-size: 13.5px;
      font-weight: 600;
      color: var(--primary);
      display: flex;
      align-items: center;
      gap: 6px;
      white-space: nowrap;
    }

    .cp-breadcrumb span { color: var(--text-muted); font-weight: 400; }

    /* Global Omni-Search */
    .cp-omni-search {
      position: relative;
      width: 100%;
      max-width: 420px;
    }

    .cp-omni-input {
      width: 100%;
      padding: 8px 12px 8px 34px;
      border: 1px solid var(--border);
      border-radius: 20px;
      background: var(--surface-2);
      font-size: 12.5px;
      font-family: var(--font-sans);
      color: var(--text-primary);
      transition: all 0.15s ease;
    }

    .cp-omni-input:focus {
      outline: none;
      background: #fff;
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(20, 33, 61, 0.08);
    }

    .cp-omni-icon {
      position: absolute;
      left: 12px;
      top: 50%;
      transform: translateY(-50%);
      font-size: 13px;
      color: var(--text-muted);
      pointer-events: none;
    }

    .cp-search-dropdown {
      position: absolute;
      top: calc(100% + 6px);
      left: 0;
      right: 0;
      background: #fff;
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      box-shadow: var(--shadow-lg);
      max-height: 380px;
      overflow-y: auto;
      z-index: 200;
      display: none;
    }

    .cp-search-dropdown.active { display: block; }

    .cp-search-group-title {
      font-size: 10.5px;
      font-weight: 700;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      padding: 8px 12px 4px;
      background: var(--surface-2);
      border-bottom: 1px solid var(--border);
    }

    .cp-search-result-item {
      padding: 10px 12px;
      border-bottom: 1px solid var(--border);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: space-between;
      transition: background 0.15s ease;
      font-size: 12.5px;
    }

    .cp-search-result-item:last-child { border-bottom: none; }
    .cp-search-result-item:hover { background: var(--surface-2); }

    .cp-topbar-right {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    /* Action Dropdown Menu */
    .cp-dropdown-wrap {
      position: relative;
    }

    .cp-dropdown-menu {
      position: absolute;
      top: calc(100% + 6px);
      right: 0;
      background: #fff;
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      box-shadow: var(--shadow-lg);
      min-width: 200px;
      z-index: 200;
      display: none;
      padding: 4px 0;
    }

    .cp-dropdown-menu.active { display: block; }

    .cp-dropdown-item {
      padding: 9px 14px;
      font-size: 12.5px;
      font-weight: 500;
      color: var(--text-primary);
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 8px;
      transition: background 0.15s ease;
    }
    .cp-dropdown-item:hover { background: var(--surface-2); color: var(--primary); }

    /* Content Area */
    .cp-content-view {
      padding: 24px;
      flex: 1;
      max-width: 1400px;
      width: 100%;
      margin: 0 auto;
    }

    /* Cards & Containers */
    .cp-card { background: var(--surface-1); border: 1px solid var(--border); border-radius: var(--radius-md); padding: 20px; margin-bottom: 20px; box-shadow: var(--shadow-sm); }
    .cp-card-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; flex-wrap: wrap; gap: 10px; }
    .cp-section-title { font-size: 15px; font-weight: 700; color: var(--primary); display: flex; align-items: center; gap: 8px; }
    .cp-section-desc { font-size: 12px; color: var(--text-secondary); margin-top: 2px; }

    /* Grids & Stats */
    .cp-grid-4 { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 14px; margin-bottom: 20px; }
    .cp-grid-3 { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 14px; margin-bottom: 20px; }
    .cp-grid-2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(340px, 1fr)); gap: 16px; margin-bottom: 20px; }

    .cp-stat { background: var(--surface-1); border: 1px solid var(--border); border-radius: var(--radius-md); padding: 16px; position: relative; box-shadow: var(--shadow-sm); }
    .cp-stat-top { display: flex; align-items: center; justify-content: space-between; margin-bottom: 6px; }
    .cp-stat-label { font-size: 11.5px; font-weight: 600; color: var(--text-secondary); text-transform: uppercase; letter-spacing: 0.4px; }
    .cp-stat-value { font-size: 21px; font-weight: 800; color: var(--primary); letter-spacing: -0.4px; line-height: 1.2; }
    .cp-stat-sub { font-size: 11px; color: var(--text-muted); margin-top: 5px; }

    .cp-stat.accent-border { border-left: 4px solid var(--primary); }
    .cp-stat.income-border { border-left: 4px solid var(--success); }
    .cp-stat.expense-border { border-left: 4px solid var(--danger); }
    .cp-stat.receivable-border { border-left: 4px solid var(--warning); }

    /* Forms & Fields */
    .cp-field { display: flex; flex-direction: column; gap: 5px; margin-bottom: 14px; }
    .cp-field label { font-size: 11.5px; font-weight: 600; color: var(--text-secondary); text-transform: uppercase; letter-spacing: 0.3px; }
    .cp-field input, .cp-field select, .cp-field textarea {
      padding: 8.5px 12px; border: 1px solid var(--border); border-radius: var(--radius-sm); font-size: 13px;
      background: var(--surface-2); color: var(--text-primary); font-family: var(--font-sans); transition: all 0.15s ease;
    }
    .cp-field input:focus, .cp-field select:focus, .cp-field textarea:focus { outline: none; border-color: var(--primary); background: #fff; box-shadow: 0 0 0 3px rgba(20, 33, 61, 0.08); }
    .cp-row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .cp-row3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 12px; }
    .cp-row4 { display: grid; grid-template-columns: 2fr 1fr 1fr 1fr 40px; gap: 8px; align-items: end; }

    /* Buttons */
    .cp-btn { background: var(--primary); color: #fff; border: 1px solid transparent; border-radius: var(--radius-sm); padding: 8px 14px; font-size: 12.5px; font-weight: 600; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; gap: 6px; transition: all 0.15s ease; text-decoration: none; font-family: var(--font-sans); }
    .cp-btn:hover { background: var(--primary-hover); }
    .cp-btn.secondary { background: var(--surface-0); color: var(--primary); border: 1px solid var(--border-strong); }
    .cp-btn.secondary:hover { background: var(--surface-2); border-color: var(--primary); }
    .cp-btn.accent { background: var(--accent); color: #fff; }
    .cp-btn.accent:hover { background: var(--accent-hover); }
    .cp-btn.danger { background: var(--surface-0); color: var(--danger); border: 1px solid var(--danger); padding: 5px 9px; font-size: 11.5px; }
    .cp-btn.danger:hover { background: var(--danger-bg); }
    .cp-btn.sm { padding: 5.5px 11px; font-size: 12px; }

    /* Tables */
    .cp-table-wrap { overflow-x: auto; border: 1px solid var(--border); border-radius: var(--radius-md); background: #fff; }
    .cp-table { width: 100%; border-collapse: collapse; font-size: 12.5px; text-align: left; }
    .cp-table th { background: #FAFBFD; padding: 10px 12px; color: var(--text-secondary); font-weight: 600; font-size: 11.5px; text-transform: uppercase; letter-spacing: 0.3px; border-bottom: 1px solid var(--border); white-space: nowrap; }
    .cp-table td { padding: 11px 12px; border-bottom: 1px solid var(--border); vertical-align: middle; color: var(--text-primary); }
    .cp-table tr:last-child td { border-bottom: none; }
    .cp-table tr:hover td { background: rgba(244, 245, 247, 0.6); }

    /* Status Badges */
    .cp-pill { display: inline-flex; align-items: center; padding: 3px 8.5px; border-radius: 12px; font-size: 11.5px; font-weight: 600; text-transform: capitalize; }
    .cp-pill.paid, .cp-pill.reconciled, .cp-pill.approved, .cp-pill.recorded, .cp-pill.active { background: var(--success-bg); color: var(--success); }
    .cp-pill.partial, .cp-pill.pending_approval, .cp-pill.pending, .cp-pill.unreconciled, .cp-pill.open { background: var(--warning-bg); color: var(--warning); }
    .cp-pill.unpaid, .cp-pill.rejected, .cp-pill.cancelled, .cp-pill.voided, .cp-pill.locked, .cp-pill.discrepancy { background: var(--danger-bg); color: var(--danger); }
    .cp-pill.category-pill { background: var(--surface-2); color: var(--text-secondary); font-weight: 500; }

    /* Priority Badges */
    .prio-low { background: #F1F5F9; color: #475569; }
    .prio-medium { background: #FEF3C7; color: #92400E; }
    .prio-high { background: #FFEDD5; color: #C2410C; }
    .prio-critical { background: #FEE2E2; color: #991B1B; font-weight: 700; }

    /* Empty States */
    .cp-empty-state {
      text-align: center;
      padding: 48px 24px;
      background: #FFFFFF;
      border: 1px dashed var(--border);
      border-radius: var(--radius-md);
      margin: 12px 0;
    }

    .cp-empty-icon {
      font-size: 38px;
      color: var(--text-muted);
      margin-bottom: 12px;
    }

    .cp-empty-title {
      font-size: 15px;
      font-weight: 700;
      color: var(--primary);
      margin-bottom: 4px;
    }

    .cp-empty-desc {
      font-size: 12.5px;
      color: var(--text-secondary);
      max-width: 420px;
      margin: 0 auto 16px;
      line-height: 1.5;
    }

    /* Modals & Overlays */
    .cp-modal-overlay { position: fixed; inset: 0; background: rgba(15, 23, 42, 0.65); display: flex; align-items: center; justify-content: center; z-index: 999; padding: 16px; backdrop-filter: blur(2px); }
    .cp-modal { background: #fff; border-radius: var(--radius-lg); width: 100%; max-width: 580px; max-height: 90vh; display: flex; flex-direction: column; box-shadow: var(--shadow-lg); border: 1px solid var(--border); }
    .cp-modal.large { max-width: 840px; }
    .cp-modal.doc-modal { max-width: 890px; }
    .cp-modal-header { display: flex; align-items: center; justify-content: space-between; padding: 14px 18px; border-bottom: 1px solid var(--border); }
    .cp-modal-title { font-size: 15px; font-weight: 700; color: var(--primary); display: flex; align-items: center; gap: 8px; }
    .cp-modal-close { background: transparent; border: none; font-size: 18px; cursor: pointer; color: var(--text-muted); line-height: 1; padding: 4px; }
    .cp-modal-close:hover { color: var(--danger); }
    .cp-modal-body { padding: 18px; overflow-y: auto; }
    .cp-modal-footer { display: flex; justify-content: flex-end; gap: 8px; padding: 12px 18px; border-top: 1px solid var(--border); background: var(--surface-2); border-radius: 0 0 var(--radius-lg) var(--radius-lg); }

    /* A4 Document Paper for Invoices & Receipts */
    .cp-doc-paper { background: #fff; border: 1px solid var(--border); border-radius: var(--radius-md); padding: 32px 36px; box-shadow: var(--shadow-sm); font-size: 12.5px; color: var(--text-primary); }
    .cp-doc-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 24px; border-bottom: 2px solid var(--primary); padding-bottom: 16px; gap: 20px; }
    .cp-doc-meta-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 20px; background: #FAFBFD; padding: 16px; border-radius: var(--radius-sm); border: 1px solid var(--border); }
    .cp-doc-table { width: 100%; border-collapse: collapse; margin-bottom: 16px; }
    .cp-doc-table th { background: #14213D; color: #fff; padding: 9px 12px; font-size: 11.5px; text-transform: uppercase; letter-spacing: 0.5px; text-align: left; }
    .cp-doc-table td { padding: 10px 12px; border-bottom: 1px solid var(--border); font-size: 12px; }
    .cp-doc-totals { display: flex; justify-content: flex-end; margin-bottom: 20px; }
    .cp-doc-totals-box { width: 340px; border: 1px solid var(--border); border-radius: var(--radius-sm); background: #FAFBFD; padding: 12px 16px; }
    .cp-doc-total-row { display: flex; justify-content: space-between; padding: 4px 0; font-size: 12.5px; }
    .cp-doc-total-row.grand { border-top: 1.5px solid var(--primary); margin-top: 6px; padding-top: 6px; font-size: 14.5px; font-weight: 800; color: var(--primary); }
    .cp-doc-box { background: #F8F9FA; border-left: 4px solid var(--primary); padding: 12px 16px; border-radius: var(--radius-sm); margin-bottom: 16px; font-size: 12px; }
    .cp-doc-footer { display: flex; justify-content: space-between; align-items: flex-end; margin-top: 28px; border-top: 1px solid var(--border); padding-top: 16px; font-size: 11.5px; color: var(--text-secondary); }

    /* Auth Screen */
    .cp-auth-wrap { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; background: linear-gradient(135deg, #0B132B 0%, #1C2541 50%, #3A506B 100%); width: 100%; }
    .cp-auth-card { background: #fff; width: 100%; max-width: 460px; border-radius: 16px; padding: 32px 30px; box-shadow: 0 20px 25px -5px rgba(0,0,0,0.3), 0 10px 10px -5px rgba(0,0,0,0.2); }
    .cp-auth-header { text-align: center; margin-bottom: 22px; }

</head>
<body>
  <div id="root"></div>

  <script>
  (function() {
    // ----------------------------------------------------
    // STORAGE KEYS & CONFIGURATION (PHASES 1–6 PRODUCTION)
    // ----------------------------------------------------
    const STORE_KEY_PROGRAMMES = 'clasptek:programmes';
    const STORE_KEY_INVOICES = 'clasptek:invoices';
    const STORE_KEY_PAYMENTS = 'clasptek:payments';
    const STORE_KEY_COUNTERS = 'clasptek:counters';
    const STORE_KEY_EXPENSES = 'clasptek:expenses';
    const STORE_KEY_DIRECT_INCOME = 'clasptek:direct_income';
    const STORE_KEY_INCOME_CATEGORIES = 'clasptek:income_categories';
    const STORE_KEY_EXPENSE_CATEGORIES = 'clasptek:expense_categories';
    const STORE_KEY_BUDGETS = 'clasptek:budgets';
    const STORE_KEY_AUDIT_LOG = 'clasptek:finance_audit_log';
    const STORE_KEY_AUTH_SESSION = 'clasptek:auth_session';
    const SHARED = true;
    const DEFAULT_TENANT_ID = 'clasptek_main';

    const SYSTEM_ACCOUNTS = [
      { id: 'usr_admin', email: 'admin@clasptek.org', name: 'Emmanuel', role: 'Super Admin', title: 'Managing Director & Super Admin', tenant_id: DEFAULT_TENANT_ID },
      { id: 'usr_manager', email: 'manager@clasptek.org', name: 'Chioma Okonkwo', role: 'Finance Manager', title: 'Head of Finance & Operations', tenant_id: DEFAULT_TENANT_ID },
      { id: 'usr_staff', email: 'staff@clasptek.org', name: 'Tunde Bakare', role: 'Finance Staff', title: 'Finance & Billing Specialist', tenant_id: DEFAULT_TENANT_ID },
      { id: 'usr_viewer', email: 'auditor@clasptek.org', name: 'External Auditor', role: 'Finance Viewer', title: 'Audit & Compliance Viewer', tenant_id: DEFAULT_TENANT_ID }
    ];

    const STORE_KEY_USER_ROLE = 'clasptek:finance_user_role';
    const STORE_KEY_COLLECTION_NOTES = 'clasptek:collection_notes';
    const STORE_KEY_PAYMENT_REMINDERS = 'clasptek:payment_reminders';
    const STORE_KEY_RECURRING_EXPENSES = 'clasptek:recurring_expenses';
    const STORE_KEY_RECURRING_INVOICES = 'clasptek:recurring_invoices';
    const STORE_KEY_FINANCE_PERIODS = 'clasptek:finance_periods';
    const STORE_KEY_APPROVAL_SETTINGS = 'clasptek:finance_approval_settings';
    const STORE_KEY_RECONCILIATIONS = 'clasptek:reconciliations';
    const STORE_KEY_ANOMALIES_REVIEWED = 'clasptek:anomalies_reviewed';
    const STORE_KEY_SUPABASE_CONFIG = 'clasptek:supabase_config';

    const DEFAULT_INCOME_CATEGORIES = [
      'Student Tuition', 'IELTS', 'TOEFL', 'SAT', 'Tech Training', 'Corporate Training',
      'Consulting', 'Registration Fee', 'Application/Processing Fee', 'Other Income'
    ];

    const DEFAULT_EXPENSE_CATEGORIES = {
      'Staff & People': ['Salaries', 'Facilitator Fees', 'Staff Welfare', 'Training & Development', 'Recruitment'],
      'Marketing': ['Advertising', 'Social Media', 'Design & Content', 'Printing', 'Promotional Materials'],
      'Technology': ['Software Subscriptions', 'Hosting', 'Domains', 'Internet', 'Hardware', 'IT Services'],
      'Operations': ['Rent', 'Utilities', 'Transport', 'Repairs & Maintenance', 'Facility & Welfare', 'Office Supplies'],
      'Academic': ['Learning Materials', 'Examination Resources', 'Teaching Resources', 'Academic Services'],
      'Administration': ['Bank Charges', 'Professional Services', 'Legal', 'Accounting', 'Office Administration'],
      'Other': ['Miscellaneous']
    };

    const PAYMENT_METHODS = ['Bank Transfer', 'POS', 'Card', 'Online Payment', 'Payment Gateway', 'Other'];
    const DEPARTMENTS = ['Operations', 'Academics', 'Marketing', 'Administration', 'Technology', 'Management', 'Finance'];

    // ----------------------------------------------------
    // SAFE FINANCIAL ARITHMETIC UTILITIES
    // ----------------------------------------------------
    function formatDocNo(type, num, dateStr) {
      const yr = dateStr ? dateStr.slice(0, 4) : new Date().getFullYear();
      return type === 'invoice' ? `INV-${yr}-${num}` : `RCT-${yr}-${num}`;
    }

    function safeRound(n) {
      return Math.round((Number(n) || 0) * 100) / 100;
    }

    function fmtMoney(n) {
      const v = safeRound(n);
      const absFormatted = Math.abs(v).toLocaleString('en-NG', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
      return (v < 0 ? '-\u20a6' : '\u20a6') + absFormatted;
    }

    function fmtDate(d) {
      if (!d) return '\u2014';
      try {
        const parts = String(d).split('-');
        if (parts.length === 3) {
          const dt = new Date(Number(parts[0]), Number(parts[1]) - 1, Number(parts[2]));
          return dt.toLocaleDateString('en-GB', { day: 'numeric', month: 'short', year: 'numeric' });
        }
        return d;
      } catch (e) {
        return d;
      }
    }

    function escapeHtml(str) {
      if (str === null || str === undefined) return '';
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
    }

    // ----------------------------------------------------
    // APPLICATION STATE
    // ----------------------------------------------------
    let state = {
      tab: 'dashboard',
      sidebarCollapsed: false,
      searchQuery: '',
      auth: {
        isAuthenticated: false,
        user: null
      },
      incomeSubTab: 'invoiced',
      invoiceSubTab: 'list',
      expensesSubTab: 'ledger',
      paymentsSubTab: 'ledger',
      reportsSubTab: 'pnl',
      budgetsSubTab: 'budgets',
      programmes: [],
      invoices: [],
      payments: [],
      expenses: [],
      directIncome: [],
      budgets: [],
      auditLog: [],
      collectionNotes: [],
      paymentReminders: [],
      recurringExpenses: [],
      recurringInvoices: [],
      financePeriods: [],
      reconciliations: [],
      anomaliesReviewed: [],
      approvalSettings: {
        tier1Limit: 100000,
        tier2Limit: 500000,
        tier2Role: 'Finance Manager',
        tier3Role: 'Super Admin'
      },
      incomeCategories: [],
      expenseCategories: {},
      counters: { invoice: 11092041, receipt: 20001 },
      supabase: {
        endpoint: 'https://logaawoigfxnisimfatf.supabase.co/rest/v1/',
        anonKey: '',
        status: 'fallback',
        lastChecked: null,
        probeResult: null,
        authUser: null
      },
      loading: true,
      modal: null,
      filters: {
        datePreset: 'this_month',
        dateStart: '',
        dateEnd: '',
        incomeSearch: '',
        incomeCategory: 'all',
        incomeStatus: 'all',
        expenseSearch: '',
        expenseGroup: 'all',
        expenseDept: 'all',
        expenseMethod: 'all',
        expenseStatus: 'active',
        invoiceSearch: '',
        invoiceStatus: 'all',
        paymentSearch: '',
        paymentMethod: 'all',
        paymentReconStatus: 'all',
        receivableSearch: '',
        receivablePrio: 'all',
        accountSearch: '',
        accountFilter: 'all',
        ledgerSearch: '',
        ledgerType: 'all',
        ledgerMethod: 'all',
        budgetPeriod: new Date().toISOString().slice(0, 7)
      }
    };

    // ----------------------------------------------------
    // STORAGE & AUDIT LOG ENGINE
    // ----------------------------------------------------
    async function safeGet(key, fallback) {
      try {
        if (window.storage && typeof window.storage.get === 'function') {
          const res = await window.storage.get(key, SHARED);
          return res && res.value ? JSON.parse(res.value) : fallback;
        } else if (typeof localStorage !== 'undefined') {
          const item = localStorage.getItem(key);
          return item ? JSON.parse(item) : fallback;
        }
        return fallback;
      } catch (e) {
        console.warn('Storage read fallback for', key, e);
        return fallback;
      }
    }

    async function safeSet(key, value) {
      try {
        if (window.storage && typeof window.storage.set === 'function') {
          await window.storage.set(key, JSON.stringify(value), SHARED);
        } else if (typeof localStorage !== 'undefined') {
          localStorage.setItem(key, JSON.stringify(value));
        }
      } catch (e) {
        console.error('Storage set error for', key, e);
      }
    }

    async function logAudit(action, entityType, entityId, reference, previousValue, newValue, reason = '') {
      const actorRole = state.auth && state.auth.user ? state.auth.user.role : 'System';
      const actorName = state.auth && state.auth.user ? `${state.auth.user.name} (${state.auth.user.email})` : 'System';

      const entry = {
        id: 'audit_' + Date.now() + '_' + Math.floor(Math.random() * 1000),
        tenant_id: DEFAULT_TENANT_ID,
        action,
        entityType,
        entityId,
        reference: reference || 'N/A',
        previousValue: previousValue ? (typeof previousValue === 'string' ? previousValue : JSON.stringify(previousValue)) : null,
        newValue: newValue ? (typeof newValue === 'string' ? newValue : JSON.stringify(newValue)) : null,
        reason: reason || 'Standard operation',
        performedBy: actorName,
        role: actorRole,
        source: 'app_ledger',
        performedAt: new Date().toISOString()
      };
      state.auditLog.unshift(entry);
      await safeSet(STORE_KEY_AUDIT_LOG, state.auditLog);
    }

    // ----------------------------------------------------
    // AUTHORITATIVE ROLE-BASED ACCESS CONTROL (RBAC)
    // ----------------------------------------------------
    function getRole() {
      return state.auth && state.auth.user ? state.auth.user.role : 'Finance Viewer';
    }

    function canRecord() {
      const r = getRole();
      return ['Finance Staff', 'Finance Manager', 'Super Admin'].includes(r);
    }

    function canApprove() {
      const r = getRole();
      return ['Finance Manager', 'Super Admin'].includes(r);
    }

    function canCancel() {
      const r = getRole();
      return ['Finance Manager', 'Super Admin'].includes(r);
    }

    function canManageBudget() {
      const r = getRole();
      return ['Finance Manager', 'Super Admin'].includes(r);
    }

    function canClosePeriod() {
      const r = getRole();
      return ['Finance Manager', 'Super Admin'].includes(r);
    }

    function canLockPeriod() {
      return getRole() === 'Super Admin';
    }

    function canReopenPeriod() {
      return getRole() === 'Super Admin';
    }

    function canExport() {
      return true;
    }

    function isReadOnly() {
      return getRole() === 'Finance Viewer';
    }

    function isPeriodLocked(dateStr) {
      if (!dateStr) return false;
      const periodKey = dateStr.slice(0, 7);
      const p = state.financePeriods.find(fp => fp.period === periodKey);
      return p && p.status === 'locked';
    }

    function getRequiredApprovalRole(amount) {
      const v = Number(amount) || 0;
      if (v > state.approvalSettings.tier2Limit) return state.approvalSettings.tier3Role;
      if (v > state.approvalSettings.tier1Limit) return state.approvalSettings.tier2Role;
      return 'None';
    }

    // ----------------------------------------------------
    // ASYNC DATA SERVICE & LOAD ALL
    // ----------------------------------------------------
    async function loadAll() {
      state.loading = true;
      render();

      const [progs, invs, pays, cnts, exps, dirInc, incCats, expCats, bdgs, audits, authSession, cNotes, pRems, rExps, rInvs, fPeriods, appSet, recons, anomRev, sbCfg] = await Promise.all([
        safeGet(STORE_KEY_PROGRAMMES, []),
        safeGet(STORE_KEY_INVOICES, []),
        safeGet(STORE_KEY_PAYMENTS, []),
        safeGet(STORE_KEY_COUNTERS, { invoice: 11092041, receipt: 20001 }),
        safeGet(STORE_KEY_EXPENSES, []),
        safeGet(STORE_KEY_DIRECT_INCOME, []),
        safeGet(STORE_KEY_INCOME_CATEGORIES, DEFAULT_INCOME_CATEGORIES),
        safeGet(STORE_KEY_EXPENSE_CATEGORIES, DEFAULT_EXPENSE_CATEGORIES),
        safeGet(STORE_KEY_BUDGETS, []),
        safeGet(STORE_KEY_AUDIT_LOG, []),
        safeGet(STORE_KEY_AUTH_SESSION, null),
        safeGet(STORE_KEY_COLLECTION_NOTES, []),
        safeGet(STORE_KEY_PAYMENT_REMINDERS, []),
        safeGet(STORE_KEY_RECURRING_EXPENSES, []),
        safeGet(STORE_KEY_RECURRING_INVOICES, []),
        safeGet(STORE_KEY_FINANCE_PERIODS, []),
        safeGet(STORE_KEY_APPROVAL_SETTINGS, { tier1Limit: 100000, tier2Limit: 500000, tier2Role: 'Finance Manager', tier3Role: 'Super Admin' }),
        safeGet(STORE_KEY_RECONCILIATIONS, []),
        safeGet(STORE_KEY_ANOMALIES_REVIEWED, []),
        safeGet(STORE_KEY_SUPABASE_CONFIG, { endpoint: 'https://logaawoigfxnisimfatf.supabase.co/rest/v1/', anonKey: '', status: 'fallback' })
      ]);

      state.programmes = Array.isArray(progs) ? progs : [];
      state.invoices = (Array.isArray(invs) ? invs : []).map(i => ({
        ...i,
        category: i.category || 'Student Tuition',
        dueDate: i.dueDate || i.date || new Date().toISOString().slice(0, 10),
        items: Array.isArray(i.items) && i.items.length ? i.items : [{
          description: i.programmeName || 'Professional Training Program',
          quantity: 1,
          price: Number(i.total || 0) + Number(i.discount || 0),
          discount: Number(i.discount || 0),
          amount: Number(i.total || 0)
        }],
        tenant_id: i.tenant_id || DEFAULT_TENANT_ID
      }));
      state.payments = (Array.isArray(pays) ? pays : []).map(p => ({
        ...p,
        paymentMethod: p.paymentMethod || p.method || 'Bank Transfer',
        reconciliationStatus: p.reconciliationStatus || 'unreconciled',
        tenant_id: p.tenant_id || DEFAULT_TENANT_ID
      }));
      state.counters = cnts && cnts.invoice ? cnts : { invoice: 11092041, receipt: 20001 };
      state.expenses = (Array.isArray(exps) ? exps : []).map(e => ({
        ...e,
        status: e.status || 'recorded',
        tenant_id: e.tenant_id || DEFAULT_TENANT_ID
      }));
      state.directIncome = (Array.isArray(dirInc) ? dirInc : []).map(d => ({
        ...d,
        status: d.status || 'active',
        tenant_id: d.tenant_id || DEFAULT_TENANT_ID
      }));
      state.budgets = Array.isArray(bdgs) ? bdgs : [];
      state.auditLog = Array.isArray(audits) ? audits : [];
      
      if (authSession && authSession.user) {
        state.auth = { isAuthenticated: true, user: authSession.user };
      } else {
        state.auth = { isAuthenticated: true, user: SYSTEM_ACCOUNTS[0] };
        await safeSet(STORE_KEY_AUTH_SESSION, state.auth);
      }

      state.collectionNotes = Array.isArray(cNotes) ? cNotes : [];
      state.paymentReminders = Array.isArray(pRems) ? pRems : [];
      state.recurringExpenses = Array.isArray(rExps) ? rExps : [];
      state.recurringInvoices = Array.isArray(rInvs) ? rInvs : [];
      state.financePeriods = Array.isArray(fPeriods) ? fPeriods : [];
      state.approvalSettings = appSet && appSet.tier2Limit ? appSet : { tier1Limit: 100000, tier2Limit: 500000, tier2Role: 'Finance Manager', tier3Role: 'Super Admin' };
      state.reconciliations = Array.isArray(recons) ? recons : [];
      state.anomaliesReviewed = Array.isArray(anomRev) ? anomRev : [];
      state.incomeCategories = incCats && incCats.length ? incCats : DEFAULT_INCOME_CATEGORIES;
      state.expenseCategories = expCats && Object.keys(expCats).length ? expCats : DEFAULT_EXPENSE_CATEGORIES;
      if (sbCfg) {
        state.supabase = { ...state.supabase, ...sbCfg };
      }

      state.loading = false;
      render();
    }

    // ----------------------------------------------------
    // INVOICE & RECEIVABLES CALCULATION ENGINE
    // ----------------------------------------------------
    function invoiceBalance(inv) {
      const paid = safeRound(state.payments
        .filter(p => p.invoiceId === inv.id)
        .reduce((sum, p) => sum + Number(p.amount || 0), 0));
      const total = safeRound(Number(inv.total) || 0);
      const balance = Math.max(0, safeRound(total - paid));
      return { paid, balance, total };
    }

    function invoiceStatus(inv) {
      const { paid, total } = invoiceBalance(inv);
      if (paid <= 0) return 'unpaid';
      if (paid >= total && total > 0) return 'paid';
      return 'partial';
    }

    function getReceivableAgeing(inv) {
      const { balance } = invoiceBalance(inv);
      if (balance <= 0) return { days: 0, bucket: 'current', label: 'Paid in Full', priority: 'Low', prioClass: 'prio-low' };

      const todayStr = new Date().toISOString().slice(0, 10);
      const dueStr = inv.dueDate || inv.date || todayStr;
      const today = new Date(todayStr + 'T00:00:00');
      const due = new Date(dueStr + 'T00:00:00');
      const daysOverdue = Math.floor((today - due) / (1000 * 60 * 60 * 24));

      if (daysOverdue <= 0) return { days: daysOverdue, bucket: 'current', label: 'Current', priority: 'Low', prioClass: 'prio-low' };
      if (daysOverdue <= 30) return { days: daysOverdue, bucket: '1-30', label: `${daysOverdue}d (1–30d)`, priority: 'Medium', prioClass: 'prio-medium' };
      if (daysOverdue <= 60) return { days: daysOverdue, bucket: '31-60', label: `${daysOverdue}d (31–60d)`, priority: 'High', prioClass: 'prio-high' };
      if (daysOverdue <= 90) return { days: daysOverdue, bucket: '61-90', label: `${daysOverdue}d (61–90d)`, priority: 'Critical', prioClass: 'prio-critical' };
      return { days: daysOverdue, bucket: '90plus', label: `${daysOverdue}d (90+d)`, priority: 'Critical', prioClass: 'prio-critical' };
    }

    function getDateRangeBounds(preset, customStart, customEnd) {
      const now = new Date();
      const yyyy = now.getFullYear();
      const mm = now.getMonth();
      const dd = now.getDate();
      function toStr(d) { return d.toISOString().slice(0, 10); }

      switch (preset) {
        case 'today': return { start: toStr(now), end: toStr(now) };
        case 'yesterday': return { start: toStr(new Date(yyyy, mm, dd - 1)), end: toStr(new Date(yyyy, mm, dd - 1)) };
        case 'this_month': return { start: toStr(new Date(yyyy, mm, 1)), end: toStr(new Date(yyyy, mm + 1, 0)) };
        case 'last_month': return { start: toStr(new Date(yyyy, mm - 1, 1)), end: toStr(new Date(yyyy, mm, 0)) };
        case 'this_quarter': {
          const q = Math.floor(mm / 3);
          return { start: toStr(new Date(yyyy, q * 3, 1)), end: toStr(new Date(yyyy, q * 3 + 3, 0)) };
        }
        case 'this_year': return { start: toStr(new Date(yyyy, 0, 1)), end: toStr(new Date(yyyy, 11, 31)) };
        case 'custom': return { start: customStart || '1970-01-01', end: customEnd || '2099-12-31' };
        case 'all':
        default: return { start: '1970-01-01', end: '2099-12-31' };
      }
    }

    function isDateInRange(dStr, bounds) {
      if (!dStr) return false;
      const d = dStr.slice(0, 10);
      return d >= bounds.start && d <= bounds.end;
    }

    function getFinancialMetrics(dateBounds = null) {
      const bounds = dateBounds || { start: '1970-01-01', end: '2099-12-31' };

      const filteredInvoices = state.invoices.filter(i => isDateInRange(i.date, bounds));
      const totalInvoiced = safeRound(filteredInvoices.reduce((s, i) => s + Number(i.total || 0), 0));

      const filteredPayments = state.payments.filter(p => isDateInRange(p.date, bounds));
      const totalPaymentsReceived = safeRound(filteredPayments.reduce((s, p) => s + Number(p.amount || 0), 0));

      const filteredDirectIncome = state.directIncome.filter(d => d.status !== 'cancelled' && isDateInRange(d.date, bounds));
      const totalDirectIncome = safeRound(filteredDirectIncome.reduce((s, d) => s + Number(d.amount || 0), 0));

      const totalIncomeReceived = safeRound(totalPaymentsReceived + totalDirectIncome);

      const filteredExpenses = state.expenses.filter(e => (e.status === 'recorded' || e.status === 'approved') && isDateInRange(e.date, bounds));
      const totalExpenses = safeRound(filteredExpenses.reduce((s, e) => s + Number(e.amount || 0), 0));

      const netFinancialPosition = safeRound(totalIncomeReceived - totalExpenses);

      const outstandingReceivables = safeRound(state.invoices.reduce((s, inv) => {
        const { balance } = invoiceBalance(inv);
        return s + balance;
      }, 0));

      const collectionRate = totalInvoiced > 0 ? safeRound((totalPaymentsReceived / totalInvoiced) * 100) : 100;

      const thisMonthBounds = getDateRangeBounds('this_month');
      const thisYearBounds = getDateRangeBounds('this_year');

      const mtdInvoices = state.invoices.filter(i => isDateInRange(i.date, thisMonthBounds));
      const mtdPayments = state.payments.filter(p => isDateInRange(p.date, thisMonthBounds));
      const mtdDirect = state.directIncome.filter(d => d.status !== 'cancelled' && isDateInRange(d.date, thisMonthBounds));
      const mtdExpensesRec = state.expenses.filter(e => (e.status === 'recorded' || e.status === 'approved') && isDateInRange(e.date, thisMonthBounds));

      const mtdIncome = safeRound(mtdPayments.reduce((s, p) => s + Number(p.amount || 0), 0) + mtdDirect.reduce((s, d) => s + Number(d.amount || 0), 0));
      const mtdExpenses = safeRound(mtdExpensesRec.reduce((s, e) => s + Number(e.amount || 0), 0));
      const mtdNet = safeRound(mtdIncome - mtdExpenses);

      const ytdPayments = state.payments.filter(p => isDateInRange(p.date, thisYearBounds));
      const ytdDirect = state.directIncome.filter(d => d.status !== 'cancelled' && isDateInRange(d.date, thisYearBounds));
      const ytdExpensesRec = state.expenses.filter(e => (e.status === 'recorded' || e.status === 'approved') && isDateInRange(e.date, thisYearBounds));

      const ytdIncome = safeRound(ytdPayments.reduce((s, p) => s + Number(p.amount || 0), 0) + ytdDirect.reduce((s, d) => s + Number(d.amount || 0), 0));
      const ytdExpenses = safeRound(ytdExpensesRec.reduce((s, e) => s + Number(e.amount || 0), 0));
      const ytdNet = safeRound(ytdIncome - ytdExpenses);

      return {
        totalInvoiced,
        totalPaymentsReceived,
        totalDirectIncome,
        totalIncomeReceived,
        totalExpenses,
        netFinancialPosition,
        outstandingReceivables,
        collectionRate,
        mtdIncome,
        mtdExpenses,
        mtdNet,
        ytdIncome,
        ytdExpenses,
        ytdNet
      };
    }

    function getStudentAccountSummaries() {
      const studentMap = {};
      state.invoices.forEach(inv => {
        const key = inv.clientName.trim();
        if (!studentMap[key]) {
          studentMap[key] = {
            clientName: key,
            phone: inv.phone || '',
            email: inv.email || '',
            parentName: inv.parentName || '',
            invoices: [],
            payments: [],
            totalInvoiced: 0,
            totalPaid: 0,
            balance: 0,
            programmes: new Set()
          };
        }
        studentMap[key].invoices.push(inv);
        studentMap[key].totalInvoiced = safeRound(studentMap[key].totalInvoiced + Number(inv.total || 0));
        if (inv.programmeName) studentMap[key].programmes.add(inv.programmeName);
      });

      state.payments.forEach(p => {
        const inv = state.invoices.find(i => i.id === p.invoiceId);
        if (inv) {
          const key = inv.clientName.trim();
          if (studentMap[key]) {
            studentMap[key].payments.push(p);
            studentMap[key].totalPaid = safeRound(studentMap[key].totalPaid + Number(p.amount || 0));
          }
        }
      });

      return Object.values(studentMap).map(acc => {
        acc.balance = Math.max(0, safeRound(acc.totalInvoiced - acc.totalPaid));
        acc.programmesList = Array.from(acc.programmes).join(', ') || 'General';
        acc.status = acc.balance === 0 ? 'Fully Paid' : (acc.totalPaid > 0 ? 'Partial Balance' : 'Outstanding');
        return acc;
      });
    }

    function getUnifiedLedger() {
      const items = [];
      state.payments.forEach(p => {
        const inv = state.invoices.find(i => i.id === p.invoiceId) || { invoiceNo: 'N/A', clientName: 'Student' };
        items.push({
          id: p.id,
          date: p.date,
          type: 'Payment Inflow (Tuition)',
          description: `Payment for Invoice #${inv.invoiceNo} (${inv.clientName})`,
          reference: p.reference || `RCP #${p.receiptNo}`,
          category: 'Student Tuition',
          method: p.paymentMethod || 'Bank Transfer',
          inflow: Number(p.amount || 0),
          outflow: 0,
          status: 'recorded'
        });
      });

      state.directIncome.forEach(d => {
        items.push({
          id: d.id,
          date: d.date,
          type: 'Direct Income Inflow',
          description: `${d.category} - ${d.clientSource || 'Direct Client'}`,
          reference: d.reference || 'N/A',
          category: d.category,
          method: d.method || 'Bank Transfer',
          inflow: Number(d.amount || 0),
          outflow: 0,
          status: d.status
        });
      });

      state.expenses.forEach(e => {
        items.push({
          id: e.id,
          date: e.date,
          type: 'Expense Outflow',
          description: `[${e.categoryGroup}] ${e.description} (${e.vendor || 'Vendor'})`,
          reference: e.id,
          category: e.category,
          method: e.method || 'Bank Transfer',
          inflow: 0,
          outflow: Number(e.amount || 0),
          status: e.status
        });
      });

      items.sort((a, b) => (b.date > a.date ? 1 : a.date < b.date ? -1 : 0));
      return items;
    }

    function getMultiHorizonCashForecast() {
      const baseMetrics = getFinancialMetrics();
      const currentCash = baseMetrics.netFinancialPosition;

      const due30Receivables = state.invoices
        .filter(i => invoiceBalance(i).balance > 0)
        .reduce((s, i) => s + invoiceBalance(i).balance, 0);

      const recurringMonthlyOutflows = state.recurringExpenses
        .filter(r => r.active)
        .reduce((s, r) => s + Number(r.amount || 0), 0);

      const exp30Inflow = safeRound(due30Receivables * 0.7);
      const exp30Outflow = safeRound(recurringMonthlyOutflows + (baseMetrics.mtdExpenses * 0.8));
      const proj30Cash = safeRound(currentCash + exp30Inflow - exp30Outflow);

      const exp60Inflow = safeRound(exp30Inflow * 1.8);
      const exp60Outflow = safeRound(exp30Outflow * 2);
      const proj60Cash = safeRound(currentCash + exp60Inflow - exp60Outflow);

      const exp90Inflow = safeRound(exp30Inflow * 2.7);
      const exp90Outflow = safeRound(exp30Outflow * 3);
      const proj90Cash = safeRound(currentCash + exp90Inflow - exp90Outflow);

      return {
        currentCash,
        h30: { inflow: exp30Inflow, outflow: exp30Outflow, closing: proj30Cash },
        h60: { inflow: exp60Inflow, outflow: exp60Outflow, closing: proj60Cash },
        h90: { inflow: exp90Inflow, outflow: exp90Outflow, closing: proj60Cash }
      };
    }

    function detectFinancialAnomalies() {
      const anomalies = [];
      state.expenses.filter(e => (e.status === 'recorded' || e.status === 'approved') && Number(e.amount) >= 400000).forEach(e => {
        anomalies.push({
          id: 'anom_exp_' + e.id,
          type: 'Unusually High Expense',
          severity: 'HIGH',
          what: `High value expense of ${fmtMoney(e.amount)} for "${e.description}"`,
          why: 'Exceeds standard operational expenditure baseline.',
          action: 'Audit invoice attached and verify budget approval.',
          entityId: e.id,
          amount: e.amount,
          date: e.date
        });
      });

      const seenPayments = {};
      state.payments.forEach(p => {
        const key = `${p.date}_${p.amount}`;
        if (seenPayments[key]) {
          anomalies.push({
            id: 'anom_dup_' + p.id,
            type: 'Potential Duplicate Payment',
            severity: 'MEDIUM',
            what: `Duplicate payment amount of ${fmtMoney(p.amount)} recorded on ${p.date}`,
            why: 'Multiple identical transactions on the same date may indicate double recording.',
            action: 'Verify bank deposit reference and student receipt.',
            entityId: p.id,
            amount: p.amount,
            date: p.date
          });
        } else {
          seenPayments[key] = p;
        }
      });
      return anomalies;
    }

    function exportToCSV(filename, rows) {
      if (!rows || !rows.length) { alert('No records available to export.'); return; }
      const separator = ',';
      const keys = Object.keys(rows[0]);
      const actorInfo = state.auth.user ? `${state.auth.user.name} (${state.auth.user.role})` : 'System';
      const headerMetadata = `# Report: ${filename.toUpperCase()}\n# Generated By: ${actorInfo}\n# Generated At: ${new Date().toISOString()}\n# Tenant: ${DEFAULT_TENANT_ID}\n# Mode: ${state.supabase.status === 'connected' ? 'SUPABASE_PRODUCTION' : 'LOCAL_STORAGE'}\n\n`;
      const csvData = keys.join(separator) + '\n' + rows.map(row => {
        return keys.map(k => {
          let cell = row[k] === null || row[k] === undefined ? '' : String(row[k]);
          cell = cell.replace(/"/g, '""');
          if (cell.search(/("|,|\n)/g) >= 0) cell = `"${cell}"`;
          return cell;
        }).join(separator);
      }).join('\n');

      const blob = new Blob([headerMetadata + csvData], { type: 'text/csv;charset=utf-8;' });
      const link = document.createElement('a');
      link.href = URL.createObjectURL(blob);
      link.download = `${filename}_${new Date().toISOString().slice(0, 10)}.csv`;
      link.click();
      logAudit('EXPORT_CSV', 'report', filename, 'CSV Data Export');
    }

    // ----------------------------------------------------
    function searchGlobalEntities(query) {
      if (!query || query.trim().length < 2) return [];
      const q = query.trim().toLowerCase();
      const results = [];

      // 1. Search Students
      const students = getStudentAccountSummaries();
      students.filter(s => s.clientName.toLowerCase().includes(q) || s.phone.includes(q) || s.email.toLowerCase().includes(q)).slice(0, 4).forEach(s => {
        results.push({
          type: 'Student',
          title: s.clientName,
          subtitle: `Phone: ${s.phone || 'N/A'} &middot; Balance: ${fmtMoney(s.balance)}`,
          tag: s.status,
          tagClass: s.balance === 0 ? 'paid' : 'partial',
          action: () => { state.tab = 'studentAccounts'; openModal('studentStatement', { account: s }); render(); }
        });
      });

      // 2. Search Invoices
      state.invoices.filter(i => String(i.invoiceNo).includes(q) || (i.invoice_display_no && i.invoice_display_no.toLowerCase().includes(q)) || i.clientName.toLowerCase().includes(q)).slice(0, 4).forEach(inv => {
        const { balance, total } = invoiceBalance(inv);
        results.push({
          type: 'Invoice',
          title: `Invoice #${inv.invoiceNo} &mdash; ${inv.clientName}`,
          subtitle: `Total: ${fmtMoney(total)} &middot; Due: ${fmtMoney(balance)}`,
          tag: invoiceStatus(inv).toUpperCase(),
          tagClass: invoiceStatus(inv),
          action: () => { state.tab = 'invoices'; openModal('viewInvoice', { invoice: inv }); render(); }
        });
      });

      // 3. Search Payments & Receipts
      state.payments.filter(p => String(p.receiptNo).includes(q) || (p.reference && p.reference.toLowerCase().includes(q)) || String(p.amount).includes(q)).slice(0, 4).forEach(p => {
        const inv = state.invoices.find(i => i.id === p.invoiceId);
        results.push({
          type: 'Receipt',
          title: `Receipt #${p.receiptNo} &mdash; ${fmtMoney(p.amount)}`,
          subtitle: `Student: ${inv ? inv.clientName : 'Direct'} &middot; Ref: ${p.reference || 'N/A'}`,
          tag: p.paymentMethod || 'Bank Transfer',
          tagClass: 'category-pill',
          action: () => { state.tab = 'payments'; openModal('viewReceipt', { payment: p, invoice: inv }); render(); }
        });
      });

      // 4. Search Programmes
      state.programmes.filter(pr => pr.name.toLowerCase().includes(q) || pr.id.toLowerCase().includes(q)).slice(0, 3).forEach(pr => {
        results.push({
          type: 'Programme',
          title: pr.name,
          subtitle: `Standard Tuition: ${fmtMoney(pr.price)}`,
          tag: 'Academic',
          tagClass: 'category-pill',
          action: () => { state.tab = 'programmes'; render(); }
        });
      });

      return results;
    }

        render();
      });

      // Supabase Status Click
      document.getElementById('sidebarSupabaseStatus').addEventListener('click', () => openModal('supabaseModal'));

      // Quick Actions Toggle
      const qaToggle = document.getElementById('btnQuickActionToggle');
      const qaMenu = document.getElementById('quickActionMenu');
      if (qaToggle && qaMenu) {
        qaToggle.addEventListener('click', (e) => {
          e.stopPropagation();
          qaMenu.classList.toggle('active');
        });
        document.addEventListener('click', () => qaMenu.classList.remove('active'));

        const qaInv = document.getElementById('qaNewInvoice');
        if (qaInv) qaInv.addEventListener('click', () => { state.tab = 'invoices'; state.invoiceSubTab = 'new'; render(); });

        const qaPay = document.getElementById('qaRecordPayment');
        if (qaPay) qaPay.addEventListener('click', () => {
          const unpaid = state.invoices.find(i => invoiceBalance(i).balance > 0) || state.invoices[0];
          if (unpaid) openModal('recordPayment', { invoice: unpaid });
          else alert('No invoices available for payment.');
        });

        const qaExp = document.getElementById('qaRecordExpense');
        if (qaExp) qaExp.addEventListener('click', () => openModal('recordExpense'));

        const qaInc = document.getElementById('qaDirectIncome');
        if (qaInc) qaInc.addEventListener('click', () => openModal('recordDirectIncome'));
      }

      const btnAlert = document.getElementById('btnOverdueHeaderAlert');
      if (btnAlert) btnAlert.addEventListener('click', () => { state.tab = 'receivables'; render(); });

      // Omni-Search Input Handling
      const omniInput = document.getElementById('globalSearchInput');
      const searchDropdown = document.getElementById('searchDropdown');
      if (omniInput && searchDropdown) {
        omniInput.addEventListener('input', (e) => {
          const val = e.target.value;
          if (!val || val.trim().length < 2) {
            searchDropdown.classList.remove('active');
            searchDropdown.innerHTML = '';
            return;
          }

          const results = searchGlobalEntities(val);
          if (results.length === 0) {
            searchDropdown.innerHTML = '<div style="padding:14px; text-align:center; color:var(--text-muted); font-size:12px;">No matching records found.</div>';
            searchDropdown.classList.add('active');
          } else {
            searchDropdown.innerHTML = results.map((r, idx) => `
              <div class="cp-search-result-item" data-idx="${idx}">
                <div>
                  <div style="font-weight:700; color:var(--primary);">${escapeHtml(r.title)}</div>
                  <div style="font-size:11px; color:var(--text-secondary);">${r.subtitle}</div>
                </div>
                <span class="cp-pill ${r.tagClass}" style="font-size:10.5px;">${escapeHtml(r.type)}: ${escapeHtml(r.tag)}</span>
              </div>
            `).join('');
            searchDropdown.classList.add('active');

            searchDropdown.querySelectorAll('.cp-search-result-item').forEach(itemEl => {
              itemEl.addEventListener('click', () => {
                const idx = Number(itemEl.dataset.idx);
                if (results[idx] && results[idx].action) {
                  searchDropdown.classList.remove('active');
                  omniInput.value = '';
                  results[idx].action();
                }
              });
            });
          }
        });

        document.addEventListener('click', (e) => {
          if (!omniInput.contains(e.target) && !searchDropdown.contains(e.target)) {
            searchDropdown.classList.remove('active');
          }
        });
      }

      // Render Active Tab Content
      const contentView = document.getElementById('contentView');
      if (state.tab === 'dashboard') renderDashboardTab(contentView);
      else if (state.tab === 'studentAccounts') renderStudentAccountsTab(contentView);
      else if (state.tab === 'invoices') renderInvoicesTab(contentView);
      else if (state.tab === 'payments') renderPaymentsTab(contentView);
      else if (state.tab === 'expenses') renderExpensesTab(contentView);
      else if (state.tab === 'programmes') renderProgrammesTab(contentView);
      else if (state.tab === 'receivables') renderReceivablesTab(contentView);
      else if (state.tab === 'budgets') renderBudgetsTab(contentView);
      else if (state.tab === 'reports') renderReportsTab(contentView);
      else if (state.tab === 'usersRoles') renderUsersRolesTab(contentView);
      else if (state.tab === 'financialControls') renderFinancialControlsTab(contentView);
      else if (state.tab === 'auditLog') renderAuditLogTab(contentView);
      else if (state.tab === 'settings') renderSettingsTab(contentView);

      if (state.modal) {
        renderModal(state.modal.type, state.modal.data);
      }
    }

    // Modal Control Helpers
    function openModal(type, data = {}) {
      state.modal = { type, data };
      render();
    }

    function closeModal() {
      state.modal = null;
      render();
    }

    function renderModal(type, data) {
      const container = document.getElementById('modalRoot');
      if (!container) return;

      if (type === 'viewInvoice') renderViewInvoiceModal(container, data.invoice);
      else if (type === 'viewReceipt') renderViewReceiptModal(container, data.payment, data.invoice);
      else if (type === 'recordPayment') renderRecordPaymentModal(container, data.invoice);
      else if (type === 'recordExpense') renderRecordExpenseModal(container);
      else if (type === 'recordDirectIncome') renderRecordDirectIncomeModal(container);
      else if (type === 'studentStatement') renderStudentStatementModal(container, data.account);
      else if (type === 'sendReminder') renderSendReminderModal(container, data.invoice);
      else if (type === 'collectionNotes') renderCollectionNotesModal(container, data.invoice);
      else if (type === 'addProgramme') renderAddProgrammeModal(container);
      else if (type === 'editProgramme') renderEditProgrammeModal(container, data.programme);
      else if (type === 'setBudget') renderSetBudgetModal(container);
      else if (type === 'cancelExpense') renderCancelExpenseModal(container, data.expense);
      else if (type === 'cancelDirectIncome') renderCancelDirectIncomeModal(container, data.item);
      else if (type === 'newReconciliation') renderNewReconciliationModal(container, data.expectedBalance);
      else if (type === 'reviewAnomalies') renderReviewAnomaliesModal(container, data.anomalies);
      else if (type === 'supabaseModal') renderSupabaseModal(container);
    }

        document.getElementById('invCustomerSelect').addEventListener('change', (e) => {
          const name = e.target.value;
          if (name) {
            const prevInv = state.invoices.slice().reverse().find(i => i.clientName.trim() === name);
            if (prevInv) {
              document.getElementById('invClient').value = prevInv.clientName;
              if (prevInv.phone) document.getElementById('invPhone').value = prevInv.phone;
              if (prevInv.email) document.getElementById('invEmail').value = prevInv.email;
              if (prevInv.parentName) document.getElementById('invParent').value = prevInv.parentName;
              if (prevInv.programmeId) document.getElementById('invProg').value = prevInv.programmeId;
            }
          }
        });

        document.getElementById('invProg').addEventListener('change', (e) => {
          const p = state.programmes.find(pr => pr.id === e.target.value);
          if (p) {
            const firstRow = document.querySelector('.line-item-row');
            if (firstRow) {
              firstRow.querySelector('.item-desc').value = p.name;
              firstRow.querySelector('.item-price').value = p.price;
              recalcInvoiceTotals();
            }
          }
        });

        function recalcInvoiceTotals() {
          let grand = 0;
          document.querySelectorAll('.line-item-row').forEach(row => {
            const qty = Number(row.querySelector('.item-qty').value || 1);
            const pr = Number(row.querySelector('.item-price').value || 0);
            const dc = Number(row.querySelector('.item-disc').value || 0);
            const lineTot = Math.max(0, safeRound((qty * pr) - dc));
            grand = safeRound(grand + lineTot);
          });
          const lbl = document.getElementById('lblCalculatedTotal');
          if (lbl) lbl.textContent = fmtMoney(grand);
        }

        const cont = document.getElementById('lineItemsContainer');
        cont.addEventListener('input', recalcInvoiceTotals);

        document.getElementById('btnAddLineItem').addEventListener('click', () => {
          const rowDiv = document.createElement('div');
          rowDiv.className = 'cp-row4 line-item-row';
          rowDiv.style.marginBottom = '8px';
          rowDiv.innerHTML = `
            <div class="cp-field" style="margin:0;"><input class="item-desc" placeholder="Item description" /></div>
            <div class="cp-field" style="margin:0;"><input class="item-qty" type="number" value="1" min="1" /></div>
            <div class="cp-field" style="margin:0;"><input class="item-price" type="number" value="50000" /></div>
            <div class="cp-field" style="margin:0;"><input class="item-disc" type="number" value="0" min="0" /></div>
            <button class="cp-btn danger sm btnRemoveLine" type="button" style="height:35px; width:35px; padding:0;" title="Remove Item">&times;</button>
          `;
          rowDiv.querySelector('.btnRemoveLine').addEventListener('click', () => {
            rowDiv.remove();
            recalcInvoiceTotals();
          });
          cont.appendChild(rowDiv);
          recalcInvoiceTotals();
        });

        cont.querySelectorAll('.btnRemoveLine').forEach(b => {
          b.addEventListener('click', (e) => {
            if (document.querySelectorAll('.line-item-row').length > 1) {
              e.target.closest('.line-item-row').remove();
              recalcInvoiceTotals();
            } else {
              alert('Invoice must contain at least one line item.');
            }
          });
        });

        document.getElementById('btnCancelNewInv').addEventListener('click', () => { state.invoiceSubTab = 'list'; render(); });
        document.getElementById('btnCancelNewInv2').addEventListener('click', () => { state.invoiceSubTab = 'list'; render(); });

        document.getElementById('btnSaveInvoice').addEventListener('click', async () => {
          const client = document.getElementById('invClient').value.trim();
          const progId = document.getElementById('invProg').value;
          const prog = state.programmes.find(p => p.id === progId);
          const dateStr = document.getElementById('invDate').value;
          const dueStr = document.getElementById('invDueDate').value;
          const errEl = document.getElementById('invFormError');

          if (!client || !prog) { errEl.textContent = 'Please fill all required fields.'; errEl.style.display = 'block'; return; }
          if (isPeriodLocked(dateStr)) { errEl.textContent = 'This financial period is locked. Mutations blocked.'; errEl.style.display = 'block'; return; }

          const items = [];
          let subtotal = 0;
          let totalDiscount = 0;

          document.querySelectorAll('.line-item-row').forEach(r => {
            const desc = r.querySelector('.item-desc').value.trim() || prog.name;
            const qty = Number(r.querySelector('.item-qty').value || 1);
            const unitPrice = Number(r.querySelector('.item-price').value || 0);
            const disc = Number(r.querySelector('.item-disc').value || 0);
            const lineAmt = Math.max(0, safeRound((qty * unitPrice) - disc));
            subtotal = safeRound(subtotal + (qty * unitPrice));
            totalDiscount = safeRound(totalDiscount + disc);
            items.push({ description: desc, quantity: qty, price: unitPrice, discount: disc, amount: lineAmt });
          });

          const total = Math.max(0, safeRound(subtotal - totalDiscount));
          state.counters.invoice += 1;
          const docNo = formatDocNo('invoice', state.counters.invoice, dateStr);

          const inv = {
            id: 'inv_' + Date.now(),
            tenant_id: DEFAULT_TENANT_ID,
            invoiceNo: state.counters.invoice,
            invoice_display_no: docNo,
            clientName: client,
            parentName: document.getElementById('invParent').value.trim(),
            programmeId: prog.id,
            programmeName: prog.name,
            phone: document.getElementById('invPhone').value.trim(),
            email: document.getElementById('invEmail').value.trim(),
            category: document.getElementById('invCat').value,
            date: dateStr,
            dueDate: dueStr,
            plan: document.getElementById('invPlan').value,
            trainingMode: document.getElementById('invMode').value,
            duration: document.getElementById('invDuration').value.trim() || '5 Months',
            schedule: document.getElementById('invSchedule').value.trim() || 'Weekdays',
            notes: document.getElementById('invNotes').value.trim(),
            items,
            subtotal,
            discount: totalDiscount,
            total,
            createdAt: new Date().toISOString(),
            createdBy: state.auth.user ? state.auth.user.name : 'Super Admin'
          };

          state.invoices.push(inv);
          await safeSet(STORE_KEY_INVOICES, state.invoices);
          await safeSet(STORE_KEY_COUNTERS, state.counters);
          await logAudit('CREATE_INVOICE', 'invoice', inv.id, `Invoice #${inv.invoiceNo} (${inv.clientName})`, null, inv);

          state.invoiceSubTab = 'list';
          openModal('viewInvoice', { invoice: inv });
          render();
        });

        const q = (state.filters.invoiceSearch || '').toLowerCase();
        const filtered = state.invoices.filter(i => i.clientName.toLowerCase().includes(q) || String(i.invoiceNo).includes(q));

        container.innerHTML = `

            <div class="cp-card-header">
              <div>
                <div class="cp-section-title">&#x1F4C4; Tuition &amp; Service Invoices</div>
                <div class="cp-section-desc">Manage, view, print, and track payment status across all issued student invoices.</div>
              </div>
              <div style="display:flex; gap:8px;">
                <button class="cp-btn sm secondary" id="btnExportInvoices">&#x1F4E5; Export CSV</button>
                ${canRecord() ? '<button class="cp-btn sm accent" id="btnNewInvBtn">+ Create Invoice</button>' : ''}
              </div>
            </div>

            <div class="cp-field" style="max-width:320px; margin-bottom:14px;">
              <input type="text" id="invoiceSearchInput" placeholder="Filter by invoice # or student..." value="${escapeHtml(state.filters.invoiceSearch)}" />
            </div>

            ${filtered.length === 0 ? `
              <div class="cp-empty-state">
                <div class="cp-empty-icon">&#x1F4C4;</div>
                <div class="cp-empty-title">No invoices yet</div>
                <div class="cp-empty-desc">Create your first invoice to begin tracking student tuition and fees.</div>
                ${canRecord() ? '<button class="cp-btn accent sm" id="btnEmptyNewInvoice">+ Create Invoice</button>' : ''}
              </div>
            ` : `
              <div class="cp-table-wrap">
                <table class="cp-table">
                  <thead>
                    <tr>
                      <th>Invoice #</th><th>Date</th><th>Due Date</th><th>Student / Client</th>
                      <th>Programme</th><th style="text-align:right;">Total</th><th style="text-align:right;">Paid</th>
                      <th style="text-align:right;">Balance</th><th>Status</th><th style="text-align:center;">Actions</th>
                    </tr>
                  </thead>
                  <tbody>
                    ${filtered.map(inv => {
                      const { paid, balance, total } = invoiceBalance(inv);
                      const st = invoiceStatus(inv);
                      return `
                        <tr>
                          <td style="font-weight:700; font-family:monospace;">#${inv.invoiceNo}</td>
                          <td>${fmtDate(inv.date)}</td>
                          <td>${fmtDate(inv.dueDate)}</td>
                          <td style="font-weight:600;">${escapeHtml(inv.clientName)}</td>
                          <td>${escapeHtml(inv.programmeName)}</td>
                          <td style="text-align:right;">${fmtMoney(total)}</td>
                          <td style="text-align:right; color:var(--success); font-weight:600;">${fmtMoney(paid)}</td>
                          <td style="text-align:right; font-weight:700; color:${balance > 0 ? 'var(--warning)' : 'var(--success)'};">${fmtMoney(balance)}</td>
                          <td><span class="cp-pill ${st}">${st.toUpperCase()}</span></td>
                          <td style="text-align:center;">
                            <div class="cp-action-group">
                              <button class="cp-btn sm secondary btnViewInv" data-id="${inv.id}" title="View official printable invoice">&#x1F4C4; View / PDF</button>
                              ${balance > 0 && canRecord() ? `<button class="cp-btn sm accent btnRecordPay" data-id="${inv.id}">+ Pay</button>` : ''}
                              <button class="cp-btn sm secondary btnReminder" data-id="${inv.id}" title="Send Reminder">&#x1F4E7;</button>
                            </div>
                          </td>
                        </tr>
                      `;
                    }).join('')}
                  </tbody>
                </table>
              </div>
            `}
          </div>
        `;

        document.getElementById('invoiceSearchInput').addEventListener('input', (e) => {
          state.filters.invoiceSearch = e.target.value;
          render();
        });

        document.getElementById('btnExportInvoices').addEventListener('click', () => {
          exportToCSV('Invoices_Ledger', filtered.map(i => ({
            Invoice_No: i.invoiceNo, Date: i.date, Due_Date: i.dueDate, Student: i.clientName,
            Programme: i.programmeName, Total: i.total, Paid: invoiceBalance(i).paid,
            Balance: invoiceBalance(i).balance, Status: invoiceStatus(i)
          })));

        const btnNew = document.getElementById('btnNewInvBtn');
        if (btnNew) btnNew.addEventListener('click', () => { state.invoiceSubTab = 'new'; render(); });

        const btnEmpty = document.getElementById('btnEmptyNewInvoice');
        if (btnEmpty) btnEmpty.addEventListener('click', () => { state.invoiceSubTab = 'new'; render(); });

        container.querySelectorAll('.btnViewInv').forEach(b => {

      container.innerHTML = `

          <div style="display:grid; grid-template-columns:1fr 1fr; gap:16px; margin-top:10px;">

            <div style="background:#FAFBFD; border:1px solid var(--border); border-radius:var(--radius-sm); padding:16px;">
              <div style="font-size:14px; font-weight:700; color:var(--primary); margin-bottom:6px;">Accounting Period Status (${curMonth})</div>
              <div style="font-size:12.5px; color:var(--text-secondary); margin-bottom:12px;">
                Status: <strong style="color:${isLocked ? 'var(--danger)' : 'var(--success)'};">${isLocked ? 'LOCKED (Modifications Prohibited)' : 'OPEN FOR TRANSACTIONS'}</strong>
              </div>
              ${canLockPeriod() ? `
                <button class="cp-btn ${isLocked ? 'accent' : 'danger'} sm" id="btnToggleLockPeriod">
                  ${isLocked ? 'Reopen Financial Period' : 'Lock Current Period'}
                </button>
              ` : '<div style="font-size:11.5px; color:var(--text-muted);">Period locking restricted to Super Admin.</div>'}
            </div>

            <!-- Approval Thresholds -->
            <div style="background:#FAFBFD; border:1px solid var(--border); border-radius:var(--radius-sm); padding:16px;">
              <div style="font-size:14px; font-weight:700; color:var(--primary); margin-bottom:6px;">Approval Tiers</div>
              <div style="font-size:12px; color:var(--text-secondary); line-height:1.6;">
                Tier 1 (Under ₦100,000): <strong>Automatic Approval</strong><br/>
                Tier 2 (₦100,000 – ₦500,000): <strong>Finance Manager</strong><br/>
                Tier 3 (Over ₦500,000): <strong>Super Admin Only</strong>
              </div>
            </div>
          </div>
        </div>
      `;

      const btnLock = document.getElementById('btnToggleLockPeriod');
      if (btnLock) {
        btnLock.addEventListener('click', async () => {
          const idx = state.financePeriods.findIndex(p => p.period === curMonth);
          const newStatus = isLocked ? 'open' : 'locked';
          if (idx >= 0) {
            state.financePeriods[idx].status = newStatus;
          } else {
            state.financePeriods.push({ period: curMonth, status: newStatus, lockedAt: new Date().toISOString() });
          }
          await safeSet(STORE_KEY_FINANCE_PERIODS, state.financePeriods);
          await logAudit('PERIOD_LOCK_TOGGLE', 'period', curMonth, `Set to ${newStatus}`);
          render();
        });
      }
    }

      container.innerHTML = `

            </div>
            <div class="cp-modal-body">
              <div style="background:var(--surface-2); padding:12px; border-radius:var(--radius-sm); margin-bottom:14px; font-size:12.5px;">
                <strong>Student:</strong> ${escapeHtml(inv.clientName)} &middot; <strong>Programme:</strong> ${escapeHtml(inv.programmeName)}<br/>
                <strong>Total Invoiced:</strong> ${fmtMoney(total)} &middot; <strong>Paid to Date:</strong> ${fmtMoney(paid)}<br/>

                <div class="cp-field"><label>Payment Date *</label><input id="payDate" type="date" value="${todayStr}" /></div>
                <div class="cp-field"><label>Payment Method *</label><select id="payMethod"><option value="Bank Transfer">Bank Transfer</option><option value="POS">POS</option><option value="Card">Card</option><option value="Online Gateway">Online Gateway</option></select></div>
              </div>
              <div class="cp-field"><label>Bank Deposit / Transaction Reference *</label><input id="payRef" placeholder="e.g. GTB/NIBSS/20260825/99812" /></div>
              <div id="payFormErr" class="cp-error" style="display:none;"></div>
            </div>
            <div class="cp-modal-footer">
              <button class="cp-btn secondary" id="mCancelPay">Cancel</button>
              <button class="cp-btn accent" id="btnSavePayment">&#x2714; Confirm &amp; Issue Receipt</button>
            </div>
          </div>
        </div>
      `;

      document.getElementById('mClose').addEventListener('click', closeModal);
      document.getElementById('mCancelPay').addEventListener('click', closeModal);

      document.getElementById('btnSavePayment').addEventListener('click', async () => {
        const amt = Number(document.getElementById('payAmount').value || 0);
        const pDate = document.getElementById('payDate').value;
        const pRef = document.getElementById('payRef').value.trim();
        const errEl = document.getElementById('payFormErr');

        if (amt <= 0) { errEl.textContent = 'Please enter a valid payment amount.'; errEl.style.display = 'block'; return; }
        if (!pRef) { errEl.textContent = 'Transaction reference is required.'; errEl.style.display = 'block'; return; }
        if (isPeriodLocked(pDate)) { errEl.textContent = 'Financial period is locked.'; errEl.style.display = 'block'; return; }

        state.counters.receipt += 1;
        const newPayment = {
          id: 'pay_' + Date.now(),
          tenant_id: DEFAULT_TENANT_ID,
          invoiceId: inv.id,
          receiptNo: state.counters.receipt,
          amount: amt,
          date: pDate,
          paymentMethod: document.getElementById('payMethod').value,
          reference: pRef,
          reconciliationStatus: 'unreconciled',
          createdAt: new Date().toISOString(),
          createdBy: state.auth.user ? state.auth.user.name : 'Staff'
        };

        state.payments.push(newPayment);
        await safeSet(STORE_KEY_PAYMENTS, state.payments);
        await safeSet(STORE_KEY_COUNTERS, state.counters);
        await logAudit('RECORD_PAYMENT', 'payment', newPayment.id, `RCP #${newPayment.receiptNo} on INV #${inv.invoiceNo}`, null, newPayment);

        closeModal();
        openModal('viewReceipt', { payment: newPayment, invoice: inv });
        render();
      });
    }

          else state.budgets.push({ id: 'bdg_' + Date.now(), category: cat, department: dept, amount: amt, period: curPeriod });

          await logAudit('SET_BUDGET', 'budget', cat, `${cat} cap ${amt}`);

          render();
