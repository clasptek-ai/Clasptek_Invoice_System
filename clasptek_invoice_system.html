async function loadAll() {
  state.loading = true;
  render();

  // 1. Load configuration and session from local store
  const [sbCfg, authSession, storedSbSession] = await Promise.all([
    safeGet(STORE_KEY_SUPABASE_CONFIG, { endpoint: 'https://logaawoigfxnisimfatf.supabase.co/rest/v1/', anonKey: '', status: 'fallback' }),
    safeGet(STORE_KEY_AUTH_SESSION, null),
    safeGet('clasptek:supabase_session', null)
  ]);

  if (sbCfg) {
    state.supabase = {
      ...state.supabase,
      ...sbCfg,
      anonKey: (sbCfg.anonKey && sbCfg.anonKey.trim()) ? sbCfg.anonKey.trim() : (state.supabase.anonKey || ''),
      endpoint: (sbCfg.endpoint && sbCfg.endpoint.trim()) ? sbCfg.endpoint.trim() : (state.supabase.endpoint || '')
    };
  }

  // 1b. Restore authenticated session & Supabase JWT before any database operations
  if (authSession && authSession.user && (authSession.token || storedSbSession?.access_token)) {
    state.auth = {
      ...authSession,
      supabaseJwt: authSession.supabaseJwt || storedSbSession?.access_token || null,
      supabaseSession: authSession.supabaseSession || storedSbSession || null,
      supabaseUser: authSession.supabaseUser || storedSbSession?.user || null,
      tokenExpiresAt: authSession.tokenExpiresAt || (storedSbSession?.expires_in ? Date.now() + storedSbSession.expires_in * 1000 : null)
    };
    const restoredTenantId = state.auth.supabaseUser?.app_metadata?.tenant_id || state.auth.supabaseUser?.user_metadata?.tenant_id || storedSbSession?.user?.app_metadata?.tenant_id;
    if (restoredTenantId && state.auth.user && state.auth.user.tenant_id === 'clasptek_main') {
      state.auth.user.tenant_id = restoredTenantId;
    }
  } else if (storedSbSession && storedSbSession.access_token) {
    state.auth = state.auth || {};
    state.auth.supabaseJwt = storedSbSession.access_token;
    state.auth.supabaseSession = storedSbSession;
    state.auth.supabaseUser = storedSbSession.user;
    state.auth.tokenExpiresAt = storedSbSession.expires_in ? Date.now() + storedSbSession.expires_in * 1000 : null;
  }

  let isDbHydrated = false;

  // 2. Attempt Database-First Hydration from Supabase PostgreSQL
  if (supabaseClient.isConfigured()) {
    try {
      const pingRes = await supabaseClient.ping();
      if (pingRes.success) {
        const [
          dbProgs, dbInvs, dbPays, dbExps, dbDirInc,
          dbIncCats, dbExpCats, dbBdgs, dbAudits, dbFPeriods,
          dbFSet, dbPAccs, dbPSlips, dbPers, dbSysUsers,
          dbEnqs, dbEnrls, dbCusts, dbCNotes, dbPRems,
          dbRExps, dbRInvs, dbRecons, dbSessions, dbCTimeline
        ] = await Promise.all([
          supabaseClient.from('programmes').select('*'),
          supabaseClient.from('invoices').select('*'),
          supabaseClient.from('payments').select('*'),
          supabaseClient.from('expenses').select('*'),
          supabaseClient.from('direct_income').select('*'),
          supabaseClient.from('income_categories').select('*'),
          supabaseClient.from('expense_categories').select('*'),
          supabaseClient.from('budgets').select('*'),
          supabaseClient.from('finance_audit_log').select('*'),
          supabaseClient.from('finance_periods').select('*'),
          supabaseClient.from('finance_settings').select('*'),
          supabaseClient.from('payment_accounts').select('*'),
          supabaseClient.from('payslips').select('*'),
          supabaseClient.from('personnel').select('*'),
          supabaseClient.from('system_users').select('*'),
          supabaseClient.from('enquiries').select('*'),
          supabaseClient.from('enrolments').select('*'),
          supabaseClient.from('customers').select('*'),
          supabaseClient.from('collection_notes').select('*'),
          supabaseClient.from('payment_reminders').select('*'),
          supabaseClient.from('recurring_expenses').select('*'),
          supabaseClient.from('recurring_invoices').select('*'),
          supabaseClient.from('reconciliations').select('*'),
          supabaseClient.from('facilitator_sessions').select('*'),
          supabaseClient.from('customer_timeline').select('*')
        ]);

        // Check if query had critical errors
        const queryResults = [dbProgs, dbInvs, dbPays, dbExps, dbPSlips, dbPers, dbFSet, dbPAccs, dbEnqs, dbEnrls, dbCusts];
        const hasDbErrors = queryResults.some(r => r && r.error && (r.status >= 500 || r.error.message));

        if (!hasDbErrors) {
          const dbTotalRecords = (dbProgs.data ? dbProgs.data.length : 0) +
            (dbInvs.data ? dbInvs.data.length : 0) +
            (dbPays.data ? dbPays.data.length : 0) +
            (dbCusts.data ? dbCusts.data.length : 0);

          const localCheck = await inspectLegacyLocalData();

          if (dbTotalRecords === 0 && localCheck.hasLegacyData) {

            state.databaseAuthorityState = DATABASE_AUTHORITY_STATE.EMPTY_DATABASE;

            state.supabase.status = 'connected';
            state.supabase.persistenceMode = 'SECONDARY_FALLBACK';
            state.connectionError = 'LOCAL LEGACY DATA DETECTED — MIGRATION REQUIRED. Existing Clasptek records were detected in the local legacy store. PostgreSQL has not yet been populated. No business data has been deleted.';
            isDbHydrated = false;
          } else {
            state.programmes = Array.isArray(dbProgs.data) ? dbProgs.data : [];

            state.collectionNotes = Array.isArray(dbCNotes.data) ? dbCNotes.data : [];

            state.diagnosticState = SUPABASE_DIAGNOSTIC_STATE.DB_CONNECTED_FULLY_RECONCILED;
            state.supabase.status = 'connected';
            state.supabase.persistenceMode = 'AUTHORITATIVE';
            state.supabase.lastSuccessfulRead = new Date().toISOString();
            state.connectionError = null;
            isDbHydrated = true;
          }
        } else {
          state.databaseAuthorityState = DATABASE_AUTHORITY_STATE.CONNECTIVITY_FAILED;
          state.diagnosticState = SUPABASE_DIAGNOSTIC_STATE.CONFIGURED_NOT_REACHABLE;
          state.supabase.status = 'error';
          state.supabase.persistenceMode = 'SECONDARY_FALLBACK';
          state.connectionError = 'Unable to connect to the database. POSTGRESQL: DISCONNECTED — AUTHORITATIVE MODE NOT ACTIVE. Clasptek cannot currently reach its authoritative PostgreSQL database. No financial data has been changed.';
        }
      } else {
        if (pingRes.httpStatus === 401 || pingRes.failureClassification === DIAGNOSTIC_CLASSIFICATION.HTTP_401_UNAUTHORIZED) {
          state.databaseAuthorityState = DATABASE_AUTHORITY_STATE.API_KEY_INVALID;
          state.connectionError = '❌ HTTP 401: SUPABASE AUTHENTICATION / API KEY FAILURE. The configured Supabase API credential is invalid, missing, revoked, or mismatched. Existing business data has not been modified. No financial data has been changed.';
        } else if (pingRes.httpStatus === 403 || pingRes.failureClassification === DIAGNOSTIC_CLASSIFICATION.HTTP_403_RLS_DENIED) {
          state.databaseAuthorityState = DATABASE_AUTHORITY_STATE.RLS_AUTHORIZATION_FAILED;
          state.connectionError = '❌ HTTP 403: SUPABASE RLS / AUTHORIZATION FAILURE. Authentication succeeded but PostgreSQL/RLS denied access. Existing business data has not been modified. No financial data has been changed.';
        } else if (pingRes.httpStatus >= 500 || pingRes.failureClassification === DIAGNOSTIC_CLASSIFICATION.HTTP_500_DATABASE_ERROR) {
          state.databaseAuthorityState = DATABASE_AUTHORITY_STATE.DATABASE_UNAVAILABLE;
          state.connectionError = '❌ HTTP 500: POSTGRESQL / POSTGREST SERVER FAILURE. Supabase PostgreSQL server encountered an error. Existing business data has not been modified. No financial data has been changed.';
        } else {
          state.databaseAuthorityState = DATABASE_AUTHORITY_STATE.CONNECTIVITY_FAILED;
          state.connectionError = 'Unable to connect to the database. POSTGRESQL: DISCONNECTED — AUTHORITATIVE MODE NOT ACTIVE. Clasptek cannot currently reach its authoritative PostgreSQL database. No financial data has been changed.';
        }
        state.diagnosticState = SUPABASE_DIAGNOSTIC_STATE.CONFIGURED_NOT_REACHABLE;
        state.supabase.status = 'error';
        state.supabase.persistenceMode = 'SECONDARY_FALLBACK';
        state.supabase.lastError = pingRes.message;
      }
    } catch (err) {
      console.warn('Database hydration error, falling back to secondary cache safely:', err.message);
      state.databaseAuthorityState = DATABASE_AUTHORITY_STATE.CONNECTIVITY_FAILED;
      state.diagnosticState = SUPABASE_DIAGNOSTIC_STATE.CONFIGURED_NOT_REACHABLE;
      state.supabase.status = 'error';
      state.supabase.persistenceMode = 'SECONDARY_FALLBACK';
      state.supabase.lastError = err.message;
      state.connectionError = 'Unable to connect to the database. POSTGRESQL: DISCONNECTED — AUTHORITATIVE MODE NOT ACTIVE. Clasptek cannot currently reach its authoritative PostgreSQL database. No financial data has been changed.';
    }
  }

  // 3. Fallback to Secondary Local Storage (Offline inspection or local sandbox)

    } else {

  } else {

  }

}

function invoiceBalance(inv) {
  if (!inv) return { paid: 0, balance: 0, total: 0 };
  const paid = safeRound((state.payments || [])
    .filter(p => p.invoiceId === inv.id)
    .reduce((sum, p) => sum + Number(p.amount || 0), 0));
  let total = Number(inv.total);
  if (isNaN(total) || total === 0) {
    if (Number(inv.totalAmount) > 0) {
      total = Number(inv.totalAmount);
    } else if (Array.isArray(inv.items) && inv.items.length > 0) {
      total = inv.items.reduce((s, it) => s + Number(it.amount || (it.price * (it.quantity || 1)) || 0), 0);
    } else {
      total = 0;
    }
  }
  total = safeRound(total);
  const balance = Math.max(0, safeRound(total - paid));
  return { paid, balance, total };
}

function invoiceStatus(inv) {
  const { paid, total, balance } = invoiceBalance(inv);
  const todayStr = new Date().toISOString().slice(0, 10);
  if (paid >= total && total > 0) return 'paid';
  if (balance > 0 && (inv.dueDate || inv.date || todayStr) < todayStr) return 'overdue';
  if (paid > 0) return 'partial';
  return 'unpaid';
}

function getStudentAccountSummaries() {
  const map = {};
  const todayStr = new Date().toISOString().slice(0, 10);

  // 1. From Invoices
  (state.invoices || []).forEach(inv => {
    const name = (inv.clientName || '').trim();
    if (!name) return;
    const key = name.toLowerCase();
    if (!map[key]) {
      map[key] = {
        clientName: name,
        parentName: inv.parentName || '',
        phone: inv.phone || '',
        email: inv.email || '',
        invoices: [],
        payments: [],
        enrolments: [],
        programmes: new Set(),
        totalInvoiced: 0,
        totalPaid: 0,
        balance: 0,
        isEnrolled: false,
        financialStatus: 'UNPAID',
        status: 'Unpaid'
      };
    }
    const acc = map[key];
    acc.invoices.push(inv);
    if (!acc.phone && inv.phone) acc.phone = inv.phone;
    if (!acc.email && inv.email) acc.email = inv.email;
    if (!acc.parentName && inv.parentName) acc.parentName = inv.parentName;
    if (inv.programmeName) acc.programmes.add(inv.programmeName);

    const { total, paid, balance } = invoiceBalance(inv);
    acc.totalInvoiced = safeRound(acc.totalInvoiced + total);
    acc.totalPaid = safeRound(acc.totalPaid + paid);
    acc.balance = safeRound(acc.balance + balance);
  });

  // 2. From Enrolments
  (state.enrolments || []).forEach(en => {
    const name = (en.studentName || '').trim();
    if (!name) return;
    const key = name.toLowerCase();
    if (!map[key]) {
      map[key] = {
        clientName: name,
        parentName: '',
        phone: en.studentPhone || '',
        email: en.studentEmail || '',
        invoices: [],
        payments: [],
        enrolments: [],
        programmes: new Set(),
        totalInvoiced: Number(en.agreedFee || en.fee || 0),
        totalPaid: Number(en.amountPaid || 0),
        balance: Number(en.balance || en.balanceDue || 0),
        isEnrolled: true,
        financialStatus: 'UNPAID',
        status: 'Unpaid'
      };
    }
    const acc = map[key];
    acc.enrolments.push(en);
    acc.isEnrolled = true;
    if (en.programmeName || en.programmeNameSnapshot) {
      acc.programmes.add(en.programmeName || en.programmeNameSnapshot);
    }
  });

  // 3. From Customers
  (state.customers || []).forEach(c => {
    const name = (c.name || c.fullName || '').trim();
    if (!name) return;
    const key = name.toLowerCase();
    if (!map[key]) {
      map[key] = {
        clientName: name,
        parentName: '',
        phone: c.phone || '',
        email: c.email || '',
        invoices: [],
        payments: [],
        enrolments: [],
        programmes: new Set(),
        totalInvoiced: Number(c.totalInvoiced || 0),
        totalPaid: Number(c.totalPaid || 0),
        balance: Number(c.outstandingBalance || c.balance || 0),
        isEnrolled: false,
        financialStatus: 'UNPAID',
        status: 'Unpaid'
      };
    }
  });

  return Object.values(map).map(acc => {
    const programmesList = Array.from(acc.programmes).join(', ') || 'General';
    if (acc.balance <= 0 && acc.totalPaid > 0) {
      acc.financialStatus = 'FULLY_PAID';
      acc.status = 'Paid in Full';
    } else if (acc.totalPaid > 0 && acc.balance > 0) {
      acc.financialStatus = 'PARTIAL';
      acc.status = 'Partially Paid';
    } else {
      acc.financialStatus = 'UNPAID';
      acc.status = 'Unpaid';
    }
    return {
      ...acc,
      programmesList
    };
  });
}

function getEnquiryFinancialStatus(enquiry) {
  const linkedInvoices = state.invoices.filter(i => (enquiry.id && i.enquiryId === enquiry.id) || (enquiry.name && i.clientName.trim().toLowerCase() === enquiry.name.trim().toLowerCase()));
  if (linkedInvoices.length === 0) return { status: 'NO_INVOICE', label: 'No Invoice', pillClass: 'new', total: 0, paid: 0, balance: 0 };

  let totalInv = 0;
  let totalPaid = 0;
  let isOverdue = false;
  const todayStr = new Date().toISOString().slice(0, 10);

  linkedInvoices.forEach(inv => {
    const { total, paid, balance } = invoiceBalance(inv);
    totalInv = safeRound(totalInv + total);
    totalPaid = safeRound(totalPaid + paid);
    if (balance > 0 && (inv.dueDate || inv.date || todayStr) < todayStr) {
      isOverdue = true;
    }
  });

  const balance = Math.max(0, safeRound(totalInv - totalPaid));
  if (totalPaid >= totalInv && totalInv > 0) return { status: 'FULLY_PAID', label: 'Fully Paid', pillClass: 'fully_paid', total: totalInv, paid: totalPaid, balance: 0 };
  if (isOverdue) return { status: 'OVERDUE', label: 'Overdue', pillClass: 'overdue', total: totalInv, paid: totalPaid, balance };
  if (totalPaid > 0) return { status: 'PARTIALLY_PAID', label: 'Partially Paid', pillClass: 'partially_paid', total: totalInv, paid: totalPaid, balance };
  return { status: 'PAYMENT_PENDING', label: 'Payment Pending', pillClass: 'payment_pending', total: totalInv, paid: totalPaid, balance };
}

function getEnquiryNextAction(enquiry) {
  const fin = getEnquiryFinancialStatus(enquiry);
  const isEnrolled = state.enrolments.some(en => en.enquiryId === enquiry.id || (enquiry.name && en.studentName.trim().toLowerCase() === enquiry.name.trim().toLowerCase()));

  if (enquiry.status === 'NEW') return { label: 'Contact Prospect', action: 'contact', btnClass: 'accent' };
  if (enquiry.status === 'CONTACTED' || enquiry.status === 'INTERESTED') return { label: 'Create Invoice', action: 'create_invoice', btnClass: 'accent' };
  if (enquiry.status === 'INVOICE_REQUESTED') return { label: 'Create Invoice', action: 'create_invoice', btnClass: 'accent' };
  if (fin.status === 'NO_INVOICE') return { label: 'Create Invoice', action: 'create_invoice', btnClass: 'secondary' };
  if (fin.status === 'FULLY_PAID' && !isEnrolled) return { label: 'Enrol Student', action: 'enrol', btnClass: 'success' };
  if (fin.status === 'PARTIALLY_PAID' && !isEnrolled) return { label: 'Enrol / Pay Balance', action: 'enrol_or_pay', btnClass: 'accent' };
  if (fin.status === 'PAYMENT_PENDING' || fin.status === 'OVERDUE') return { label: 'Record Payment', action: 'record_payment', btnClass: 'accent' };
  if (isEnrolled && fin.balance > 0) return { label: 'Follow Up Balance', action: 'follow_up', btnClass: 'secondary' };
  if (isEnrolled && fin.balance === 0) return { label: 'View Student Profile', action: 'view_profile', btnClass: 'secondary' };
  return { label: 'View Details', action: 'view', btnClass: 'secondary' };
}

function getReceivableAgeing(inv) {
  const { balance } = invoiceBalance(inv);
  if (balance <= 0) return { days: 0, bucket: 'current', label: 'Paid in Full', priority: 'Low', prioClass: 'prio-low' };

  const todayStr = new Date().toISOString().slice(0, 10);
  const dueStr = inv.dueDate || inv.date || todayStr;
  const today = new Date(todayStr + 'T00:00:00');
  const due = new Date(dueStr + 'T00:00:00');
  const daysOverdue = Math.floor((today - due) / (1000 * 60 * 60 * 24));

  if (daysOverdue <= 0) return { days: daysOverdue, bucket: 'current', label: 'Current', priority: 'Low', prioClass: 'prio-low' };
  if (daysOverdue <= 30) return { days: daysOverdue, bucket: '1-30', label: `${daysOverdue}d (1–30d)`, priority: 'Medium', prioClass: 'prio-medium' };
  if (daysOverdue <= 60) return { days: daysOverdue, bucket: '31-60', label: `${daysOverdue}d (31–60d)`, priority: 'High', prioClass: 'prio-high' };
  if (daysOverdue <= 90) return { days: daysOverdue, bucket: '61-90', label: `${daysOverdue}d (61–90d)`, priority: 'Critical', prioClass: 'prio-critical' };
  return { days: daysOverdue, bucket: '90plus', label: `${daysOverdue}d (90+d)`, priority: 'Critical', prioClass: 'prio-critical' };
}

// ----------------------------------------------------
function calculatePayslipTotals(basicPay, allowances = [], deductions = []) {
  const basic = Number(basicPay) || 0;
  let totalAllowances = 0;
  if (Array.isArray(allowances)) {
    totalAllowances = safeRound(allowances.reduce((s, a) => s + Number(typeof a === 'object' ? (a.amount || 0) : a), 0));
  } else if (typeof allowances === 'number') {
    totalAllowances = Number(allowances) || 0;
  }

  // Handle session earnings if passed as 3rd param when allowances was number
  let sessionEarn = 0;
  if (typeof deductions === 'number' && typeof arguments[3] === 'number') {
    sessionEarn = Number(deductions) || 0;
    totalAllowances = safeRound(totalAllowances + sessionEarn);
  }

  const grossPay = safeRound(basic + totalAllowances);

  let totalDeductions = 0;
  if (Array.isArray(deductions)) {
    totalDeductions = safeRound(deductions.reduce((s, d) => s + Number(typeof d === 'object' ? (d.amount || 0) : d), 0));
  } else if (typeof deductions === 'number') {
    if (typeof arguments[3] === 'number') {
      totalDeductions = Number(arguments[3]) || 0;
      if (typeof arguments[4] === 'number') totalDeductions += Number(arguments[4]);
    } else {
      totalDeductions = Number(deductions) || 0;
    }
  }

  const netPay = Math.max(0, safeRound(grossPay - totalDeductions));
  return { basic, totalAllowances, grossPay, totalDeductions, netPay };
}

async function integratePayslipExpense(payslip, accountId = null) {
  // CRITICAL: Only create expense when payslip is actually PAID
  if (payslip.status !== 'paid') {
    console.warn('Attempted to integrate expense for unpaid payslip', payslip.payslipNo);
    return null;
  }

  const payslipRef = 'PAYSLIP-' + payslip.payslipNo;
  const existing = state.expenses.find(e => 
    (e.sourceId && e.sourceId === payslip.id) ||
    (e.sourceReference && e.sourceReference === payslipRef) ||
    (e.reference && e.reference === payslipRef) ||
    (payslip.linkedExpenseId && e.id === payslip.linkedExpenseId)
  );

  if (existing) {
    return existing;
  }

function findCustomerDuplicate(email, phone, name) {
  const normEmail = (email || '').trim().toLowerCase();
  const normPhone = (phone || '').replace(/[^0-9]/g, '');
  const normName = (name || '').trim().toLowerCase();

  if (normEmail && normEmail.length > 3) {
    const byEmail = state.customers.find(c => (c.email || '').trim().toLowerCase() === normEmail);
    if (byEmail) return { matchType: 'email', customer: byEmail };
  }
  if (normPhone && normPhone.length >= 7) {
    const last10 = normPhone.slice(-10);
    const byPhone = state.customers.find(c => {
      const custDigits = (c.phone || '').replace(/[^0-9]/g, '');
      return custDigits.length >= 7 && (custDigits.slice(-10) === last10 || custDigits.includes(normPhone) || normPhone.includes(custDigits));
    });
    if (byPhone) return { matchType: 'phone', customer: byPhone };
  }
  if (normName && normName.length >= 4) {
    const byName = state.customers.find(c => (c.name || c.fullName || '').trim().toLowerCase() === normName);
    if (byName) return { matchType: 'name', customer: byName };
  }
  return null;
}

    state.counters.customer = (state.counters.customer || 0) + 1;
    const custNo = `CUST-2026-${String(state.counters.customer).padStart(4, '0')}`;
    customer = {

async function syncPaymentToEnrolmentAndCustomer(payment, invoice) {
  if (!invoice) return;
  const { paid, balance } = invoiceBalance(invoice);

  // 1. Sync linked enrolment
  const linkedEnrolment = state.enrolments.find(e => e.invoiceId === invoice.id || e.id === invoice.enrolmentId || (e.studentName && e.studentName === invoice.clientName));
  if (linkedEnrolment) {
    linkedEnrolment.amountPaid = paid;
    linkedEnrolment.balance = balance;
    linkedEnrolment.balanceDue = balance;
    linkedEnrolment.financialStatus = balance <= 0 ? 'paid' : (paid > 0 ? 'partial' : 'unpaid');
    linkedEnrolment.paymentStatus = linkedEnrolment.financialStatus;
    linkedEnrolment.updatedAt = new Date().toISOString();
    await dbRepo.saveRecord(STORE_KEY_ENROLMENTS, linkedEnrolment);
    await safeSet(STORE_KEY_ENROLMENTS, state.enrolments);
  }

  // 2. Sync linked customer master record
  const customerId = invoice.customerId || (linkedEnrolment ? linkedEnrolment.customerId : null);
  if (customerId) {
    const cust = state.customers.find(c => c.id === customerId);
    if (cust) {
      const custInvoices = state.invoices.filter(i => i.customerId === customerId);
      const totalInv = custInvoices.reduce((s, i) => s + (Number(i.total) || invoiceBalance(i).total), 0);
      const totalPd = custInvoices.reduce((s, i) => s + invoiceBalance(i).paid, 0);
      cust.totalInvoiced = safeRound(totalInv);
      cust.totalPaid = safeRound(totalPd);
      cust.balance = Math.max(0, safeRound(totalInv - totalPd));
      cust.outstandingBalance = cust.balance;
      cust.lastPaymentDate = payment.paymentDate || payment.date || new Date().toISOString().slice(0, 10);
      cust.currentPaymentStatus = cust.balance <= 0 ? 'Paid in Full' : (cust.totalPaid > 0 ? 'Partial' : 'Unpaid');
      cust.updatedAt = new Date().toISOString();

      await dbRepo.saveRecord(STORE_KEY_CUSTOMERS, cust);
      await safeSet(STORE_KEY_CUSTOMERS, state.customers);

      await logCustomerActivity(cust.id, 'PAYMENT_RECEIVED', `Payment of ${fmtMoney(payment.amount)} Confirmed`, `Receipt #${payment.receiptNo} against Invoice #${invoice.invoiceNo}`, { referenceId: payment.id });
    }
  }
}

function getCustomer360Data(customerId) {
  const customer = state.customers.find(c => c.id === customerId);

  const enquiries = state.enquiries.filter(e => e.customerId === customer.id || e.convertedCustomerId === customer.id || (e.email && e.email.toLowerCase() === (customer.email || '').toLowerCase()));
  const enrolments = state.enrolments.filter(e => e.customerId === customer.id || (e.studentName && e.studentName === customer.name) || (e.studentEmail && e.studentEmail.toLowerCase() === (customer.email || '').toLowerCase()));
  const invoices = state.invoices.filter(i => i.customerId === customer.id || enrolments.some(en => en.invoiceId === i.id) || (i.clientName && i.clientName.trim().toLowerCase() === (customer.name || '').trim().toLowerCase()));
  const invoiceIds = invoices.map(i => i.id);
  const payments = state.payments.filter(p => invoiceIds.includes(p.invoiceId) || (p.clientName && p.clientName === customer.name));
  const timeline = state.customerTimeline.filter(t => t.customerId === customer.id);

  const totalInvoiced = invoices.reduce((s, i) => s + (Number(i.total) || invoiceBalance(i).total || 0), 0);
  const totalPaid = payments.reduce((s, p) => s + Number(p.amount || 0), 0);
  const outstandingBalance = Math.max(0, safeRound(totalInvoiced - totalPaid));

  const summaryObj = {
    totalInvoiced: safeRound(totalInvoiced),
    totalPaid: safeRound(totalPaid),
    balance: safeRound(outstandingBalance),
    outstandingBalance: safeRound(outstandingBalance),
    invoicesCount: invoices.length,
    paymentsCount: payments.length,
    lastPaymentDate: payments.length ? (payments[payments.length - 1].paymentDate || payments[payments.length - 1].date) : null
  };

  return {
    customer,
    enquiries,
    enrolments,
    invoices,
    payments,
    timeline,
    summary: summaryObj,
    financialSummary: summaryObj
  };
}

function calculateProgrammeContribution(progId) {
  const prog = state.programmes.find(p => p.id === progId);
  if (!prog) return {
    enquiriesCount: 0,
    enrolmentsCount: 0,
    conversionRate: 0,
    totalRevenueBilled: 0,
    totalRevenueCollected: 0,
    facilitatorDirectCosts: 0,
    operationalContribution: 0
  };

  const enquiries = state.enquiries.filter(e => e.programmeId === prog.id || (e.programmeName && e.programmeName.toLowerCase() === prog.name.toLowerCase()));
  const enrolments = state.enrolments.filter(e => e.programmeId === prog.id || (e.programmeName && e.programmeName.toLowerCase() === prog.name.toLowerCase()) || (e.programmeNameSnapshot && e.programmeNameSnapshot.toLowerCase() === prog.name.toLowerCase()));
  const invoices = state.invoices.filter(i => i.programmeId === prog.id || (i.programmeName && i.programmeName.toLowerCase() === prog.name.toLowerCase()));
  const invoiceIds = invoices.map(i => i.id);
  const payments = state.payments.filter(p => invoiceIds.includes(p.invoiceId));

  const directSessions = state.sessions.filter(s => (s.programme_id === prog.id || s.programmeId === prog.id || (s.programme_name && s.programme_name.toLowerCase() === prog.name.toLowerCase())) && (s.status === 'approved' || s.status === 'included_in_payslip'));
  const facilitatorDirectCosts = directSessions.reduce((s, sess) => s + Number(sess.total_amount || sess.totalAmount || sess.amountEarned || 0), 0);

  const totalRevenueBilled = invoices.reduce((s, i) => s + (Number(i.total) || invoiceBalance(i).total || 0), 0);
  const totalRevenueCollected = payments.reduce((s, p) => s + Number(p.amount || 0), 0);
  const operationalContribution = safeRound(totalRevenueCollected - facilitatorDirectCosts);

  const enrolCount = Math.max(enrolments.length, state.enquiries.filter(e => (e.programmeId === prog.id || e.programmeName === prog.name) && e.status === 'ENROLLED').length);

  return {
    programme: prog,
    enquiriesCount: enquiries.length,
    enrolmentsCount: enrolCount,
    conversionRate: enquiries.length ? Math.round((enrolCount / enquiries.length) * 100) : 0,
    totalRevenueBilled: safeRound(totalRevenueBilled),
    totalRevenueCollected: safeRound(totalRevenueCollected),
    facilitatorDirectCosts: safeRound(facilitatorDirectCosts),
    operationalContribution: safeRound(operationalContribution)
  };
}

async function batchDisbursePayroll(payPeriod, accountId = null) {
  const targetPayslips = state.payslips.filter(p => p.payPeriod === payPeriod && (p.status === 'approved' || p.status === 'acknowledged'));
  const results = [];

  for (const ps of targetPayslips) {
    ps.status = 'paid';
    ps.paymentAccountId = accountId || ps.paymentAccountId || null;
    ps.actualPaymentDate = new Date().toISOString().slice(0, 10);
    ps.paidAmount = ps.netPay;
    ps.paymentMethod = 'Bank Transfer';
    ps.disbursedBy = state.auth && state.auth.user ? state.auth.user.name : 'Finance Operations';
    ps.disbursedAt = new Date().toISOString();

    await dbRepo.saveRecord(STORE_KEY_PAYSLIPS, ps);
    const exp = await integratePayslipExpense(ps, accountId);

  await safeSet(STORE_KEY_EXPENSES, state.expenses);
  await logAudit('BATCH_PAYROLL_DISBURSEMENT', 'payroll', payPeriod, `Disbursed ${results.length} payslips for period ${payPeriod}`);
  return results;
}

const CRM_PERMITTED_TRANSITIONS = {
  'NEW': ['CONTACTED', 'QUALIFIED', 'LOST', 'NOT INTERESTED'],
  'CONTACTED': ['QUALIFIED', 'CONSULTATION', 'LOST', 'NOT INTERESTED', 'ON HOLD'],
  'QUALIFIED': ['CONSULTATION', 'PROPOSAL / PROGRAMME SELECTED', 'OFFERED', 'LOST', 'ON HOLD'],
  'CONSULTATION': ['PROPOSAL / PROGRAMME SELECTED', 'OFFERED', 'INVOICE GENERATED', 'LOST', 'ON HOLD'],
  'PROPOSAL / PROGRAMME SELECTED': ['OFFERED', 'INVOICE GENERATED', 'LOST', 'ON HOLD'],
  'OFFERED': ['INVOICE GENERATED', 'PAYMENT PENDING', 'LOST', 'ON HOLD'],
  'INVOICE GENERATED': ['PAYMENT PENDING', 'PARTIALLY PAID', 'PAID', 'LOST', 'ON HOLD'],
  'PAYMENT PENDING': ['PARTIALLY PAID', 'PAID', 'LOST', 'ON HOLD'],
  'PARTIALLY PAID': ['PAID', 'ENROLLED', 'ACTIVE CUSTOMER'],
  'PAID': ['ENROLLED', 'ACTIVE CUSTOMER'],
  'ENROLLED': ['ACTIVE CUSTOMER', 'ON HOLD'],
  'ACTIVE CUSTOMER': ['ON HOLD', 'ENROLLED'],
  'ON HOLD': ['NEW', 'CONTACTED', 'QUALIFIED', 'CONSULTATION', 'PROPOSAL / PROGRAMME SELECTED', 'OFFERED', 'INVOICE GENERATED', 'PAYMENT PENDING', 'PARTIALLY PAID', 'PAID', 'ENROLLED', 'ACTIVE CUSTOMER', 'LOST'],
  'LOST': ['NEW', 'CONTACTED', 'QUALIFIED']
};

function validateCrmStageTransition(fromStage, toStage, userRole = null) {
  if (!fromStage || !toStage) return { valid: false, message: 'Source and target stages required' };
  if (fromStage === toStage) return { valid: true };
  const allowed = CRM_PERMITTED_TRANSITIONS[fromStage] || [];
  if (!allowed.includes(toStage)) {
    if (userRole === 'Super Admin') {
      return { valid: true, warning: `Administrative override from ${fromStage} to ${toStage}` };
    }
    return {
      valid: false,
      message: `Invalid CRM pipeline transition from ${fromStage} to ${toStage}. Permitted next stages: ${allowed.join(', ') || 'None'}`
    };
  }
  return { valid: true };
}

async function transitionCrmStage(enquiryId, toStage, reason = '', customActor = null) {
  const enq = state.enquiries.find(e => e.id === enquiryId);
  if (!enq) throw new Error(`Enquiry ${enquiryId} not found`);

  const fromStage = enq.status || 'NEW';
  const actor = customActor || (state.auth && state.auth.user ? state.auth.user.name : 'System');
  const role = state.auth && state.auth.user ? state.auth.user.role : null;

  const validation = validateCrmStageTransition(fromStage, toStage, role);
  if (!validation.valid) {
    throw new Error(validation.message);
  }

  enq.status = toStage;
  enq.lastStageChangeAt = new Date().toISOString();
  enq.lastStageChangeBy = actor;

  const historyEntry = {
    id: 'csh_' + Date.now() + '_' + Math.floor(Math.random() * 1000),
    tenant_id: DEFAULT_TENANT_ID,
    enquiry_id: enq.id,
    customer_id: enq.customerId || enq.convertedCustomerId || null,
    from_stage: fromStage,
    to_stage: toStage,
    actor_name: actor,
    reason: reason || `Pipeline stage progression to ${toStage}`,
    created_at: new Date().toISOString()
  };

  state.crmStageHistory.unshift(historyEntry);
  await dbRepo.saveRecord(STORE_KEY_CRM_STAGE_HISTORY, historyEntry);
  await dbRepo.saveRecord(STORE_KEY_ENQUIRIES, enq);
  await safeSet(STORE_KEY_CRM_STAGE_HISTORY, state.crmStageHistory);
  await safeSet(STORE_KEY_ENQUIRIES, state.enquiries);

  if (enq.customerId || enq.convertedCustomerId) {
    await logCustomerActivity(
      enq.customerId || enq.convertedCustomerId,
      'STAGE_TRANSITION',
      `Pipeline Advanced: ${fromStage} → ${toStage}`,
      reason || `Updated by ${actor}`,
      { enquiryId: enq.id }
    );
  }

  await logAudit('CRM_STAGE_TRANSITION', 'enquiry', enq.id, `Advanced ${fromStage} -> ${toStage} for ${enq.name}`);
  return { enquiry: enq, history: historyEntry };
}

function getReceivablesAgeingAnalysis(asOfDate = null) {
  const refDateStr = asOfDate || new Date().toISOString().slice(0, 10);
  const refDate = new Date(refDateStr);

  const buckets = {
    current: { count: 0, amount: 0, invoices: [] },
    days1to30: { count: 0, amount: 0, invoices: [] },
    days31to60: { count: 0, amount: 0, invoices: [] },
    days61to90: { count: 0, amount: 0, invoices: [] },
    days90Plus: { count: 0, amount: 0, invoices: [] },
    totalOutstanding: 0,
    totalOverdue: 0
  };

  for (const inv of state.invoices) {
    const { balance } = invoiceBalance(inv);
    if (balance <= 0) continue;

    const dueDateStr = inv.dueDate || inv.date || refDateStr;
    const dueDate = new Date(dueDateStr);
    const diffMs = refDate.getTime() - dueDate.getTime();
    const daysOverdue = Math.floor(diffMs / (1000 * 60 * 60 * 24));

    buckets.totalOutstanding = safeRound(buckets.totalOutstanding + balance);

    if (daysOverdue <= 0) {
      buckets.current.count++;
      buckets.current.amount = safeRound(buckets.current.amount + balance);
      buckets.current.invoices.push({ ...inv, daysOverdue: 0 });
    } else {
      buckets.totalOverdue = safeRound(buckets.totalOverdue + balance);
      if (daysOverdue <= 30) {
        buckets.days1to30.count++;
        buckets.days1to30.amount = safeRound(buckets.days1to30.amount + balance);
        buckets.days1to30.invoices.push({ ...inv, daysOverdue });
      } else if (daysOverdue <= 60) {
        buckets.days31to60.count++;
        buckets.days31to60.amount = safeRound(buckets.days31to60.amount + balance);
        buckets.days31to60.invoices.push({ ...inv, daysOverdue });
      } else if (daysOverdue <= 90) {
        buckets.days61to90.count++;
        buckets.days61to90.amount = safeRound(buckets.days61to90.amount + balance);
        buckets.days61to90.invoices.push({ ...inv, daysOverdue });
      } else {
        buckets.days90Plus.count++;
        buckets.days90Plus.amount = safeRound(buckets.days90Plus.amount + balance);
        buckets.days90Plus.invoices.push({ ...inv, daysOverdue });
      }
    }
  }

  buckets.days_1_30 = buckets.days1to30;
  buckets.days_31_60 = buckets.days31to60;
  buckets.days_61_90 = buckets.days61to90;
  buckets.days_90_plus = buckets.days90Plus;
  buckets.buckets = buckets;

  return buckets;
}

function calculateBankReconciliation(accountId, period, statementBalance = 0, clearedItemIds = []) {
  const acc = state.paymentAccounts.find(a => a.id === accountId) || { accountName: 'Corporate Account', openingBalance: 0 };
  const openingBalance = Number(acc.openingBalance || 0);

  const accountPayments = state.payments.filter(p => (p.paymentAccountId === accountId || (!p.paymentAccountId && acc.isDefault)));
  const totalInflows = accountPayments.reduce((s, p) => s + Number(p.amount || 0), 0);

  const accountExpenses = state.expenses.filter(e => (e.paymentAccountId === accountId || (!e.paymentAccountId && acc.isDefault)) && (e.status === 'recorded' || e.status === 'paid' || e.status === 'approved'));
  const totalOutflows = accountExpenses.reduce((s, e) => s + Number(e.amount || 0), 0);

  const bookBalance = safeRound(openingBalance + totalInflows - totalOutflows);
  const stmtBalance = Number(statementBalance) || 0;

  const unclearedPayments = accountPayments.filter(p => !clearedItemIds.includes(p.id));
  const unclearedExpenses = accountExpenses.filter(e => !clearedItemIds.includes(e.id));

  const unclearedInflows = safeRound(unclearedPayments.reduce((s, p) => s + Number(p.amount || 0), 0));
  const unclearedOutflows = safeRound(unclearedExpenses.reduce((s, e) => s + Number(e.amount || 0), 0));

  const adjustedBookBalance = safeRound(bookBalance - unclearedInflows + unclearedOutflows);
  const difference = safeRound(stmtBalance - adjustedBookBalance);

  let status = 'UNRECONCILED';
  if (difference === 0) {
    status = 'RECONCILED';
  } else if (Math.abs(difference) > 0) {
    status = 'EXCEPTION';
  }

  return {
    account: acc,
    period,
    openingBalance,
    totalInflows,
    totalOutflows,
    bookBalance,
    statementBalance: stmtBalance,
    unclearedInflows,
    unclearedOutflows,
    difference,
    status,
    clearedCount: clearedItemIds.length,
    unclearedCount: unclearedPayments.length + unclearedExpenses.length
  };
}

async function transitionExpenseStatus(expenseId, targetStatus, reason = '') {
  const exp = state.expenses.find(e => e.id === expenseId);
  if (!exp) throw new Error(`Expense ${expenseId} not found`);

  const fromStatus = exp.status || 'draft';
  const actor = state.auth && state.auth.user ? state.auth.user.name : 'Finance Operations';

  const period = exp.financial_period || (exp.date ? exp.date.slice(0, 7) : new Date().toISOString().slice(0, 7));
  if (isPeriodLocked(period)) {
    throw new Error(`PERIOD LOCK VIOLATION: Financial period ${period} is LOCKED. Cannot transition expense status.`);
  }

  exp.status = targetStatus;
  exp.updatedAt = new Date().toISOString();
  if (targetStatus === 'approved') {
    exp.approvedBy = actor;
    exp.approvedAt = new Date().toISOString();
  }

  const history = {
    id: 'exh_' + Date.now() + '_' + Math.floor(Math.random() * 1000),
    tenant_id: DEFAULT_TENANT_ID,
    expense_id: exp.id,
    from_status: fromStatus,
    to_status: targetStatus,
    actor_name: actor,
    reason: reason || `Transitioned to ${targetStatus}`,
    created_at: new Date().toISOString()
  };

  state.expenseStatusHistory.unshift(history);
  await dbRepo.saveRecord(STORE_KEY_EXPENSE_STATUS_HISTORY, history);
  await dbRepo.saveRecord(STORE_KEY_EXPENSES, exp);
  await safeSet(STORE_KEY_EXPENSE_STATUS_HISTORY, state.expenseStatusHistory);
  await safeSet(STORE_KEY_EXPENSES, state.expenses);

  await logAudit('EXPENSE_STATUS_CHANGE', 'expense', exp.id, `Status changed ${fromStatus} -> ${targetStatus}`);
  return { expense: exp, history };
}

function verifySchemaCompatibility(expectedVersion = SCHEMA_VERSION) {
  const current = state.schemaVersions && state.schemaVersions.length ? state.schemaVersions[0].version : SCHEMA_VERSION;
  const majorCur = parseInt(current.split('.')[0], 10) || 0;
  const majorExp = parseInt(String(expectedVersion || SCHEMA_VERSION).split('.')[0], 10) || 0;
  const isCompatible = current === expectedVersion || (majorCur >= 10 && majorExp >= 10);
  return {
    isCompatible,
    currentVersion: current,
    expectedVersion,
    description: `Database Schema Version ${current} (Application expects ${expectedVersion})`
  };
}

async function executeTransactionalPaymentCascade(paymentData, invoiceId, options = {}) {
  const inv = state.invoices.find(i => i.id === invoiceId);
  if (!inv) throw new Error(`Invoice ${invoiceId} not found`);

  const period = inv.date ? inv.date.slice(0, 7) : new Date().toISOString().slice(0, 7);
  if (isPeriodLocked(period)) {
    throw new Error(`PERIOD LOCK VIOLATION: Financial period ${period} is LOCKED. Cannot post payments.`);
  }

  if (options.idempotencyKey) {
    await checkAndRecordIdempotency(options.idempotencyKey, 'payment', paymentData.receiptNo || 'RCT-TEMP');
  }

  state.counters.receipt = (state.counters.receipt || 20000) + 1;
  const receiptNo = paymentData.receiptNo || `RCT-${new Date().getFullYear()}-${String(state.counters.receipt).slice(-4)}`;
  const payment = {
    id: 'pay_' + Date.now() + '_' + Math.floor(Math.random() * 1000),
    tenant_id: DEFAULT_TENANT_ID,
    invoiceId: inv.id,
    invoiceNo: inv.invoiceNo,
    receiptNo: receiptNo,
    amount: Number(paymentData.amount) || 0,
    paymentDate: paymentData.paymentDate || paymentData.date || new Date().toISOString().slice(0, 10),
    date: paymentData.paymentDate || paymentData.date || new Date().toISOString().slice(0, 10),
    paymentMethod: paymentData.paymentMethod || 'Bank Transfer',
    paymentAccountId: paymentData.paymentAccountId || null,
    reference: paymentData.reference || '',
    notes: paymentData.notes || '',
    clientName: inv.clientName,
    recordedBy: state.auth && state.auth.user ? state.auth.user.name : 'Finance Staff',
    createdAt: new Date().toISOString()
  };

  // Attempt live PostgreSQL RPC if authoritative connection is active
  if (supabaseClient.isConfigured() && state.supabase.status === 'connected') {
    try {
      const rpcRes = await supabaseClient.rpc('execute_payment_transaction', {
        p_invoice_id: inv.id,
        p_amount: payment.amount,
        p_payment_method: payment.paymentMethod,
        p_payment_account_id: payment.paymentAccountId,
        p_reference: payment.reference,
        p_notes: payment.notes,
        p_payment_date: payment.paymentDate,
        p_idempotency_key: options.idempotencyKey || null
      });
      if (rpcRes.error) {
        throw new Error(`PostgreSQL RPC payment error: ${rpcRes.error.message || JSON.stringify(rpcRes.error)}`);
      }
      if (rpcRes.data && rpcRes.data.payment_id) {
        payment.id = rpcRes.data.payment_id;
        if (rpcRes.data.receipt_no) payment.receiptNo = rpcRes.data.receipt_no;
      }
    } catch (rpcErr) {
      console.warn('Live RPC payment execution failed, rolling back:', rpcErr.message);
      throw rpcErr;
    }
  }

  state.payments.push(payment);
  await dbRepo.saveRecord(STORE_KEY_PAYMENTS, payment);
  await safeSet(STORE_KEY_PAYMENTS, state.payments);
  await safeSet(STORE_KEY_COUNTERS, state.counters);

  await syncPaymentToEnrolmentAndCustomer(payment, inv);

  await logAudit('PAYMENT_RECORDED', 'payment', payment.id, `Recorded payment ${payment.receiptNo} of ₦${payment.amount} for ${inv.invoiceNo}`);
  return payment;
}

function getFinancialMetrics() {
  const totalInvoiced = safeRound(state.invoices.reduce((s, i) => s + Number(i.total || i.grandTotal || i.totalAmount || 0), 0));
  const totalPaymentsReceived = safeRound(state.payments.reduce((s, p) => s + Number(p.amount || 0), 0));
  const totalDirectIncome = safeRound(state.directIncome.filter(d => d.status !== 'cancelled').reduce((s, d) => s + Number(d.amount || 0), 0));
  const totalIncomeReceived = safeRound(totalPaymentsReceived + totalDirectIncome);

  const totalExpenses = safeRound(state.expenses.filter(e => e.status === 'recorded' || e.status === 'approved').reduce((s, e) => s + Number(e.amount || 0), 0));
  const netFinancialPosition = safeRound(totalIncomeReceived - totalExpenses);

  const outstandingReceivables = safeRound(state.invoices.reduce((s, inv) => {
    const { balance } = invoiceBalance(inv);
    return s + balance;
  }, 0));

  const overdueReceivables = safeRound(state.invoices.reduce((s, inv) => {
    const { balance } = invoiceBalance(inv);
    const todayStr = new Date().toISOString().slice(0, 10);
    if (balance > 0 && (inv.dueDate || inv.date || todayStr) < todayStr) return s + balance;
    return s;
  }, 0));

  const collectionRate = totalInvoiced > 0 ? safeRound((totalPaymentsReceived / totalInvoiced) * 100) : 100;

  // Multi-Stage Payroll KPI Metrics
  const totalPayrollDisbursed = safeRound(state.payslips.filter(p => p.status === 'paid').reduce((s, p) => s + Number(p.paidAmount || p.netPay || 0), 0));
  const awaitingMonthEndPayment = safeRound(state.payslips.filter(p => p.status === 'approved').reduce((s, p) => s + Number(p.netPay || 0), 0));
  const pendingApproval = safeRound(state.payslips.filter(p => p.status === 'acknowledged').reduce((s, p) => s + Number(p.netPay || 0), 0));
  const pendingAcknowledgement = safeRound(state.payslips.filter(p => p.status === 'issued').reduce((s, p) => s + Number(p.netPay || 0), 0));
  const draftPayroll = safeRound(state.payslips.filter(p => p.status === 'draft').reduce((s, p) => s + Number(p.netPay || 0), 0));
  const openQueriesCount = state.payslips.filter(p => p.queries && p.queries.some(q => q.status === 'open' || q.status === 'under_review')).length;

  // Pipeline Conversion Analytics
  const totalEnquiries = state.enquiries.length;
  const qualifiedEnquiries = state.enquiries.filter(e => e.status !== 'LOST').length || 1;
  const enquiriesWithInvoice = state.enquiries.filter(e => {
    return state.invoices.some(i => (i.enquiryId && i.enquiryId === e.id) || (e.name && i.clientName.trim().toLowerCase() === e.name.trim().toLowerCase()));
  }).length;

  const totalIssuedInvoices = state.invoices.length;
  const invoicesWithPayment = state.invoices.filter(i => invoiceBalance(i).paid > 0).length;
  const invoicesFullyPaid = state.invoices.filter(i => invoiceStatus(i) === 'paid').length;

  const totalEnrolments = state.enrolments.length;

  const convEnquiryToInvoice = safeRound((enquiriesWithInvoice / qualifiedEnquiries) * 100);
  const convInvoiceToPayment = totalIssuedInvoices > 0 ? safeRound((invoicesWithPayment / totalIssuedInvoices) * 100) : 0;
  const convInvoiceToFull = totalIssuedInvoices > 0 ? safeRound((invoicesFullyPaid / totalIssuedInvoices) * 100) : 0;
  const convPaymentToEnrol = invoicesWithPayment > 0 ? Math.min(100, safeRound((totalEnrolments / invoicesWithPayment) * 100)) : 0;
  const convOverall = totalEnquiries > 0 ? safeRound((totalEnrolments / totalEnquiries) * 100) : 0;

  // Monthly Metrics
  const curMonthStr = new Date().toISOString().slice(0, 7);
  const monthlyPayments = state.payments.filter(p => (p.paymentDate || p.date || '').startsWith(curMonthStr));
  const monthlyDirectIncome = state.directIncome.filter(d => (d.date || '').startsWith(curMonthStr) && d.status !== 'cancelled');
  const monthlyIncome = safeRound(monthlyPayments.reduce((s, p) => s + Number(p.amount || 0), 0) + monthlyDirectIncome.reduce((s, d) => s + Number(d.amount || 0), 0));
  const monthlyExpenses = safeRound(state.expenses.filter(e => (e.date || '').startsWith(curMonthStr) && (e.status === 'recorded' || e.status === 'approved' || e.status === 'paid')).reduce((s, e) => s + Number(e.amount || 0), 0));
  const netMonthlyPosition = safeRound(monthlyIncome - monthlyExpenses);

  const receivablesAgeing = getReceivablesAgeingAnalysis();

  return {
    totalInvoiced,
    totalPaymentsReceived,
    totalDirectIncome,
    totalIncomeReceived,
    totalExpenses,
    netFinancialPosition,
    outstandingReceivables,
    overdueReceivables,
    collectionRate,
    monthlyIncome,
    monthlyExpenses,
    netMonthlyPosition,
    monthly: {
      income: monthlyIncome,
      expenses: monthlyExpenses,
      net: netMonthlyPosition
    },
    receivablesAgeing,
    payroll: {
      totalDisbursed: totalPayrollDisbursed,
      awaitingPayment: awaitingMonthEndPayment,
      pendingApproval,
      pendingAcknowledgement,
      draftPayroll,
      openQueriesCount,
      paidPayslipsCount: state.payslips.filter(p => p.status === 'paid').length,
      approvedPayslipsCount: state.payslips.filter(p => p.status === 'approved').length
    },
    pipeline: {
      totalEnquiries,
      newEnquiries: state.enquiries.filter(e => e.status === 'NEW').length,
      contacted: state.enquiries.filter(e => e.status === 'CONTACTED' || e.status === 'INTERESTED').length,
      invoiceRequested: state.enquiries.filter(e => e.status === 'INVOICE_REQUESTED').length,
      invoicesIssued: totalIssuedInvoices,
      awaitingPayment: state.invoices.filter(i => invoiceStatus(i) === 'unpaid').length,
      partiallyPaid: state.invoices.filter(i => invoiceStatus(i) === 'partial').length,
      fullyPaid: invoicesFullyPaid,
      enrolledStudents: totalEnrolments,
      convEnquiryToInvoice,
      convInvoiceToPayment,
      convInvoiceToFull,
      convPaymentToEnrol,
      convOverall
    }
  };
}

function getStudentAccountSummaries() {
  const studentMap = {};

  (state.enquiries || []).forEach(enq => {
    const key = (enq.name || '').trim();
    if (key && !studentMap[key]) {
      studentMap[key] = {
        clientName: key, phone: enq.phone || '', email: enq.email || '', parentName: '',
        invoices: [], payments: [], enrolments: [], enquiries: [enq], followups: [],
        totalInvoiced: 0, totalPaid: 0, balance: 0, programmes: new Set([enq.programmeName].filter(Boolean))
      };
    } else if (key && studentMap[key]) {
      studentMap[key].enquiries.push(enq);
      if (enq.programmeName) studentMap[key].programmes.add(enq.programmeName);
    }
  });

  (state.invoices || []).forEach(inv => {
    const key = (inv.clientName || '').trim();
    if (!key) return;
    if (!studentMap[key]) {
      studentMap[key] = {
        clientName: key, phone: inv.phone || '', email: inv.email || '', parentName: inv.parentName || '',
        invoices: [], payments: [], enrolments: [], enquiries: [], followups: [],
        totalInvoiced: 0, totalPaid: 0, balance: 0, programmes: new Set()
      };
    }
    studentMap[key].invoices.push(inv);
    const balData = invoiceBalance(inv);
    studentMap[key].totalInvoiced = safeRound(studentMap[key].totalInvoiced + balData.total);
    if (inv.phone && !studentMap[key].phone) studentMap[key].phone = inv.phone;
    if (inv.email && !studentMap[key].email) studentMap[key].email = inv.email;
    if (inv.parentName) studentMap[key].parentName = inv.parentName;
    if (inv.programmeName) studentMap[key].programmes.add(inv.programmeName);
  });

  (state.payments || []).forEach(p => {
    const inv = (state.invoices || []).find(i => i.id === p.invoiceId);
    const clientKey = (inv && inv.clientName ? inv.clientName : (p.clientName || '')).trim();
    if (clientKey && studentMap[clientKey]) {
      if (!studentMap[clientKey].payments.includes(p)) {
        studentMap[clientKey].payments.push(p);
      }
      studentMap[clientKey].totalPaid = safeRound(studentMap[clientKey].totalPaid + Number(p.amount || 0));
    }
  });

  (state.enrolments || []).forEach(en => {
    const key = (en.studentName || '').trim();
    if (key && studentMap[key]) {
      studentMap[key].enrolments.push(en);
      if (en.programmeName) studentMap[key].programmes.add(en.programmeName);
    }
  });

  (state.collectionNotes || []).forEach(cn => {
    const inv = (state.invoices || []).find(i => i.id === cn.invoiceId);
    if (inv) {
      const key = (inv.clientName || '').trim();
      if (studentMap[key]) studentMap[key].followups.push(cn);
    }
  });

  return Object.values(studentMap).map(acc => {
    acc.balance = Math.max(0, safeRound(acc.totalInvoiced - acc.totalPaid));
    acc.programmesList = Array.from(acc.programmes).join(', ') || 'General';
    acc.isEnrolled = acc.enrolments.length > 0;
    acc.financialStatus = acc.balance === 0 && acc.totalInvoiced > 0 ? 'FULLY_PAID' : (acc.totalPaid > 0 ? 'PARTIALLY_PAID' : (acc.totalInvoiced > 0 ? 'PAYMENT_PENDING' : 'NO_INVOICE'));
    acc.status = acc.balance === 0 && acc.totalInvoiced > 0 ? 'Fully Paid' : (acc.totalPaid > 0 ? 'Partial Balance' : (acc.totalInvoiced > 0 ? 'Outstanding' : 'Prospect'));
    return acc;
  });
}

// 1. Executive Financial Intelligence Engine & Period Comparisons
function calculateExecutiveFinancialIntelligence(periodType = 'month', customRange = null) {
  const allInvoices = state.invoices || [];
  const allPayments = state.payments || [];
  const allDirectIncome = (state.directIncome || []).filter(d => d.status !== 'cancelled');
  const allExpenses = (state.expenses || []).filter(e => e.status === 'recorded' || e.status === 'approved' || e.status === 'paid');
  const allPayslips = state.payslips || [];
  const allSessions = state.sessions || [];
  const allEnrolments = state.enrolments || [];
  const allCustomers = state.customers || [];

  const totalInvoiced = safeRound(allInvoices.reduce((s, i) => s + invoiceBalance(i).total, 0));
  const totalRevenueCollected = safeRound(allPayments.reduce((s, p) => s + Number(p.amount || 0), 0));
  const totalDirectIncomeVal = safeRound(allDirectIncome.reduce((s, d) => s + Number(d.amount || 0), 0));
  const totalRevenue = safeRound(totalRevenueCollected + totalDirectIncomeVal);

  const outstandingReceivables = safeRound(allInvoices.reduce((s, inv) => {
    const { balance } = invoiceBalance(inv);
    return s + balance;
  }, 0));

  const todayStr = new Date().toISOString().slice(0, 10);
  const overdueReceivables = safeRound(allInvoices.reduce((s, inv) => {
    const { balance } = invoiceBalance(inv);
    if (balance <= 0) return s;
    const dueDate = inv.dueDate || inv.date || todayStr;
    return dueDate < todayStr ? s + balance : s;
  }, 0));

  const totalExpenses = safeRound(allExpenses.reduce((s, e) => s + Number(e.amount || 0), 0));

  const payrollCost = safeRound(allPayslips.filter(p => p.status === 'paid' || p.status === 'approved' || p.status === 'issued').reduce((s, p) => s + Number(p.netPay || p.totalPay || 0), 0));

  const facilitatorCost = safeRound(allSessions.filter(s => s.status === 'approved' || s.status === 'paid' || s.status === 'completed').reduce((s, ssn) => {
    const pers = state.personnel.find(p => p.id === ssn.facilitatorId);
    const rate = pers ? Number(pers.hourlyRate || pers.sessionRate || pers.ratePerSession || 15000) : 15000;
    return s + (Number(ssn.durationHours || 1) * rate);
  }, 0));

  const operatingExpenses = Math.max(0, safeRound(totalExpenses - payrollCost));
  const grossOperatingContribution = safeRound(totalRevenue - facilitatorCost);
  const netFinancialPosition = safeRound(totalRevenue - totalExpenses);

  // Cash Position
  const openingBankBalance = (state.paymentAccounts || []).filter(a => a.isActive !== false).reduce((s, a) => s + Number(a.balance !== undefined ? a.balance : (a.openingBalance || 0)), 0);
  const cashPosition = safeRound(openingBankBalance);

  const collectionRatePct = totalInvoiced > 0 ? safeRound((totalRevenueCollected / totalInvoiced) * 100) : 100;
  const expenseToRevenuePct = totalRevenue > 0 ? safeRound((totalExpenses / totalRevenue) * 100) : 0;
  const payrollToRevenuePct = totalRevenue > 0 ? safeRound((payrollCost / totalRevenue) * 100) : 0;
  const uniqueCustomerCount = Math.max(1, allCustomers.length || new Set(allInvoices.map(i => i.clientName)).size || 1);
  const averageCustomerValue = safeRound(totalRevenue / uniqueCustomerCount);

  // Period Comparison Engine
  const currentMonthKey = todayStr.slice(0, 7);
  const currentYear = todayStr.slice(0, 4);

  let currentPeriodLabel = 'Current Month';
  let previousPeriodLabel = 'Previous Month';
  let filterCur = (d) => String(d || '').startsWith(currentMonthKey);
  let filterPrev = (d) => {
    const curMonthNum = parseInt(currentMonthKey.split('-')[1], 10);
    const prevMonthNum = curMonthNum === 1 ? 12 : curMonthNum - 1;
    const prevYear = curMonthNum === 1 ? parseInt(currentYear, 10) - 1 : currentYear;
    const prevKey = `${prevYear}-${String(prevMonthNum).padStart(2, '0')}`;
    return String(d || '').startsWith(prevKey);
  };

  if (periodType === 'quarter') {
    const m = parseInt(todayStr.slice(5, 7), 10);
    const q = Math.ceil(m / 3);
    const curMonths = [q * 3 - 2, q * 3 - 1, q * 3].map(x => `${currentYear}-${String(x).padStart(2, '0')}`);
    const prevQ = q === 1 ? 4 : q - 1;
    const prevYear = q === 1 ? String(parseInt(currentYear, 10) - 1) : currentYear;
    const prevMonths = [prevQ * 3 - 2, prevQ * 3 - 1, prevQ * 3].map(x => `${prevYear}-${String(x).padStart(2, '0')}`);
    currentPeriodLabel = `Q${q} ${currentYear}`;
    previousPeriodLabel = `Q${prevQ} ${prevYear}`;
    filterCur = (d) => curMonths.some(k => String(d || '').startsWith(k));
    filterPrev = (d) => prevMonths.some(k => String(d || '').startsWith(k));
  } else if (periodType === 'year') {
    currentPeriodLabel = currentYear;
    previousPeriodLabel = String(parseInt(currentYear, 10) - 1);
    filterCur = (d) => String(d || '').startsWith(currentYear);
    filterPrev = (d) => String(d || '').startsWith(previousPeriodLabel);
  } else if (periodType === 'custom' && customRange && customRange.startDate && customRange.endDate) {
    currentPeriodLabel = `${customRange.startDate} to ${customRange.endDate}`;
    previousPeriodLabel = 'Prior Period';
    filterCur = (d) => d && d >= customRange.startDate && d <= customRange.endDate;
    filterPrev = () => false;
  }

  // Current Period Calculations
  const curPayments = allPayments.filter(p => filterCur(p.paymentDate || p.date));
  const curDirectInc = allDirectIncome.filter(d => filterCur(d.date));
  const curRevenue = safeRound(curPayments.reduce((s, p) => s + Number(p.amount || 0), 0) + curDirectInc.reduce((s, d) => s + Number(d.amount || 0), 0));
  const curExpenses = safeRound(allExpenses.filter(e => filterCur(e.date || e.financial_period)).reduce((s, e) => s + Number(e.amount || 0), 0));
  const curNet = safeRound(curRevenue - curExpenses);

  // Previous Period Calculations
  const prevPayments = allPayments.filter(p => filterPrev(p.paymentDate || p.date));
  const prevDirectInc = allDirectIncome.filter(d => filterPrev(d.date));
  const prevRevenue = safeRound(prevPayments.reduce((s, p) => s + Number(p.amount || 0), 0) + prevDirectInc.reduce((s, d) => s + Number(d.amount || 0), 0));
  const prevExpenses = safeRound(allExpenses.filter(e => filterPrev(e.date || e.financial_period)).reduce((s, e) => s + Number(e.amount || 0), 0));
  const prevNet = safeRound(prevRevenue - prevExpenses);

  // Deltas and Trends
  const revenueDelta = safeRound(curRevenue - prevRevenue);
  const revenuePctChange = prevRevenue > 0 ? safeRound(((curRevenue - prevRevenue) / prevRevenue) * 100) : (curRevenue > 0 ? 100 : 0);
  const revenueTrend = revenueDelta > 0 ? 'UP' : (revenueDelta < 0 ? 'DOWN' : 'FLAT');

  const expenseDelta = safeRound(curExpenses - prevExpenses);
  const expensePctChange = prevExpenses > 0 ? safeRound(((curExpenses - prevExpenses) / prevExpenses) * 100) : (curExpenses > 0 ? 100 : 0);
  const expenseTrend = expenseDelta > 0 ? 'UP' : (expenseDelta < 0 ? 'DOWN' : 'FLAT');

  const netDelta = safeRound(curNet - prevNet);
  const netPctChange = prevNet !== 0 ? safeRound(((curNet - prevNet) / Math.abs(prevNet)) * 100) : 0;
  const netTrend = netDelta > 0 ? 'UP' : (netDelta < 0 ? 'DOWN' : 'FLAT');

  return {
    totalRevenue,
    totalInvoiced,
    totalRevenueCollected,
    totalDirectIncome: totalDirectIncomeVal,
    outstandingReceivables,
    overdueReceivables,
    totalExpenses,
    payrollCost,
    facilitatorCost,
    operatingExpenses,
    grossOperatingContribution,
    netFinancialPosition,
    cashPosition,
    collectionRatePct,
    expenseToRevenuePct,
    payrollToRevenuePct,
    averageCustomerValue,
    currentPeriod: {
      label: currentPeriodLabel,
      revenue: curRevenue,
      expenses: curExpenses,
      net: curNet
    },
    previousPeriod: {
      label: previousPeriodLabel,
      revenue: prevRevenue,
      expenses: prevExpenses,
      net: prevNet
    },
    comparison: {
      revenueDelta,
      revenuePctChange,
      revenueTrend,
      expenseDelta,
      expensePctChange,
      expenseTrend,
      netDelta,
      netPctChange,
      netTrend
    }
  };
}

// 2. Budget vs Actual Control System
function calculateBudgetVsActual(financialYear = '2026', periodKey = null, department = null) {
  const budgets = state.budgets || [];
  const financialBudgets = state.financialBudgets || [];
  const budgetLines = state.budgetLines || [];
  const expenses = (state.expenses || []).filter(e => e.status === 'recorded' || e.status === 'approved' || e.status === 'paid');

  const categoryMap = {};
  const currentMonthKey = new Date().toISOString().slice(0, 7);
  const targetPeriod = periodKey || currentMonthKey;

  budgets.forEach(b => {
    if (!b || !b.category) return;
    const cat = b.category;
    if (!categoryMap[cat]) {
      categoryMap[cat] = {
        category: cat,
        department: b.department || 'General',
        budgetAmount: 0,
        actualAmount: 0,
        subCategories: {}
      };
    }
    categoryMap[cat].budgetAmount = safeRound(categoryMap[cat].budgetAmount + Number(b.amount || b.monthlyLimit || 0));
  });

  budgetLines.forEach(bl => {
    if (!bl || !bl.category) return;
    if (periodKey && bl.month_key !== periodKey) return;
    const cat = bl.category;
    if (!categoryMap[cat]) {
      categoryMap[cat] = {
        category: cat,
        department: bl.department || 'General',
        budgetAmount: 0,
        actualAmount: 0,
        subCategories: {}
      };
    }
    categoryMap[cat].budgetAmount = safeRound(categoryMap[cat].budgetAmount + Number(bl.budget_amount || 0));
    if (bl.sub_category) {
      if (!categoryMap[cat].subCategories[bl.sub_category]) {
        categoryMap[cat].subCategories[bl.sub_category] = { budgetAmount: 0, actualAmount: 0 };
      }
      categoryMap[cat].subCategories[bl.sub_category].budgetAmount = safeRound(categoryMap[cat].subCategories[bl.sub_category].budgetAmount + Number(bl.budget_amount || 0));
    }
  });

  expenses.forEach(e => {
    if (!e || !e.category) return;
    const expPeriod = (e.date || e.financial_period || '').slice(0, 7);
    if (periodKey && expPeriod !== periodKey) return;
    const cat = e.category;
    if (!categoryMap[cat]) {
      categoryMap[cat] = {
        category: cat,
        department: e.department || 'Operations',
        budgetAmount: 0,
        actualAmount: 0,
        subCategories: {}
      };
    }
    categoryMap[cat].actualAmount = safeRound(categoryMap[cat].actualAmount + Number(e.amount || 0));
    if (e.subCategory) {
      if (!categoryMap[cat].subCategories[e.subCategory]) {
        categoryMap[cat].subCategories[e.subCategory] = { budgetAmount: 0, actualAmount: 0 };
      }
      categoryMap[cat].subCategories[e.subCategory].actualAmount = safeRound(categoryMap[cat].subCategories[e.subCategory].actualAmount + Number(e.amount || 0));
    }
  });

  let totalBudget = 0;
  let totalActual = 0;
  const categories = Object.values(categoryMap).map(c => {
    const variance = safeRound(c.budgetAmount - c.actualAmount);
    const variancePct = c.budgetAmount > 0 ? safeRound(((c.actualAmount - c.budgetAmount) / c.budgetAmount) * 100) : 0;
    const utilizationPct = c.budgetAmount > 0 ? safeRound((c.actualAmount / c.budgetAmount) * 100) : (c.actualAmount > 0 ? 100 : 0);
    const isOverBudget = c.actualAmount > c.budgetAmount;
    const isNearLimit = !isOverBudget && utilizationPct >= 80;
    const status = isOverBudget ? 'OVER_BUDGET' : (isNearLimit ? 'NEAR_LIMIT' : 'UNDER_BUDGET');

    totalBudget = safeRound(totalBudget + c.budgetAmount);
    totalActual = safeRound(totalActual + c.actualAmount);

    return {
      ...c,
      variance,
      variancePct,
      utilizationPct,
      isOverBudget,
      isNearLimit,
      status
    };
  });

  const totalVariance = safeRound(totalBudget - totalActual);
  const overallUtilizationPct = totalBudget > 0 ? safeRound((totalActual / totalBudget) * 100) : 0;
  const overBudgetCategories = categories.filter(c => c.isOverBudget);
  const nearLimitCategories = categories.filter(c => c.isNearLimit);

  return {
    financialYear,
    periodKey: targetPeriod,
    totalBudget,
    totalActual,
    totalVariance,
    overallUtilizationPct,
    categories,
    overBudgetCategories,
    nearLimitCategories,
    hasOverspending: overBudgetCategories.length > 0
  };
}

function getBudgetExpenseTransactions(category, periodKey = null) {
  const expenses = (state.expenses || []).filter(e => e.status === 'recorded' || e.status === 'approved' || e.status === 'paid');
  return expenses.filter(e => {
    const matchCat = !category || String(e.category || '').toLowerCase() === String(category).toLowerCase();
    const expPeriod = (e.date || e.financial_period || '').slice(0, 7);

    subCategory: e.subCategory || '',
    payee: e.payee || e.vendor || 'Vendor',
    amount: Number(e.amount || 0),
    description: e.description || '',
    status: e.status || '',
    receiptNo: e.receiptNo || e.invoiceNo || ''
  }));
}

// 3. Programme Profitability Intelligence Engine
function calculateEnhancedProgrammeProfitability() {
  const programmes = state.programmes || [];
  const invoices = state.invoices || [];
  const payments = state.payments || [];
  const enquiries = state.enquiries || [];
  const enrolments = state.enrolments || [];
  const sessions = state.sessions || [];

  const list = programmes.map(prog => {
    const progName = prog.name || 'Programme';
    const progInvoices = invoices.filter(i => i.programmeName === progName || i.programmeId === prog.id || (i.items && i.items.some(item => item.description === progName)));
    const revenueBilled = safeRound(progInvoices.reduce((s, i) => s + invoiceBalance(i).total, 0));

    const progInvIds = new Set(progInvoices.map(i => i.id));
    const progPayments = payments.filter(p => progInvIds.has(p.invoiceId) || p.programmeName === progName || p.programmeId === prog.id);
    const revenueCollected = safeRound(progPayments.reduce((s, p) => s + Number(p.amount || 0), 0));
    const outstanding = Math.max(0, safeRound(revenueBilled - revenueCollected));

    const progEnquiries = enquiries.filter(e => e.programmeName === progName || e.programmeId === prog.id);
    const enquiriesCount = progEnquiries.length;
    const progEnrolments = enrolments.filter(e => e.programmeName === progName || e.programmeId === prog.id || e.programmeNameSnapshot === progName);
    const studentsCount = progEnrolments.length;
    const conversionPct = enquiriesCount > 0 ? safeRound((studentsCount / enquiriesCount) * 100) : (studentsCount > 0 ? 100 : 0);

    const progSessions = sessions.filter(s => s.programmeName === progName || s.programmeId === prog.id || s.programme_id === prog.id);
    const facilitatorCost = safeRound(progSessions.reduce((s, ssn) => {
      if (Number(ssn.total_amount || ssn.totalAmount) > 0) return s + Number(ssn.total_amount || ssn.totalAmount);
      const pers = (state.personnel || []).find(p => p.id === ssn.facilitatorId || p.id === ssn.facilitator_id);
      const rate = Number(ssn.agreedRate || ssn.rate_per_session || (pers ? (pers.hourlyRate || pers.sessionRate || 15000) : 15000));
      const dur = Number(ssn.sessionsConducted || ssn.sessions_count || ssn.durationHours || 1);
      return s + (dur * rate);
    }, 0));

    const marketingAllocation = safeRound(revenueBilled * 0.10);
    const operationalAllocation = safeRound(revenueBilled * 0.10);
    const otherAllocatedCost = safeRound(marketingAllocation + operationalAllocation);
    const totalCost = safeRound(facilitatorCost + otherAllocatedCost);

    const contribution = safeRound(revenueCollected - facilitatorCost);
    const netMargin = safeRound(revenueCollected - totalCost);
    const contributionMarginPct = revenueCollected > 0 ? safeRound((contribution / revenueCollected) * 100) : 0;

    const averageRevenuePerStudent = studentsCount > 0 ? safeRound(revenueCollected / studentsCount) : safeRound(revenueBilled);
    const costPerStudent = studentsCount > 0 ? safeRound(totalCost / studentsCount) : totalCost;

    return {
      id: prog.id,
      name: progName,
      code: prog.code || '',
      category: prog.category || 'Tech',
      price: Number(prog.price || prog.fee || 0),
      studentsCount,
      enquiriesCount,
      conversionPct,
      amountInvoiced: revenueBilled,
      amountCollected: revenueCollected,
      outstanding,
      facilitatorCost,
      marketingAllocation,
      operationalAllocation,
      otherAllocatedCost,
      totalCost,
      contribution,
      netMargin,
      contributionMarginPct,
      averageRevenuePerStudent,
      costPerStudent
    };
  });

  list.sort((a, b) => b.contribution - a.contribution);
  list.forEach((p, idx) => { p.profitabilityRank = idx + 1; });

  return list;
}

// 4. Customer Revenue Intelligence & Segmentation Engine
function calculateCustomerRevenueIntelligence() {
  const summaries = getStudentAccountSummaries();
  const today = new Date();

  return summaries.map(cust => {
    const lifetimeInvoiced = cust.totalInvoiced || 0;
    const lifetimePayments = cust.totalPaid || 0;
    const outstandingBalance = cust.balance || 0;
    const invoicesCount = (cust.invoices || []).length;
    const enrolmentsCount = (cust.enrolments || []).length;
    const programmesCount = cust.programmes ? (cust.programmes.size || 1) : (cust.programmesList ? cust.programmesList.split(',').length : 1);
    const averageTransactionValue = invoicesCount > 0 ? safeRound(lifetimeInvoiced / invoicesCount) : 0;
    const paymentReliabilityScore = invoicesCount > 0 ? Math.min(100, safeRound((lifetimePayments / Math.max(1, lifetimeInvoiced)) * 100)) : 100;

    let daysOutstanding = 0;
    (cust.invoices || []).forEach(inv => {
      const { balance } = invoiceBalance(inv);
      if (balance > 0) {
        const dueDate = new Date(inv.dueDate || inv.date || today);
        const diffDays = Math.max(0, Math.floor((today - dueDate) / (1000 * 60 * 60 * 24)));
        if (diffDays > daysOutstanding) daysOutstanding = diffDays;
      }
    });

    const customerLifetimeValue = safeRound(lifetimePayments + (outstandingBalance > 0 ? outstandingBalance * 0.8 : 0));

    let segment = 'Regular';
    if (lifetimePayments >= 500000 && outstandingBalance === 0) {
      segment = 'VIP';
    } else if (lifetimeInvoiced >= 300000) {
      segment = 'High Value';
    } else if (outstandingBalance > 0 && daysOutstanding > 60) {
      segment = 'Delinquent';
    } else if (outstandingBalance > 0 && daysOutstanding > 30) {
      segment = 'At Risk';
    } else if (outstandingBalance === 0 && lifetimePayments > 0) {
      segment = 'Fully Paid';
    } else if (invoicesCount <= 1 && enrolmentsCount <= 1) {
      segment = 'New';
    }

    return {
      customerId: cust.clientName,
      name: cust.clientName,
      email: cust.email,
      phone: cust.phone,
      parentName: cust.parentName,
      lifetimeInvoiced,
      lifetimePayments,
      outstandingBalance,
      invoicesCount,
      enrolmentsCount,
      programmesCount,
      programmesList: cust.programmesList,
      averageTransactionValue,
      paymentReliabilityScore,
      daysOutstanding,
      customerLifetimeValue,
      segment,
      currentFinancialStatus: cust.financialStatus
    };
  });
}

// 5. Cash Flow Forecasting Engine
function calculateCashFlowForecast(daysHorizon = 30) {
  const hDays = Number(daysHorizon) || 30;
  const activeAccounts = getActivePaymentAccounts();
  const openingCash = safeRound(activeAccounts.reduce((s, a) => s + Number(a.balance !== undefined ? a.balance : (a.openingBalance || 0)), 0));

  const today = new Date();
  const targetDate = new Date(today.getTime() + hDays * 24 * 60 * 60 * 1000);
  const targetDateStr = targetDate.toISOString().slice(0, 10);

  const scheduledInvoices = (state.invoices || []).filter(inv => {
    const { balance } = invoiceBalance(inv);
    if (balance <= 0) return false;
    const d = inv.dueDate || inv.date || targetDateStr;
    return d <= targetDateStr;
  });
  const expectedInvoiceInflows = safeRound(scheduledInvoices.reduce((s, inv) => {
    const { balance } = invoiceBalance(inv);
    return s + balance;
  }, 0) * 0.85);

  const recurringInvoicesInflow = safeRound((state.recurringInvoices || []).filter(r => r.status === 'active').reduce((s, r) => s + Number(r.amount || 0), 0) * (hDays / 30));
  const expectedInflows = safeRound(expectedInvoiceInflows + recurringInvoicesInflow);

  const pendingPayrollOutflow = safeRound((state.payslips || []).filter(p => p.status === 'approved' || p.status === 'issued' || p.status === 'draft').reduce((s, p) => s + Number(p.netPay || p.totalPay || 0), 0));
  const pendingFacilitatorOutflow = safeRound((state.sessions || []).filter(s => s.status === 'pending_approval' || s.status === 'scheduled').reduce((s, ssn) => s + 15000, 0));
  const recurringExpensesOutflow = safeRound((state.recurringExpenses || []).filter(r => r.status === 'active').reduce((s, r) => s + Number(r.amount || 0), 0) * (hDays / 30));
  const approvedExpensesOutflow = safeRound((state.expenses || []).filter(e => e.status === 'approved').reduce((s, e) => s + Number(e.amount || 0), 0));

  const expectedOutflows = safeRound(pendingPayrollOutflow + pendingFacilitatorOutflow + recurringExpensesOutflow + approvedExpensesOutflow);
  const forecastClosingCash = safeRound(openingCash + expectedInflows - expectedOutflows);
  const netCashFlow = safeRound(expectedInflows - expectedOutflows);

  let runwayStatus = 'HEALTHY';
  if (forecastClosingCash < 0) runwayStatus = 'CRITICAL';
  else if (forecastClosingCash < (expectedOutflows * 0.3)) runwayStatus = 'TIGHT';

  return {
    forecastDate: new Date().toISOString().slice(0, 10),
    daysHorizon: hDays,
    horizonDays: hDays,
    openingCash,
    expectedInflows,
    inflowBreakdown: {
      scheduledInvoiceInflows: expectedInvoiceInflows,
      recurringInvoicesInflow
    },
    expectedOutflows,
    outflowBreakdown: {
      payrollOutflow: pendingPayrollOutflow,
      facilitatorOutflow: pendingFacilitatorOutflow,
      recurringExpensesOutflow,
      approvedExpensesOutflow
    },
    netCashFlow,
    forecastClosingCash,
    runwayStatus
  };
}

// 6. Accounts Receivable Collection Priority & Recommended Actions
function calculateCollectionPriorityScore(item) {
  let balance = 0;
  let daysOverdue = 0;
  let clientName = '';
  let invId = null;

  if (item && (item.invoiceNo || item.clientName)) {
    const balData = invoiceBalance(item);
    balance = balData.balance;
    clientName = item.clientName || '';
    invId = item.id;
    const today = new Date();
    const dueDate = new Date(item.dueDate || item.date || today);
    daysOverdue = Math.max(0, Math.floor((today - dueDate) / (1000 * 60 * 60 * 24)));
  } else if (item && item.outstandingBalance !== undefined) {
    balance = item.outstandingBalance;
    daysOverdue = item.daysOutstanding || 0;
    clientName = item.name || '';
  }

  let score = 0;
  if (balance >= 200000) score += 40;
  else if (balance >= 100000) score += 28;
  else if (balance >= 50000) score += 18;
  else if (balance > 0) score += 10;

  if (daysOverdue >= 60) score += 40;
  else if (daysOverdue >= 30) score += 28;
  else if (daysOverdue >= 14) score += 18;
  else if (daysOverdue > 0) score += 10;

  const custIntel = calculateCustomerRevenueIntelligence().find(c => c.name === clientName);
  if (custIntel && custIntel.segment === 'Delinquent') score += 20;
  else if (custIntel && custIntel.segment === 'At Risk') score += 12;

  let priority = 'LOW';
  let recommendedAction = 'Automated Email Payment Reminder';
  let actionType = 'Email';

  if (score >= 70) {
    priority = 'CRITICAL';
    recommendedAction = 'Immediate Escalation & In-Person Follow-up';
    actionType = 'Escalation';
  } else if (score >= 45) {
    priority = 'HIGH';
    recommendedAction = 'Direct Phone Call & Payment Plan Negotiation';
    actionType = 'Phone Call';
  } else if (score >= 25) {
    priority = 'MEDIUM';
    recommendedAction = 'WhatsApp Reminder with Outstanding Statement';
    actionType = 'WhatsApp';
  }

  return {
    score,
    priority,
    recommendedAction,
    actionType,
    balance,
    daysOverdue,
    clientName,
    invoiceId: invId
  };
}
