// 7. Spend Analytics & Expense Anomaly Detection
function detectExpenseAnomalies() {
  const expenses = state.expenses || [];
  const anomalies = [];

  const catTotals = {};
  const catCounts = {};
  expenses.forEach(e => {
    const cat = e.category || 'Operations';
    catTotals[cat] = (catTotals[cat] || 0) + Number(e.amount || 0);
    catCounts[cat] = (catCounts[cat] || 0) + 1;
  });

  const catAverages = {};
  Object.keys(catTotals).forEach(cat => {
    catAverages[cat] = catTotals[cat] / Math.max(1, catCounts[cat]);
  });

  expenses.forEach(e => {
    const amt = Number(e.amount || 0);
    const cat = e.category || 'Operations';
    const avg = catAverages[cat] || 0;

    if (avg > 10000 && amt > (2.5 * avg) && amt > 100000) {
      anomalies.push({
        id: `anom_spike_${e.id}`,
        expenseId: e.id,
        amount: amt,
        type: 'CATEGORY_SPIKE',
        severity: 'HIGH',
        finding: `Expense of ₦${amt.toLocaleString()} is significantly higher than category average of ₦${Math.round(avg).toLocaleString()}`,
        evidence: `Category: ${cat} · Payee: ${e.payee || e.vendor} · Date: ${e.date}`,
        recommendedAction: 'Verify vendor quote and obtain secondary management authorization.'
      });
    }

    if (amt >= 200000) {
      anomalies.push({
        id: `anom_high_${e.id}`,
        expenseId: e.id,
        amount: amt,
        type: 'HIGH_VALUE_TRANSACTION',
        severity: 'MEDIUM',
        finding: `High-value expense transaction of ₦${amt.toLocaleString()} requires Tier-3 approval.`,
        evidence: `Payee: ${e.payee || e.vendor} · Category: ${cat}`,
        recommendedAction: 'Ensure dual-signoff and payment voucher archiving.'
      });
    }

    if (isPeriodLocked(e.date || e.financial_period)) {
      anomalies.push({
        id: `anom_lock_${e.id}`,
        expenseId: e.id,
        amount: amt,
        type: 'POST_PERIOD_LOCK_ENTRY',
        severity: 'CRITICAL',
        finding: `Expense dated ${e.date} falls into a closed and finalized financial period.`,
        evidence: `Period: ${(e.date || '').slice(0, 7)} is locked`,
        recommendedAction: 'Revert expense mutation or post through Financial Adjustment Ledger.'
      });
    }
  });

  for (let i = 0; i < expenses.length; i++) {
    for (let j = i + 1; j < expenses.length; j++) {
      const a = expenses[i];
      const b = expenses[j];
      if (a.payee && b.payee && String(a.payee).toLowerCase() === String(b.payee).toLowerCase() && Number(a.amount) === Number(b.amount)) {
        const d1 = new Date(a.date || 0);
        const d2 = new Date(b.date || 0);
        const diffDays = Math.abs((d1 - d2) / (1000 * 60 * 60 * 24));
        if (diffDays <= 3) {
          anomalies.push({
            id: `anom_dup_${a.id}_${b.id}`,
            expenseId: b.id,
            amount: Number(b.amount),
            type: 'POTENTIAL_DUPLICATE',
            severity: 'HIGH',
            finding: `Identical expense amount of ₦${Number(a.amount).toLocaleString()} for ${a.payee} submitted within ${Math.round(diffDays)} days.`,
            evidence: `Expense #${a.id} on ${a.date} vs Expense #${b.id} on ${b.date}`,
            recommendedAction: 'Check invoice numbers to prevent duplicate payment disbursement.'
          });
        }
      }
    }
  }

  return anomalies;
}

// 8. Payroll Cost Intelligence
function calculatePayrollCostIntelligence() {
  const payslips = state.payslips || [];
  const sessions = state.sessions || [];
  const personnel = state.personnel || [];
  const metrics = calculateExecutiveFinancialIntelligence('month');

  const staffPayslips = payslips.filter(p => {
    if (p.personnelType === 'facilitator' || p.type === 'facilitator' || p.employeeType === 'facilitator') return false;
    const pers = personnel.find(x => x.id === p.personnelId || x.employeeId === p.employeeId);
    return !pers || pers.type !== 'facilitator';
  });

  const facilitatorPayslips = payslips.filter(p => {
    if (p.personnelType === 'facilitator' || p.type === 'facilitator' || p.employeeType === 'facilitator') return true;
    const pers = personnel.find(x => x.id === p.personnelId || x.employeeId === p.employeeId);
    return pers && pers.type === 'facilitator';
  });

  const salariedStaffCost = safeRound(staffPayslips.reduce((s, p) => s + Number(p.netPay || p.totalPay || 0), 0));
  const facilitatorCost = safeRound(facilitatorPayslips.reduce((s, p) => s + Number(p.netPay || p.totalPay || 0), 0));
  const totalPayrollCost = safeRound(salariedStaffCost + facilitatorCost);

  const activeStaffCount = personnel.filter(p => p.type !== 'facilitator' && p.status === 'active').length || 1;
  const averageEmployeeCost = safeRound(salariedStaffCost / activeStaffCount);

  const deliveredSessionsCount = sessions.filter(s => s.status === 'completed' || s.status === 'approved' || s.status === 'paid').length || 1;
  const averageSessionCost = safeRound((facilitatorCost || sessions.length * 15000) / deliveredSessionsCount);

  const totalRevenue = Math.max(1, metrics.totalRevenue);
  const payrollToRevenuePct = safeRound((totalPayrollCost / totalRevenue) * 100);

  const unpaidPayrollLiability = safeRound(payslips.filter(p => p.status === 'approved' || p.status === 'issued').reduce((s, p) => s + Number(p.netPay || p.totalPay || 0), 0));

  return {
    monthlyPayrollLiability: totalPayrollCost,
    totalStaffLiability: salariedStaffCost,
    totalFacilitatorLiability: facilitatorCost,
    salariedStaffCost,
    facilitatorCost,
    payrollToRevenuePct,
    averageEmployeeCost,
    averageSessionCost,
    unpaidPayrollLiability,
    activeStaffCount,
    deliveredSessionsCount
  };
}

// 9. Executive Decision Support & Recommendations Engine
function generateExecutiveRecommendations() {
  const recommendations = [];
  const fin = calculateExecutiveFinancialIntelligence('month');
  const budgets = calculateBudgetVsActual('2026', new Date().toISOString().slice(0, 7));
  const progProf = calculateEnhancedProgrammeProfitability();
  const custIntel = calculateCustomerRevenueIntelligence();
  const cflow = calculateCashFlowForecast(30);
  const payroll = calculatePayrollCostIntelligence();

  const criticalOverdue = custIntel.filter(c => c.segment === 'Delinquent' && c.outstandingBalance >= 50000);
  if (criticalOverdue.length > 0) {
    const totalDelinq = criticalOverdue.reduce((s, c) => s + c.outstandingBalance, 0);
    recommendations.push({
      id: 'rec_receivables_delinquent',
      domain: 'receivables',
      priority: 'CRITICAL',
      finding: `${criticalOverdue.length} client accounts are severely delinquent (>60 days overdue).`,
      evidence: `Total overdue balance: ₦${totalDelinq.toLocaleString()} across ${criticalOverdue.map(c => c.name).slice(0, 3).join(', ')}`,
      financialImpact: totalDelinq,
      recommendedAction: 'Dispatch immediate executive collection escalations and pause certificates.',
      status: 'ACTIVE'
    });
  }

  if (budgets.overBudgetCategories.length > 0) {
    const overCats = budgets.overBudgetCategories;
    const totalExcess = overCats.reduce((s, c) => s + Math.abs(c.variance), 0);
    recommendations.push({
      id: 'rec_budget_overspend',
      domain: 'budget',
      priority: 'HIGH',
      finding: `${overCats.length} expense categories have exceeded their monthly budget allocation.`,
      evidence: `Exceeded categories: ${overCats.map(c => `${c.category} (+${c.variancePct}%)`).join(', ')}`,
      financialImpact: totalExcess,
      recommendedAction: 'Enforce discretionary expenditure freeze on flagged categories for current period.',
      status: 'ACTIVE'
    });
  }

  const lowMarginProgs = progProf.filter(p => p.contributionMarginPct < 35 && p.amountInvoiced > 0);
  if (lowMarginProgs.length > 0) {
    recommendations.push({
      id: 'rec_low_margin_progs',
      domain: 'programmes',
      priority: 'MEDIUM',
      finding: `Programmes [${lowMarginProgs.map(p => p.name).join(', ')}] are operating below target margin threshold (35%).`,
      evidence: `Current contribution margins: ${lowMarginProgs.map(p => `${p.name} (${p.contributionMarginPct}%)`).join(', ')}`,
      financialImpact: lowMarginProgs.reduce((s, p) => s + p.totalCost, 0),
      recommendedAction: 'Review facilitator delivery hours and adjust programme tuition pricing.',
      status: 'ACTIVE'
    });
  }

  if (cflow.runwayStatus !== 'HEALTHY') {
    recommendations.push({
      id: 'rec_cash_flow_tight',
      domain: 'cashflow',
      priority: cflow.runwayStatus === 'CRITICAL' ? 'CRITICAL' : 'HIGH',
      finding: `30-Day Cash Flow projection indicates a ${cflow.runwayStatus} liquidity position.`,
      evidence: `Forecast closing cash: ₦${cflow.forecastClosingCash.toLocaleString()} against expected outflows of ₦${cflow.expectedOutflows.toLocaleString()}`,
      financialImpact: Math.abs(cflow.forecastClosingCash),
      recommendedAction: 'Accelerate student receivables collection and defer non-urgent capital expenditure.',
      status: 'ACTIVE'
    });
  }

  if (payroll.payrollToRevenuePct > 45) {
    recommendations.push({
      id: 'rec_payroll_ratio_high',
      domain: 'payroll',
      priority: 'HIGH',
      finding: `Monthly payroll cost accounts for ${payroll.payrollToRevenuePct}% of revenue collected (Target < 40%).`,
      evidence: `Total Payroll: ₦${payroll.monthlyPayrollLiability.toLocaleString()} vs Revenue: ₦${fin.totalRevenue.toLocaleString()}`,
      financialImpact: safeRound(payroll.monthlyPayrollLiability - (fin.totalRevenue * 0.4)),
      recommendedAction: 'Optimize facilitator class cohort sizes and scale admissions revenue.',
      status: 'ACTIVE'
    });
  }

  return recommendations;
}

// 11. Approval Thresholds Evaluation
function evaluateApprovalThreshold(amount) {
  const val = Number(amount) || 0;
  const thresholds = state.approvalThresholds || [];
  const t3 = thresholds.find(t => t.tierLevel === 3) || { minAmount: 200000, authorizedRole: 'Super Admin' };
  const t2 = thresholds.find(t => t.tierLevel === 2) || { minAmount: 50000, maxAmount: 199999, authorizedRole: 'Finance Manager' };
  const t1 = thresholds.find(t => t.tierLevel === 1) || { minAmount: 0, maxAmount: 49999, authorizedRole: 'Finance Staff' };

  if (val >= (t3.minAmount || 200000)) return t3.authorizedRole || 'Super Admin';
  if (val >= (t2.minAmount || 50000)) return t2.authorizedRole || 'Finance Manager';
  return t1.authorizedRole || 'Finance Staff';
}

function searchGlobalEntities(query) {
  const q = String(query || '').trim().toLowerCase();
  if (!q || q.length < 2) return [];

  const currentUser = state.auth && state.auth.user ? state.auth.user : null;
  const role = currentUser ? currentUser.role : null;
  const isEmployee = role === 'Staff' || role === 'Facilitator';
  const myPersonnelId = currentUser ? (currentUser.personnelId || currentUser.id) : null;

  const results = [];

  const customers = state.customers || [];
  const enquiries = state.enquiries || [];
  const invoices = state.invoices || [];
  const payments = state.payments || [];
  const programmes = state.programmes || [];
  const payslips = state.payslips || [];

  // 1. Customers (All authenticated staff with CRM/Finance roles)
  if (!isEmployee) {
    customers.forEach(c => {
      if (!c) return;
      if (String(c.name || '').toLowerCase().includes(q) || String(c.email || '').toLowerCase().includes(q) || String(c.phone || '').includes(q) || String(c.customerNumber || '').toLowerCase().includes(q)) {
        results.push({
          type: 'customer',
          title: c.name || c.fullName || 'Customer',
          subtitle: `Customer #${c.customerNumber || ''} · ${c.phone || c.email || ''}`,
          tab: 'studentAccounts',
          id: c.id
        });
      }
    });
  }

  // 2. Enquiries (Admissions / Management)
  if (!isEmployee) {
    enquiries.forEach(e => {
      if (!e) return;
      if (String(e.name || '').toLowerCase().includes(q) || String(e.phone || '').includes(q) || String(e.email || '').toLowerCase().includes(q) || String(e.enquiryNo || '').includes(q)) {
        results.push({
          type: 'enquiry',
          title: e.name || 'Enquiry',
          subtitle: `Enquiry #${e.enquiryNo || ''} · ${e.programmeName || 'General'} (${e.status || ''})`,
          tab: 'enquiries',
          id: e.id
        });
      }
    });
  }

  // 3. Invoices (Finance Roles & Super Admin ONLY)
  if (role === 'Super Admin' || role === 'Finance Manager' || role === 'Finance Staff' || role === 'Finance Viewer') {
    invoices.forEach(inv => {
      if (!inv) return;
      if (String(inv.invoiceNo || '').toLowerCase().includes(q) || String(inv.clientName || '').toLowerCase().includes(q) || String(inv.programmeName || '').toLowerCase().includes(q)) {
        results.push({
          type: 'invoice',
          title: `Invoice ${inv.invoiceNo || ''} - ${inv.clientName || ''}`,
          subtitle: `${fmtMoney(inv.total)} · ${inv.programmeName || ''}`,
          tab: 'invoices',
          id: inv.id
        });
      }
    });
  }

  // 4. Receipts & Payments (Finance Roles & Super Admin ONLY)
  if (role === 'Super Admin' || role === 'Finance Manager' || role === 'Finance Staff' || role === 'Finance Viewer') {
    payments.forEach(p => {
      if (!p) return;
      if (String(p.receiptNo || '').toLowerCase().includes(q) || String(p.clientName || '').toLowerCase().includes(q) || String(p.invoiceNo || '').toLowerCase().includes(q)) {
        results.push({
          type: 'payment',
          title: `Receipt ${p.receiptNo || ''} (${fmtMoney(p.amount)})`,
          subtitle: `Paid for ${p.clientName || p.invoiceNo || ''}`,
          tab: 'payments',
          id: p.id
        });
      }
    });
  }

  // 5. Programmes (All users)
  programmes.forEach(p => {
    if (!p) return;
    if (String(p.name || '').toLowerCase().includes(q) || String(p.category || '').toLowerCase().includes(q) || String(p.code || '').toLowerCase().includes(q)) {
      results.push({
        type: 'programme',
        title: p.name || 'Programme',
        subtitle: `${p.category || 'Tech'} · ${fmtMoney(p.price || p.fee)}`,
        tab: 'programmes',
        id: p.id
      });
    }
  });

  // 6. Payslips (Strict RBAC isolation: employees see ONLY own payslips)
  const accessiblePayslips = isEmployee
    ? payslips.filter(ps => ps && ((myPersonnelId && ps.employeeId === myPersonnelId) || (currentUser && currentUser.name && ps.employeeName === currentUser.name)))
    : payslips;

  accessiblePayslips.forEach(ps => {
    if (!ps) return;
    if (String(ps.employeeName || '').toLowerCase().includes(q) || String(ps.payslipNo || '').includes(q) || String(ps.payPeriod || '').includes(q)) {
      results.push({
        type: 'payslip',
        title: `Payslip #${ps.payslipNo || ''} - ${ps.employeeName || ''}`,
        subtitle: `Period ${ps.payPeriod || ''} · Net: ${fmtMoney(ps.netPay)} (${ps.status || ''})`,
        tab: isEmployee ? 'myPayslips' : 'payslips',
        id: ps.id
      });
    }
  });

  return results.slice(0, 15);
}

function exportToCSV(filename, rows) {
  if (!rows || !rows.length) { alert('No records available to export.'); return; }
  const separator = ',';
  const keys = Object.keys(rows[0]);
  const actorInfo = state.auth.user ? `${state.auth.user.name} (${state.auth.user.role})` : 'System';
  const headerMetadata = `# Report: ${filename.toUpperCase()}\n# Generated By: ${actorInfo}\n# Generated At: ${new Date().toISOString()}\n# Tenant: ${DEFAULT_TENANT_ID}\n\n`;
  const csvData = keys.join(separator) + '\n' + rows.map(row => {
    return keys.map(k => {
      let cell = row[k] === null || row[k] === undefined ? '' : String(row[k]);
      cell = cell.replace(/"/g, '""');
      if (cell.search(/("|,|\n)/g) >= 0) cell = `"${cell}"`;
      return cell;
    }).join(separator);
  }).join('\n');

  const blob = new Blob([headerMetadata + csvData], { type: 'text/csv;charset=utf-8;' });
  const link = document.createElement('a');
  link.href = URL.createObjectURL(blob);
  link.download = `${filename}_${new Date().toISOString().slice(0, 10)}.csv`;
  link.click();
  logAudit('EXPORT_CSV', 'report', filename, 'CSV Data Export');
}

function performOmniSearch(query) {
  const items = searchGlobalEntities(query);
  return items.map(item => ({
    ...item,
    tag: item.type.toUpperCase(),
    tagClass: item.type === 'payment' ? 'paid' : (item.type === 'invoice' ? 'partial' : 'active'),
    action: () => {
      if (item.tab && canAccessTab(item.tab)) {
        state.tab = item.tab;
        render();
      }
    }
  }));
}

function printCanonicalDocument(docHtml) {
  let printRoot = document.getElementById('print-root');
  if (!printRoot) {
    printRoot = document.createElement('div');
    printRoot.id = 'print-root';
    document.body.appendChild(printRoot);
  }
  printRoot.innerHTML = docHtml;
  window.print();
}

let authViewState = {
  mode: 'login', // 'login' | 'forgot' | 'force_reset' | 'invitation'
  email: '',
  targetUser: null,
  inviteToken: '',
  resetToken: '',
  alertMsg: '',
  alertType: 'error'
};

function checkUrlAuthParams() {
  if (typeof window !== 'undefined' && window.location && window.location.search) {
    const params = new URLSearchParams(window.location.search);
    const invite = params.get('invite');
    const reset = params.get('reset');
    if (invite) {
      const u = state.users.find(user => user.invitationToken === invite);
      if (u) {
        if (u.status !== 'invited') {
          authViewState.alertMsg = 'This invitation link has already been used. Please sign in.';
          authViewState.alertType = 'warning';
          authViewState.mode = 'login';
        } else if (u.invitationExpiresAt && u.invitationExpiresAt < Date.now()) {
          authViewState.alertMsg = 'This invitation link has expired. Please request a new invitation from your administrator.';
          authViewState.alertType = 'error';
          authViewState.mode = 'login';
        } else {
          authViewState.mode = 'invitation';
          authViewState.inviteToken = invite;
          authViewState.targetUser = u;
        }
      } else {
        authViewState.alertMsg = 'Invalid invitation token.';
        authViewState.alertType = 'error';
      }
    } else if (reset) {
      const u = state.users.find(user => user.resetToken === reset);
      if (u) {
        if (u.resetExpiresAt && u.resetExpiresAt < Date.now()) {
          authViewState.alertMsg = 'This password reset link has expired. Please request a new reset.';
          authViewState.alertType = 'error';
          authViewState.mode = 'login';
        } else {
          authViewState.mode = 'force_reset';
          authViewState.resetToken = reset;
          authViewState.targetUser = u;
        }
      } else {
        authViewState.alertMsg = 'Invalid password reset token.';
        authViewState.alertType = 'error';
      }
    }
  }
}

          alertEl.textContent = 'Your account invitation is pending setup. Please use the invitation link sent by your administrator.';
          alertEl.style.display = 'block';
          return;

        // Verify password hash
        const computedHash = await hashPasswordWithSalt(pwd, user.passwordSalt || 'salt_default');

          alertEl.textContent = 'Invalid email address or password.';
          alertEl.style.display = 'block';
          await logAudit('USER_LOGIN_FAILED', 'user', user.id, `Invalid password entered for ${user.email}`);

        await safeSet(STORE_KEY_SYSTEM_USERS, state.users);

        // Synchronize Supabase authentication if configured
        try {
          if (supabaseClient.isConfigured()) {
            await supabaseAuth.signInWithPassword(email, pwd);
          }
        } catch (_) {}

        state.auth = {
          ...state.auth,
          isAuthenticated: true,
          user: user,
          token: sessionToken,
          expiresAt: sessionExpiry
        };
        await safeSet(STORE_KEY_AUTH_SESSION, state.auth);

        // Role-based workspace routing
        state.tab = getDefaultTabForRole(user.role);

        await logAudit('USER_LOGIN', 'user', user.id, `User logged in with role: ${user.role}`);

        render();

    root.innerHTML = `

  if (st === 'EMPTY_DATABASE' || st === 'MIGRATION_REQUIRED' || st === 'DB_CONNECTED_EMPTY') {
    return `
      <div id="dbConnWarningBanner" style="background:#FFFBEB; border-bottom:1.5px solid #F59E0B; padding:10px 18px; font-size:12.5px; color:#92400E; display:flex; justify-content:space-between; align-items:center;">
        <div><strong>🟠 POSTGRESQL CONNECTED — DATABASE EMPTY.</strong> <strong>LOCAL LEGACY DATA DETECTED — MIGRATION REQUIRED.</strong> Existing Clasptek records were detected in the local legacy store. PostgreSQL has not yet been populated. No business data has been deleted.</div>
        <div style="display:flex; gap:8px;">
          <button class="cp-btn sm accent" id="btnLaunchMigrationBanner" style="padding:2px 10px;">Review Migration</button>
          <button class="cp-btn sm secondary" id="btnDismissConnErr" style="border-color:#F59E0B; color:#92400E; padding:2px 8px;">Dismiss</button>
        </div>
      </div>
    `;
  }
  if (st === 'MIGRATION_IN_PROGRESS') {
    return `
      <div id="dbConnWarningBanner" style="background:#EFF6FF; border-bottom:1.5px solid #3B82F6; padding:10px 18px; font-size:12.5px; color:#1E40AF; display:flex; justify-content:space-between; align-items:center;">
        <div><strong>🔵 PRODUCTION DATA MIGRATION IN PROGRESS — DO NOT CLOSE THIS WINDOW.</strong> Moving verified legacy business records into PostgreSQL.</div>
      </div>
    `;
  }
  if (st === 'RECONCILIATION_FAILED') {
    return `
      <div id="dbConnWarningBanner" style="background:#FEF2F2; border-bottom:1.5px solid var(--danger); padding:10px 18px; font-size:12.5px; color:#991B1B; display:flex; justify-content:space-between; align-items:center;">
        <div><strong>🔴 PRODUCTION RECONCILIATION FAILED — AUTHORITATIVE MODE BLOCKED.</strong> Relational orphans or financial equation discrepancies detected.</div>
        <button class="cp-btn sm secondary" id="btnDismissConnErr" style="border-color:var(--danger); color:#991B1B; padding:2px 8px;">Dismiss</button>
      </div>
    `;
  }
  if (st === 'AUTHORITATIVE' || (state.supabase && state.supabase.status === 'connected' && (state.invoices && state.invoices.length > 0))) {
    return `
      <div id="dbConnWarningBanner" style="background:#F0FDF4; border-bottom:1.5px solid var(--success); padding:8px 18px; font-size:12px; color:#166534; display:flex; justify-content:space-between; align-items:center;">
        <div><strong>🟢 POSTGRESQL CONNECTED — DATA PRESENT.</strong> <strong>POSTGRESQL AUTHORITATIVE MODE ACTIVE — DATA RECONCILIATION: 100%.</strong> PostgreSQL is the certified single source of truth.</div>
        <button class="cp-btn sm secondary" id="btnDismissConnErr" style="border-color:var(--success); color:#166534; padding:2px 8px;">Dismiss</button>
      </div>
    `;
  }
  if (state.connectionError) {
    return `
      <div id="dbConnWarningBanner" style="background:#FEF2F2; border-bottom:1.5px solid var(--danger); padding:10px 18px; font-size:12.5px; color:#991B1B; display:flex; justify-content:space-between; align-items:center;">
        <div><strong>⚠️ Database Notice:</strong> ${escapeHtml(state.connectionError)}</div>
        <button class="cp-btn sm secondary" id="btnDismissConnErr" style="border-color:var(--danger); color:#991B1B; padding:2px 8px;">Dismiss</button>
      </div>
    `;
  }
  return '';
}

function render(container) {
  const root = container || document.getElementById('root');
  if (state.loading) {
    root.innerHTML = '<div class="cp-empty-state" style="margin:40px auto; max-width:400px;"><div class="cp-empty-title">Loading Clasptek Portal...</div></div>';
    return;
  }

  // Authoritative Mandatory Login Gate
  if (!state.auth || !state.auth.isAuthenticated || !state.auth.user) {
    renderLoginScreen(root);
    return;
  }

  // Ensure active user is still active and not deactivated or suspended
  const activeUser = (state.users && state.users.find(u => u.id === state.auth.user.id)) || state.auth.user;
  if (!activeUser || activeUser.status === 'deactivated' || (activeUser.revokedSessionTokens || []).includes(state.auth.token)) {
    state.auth = { isAuthenticated: false, user: null };
    safeSet(STORE_KEY_AUTH_SESSION, null);
    authViewState.alertMsg = activeUser && activeUser.status === 'deactivated' ? 'Your account has been deactivated.' : 'Your session has expired or was revoked. Please sign in again.';
    authViewState.alertType = 'error';
    renderLoginScreen(root);
    return;
  }

  // Force Password Reset check
  if (activeUser.mustChangePassword || activeUser.forcePasswordReset) {
    authViewState.mode = 'force_reset';
    authViewState.targetUser = activeUser;
    renderLoginScreen(root);
    return;
  }

  // Authoritative Tab Access Check
  if (!canAccessTab(activeUser, state.tab)) {
    state.tab = getDefaultTabForRole(activeUser.role);
  }

  const user = state.auth.user;

  const isEmployee = isEmployeePortal();

    return (i.dueDate || i.date || todayStr) < todayStr;

  const activeEnquiriesCount = isEmployee ? 0 : state.enquiries.filter(e => e.status !== 'ENROLLED' && e.status !== 'LOST').length;

    payments: 'Payments & Receipts',

    expenses: 'Expenses',
    programmes: 'Programmes',

    reports: 'Management Reports',

    cashFlow: 'Cash Flow Forecast',

                </div>

                </div>
                <div class="cp-nav-item ${state.tab === 'receivables' ? 'active' : ''}" data-tab="receivables">

                <div class="cp-nav-item ${state.tab === 'budgets' ? 'active' : ''}" data-tab="budgets">
                  <span class="cp-nav-icon">&#x2696;&#xFE0F;</span><span class="cp-nav-label">Budgets &amp; Planning</span>

      <!-- Main Viewport Area -->
      <div class="cp-main-area">

  // Attach Global Event Listeners
  const appSidebar = document.getElementById('appSidebar');
  const sidebarBackdrop = document.getElementById('sidebarBackdrop');
  const btnMobileNavToggle = document.getElementById('btnMobileNavToggle');

  if (btnMobileNavToggle && appSidebar && sidebarBackdrop) {
    btnMobileNavToggle.addEventListener('click', () => {
      appSidebar.classList.toggle('mobile-open');
      sidebarBackdrop.classList.toggle('active');
    });
    sidebarBackdrop.addEventListener('click', () => {
      appSidebar.classList.remove('mobile-open');
      sidebarBackdrop.classList.remove('active');
    });
  }

  document.getElementById('btnToggleSidebar').addEventListener('click', () => {
    state.sidebarCollapsed = !state.sidebarCollapsed;
    render();
  });

  document.getElementById('brandLogoLink').addEventListener('click', (e) => {
    e.preventDefault();
    state.tab = isEmployee ? 'staffDashboard' : 'dashboard';
    render();
  });

  document.getElementById('btnSidebarSignOut').addEventListener('click', async () => {
    try {
      await supabaseAuth.signOut();
    } catch (_) {}
    state.auth = { isAuthenticated: false, user: null };
    await safeSet(STORE_KEY_AUTH_SESSION, null);
    await safeSet('clasptek:supabase_session', null);
    render();
  });

  document.getElementById('sidebarSupabaseStatus').addEventListener('click', () => {
    if (!isEmployee) openModal('supabaseModal');
  });

  document.querySelectorAll('.cp-nav-item').forEach(item => {
    item.addEventListener('click', () => {
      state.tab = item.dataset.tab;
      if (appSidebar && sidebarBackdrop) {
        appSidebar.classList.remove('mobile-open');
        sidebarBackdrop.classList.remove('active');
      }
      render();
    });
  });

  const btnEmployeeQuery = document.getElementById('btnEmployeeRaiseQuery');
  if (btnEmployeeQuery) {
    btnEmployeeQuery.addEventListener('click', () => {
      const psls = getAccessiblePayslips();
      if (psls.length === 0) {
        alert('No payslip records available yet to raise a query against.');
        return;
      }
      openModal('raisePayrollQuery', { payslip: psls[0] });
    });
  }

  const btnDismissConn = document.getElementById('btnDismissConnErr');
  if (btnDismissConn) {
    btnDismissConn.addEventListener('click', () => {
      state.connectionError = null;
      render();
    });
  }

  const btnLaunchMig = document.getElementById('btnLaunchMigrationBanner');
  if (btnLaunchMig) {
    btnLaunchMig.addEventListener('click', () => {
      openModal('supabaseModal');
    });
  }

  // Quick Action dropdown for admins
  const btnQA = document.getElementById('btnQuickActionToggle');
  const qaMenu = document.getElementById('quickActionDropdown');
  if (btnQA && qaMenu) {
    btnQA.addEventListener('click', (e) => {
      e.stopPropagation();
      qaMenu.classList.toggle('active');
    });

    document.addEventListener('click', () => qaMenu.classList.remove('active'));

    const qaNewEnquiry = document.getElementById('qaNewEnquiry');
    if (qaNewEnquiry) qaNewEnquiry.addEventListener('click', () => openModal('newEnquiry'));
    const qaNewInvoice = document.getElementById('qaNewInvoice');
    if (qaNewInvoice) qaNewInvoice.addEventListener('click', () => { state.tab = 'invoices'; state.invoiceSubTab = 'new'; render(); });
    const qaRecordPayment = document.getElementById('qaRecordPayment');
    if (qaRecordPayment) qaRecordPayment.addEventListener('click', () => {
      const unpaidInv = state.invoices.find(i => invoiceBalance(i).balance > 0);
      if (unpaidInv) openModal('recordPayment', { invoice: unpaidInv });
      else alert('No outstanding invoices found to apply payment against.');
    });
    const qaGeneratePayslip = document.getElementById('qaGeneratePayslip');
    if (qaGeneratePayslip) qaGeneratePayslip.addEventListener('click', () => openModal('generatePayslip'));
    const qaRecordExpense = document.getElementById('qaRecordExpense');
    if (qaRecordExpense) qaRecordExpense.addEventListener('click', () => openModal('recordExpense'));
    const qaRecordDirectIncome = document.getElementById('qaRecordDirectIncome');
    if (qaRecordDirectIncome) qaRecordDirectIncome.addEventListener('click', () => openModal('recordDirectIncome'));
  }

  // Omni-Search Listener
  const omniInput = document.getElementById('globalSearchInput');
  const searchDropdown = document.getElementById('searchDropdown');
  if (omniInput && searchDropdown) {
    omniInput.addEventListener('input', (e) => {
      const val = e.target.value.trim();
      if (val.length < 2) {
        searchDropdown.classList.remove('active');
        searchDropdown.innerHTML = '';
        return;
      }

      const results = searchGlobalEntities(val);
      if (results.length === 0) {
        searchDropdown.innerHTML = '<div style="padding:14px; text-align:center; color:var(--text-muted); font-size:12px;">No matching records found.</div>';
        searchDropdown.classList.add('active');
      } else {
        searchDropdown.innerHTML = results.map((r, idx) => `
          <div class="cp-search-result-item" data-idx="${idx}">
            <div>
              <div style="font-weight:700; color:var(--primary);">${escapeHtml(r.title)}</div>
              <div style="font-size:11px; color:var(--text-secondary);">${r.subtitle}</div>
            </div>
            <span class="cp-pill ${r.tagClass}" style="font-size:10.5px;">${escapeHtml(r.type)}: ${escapeHtml(r.tag)}</span>
          </div>
        `).join('');
        searchDropdown.classList.add('active');

        searchDropdown.querySelectorAll('.cp-search-result-item').forEach(itemEl => {
          itemEl.addEventListener('click', () => {
            const idx = Number(itemEl.dataset.idx);
            if (results[idx] && results[idx].action) {
              searchDropdown.classList.remove('active');
              omniInput.value = '';
              results[idx].action();
            }
          });
        });
      }
    });

    if (typeof document !== 'undefined' && typeof document.addEventListener === 'function') {
      document.addEventListener('click', (e) => {
        if (!omniInput.contains(e.target) && !searchDropdown.contains(e.target)) {
          searchDropdown.classList.remove('active');
        }
      });
    }
  }

  // Render View Routing
  const contentView = document.getElementById('contentView');
  if (isEmployee) {
    if (state.tab === 'staffDashboard') renderStaffDashboardTab(contentView);
    else if (state.tab === 'myPayslips') renderMyPayslipsTab(contentView);
    else if (state.tab === 'mySessions') renderMySessionsTab(contentView);
    else if (state.tab === 'myProfile') renderMyProfileTab(contentView);
    else if (state.tab === 'myQueries') renderMyQueriesTab(contentView);
    else if (state.tab === 'mySecurity') renderMySecurityTab(contentView);
  } else {
    if (state.tab === 'dashboard') renderDashboardTab(contentView);
    else if (state.tab === 'financialIntelligence') renderFinancialIntelligenceTab(contentView);
    else if (state.tab === 'cashFlow') renderCashFlowForecastTab(contentView);
    else if (state.tab === 'enquiries') renderEnquiriesTab(contentView);
    else if (state.tab === 'studentAccounts') renderStudentAccountsTab(contentView);
    else if (state.tab === 'invoices') renderInvoicesTab(contentView);
    else if (state.tab === 'payments') renderPaymentsTab(contentView);
    else if (state.tab === 'payslips') renderPayslipsTab(contentView);
    else if (state.tab === 'expenses') renderExpensesTab(contentView);
    else if (state.tab === 'programmes') renderProgrammesTab(contentView);
    else if (state.tab === 'receivables') renderReceivablesTab(contentView);
    else if (state.tab === 'budgets') renderBudgetsTab(contentView);
    else if (state.tab === 'reports') renderReportsTab(contentView);
    else if (state.tab === 'usersRoles') renderUsersRolesTab(contentView);
    else if (state.tab === 'financialControls') renderFinancialControlsTab(contentView);
    else if (state.tab === 'productionControl') renderProductionControlTab(contentView);
    else if (state.tab === 'auditLog') renderAuditLogTab(contentView);
    else if (state.tab === 'settings') renderSettingsTab(contentView);
  }

  if (state.modal) {
    renderModal(state.modal.type, state.modal.data);
  }
}

// Modal Control Helpers
function openModal(type, data = {}) {
  state.modal = { type, data };

}

function closeModal() {
  state.modal = null;
  render();
}

                  <strong style="color:var(--primary); font-size:12.5px;">${escapeHtml(q.queryReason)}</strong>

function renderMyPayslipsTab(container) {
  const myPayslips = getAccessiblePayslips();

  container.innerHTML = `
    <div class="cp-card">
      <div class="cp-card-header">
        <div>
          <div class="cp-section-title">&#x1F4B3; My Confidential Payslips</div>
          <div class="cp-section-desc">Review your monthly compensation statements, verify earnings &amp; deductions, confirm acknowledgements, or print/export official copies.</div>
        </div>
      </div>

      ${myPayslips.length === 0 ? `
        <div class="cp-empty-state">
          <div class="cp-empty-icon">&#x1F4B3;</div>
          <div class="cp-empty-title">No payslips issued yet</div>
          <div class="cp-empty-desc">When Finance issues your monthly payroll statement, it will appear here for your review and acknowledgement.</div>
        </div>
      ` : `
        <div class="cp-table-wrap">
          <table class="cp-table">
            <thead>
              <tr>
                <th>Period</th>
                <th>Payslip #</th>
                <th style="text-align:right;">Gross Pay</th>
                <th style="text-align:right;">Deductions</th>
                <th style="text-align:right;">Net Pay</th>
                <th>Payroll Status</th>
                <th>Acknowledgement</th>
                <th style="text-align:center;">Actions</th>
              </tr>
            </thead>
            <tbody>
              ${myPayslips.slice().reverse().map(ps => {
                const hasOpenQry = ps.queries && ps.queries.some(q => q.status === 'open' || q.status === 'under_review');
                let statusBadge = '';
                if (ps.status === 'draft') statusBadge = '<span class="cp-pill draft">1. IN PREPARATION</span>';
                else if (ps.status === 'issued') statusBadge = '<span class="cp-pill new">2. ISSUED (REVIEW)</span>';
                else if (ps.status === 'acknowledged') statusBadge = '<span class="cp-pill active" style="background:#E0E7FF; color:#3730A3;">3. ACKNOWLEDGED</span>';
                else if (ps.status === 'approved') statusBadge = '<span class="cp-pill partial" style="background:#FEF3C7; color:#92400E; font-weight:800;">4. APPROVED</span>';
                else if (ps.status === 'paid') statusBadge = '<span class="cp-pill paid">5. PAID &amp; DISBURSED</span>';
                else if (ps.status === 'cancelled') statusBadge = '<span class="cp-pill cancelled">CANCELLED</span>';

                return `
                  <tr>
                    <td style="font-weight:700; color:var(--primary);">${escapeHtml(ps.payPeriod)}</td>
                    <td style="font-family:var(--font-mono); font-weight:600;">#${ps.payslipNo}</td>
                    <td style="text-align:right;">${fmtMoney(ps.grossPay)}</td>
                    <td style="text-align:right; color:var(--danger);">${ps.totalDeductions > 0 ? '-' + fmtMoney(ps.totalDeductions) : '₦0.00'}</td>
                    <td style="text-align:right; font-weight:800; color:var(--success); font-size:13px;">${fmtMoney(ps.netPay)}</td>
                    <td>${statusBadge}</td>
                    <td>
                      ${ps.acknowledgedAt ? `
                        <span class="cp-pill paid" style="font-size:10px;">✔ Acknowledged</span>
                      ` : (ps.status === 'issued' ? `
                        <span class="cp-pill prio-high" style="font-size:10px;">⚠️ Action Required</span>
                      ` : `
                        <span style="font-size:11px; color:var(--text-muted);">&mdash;</span>
                      `)}
                      ${hasOpenQry ? `<div style="margin-top:2px;"><span class="cp-pill prio-high" style="font-size:9.5px;">⚠️ Query Open</span></div>` : ''}
                    </td>
                    <td style="text-align:center;">
                      <div class="cp-action-group" style="display:flex; justify-content:center; gap:6px;">
                        <button class="cp-btn sm secondary btnMyViewPsl" data-id="${ps.id}" title="View official printable payslip">&#x1F4C4; View / Print</button>
                        ${ps.status === 'issued' ? `
                          <button class="cp-btn sm success btnMyAckPsl" data-id="${ps.id}">Acknowledge</button>
                          <button class="cp-btn sm secondary btnMyQryPsl" data-id="${ps.id}" style="color:#B45309;">Raise Query</button>
                        ` : ''}
                        ${ps.status === 'acknowledged' ? `
                          <button class="cp-btn sm secondary btnMyQryPsl" data-id="${ps.id}" style="color:#B45309;">Raise Query</button>
                        ` : ''}
                      </div>
                    </td>
                  </tr>
                `;
              }).join('')}
            </tbody>
          </table>
        </div>
      `}
    </div>
  `;

  container.querySelectorAll('.btnMyViewPsl').forEach(b => {
    b.addEventListener('click', () => {
      const ps = state.payslips.find(p => p.id === b.dataset.id);
      if (ps) openModal('viewPayslip', { payslip: ps });
    });
  });

  container.querySelectorAll('.btnMyAckPsl').forEach(b => {
    b.addEventListener('click', () => {
      const ps = state.payslips.find(p => p.id === b.dataset.id);
      if (ps) openModal('acknowledgePayslip', { payslip: ps });
    });
  });

  container.querySelectorAll('.btnMyQryPsl').forEach(b => {
    b.addEventListener('click', () => {
      const ps = state.payslips.find(p => p.id === b.dataset.id);
      if (ps) openModal('raisePayrollQuery', { payslip: ps });
    });
  });
}

function renderMySecurityTab(container) {
  const user = getCurrentUser();

  container.innerHTML = `
    <div class="cp-card" style="max-width:600px;">
      <div class="cp-card-header">
        <div>
          <div class="cp-section-title">&#x1F512; Account &amp; Login Security</div>
          <div class="cp-section-desc">Manage your portal access credentials and security settings.</div>
        </div>
      </div>

      <div class="cp-field"><label>Registered Login Email</label><input value="${escapeHtml(user.email)}" disabled style="background:#F8FAFC;" /></div>
      <div class="cp-field"><label>Current Password</label><input type="password" id="curSecPwd" placeholder="••••••••••••" /></div>
      <div class="cp-field"><label>New Secure Password</label><input type="password" id="newSecPwd" placeholder="Enter new password" /></div>
      <div class="cp-field"><label>Confirm New Password</label><input type="password" id="confSecPwd" placeholder="Confirm new password" /></div>

      <div id="secPwdMsg" style="margin-top:6px; font-size:12px; display:none;"></div>

      <div style="margin-top:16px; display:flex; gap:10px;">
        <button class="cp-btn accent" id="btnUpdateMyPassword">&#x1F512; Update Password</button>
      </div>
    </div>
  `;

  document.getElementById('btnUpdateMyPassword').addEventListener('click', async () => {
    const p1 = document.getElementById('newSecPwd').value;
    const p2 = document.getElementById('confSecPwd').value;
    const msg = document.getElementById('secPwdMsg');

    if (!p1 || p1.length < 6) {
      msg.textContent = 'New password must be at least 6 characters.';
      msg.style.color = 'var(--danger)';
      msg.style.display = 'block';
      return;
    }
    if (p1 !== p2) {
      msg.textContent = 'Passwords do not match.';
      msg.style.color = 'var(--danger)';
      msg.style.display = 'block';
      return;
    }

    await logAudit('PASSWORD_CHANGE', 'user', user.id, `User ${user.email} updated personal password`);
    msg.textContent = '✔ Password successfully updated.';
    msg.style.color = 'var(--success)';
    msg.style.display = 'block';
  });
}

        else openModal('enquiryDetail', { enquiry: enq });
      } else {
        openModal('enquiryDetail', { enquiry: enq });
      }
    });
  });
}

      if (acc) openModal('studentProfile', { account: acc });
    });
  });

  container.querySelectorAll('.btnOpenCust360').forEach(btn => {
    btn.addEventListener('click', async () => {
      const name = btn.dataset.name;
      const cust = state.customers.find(c => (c.name && c.name.toLowerCase() === name.toLowerCase()) || (c.fullName && c.fullName.toLowerCase() === name.toLowerCase()));
      if (cust) {
        openModal('customer360', { customerId: cust.id });
      } else {
        const dup = findCustomerDuplicate('', '', name);
        if (dup) {
          openModal('customer360', { customerId: dup.customer.id });
        } else {
          state.counters.customer = (state.counters.customer || 0) + 1;
          const newCust = {
            id: 'cust_' + Date.now(),
            tenant_id: DEFAULT_TENANT_ID,
            customerNumber: formatDocNo('customer', state.counters.customer),
            name: name,
            fullName: name,
            createdAt: new Date().toISOString()
          };
          state.customers.push(newCust);
          await safeSet(STORE_KEY_CUSTOMERS, state.customers);
          await safeSet(STORE_KEY_COUNTERS, state.counters);
          openModal('customer360', { customerId: newCust.id });
        }
      }
    });
  });
}

            <div id="lineItemsContainer">

              <div style="text-align:right;">
                <div style="font-size:12px; color:var(--text-secondary);">Calculated Total: <strong id="lblCalculatedTotal" style="font-size:15px; color:var(--primary);">${fmtMoney(defaultProg.price)}</strong></div>

              <label>Customer-Facing Notes (Appears under NOTES on Invoice)</label>
              <textarea id="invNotes" rows="2" placeholder="e.g. Please note that tuition includes all examination preparatory materials and lab access."></textarea>
            </div>
            <div class="cp-field">
              <label>Contextual / Internal Comments (Appears under COMMENT on Invoice)</label>
              <textarea id="invComments" rows="2" placeholder="e.g. 60/40 installment schedule approved by Admissions Committee."></textarea>
            </div>
          </div>

          <div class="cp-field">
            <label>Standard Terms &amp; Conditions</label>
            <textarea id="invTerms" rows="2">${escapeHtml(state.financeSettings.defaultTerms || 'Payment is due according to the schedule specified above.')}</textarea>
          </div>

          <div id="invFormError" class="cp-error" style="display:none; margin-bottom:12px; color:var(--danger); font-size:12px;"></div>

          <div style="display:flex; justify-content:flex-end; gap:10px; margin-top:16px;">
            <button class="cp-btn secondary" id="btnCancelNewInv2" type="button">Cancel</button>
            <button class="cp-btn secondary" id="btnPreviewInvoice" type="button">&#x1F441;&#xFE0F; Preview Invoice</button>

          </div>
        </div>
      </div>
    `;

    document.getElementById('invCustomerSelect').addEventListener('change', (e) => {
      const name = e.target.value;
      if (name) {
        const prevInv = state.invoices.slice().reverse().find(i => i.clientName.trim() === name);
        if (prevInv) {
          document.getElementById('invClient').value = prevInv.clientName;
          if (prevInv.phone) document.getElementById('invPhone').value = prevInv.phone;
          if (prevInv.email) document.getElementById('invEmail').value = prevInv.email;
          if (prevInv.parentName) document.getElementById('invParent').value = prevInv.parentName;
          if (prevInv.programmeId) document.getElementById('invProg').value = prevInv.programmeId;
        }
      }
    });

    document.getElementById('invProg').addEventListener('change', (e) => {
      const p = state.programmes.find(pr => pr.id === e.target.value);
      if (p) {
        const firstRow = document.querySelector('.line-item-row');
        if (firstRow) {
          firstRow.querySelector('.item-desc').value = p.name;
          firstRow.querySelector('.item-price').value = p.price;
          recalcInvoiceTotals();
        }
      }
    });

    document.getElementById('invPaymentAccount').addEventListener('change', (e) => {
      const acc = state.paymentAccounts.find(a => a.id === e.target.value);
      if (acc && acc.instructions) {
        document.getElementById('invPaymentInstructions').value = acc.instructions;
      }
    });

    function recalcInvoiceTotals() {
      let grand = 0;
      document.querySelectorAll('.line-item-row').forEach(row => {
        const qty = Number(row.querySelector('.item-qty').value || 1);
        const pr = Number(row.querySelector('.item-price').value || 0);
        const dc = Number(row.querySelector('.item-disc').value || 0);
        const lineAmt = Math.max(0, safeRound((qty * pr) - dc));
        grand = safeRound(grand + lineAmt);
      });
      const lbl = document.getElementById('lblCalculatedTotal');
      if (lbl) lbl.textContent = fmtMoney(grand);
    }

    const cont = document.getElementById('lineItemsContainer');
    cont.addEventListener('input', recalcInvoiceTotals);

    document.getElementById('btnAddLineItem').addEventListener('click', () => {
      const rowDiv = document.createElement('div');
      rowDiv.className = 'cp-row4 line-item-row';
      rowDiv.style.marginBottom = '8px';
      rowDiv.innerHTML = `
        <div class="cp-field" style="margin:0;"><input class="item-desc" placeholder="Item description" /></div>
        <div class="cp-field" style="margin:0;"><input class="item-qty" type="number" value="1" min="1" /></div>
        <div class="cp-field" style="margin:0;"><input class="item-price" type="number" value="50000" /></div>
        <div class="cp-field" style="margin:0;"><input class="item-disc" type="number" value="0" min="0" /></div>
        <button class="cp-btn danger sm btnRemoveLine" type="button" style="height:35px; width:35px; padding:0;" title="Remove Item">&times;</button>
      `;
      rowDiv.querySelector('.btnRemoveLine').addEventListener('click', () => {
        rowDiv.remove();
        recalcInvoiceTotals();
      });
      cont.appendChild(rowDiv);
      recalcInvoiceTotals();
    });

    cont.querySelectorAll('.btnRemoveLine').forEach(b => {
      b.addEventListener('click', (e) => {
        if (document.querySelectorAll('.line-item-row').length > 1) {
          e.target.closest('.line-item-row').remove();
          recalcInvoiceTotals();
        } else {
          alert('Invoice must contain at least one line item.');
        }
      });
    });

    document.getElementById('btnCancelNewInv').addEventListener('click', () => { state.pendingEnquiryForInvoice = null; state.invoiceSubTab = 'list'; render(); });
    document.getElementById('btnCancelNewInv2').addEventListener('click', () => { state.pendingEnquiryForInvoice = null; state.invoiceSubTab = 'list'; render(); });

    function buildInvoicePayloadFromForm() {
      const client = document.getElementById('invClient').value.trim();
      const progId = document.getElementById('invProg').value;
      const prog = state.programmes.find(p => p.id === progId) || { id: 'prog_gen', name: 'Professional Training Programme' };
      const dateStr = document.getElementById('invDate').value;
      const dueStr = document.getElementById('invDueDate').value;
      const accId = document.getElementById('invPaymentAccount').value;
      const selAcc = state.paymentAccounts.find(a => a.id === accId) || getDefaultPaymentAccount();

      const items = [];
      let subtotal = 0;
      let totalDiscount = 0;

      document.querySelectorAll('.line-item-row').forEach(r => {
        const desc = r.querySelector('.item-desc').value.trim() || prog.name;
        const qty = Number(r.querySelector('.item-qty').value || 1);
        const unitPrice = Number(r.querySelector('.item-price').value || 0);
        const disc = Number(r.querySelector('.item-disc').value || 0);
        const lineAmt = Math.max(0, safeRound((qty * unitPrice) - disc));
        subtotal = safeRound(subtotal + (qty * unitPrice));
        totalDiscount = safeRound(totalDiscount + disc);
        items.push({ description: desc, quantity: qty, price: unitPrice, discount: disc, amount: lineAmt });
      });

      const total = Math.max(0, safeRound(subtotal - totalDiscount));

      // Payment Account Immutable Snapshot (Phase 8)
      const paymentAccountSnapshot = {
        id: selAcc.id,
        accountName: selAcc.accountName,
        bankName: selAcc.bankName,
        accountNumber: selAcc.accountNumber,
        accountType: selAcc.accountType || 'Corporate Current',
        currency: selAcc.currency || 'NGN',
        instructions: document.getElementById('invPaymentInstructions').value.trim() || selAcc.instructions
      };

      return {
        client,
        parentName: document.getElementById('invParent').value.trim(),
        phone: document.getElementById('invPhone').value.trim(),
        email: document.getElementById('invEmail').value.trim(),
        category: document.getElementById('invCat').value,
        progId: prog.id,
        progName: prog.name,
        plan: document.getElementById('invPlan').value,
        trainingMode: document.getElementById('invMode').value,
        duration: document.getElementById('invDuration').value.trim() || '5 Months',
        schedule: document.getElementById('invSchedule').value.trim() || 'Weekdays',
        dateStr,
        dueStr,
        paymentAccountId: selAcc.id,
        paymentAccountSnapshot,
        notes: document.getElementById('invNotes').value.trim(),
        comments: document.getElementById('invComments').value.trim(),
        termsAndConditions: document.getElementById('invTerms').value.trim(),
        items,
        subtotal,
        discount: totalDiscount,
        total
      };
    }

    document.getElementById('btnPreviewInvoice').addEventListener('click', () => {
      const payload = buildInvoicePayloadFromForm();
      const errEl = document.getElementById('invFormError');

      if (!payload.client || payload.items.length === 0) {
        errEl.textContent = 'Please fill client name and at least one line item.';
        errEl.style.display = 'block';
        return;
      }

      const tempInv = {
        id: 'preview_temp',
        invoiceNo: state.counters.invoice + 1,
        invoice_display_no: formatDocNo('invoice', state.counters.invoice + 1, payload.dateStr),
        clientName: payload.client,
        parentName: payload.parentName,
        phone: payload.phone,
        email: payload.email,
        category: payload.category,
        programmeId: payload.progId,
        programmeName: payload.progName,
        plan: payload.plan,
        trainingMode: payload.trainingMode,
        duration: payload.duration,
        schedule: payload.schedule,
        date: payload.dateStr,
        dueDate: payload.dueStr,
        paymentAccountId: payload.paymentAccountId,
        paymentAccountSnapshot: payload.paymentAccountSnapshot,
        notes: payload.notes,
        comments: payload.comments,
        termsAndConditions: payload.termsAndConditions,
        items: payload.items,
        subtotal: payload.subtotal,
        discount: payload.discount,
        total: payload.total,
        createdBy: state.auth.user ? state.auth.user.name : 'Super Admin'
      };

      openModal('previewInvoice', { invoice: tempInv });
    });

    document.getElementById('btnSaveInvoice').addEventListener('click', async () => {
      const payload = buildInvoicePayloadFromForm();
      const errEl = document.getElementById('invFormError');

      if (!payload.client || payload.items.length === 0) {
        errEl.textContent = 'Please fill all required fields.';
        errEl.style.display = 'block';
        return;
      }
      if (isPeriodLocked(payload.dateStr)) {
        errEl.textContent = 'This financial period is locked. Mutations blocked.';
        errEl.style.display = 'block';
        return;
      }
      if (payload.dueStr < payload.dateStr) {
        errEl.textContent = 'Due date cannot precede invoice issue date.';
        errEl.style.display = 'block';
        return;
      }

      state.counters.invoice += 1;
      const docNo = formatDocNo('invoice', state.counters.invoice, payload.dateStr);

      const inv = {
        id: 'inv_' + Date.now(),
        tenant_id: DEFAULT_TENANT_ID,
        enquiryId: state.pendingEnquiryForInvoice ? state.pendingEnquiryForInvoice.id : null,
        invoiceNo: state.counters.invoice,
        invoice_display_no: docNo,
        clientName: payload.client,
        parentName: payload.parentName,
        programmeId: payload.progId,
        programmeName: payload.progName,
        phone: payload.phone,
        email: payload.email,
        category: payload.category,
        date: payload.dateStr,
        dueDate: payload.dueStr,
        plan: payload.plan,
        trainingMode: payload.trainingMode,
        duration: payload.duration,
        schedule: payload.schedule,
        paymentAccountId: payload.paymentAccountId,
        paymentAccountSnapshot: payload.paymentAccountSnapshot,
        notes: payload.notes,
        comments: payload.comments,
        termsAndConditions: payload.termsAndConditions,
        items: payload.items,
        subtotal: payload.subtotal,
        discount: payload.discount,
        total: payload.total,
        createdAt: new Date().toISOString(),
        createdBy: state.auth.user ? state.auth.user.name : 'Super Admin'
      };

      try {
        await dbRepo.saveRecord(STORE_KEY_INVOICES, inv);
      } catch (dbErr) {
        errEl.textContent = dbErr.message;
        errEl.style.display = 'block';
        return;
      }

      state.invoices.push(inv);
      await createEnrolmentFromInvoice(inv.id);

      // Advance linked enquiry status
      if (state.pendingEnquiryForInvoice) {
        const enq = state.enquiries.find(e => e.id === state.pendingEnquiryForInvoice.id);
        if (enq) {
          enq.status = 'INVOICE_ISSUED';
          enq.updatedAt = new Date().toISOString();
          await safeSet(STORE_KEY_ENQUIRIES, state.enquiries);
        }
        state.pendingEnquiryForInvoice = null;
      }

      await safeSet(STORE_KEY_INVOICES, state.invoices);
      await safeSet(STORE_KEY_COUNTERS, state.counters);
      await logAudit('CREATE_INVOICE', 'invoice', inv.id, `Invoice #${inv.invoiceNo} (${inv.clientName})`, null, inv);

      state.invoiceSubTab = 'list';
      openModal('viewInvoice', { invoice: inv });
      render();
    });
  } else {
    const q = (state.filters.invoiceSearch || '').toLowerCase();
    const filtered = state.invoices.filter(i => i.clientName.toLowerCase().includes(q) || String(i.invoiceNo).includes(q) || (i.programmeName && i.programmeName.toLowerCase().includes(q)));

    container.innerHTML = `
      <div class="cp-card">
        <div class="cp-card-header">
          <div>
            <div class="cp-section-title">&#x1F4C4; Tuition &amp; Service Invoices</div>
            <div class="cp-section-desc">Manage, view, print, and track payment status across all issued student invoices.</div>
          </div>
          <div style="display:flex; gap:8px;">
            <button class="cp-btn sm secondary" id="btnExportInvoices">&#x1F4E5; Export CSV</button>
            ${canRecord() ? '<button class="cp-btn sm accent" id="btnNewInvBtn">+ Create Invoice</button>' : ''}
          </div>
        </div>

        <div class="cp-field" style="max-width:320px; margin-bottom:14px;">
          <input type="text" id="invoiceSearchInput" placeholder="Filter by invoice #, student, programme..." value="${escapeHtml(state.filters.invoiceSearch)}" />
        </div>

        ${filtered.length === 0 ? `
          <div class="cp-empty-state">
            <div class="cp-empty-icon">&#x1F4C4;</div>
            <div class="cp-empty-title">No invoices yet</div>
            <div class="cp-empty-desc">Create your first invoice to begin tracking student tuition and fees.</div>
            ${canRecord() ? '<button class="cp-btn accent sm" id="btnEmptyNewInvoice">+ Create Invoice</button>' : ''}
          </div>
        ` : `
          <div class="cp-table-wrap">
            <table class="cp-table">
              <thead>
                <tr>
                  <th>Invoice #</th><th>Issue Date</th><th>Due Date</th><th>Student / Client</th>
                  <th>Programme / Service</th><th style="text-align:right;">Total</th><th style="text-align:right;">Paid</th>
                  <th style="text-align:right;">Balance</th><th>Status</th><th style="text-align:center;">Actions</th>
                </tr>
              </thead>
              <tbody>
                ${filtered.slice().reverse().map(inv => {
                  const { paid, balance, total } = invoiceBalance(inv);
                  const st = invoiceStatus(inv);
                  return `
                    <tr>
                      <td style="font-weight:700; font-family:var(--font-mono);">#${inv.invoiceNo}</td>
                      <td>${fmtDate(inv.date)}</td>
                      <td>${fmtDate(inv.dueDate)}</td>
                      <td style="font-weight:600;">${escapeHtml(inv.clientName)}</td>
                      <td style="font-weight:600; color:var(--primary);">${escapeHtml(inv.programmeName || 'General Tech Programme')}</td>
                      <td style="text-align:right;">${fmtMoney(total)}</td>
                      <td style="text-align:right; color:var(--success); font-weight:600;">${fmtMoney(paid)}</td>
                      <td style="text-align:right; font-weight:700; color:${balance > 0 ? 'var(--warning)' : 'var(--success)'};">${fmtMoney(balance)}</td>
                      <td><span class="cp-pill ${st}">${st.toUpperCase()}</span></td>
                      <td style="text-align:center;">
                        <div class="cp-action-group">
                          <button class="cp-btn sm secondary btnViewInv" data-id="${inv.id}" title="View official printable invoice">&#x1F4C4; View / PDF</button>
                          ${balance > 0 && canRecord() ? `<button class="cp-btn sm accent btnRecordPay" data-id="${inv.id}">+ Pay</button>` : ''}
                          <button class="cp-btn sm secondary btnReminder" data-id="${inv.id}" title="Send Reminder">&#x1F4E7;</button>
                        </div>
                      </td>
                    </tr>
                  `;
                }).join('')}
              </tbody>
            </table>
          </div>
        `}
      </div>
    `;

    document.getElementById('invoiceSearchInput').addEventListener('input', (e) => {
      state.filters.invoiceSearch = e.target.value;
      render();
    });

    document.getElementById('btnExportInvoices').addEventListener('click', () => {
      exportToCSV('Invoices_Ledger', filtered.map(i => ({
        Invoice_No: i.invoiceNo, Date: i.date, Due_Date: i.dueDate, Student: i.clientName,
        Programme: i.programmeName, Total: i.total, Paid: invoiceBalance(i).paid,
        Balance: invoiceBalance(i).balance, Status: invoiceStatus(i)
      })));
    });

    const btnNew = document.getElementById('btnNewInvBtn') || document.getElementById('btnEmptyNewInvoice');
    if (btnNew) {
      btnNew.addEventListener('click', () => {
        state.invoiceSubTab = 'new';
        render();
      });
    }

    container.querySelectorAll('.btnViewInv').forEach(b => {
      b.addEventListener('click', () => {
        const inv = state.invoices.find(i => i.id === b.dataset.id);
        if (inv) openModal('viewInvoice', { invoice: inv });
      });
    });

    container.querySelectorAll('.btnRecordPay').forEach(b => {
      b.addEventListener('click', () => {
        const inv = state.invoices.find(i => i.id === b.dataset.id);
        if (inv) openModal('recordPayment', { invoice: inv });
      });
    });

    container.querySelectorAll('.btnReminder').forEach(b => {
      b.addEventListener('click', () => {
        const inv = state.invoices.find(i => i.id === b.dataset.id);
        if (inv) openModal('sendReminder', { invoice: inv });
      });
    });

}

                    <td style="font-family:var(--font-mono); font-size:11.5px;">${escapeHtml(p.reference || '—')}</td>
                    <td style="text-align:right; font-weight:700; color:var(--success);">${fmtMoney(p.amount)}</td>
                    <td><span class="cp-pill paid">CONFIRMED</span></td>

            </tbody>
          </table>
        </div>

  `;

  document.getElementById('paymentSearchInput').addEventListener('input', (e) => {
    state.filters.paymentSearch = e.target.value;
    render();
  });

  document.getElementById('btnExportPayments').addEventListener('click', () => {
    exportToCSV('Payments_Ledger', filtered.map(p => {
      const inv = state.invoices.find(i => i.id === p.invoiceId) || { invoiceNo: 'N/A', clientName: 'Student' };
      return { Receipt_No: p.receiptNo, Date: p.date, Student: inv.clientName, Invoice_No: inv.invoiceNo, Method: p.paymentMethod, Reference: p.reference, Amount: p.amount };

  container.querySelectorAll('.btnViewRec').forEach(b => {

function renderPayslipsTab(container) {
  const q = (state.filters.payslipSearch || '').toLowerCase();
  const periodFilter = state.filters.payslipPeriod || '';

  const statusFilter = state.filters.payslipStatus || 'all';

  const filtered = state.payslips.filter(ps => {

    const matchesPeriod = !periodFilter || ps.payPeriod === periodFilter;
    const matchesType = typeFilter === 'all' || ps.employeeType === typeFilter;
    
    let matchesStatus = true;
    if (statusFilter === 'has_query') {
      matchesStatus = ps.queries && ps.queries.some(query => query.status === 'open' || query.status === 'under_review');

      </div>
      <div class="cp-kpi-card" style="padding:12px 14px;">
        <div class="cp-kpi-label">3. Acknowledged</div>

        <div class="cp-kpi-val" style="font-size:18px; color:var(--warning);">${fmtMoney(payM.awaitingPayment)}</div>

      </div>
    </div>

    ${payM.openQueriesCount > 0 ? `

            <option value="draft" ${statusFilter === 'draft' ? 'selected' : ''}>Draft (Preparation)</option>
            <option value="issued" ${statusFilter === 'issued' ? 'selected' : ''}>Issued (Pending Review)</option>

          </select>

      ${filtered.length === 0 ? `
        <div class="cp-empty-state">

          <div class="cp-empty-desc">Prepare monthly payroll statements for staff and facilitators before month-end settlement.</div>
          ${canRecord() ? '<button class="cp-btn accent sm" id="btnEmptyGeneratePayslip">+ Prepare Payslip</button>' : ''}
        </div>
      ` : `
        <div class="cp-table-wrap">
          <table class="cp-table">
            <thead>
              <tr>
                <th>Payslip #</th><th>Period &amp; Target Pay Date</th><th>Employee / Facilitator</th><th>Type</th>

                else if (ps.status === 'acknowledged') statusBadge = '<span class="cp-pill active" style="background:#E0E7FF; color:#3730A3;">3. ACKNOWLEDGED</span>';
                else if (ps.status === 'approved') statusBadge = '<span class="cp-pill partial" style="background:#FEF3C7; color:#92400E; font-weight:800;">4. APPROVED (AWAITING PAY)</span>';
                else if (ps.status === 'paid') statusBadge = '<span class="cp-pill paid">5. PAID &amp; DISBURSED</span>';
                else if (ps.status === 'cancelled') statusBadge = '<span class="cp-pill cancelled">CANCELLED</span>';

                return `
                  <tr>
                    <td style="font-weight:700; font-family:var(--font-mono);">#${ps.payslipNo}</td>
                    <td><strong>${escapeHtml(ps.payPeriod)}</strong><br/><span style="font-size:10.5px; color:var(--text-muted);">${fmtDate(ps.payDate)}</span></td>
                    <td style="font-weight:700; color:var(--primary);">${escapeHtml(ps.employeeName)}</td>
                    <td><span class="cp-pill ${ps.employeeType === 'facilitator' ? 'category-pill' : 'new'}">${escapeHtml(ps.employeeType.toUpperCase())}</span></td>
                    <td>${escapeHtml(ps.department)}<br/><span style="font-size:11px; color:var(--text-secondary);">${escapeHtml(ps.role)}</span></td>
                    <td style="text-align:right; font-weight:600;">${fmtMoney(ps.grossPay)}</td>
                    <td style="text-align:right; color:var(--danger);">${ps.totalDeductions > 0 ? '-' + fmtMoney(ps.totalDeductions) : '₦0.00'}</td>

                      ${hasOpenQuery ? `<div style="margin-top:4px;"><span class="cp-pill prio-high" style="font-size:10px;">⚠️ Query Pending</span></div>` : ''}

                        ${ps.status === 'acknowledged' ? `

                          <button class="cp-btn sm secondary btnRaiseQuery" data-id="${ps.id}" title="Raise Discrepancy Query" style="color:#B45309;">Raise Query</button>

        </div>
      `}

  document.getElementById('payslipTypeSelect').addEventListener('change', (e) => {
    state.filters.payslipType = e.target.value;
    render();
  });

  document.getElementById('payslipStatusSelect').addEventListener('change', (e) => {
    state.filters.payslipStatus = e.target.value;
    render();
  });

  const btnFilterQueries = document.getElementById('btnFilterOpenQueries');
  if (btnFilterQueries) {
    btnFilterQueries.addEventListener('click', () => {
      state.filters.payslipStatus = 'has_query';
      render();
    });
  }

  document.getElementById('btnExportPayslips').addEventListener('click', () => {
    exportToCSV('Payroll_Ledger', filtered.map(p => ({
      Payslip_No: p.payslipNo, Period: p.payPeriod, Date: p.payDate, Employee: p.employeeName,
      Type: p.employeeType, Department: p.department, Role: p.role, Gross_Pay: p.grossPay,
      Deductions: p.totalDeductions, Net_Pay: p.netPay, Status: p.status, Method: p.paymentMethod, Reference: p.paymentReference
    })));
  });

  const btnGen = document.getElementById('btnNewPayslipBtn') || document.getElementById('btnEmptyGeneratePayslip');
  if (btnGen) btnGen.addEventListener('click', () => openModal('generatePayslip'));

  const btnMonthEnd = document.getElementById('btnMonthEndBatchPay');
  if (btnMonthEnd) btnMonthEnd.addEventListener('click', () => openModal('monthEndPayroll'));

  container.querySelectorAll('.btnViewPayslip').forEach(b => {

      const ps = state.payslips.find(p => p.id === b.dataset.id);
      if (ps) openModal('viewPayslip', { payslip: ps });
    });
  });

  container.querySelectorAll('.btnIssuePayslip').forEach(b => {
    b.addEventListener('click', async () => {
      const ps = state.payslips.find(p => p.id === b.dataset.id);
      if (ps) {
        ps.status = 'issued';
        ps.issuedAt = new Date().toISOString();
        ps.issuedBy = state.auth.user ? state.auth.user.name : 'Finance Operations';
        await safeSet(STORE_KEY_PAYSLIPS, state.payslips);
        await logAudit('ISSUE_PAYSLIP', 'payslip', ps.id, `Issued Payslip #${ps.payslipNo} for ${ps.employeeName} review`);
        render();
      }
    });
  });

  container.querySelectorAll('.btnAckPayslip').forEach(b => {
    b.addEventListener('click', () => {
      const ps = state.payslips.find(p => p.id === b.dataset.id);
      if (ps) openModal('acknowledgePayslip', { payslip: ps });
    });
  });

  container.querySelectorAll('.btnRaiseQuery').forEach(b => {
    b.addEventListener('click', () => {
      const ps = state.payslips.find(p => p.id === b.dataset.id);
      if (ps) openModal('raisePayrollQuery', { payslip: ps });
    });
  });

  container.querySelectorAll('.btnReviewQuery').forEach(b => {
    b.addEventListener('click', () => {
      const ps = state.payslips.find(p => p.id === b.dataset.id);
      if (ps) openModal('resolvePayrollQuery', { payslip: ps });
    });
  });

  container.querySelectorAll('.btnApprovePayslip').forEach(b => {
    b.addEventListener('click', () => {
      const ps = state.payslips.find(p => p.id === b.dataset.id);
      if (ps) openModal('approvePayslip', { payslip: ps });
    });
  });

  container.querySelectorAll('.btnPayPayslip').forEach(b => {
    b.addEventListener('click', () => {
      const ps = state.payslips.find(p => p.id === b.dataset.id);
      if (ps) openModal('payPayslip', { payslip: ps });
    });
  });

  container.querySelectorAll('.btnCancelPayslip').forEach(b => {
    b.addEventListener('click', () => {
      const ps = state.payslips.find(p => p.id === b.dataset.id);
      if (ps) openModal('cancelPayslip', { payslip: ps });
    });
  });
}

                  <td>${escapeHtml(e.vendor || '—')}</td>
                  <td>${escapeHtml(e.department || 'Operations')}</td>

                    ${e.status === 'pending_approval' && canApprove() ? `
                      <button class="cp-btn sm accent btnApproveExp" data-id="${e.id}">Approve</button>

                  </td>

    state.filters.expenseSearch = e.target.value;
    render();
  });

  document.getElementById('btnExportExpenses').addEventListener('click', () => {
    exportToCSV('Expenses_Ledger', filtered.map(e => ({
      Date: e.date, Group: e.categoryGroup, Category: e.category,
      Description: e.description, Vendor: e.vendor, Department: e.department,
      Amount: e.amount, Status: e.status
    })));
  });

  const btnLog = document.getElementById('btnLogExpenseBtn');
  if (btnLog) btnLog.addEventListener('click', () => openModal('recordExpense'));

  container.querySelectorAll('.btnApproveExp').forEach(b => {
    b.addEventListener('click', async () => {
      const exp = state.expenses.find(e => e.id === b.dataset.id);
      if (exp) {
        exp.status = 'approved';
        exp.approvedBy = state.auth.user ? state.auth.user.name : 'Manager';
        exp.approvedAt = new Date().toISOString();
        await safeSet(STORE_KEY_EXPENSES, state.expenses);
        await logAudit('APPROVE_EXPENSE', 'expense', exp.id, exp.description);
        render();
      }
    });
  });

  container.querySelectorAll('.btnCancelExp').forEach(b => {
    b.addEventListener('click', () => {
      const exp = state.expenses.find(e => e.id === b.dataset.id);
      if (exp) openModal('cancelExpense', { expense: exp });
    });
  });
}

                                <button class="cp-btn sm danger btnDeactivatePersonnel" data-id="${p.id}" title="Deactivate staff while preserving all past payroll records">Deactivate</button>

                  &bull; <strong>Finance Manager:</strong> Financial Approvals, Payroll Disbursement, Budgets, Invoices, Reconciliation.<br/>

                <div style="font-size:12px; color:var(--text-secondary); line-height:1.7;">
                  &bull; <strong>Mandatory Authentication:</strong> Unauthenticated users are strictly barred from all internal routes.<br/>
                  &bull; <strong>Session Revocation:</strong> Administrators can immediately invalidate any user session across devices.<br/>
