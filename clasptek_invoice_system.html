                const hasOpenQry = ps.queries && ps.queries.some(q => q.status === 'open' || q.status === 'under_review');
                let statusBadge = '';
                if (ps.status === 'draft') statusBadge = '<span class="cp-pill draft">1. IN PREPARATION</span>';
                else if (ps.status === 'issued') statusBadge = '<span class="cp-pill new">2. ISSUED (REVIEW)</span>';
                else if (ps.status === 'acknowledged') statusBadge = '<span class="cp-pill active" style="background:#E0E7FF; color:#3730A3;">3. ACKNOWLEDGED</span>';
                else if (ps.status === 'approved') statusBadge = '<span class="cp-pill partial" style="background:#FEF3C7; color:#92400E; font-weight:800;">4. APPROVED</span>';
                else if (ps.status === 'paid') statusBadge = '<span class="cp-pill paid">5. PAID &amp; DISBURSED</span>';
                else if (ps.status === 'cancelled') statusBadge = '<span class="cp-pill cancelled">CANCELLED</span>';

                return `
                  <tr>
                    <td style="font-weight:700; color:var(--primary);">${escapeHtml(ps.payPeriod)}</td>
                    <td style="font-family:var(--font-mono); font-weight:600;">#${ps.payslipNo}</td>
                    <td style="text-align:right;">${fmtMoney(ps.grossPay)}</td>
                    <td style="text-align:right; color:var(--danger);">${ps.totalDeductions > 0 ? '-' + fmtMoney(ps.totalDeductions) : '₦0.00'}</td>
                    <td style="text-align:right; font-weight:800; color:var(--success); font-size:13px;">${fmtMoney(ps.netPay)}</td>
                    <td>${statusBadge}</td>
                    <td>
                      ${ps.acknowledgedAt ? `
                        <span class="cp-pill paid" style="font-size:10px;">✔ Acknowledged</span>
                      ` : (ps.status === 'issued' ? `
                        <span class="cp-pill prio-high" style="font-size:10px;">⚠️ Action Required</span>
                      ` : `
                        <span style="font-size:11px; color:var(--text-muted);">&mdash;</span>
                      `)}
                      ${hasOpenQry ? `<div style="margin-top:2px;"><span class="cp-pill prio-high" style="font-size:9.5px;">⚠️ Query Open</span></div>` : ''}
                    </td>
                    <td style="text-align:center;">
                      <div class="cp-action-group" style="display:flex; justify-content:center; gap:6px;">
                        <button class="cp-btn sm secondary btnMyViewPsl" data-id="${ps.id}" title="View official printable payslip">&#x1F4C4; View / Print</button>
                        ${ps.status === 'issued' ? `
                          <button class="cp-btn sm success btnMyAckPsl" data-id="${ps.id}">Acknowledge</button>
                          <button class="cp-btn sm secondary btnMyQryPsl" data-id="${ps.id}" style="color:#B45309;">Raise Query</button>
                        ` : ''}
                        ${ps.status === 'acknowledged' ? `
                          <button class="cp-btn sm secondary btnMyQryPsl" data-id="${ps.id}" style="color:#B45309;">Raise Query</button>
                        ` : ''}
                      </div>
                    </td>
                  </tr>
                `;
              }).join('')}
            </tbody>
          </table>
        </div>
      `}
    </div>
  `;

  container.querySelectorAll('.btnMyViewPsl').forEach(b => {
    b.addEventListener('click', () => {
      const ps = state.payslips.find(p => p.id === b.dataset.id);
      if (ps) openModal('viewPayslip', { payslip: ps });
    });
  });

  container.querySelectorAll('.btnMyAckPsl').forEach(b => {
    b.addEventListener('click', () => {
      const ps = state.payslips.find(p => p.id === b.dataset.id);
      if (ps) openModal('acknowledgePayslip', { payslip: ps });
    });
  });

  container.querySelectorAll('.btnMyQryPsl').forEach(b => {
    b.addEventListener('click', () => {
      const ps = state.payslips.find(p => p.id === b.dataset.id);
      if (ps) openModal('raisePayrollQuery', { payslip: ps });
    });
  });
}

function renderMySecurityTab(container) {

  container.innerHTML = `
    <div class="cp-card" style="max-width:600px;">

        <div>
          <div class="cp-section-title">&#x1F512; Account &amp; Login Security</div>

      <div class="cp-field"><label>Current Password</label><input type="password" id="curSecPwd" placeholder="••••••••••••" /></div>
      <div class="cp-field"><label>New Secure Password</label><input type="password" id="newSecPwd" placeholder="Enter new password" /></div>
      <div class="cp-field"><label>Confirm New Password</label><input type="password" id="confSecPwd" placeholder="Confirm new password" /></div>

      <div id="secPwdMsg" style="margin-top:6px; font-size:12px; display:none;"></div>

      <div style="margin-top:16px; display:flex; gap:10px;">
        <button class="cp-btn accent" id="btnUpdateMyPassword">&#x1F512; Update Password</button>
      </div>
    </div>
  `;

  document.getElementById('btnUpdateMyPassword').addEventListener('click', async () => {
    const p1 = document.getElementById('newSecPwd').value;
    const p2 = document.getElementById('confSecPwd').value;
    const msg = document.getElementById('secPwdMsg');

    if (!p1 || p1.length < 6) {
      msg.textContent = 'New password must be at least 6 characters.';
      msg.style.color = 'var(--danger)';
      msg.style.display = 'block';
      return;
    }
    if (p1 !== p2) {
      msg.textContent = 'Passwords do not match.';
      msg.style.color = 'var(--danger)';
      msg.style.display = 'block';
      return;
    }

    await logAudit('PASSWORD_CHANGE', 'user', user.id, `User ${user.email} updated personal password`);
    msg.textContent = '✔ Password successfully updated.';
    msg.style.color = 'var(--success)';
    msg.style.display = 'block';
  });
}

  });

      const act = btn.dataset.action;

      if (act === 'contact') {

        state.tab = 'invoices';
        state.invoiceSubTab = 'new';

        const inv = state.invoices.find(i => (i.enquiryId && i.enquiryId === enq.id) || i.clientName.trim().toLowerCase() === enq.name.trim().toLowerCase());

      } else if (act === 'view_profile') {
        const accs = getStudentAccountSummaries();
        const acc = accs.find(a => a.clientName.trim().toLowerCase() === enq.name.trim().toLowerCase());
        if (acc) openModal('studentProfile', { account: acc });
        else openModal('enquiryDetail', { enquiry: enq });
      } else {
        openModal('enquiryDetail', { enquiry: enq });
      }
    });
  });
}

              ${filtered.map(acc => `
                <tr>
                  <td style="font-weight:700; color:var(--primary); cursor:pointer;" class="btnOpenProfile" data-name="${escapeHtml(acc.clientName)}">
                    ${escapeHtml(acc.clientName)}
                    ${acc.parentName ? `<div style="font-size:11px; font-weight:400; color:var(--text-muted);">Parent: ${escapeHtml(acc.parentName)}</div>` : ''}
                  </td>
                  <td>${escapeHtml(acc.programmesList)}</td>
                  <td>${escapeHtml(acc.phone || 'N/A')}<br/><span style="color:var(--text-muted); font-size:11px;">${escapeHtml(acc.email || 'N/A')}</span></td>
                  <td style="text-align:right; font-weight:600;">${fmtMoney(acc.totalInvoiced)}</td>
                  <td style="text-align:right; font-weight:600; color:var(--success);">${fmtMoney(acc.totalPaid)}</td>
                  <td style="text-align:right; font-weight:700; color:${acc.balance > 0 ? 'var(--warning)' : 'var(--success)'};">${fmtMoney(acc.balance)}</td>
                  <td>${acc.isEnrolled ? '<span class="cp-pill active">ENROLLED</span>' : '<span class="cp-pill draft">NOT ENROLLED</span>'}</td>
                  <td><span class="cp-pill ${acc.financialStatus.toLowerCase()}">${escapeHtml(acc.status)}</span></td>
                  <td style="text-align:center;">
                    <button class="cp-btn sm secondary btnOpenProfile" data-name="${escapeHtml(acc.clientName)}">&#x1F464; Complete Profile</button>
                  </td>
                </tr>
              `).join('')}
            </tbody>
          </table>
        </div>
      `}
    </div>
  `;

  document.getElementById('accountSearchInput').addEventListener('input', (e) => {
    state.filters.accountSearch = e.target.value;
    render();
  });

  document.getElementById('btnExportStudents').addEventListener('click', () => {
    exportToCSV('Student_Directory', filtered.map(a => ({
      Name: a.clientName, Phone: a.phone, Email: a.email, Programmes: a.programmesList,
      Invoiced: a.totalInvoiced, Paid: a.totalPaid, Balance: a.balance, Status: a.status
    })));
  });

  container.querySelectorAll('.btnOpenProfile').forEach(btn => {
    btn.addEventListener('click', () => {
      const name = btn.dataset.name;
      const acc = accounts.find(a => a.clientName === name);
      if (acc) openModal('studentProfile', { account: acc });
    });
  });
}

          <div class="cp-row2">
            <div class="cp-field"><label>Student / Client Name *</label><input id="invClient" value="${escapeHtml(initialClient)}" placeholder="e.g. Samuel Adebayo" /></div>
            <div class="cp-field"><label>Parent / Guardian Name (Optional)</label><input id="invParent" placeholder="e.g. Mr. &amp; Mrs. Adebayo" /></div>
          </div>

          <div class="cp-row3">
            <div class="cp-field"><label>Phone Number *</label><input id="invPhone" value="${escapeHtml(initialPhone)}" placeholder="08031234567" /></div>
            <div class="cp-field"><label>Email Address</label><input id="invEmail" type="email" value="${escapeHtml(initialEmail)}" placeholder="student@example.com" /></div>
            <div class="cp-field"><label>Billing Category</label><select id="invCat">${state.incomeCategories.map(c => `<option value="${escapeHtml(c)}">${escapeHtml(c)}</option>`).join('')}</select></div>
          </div>

          <div class="cp-row2">
            <div class="cp-field">
              <label>Target Programme / Curriculum *</label>
              <select id="invProg">
                ${state.programmes.map(p => `<option value="${p.id}" ${p.id === initialProgId ? 'selected' : ''}>${escapeHtml(p.name)} (${fmtMoney(p.price)})</option>`).join('')}
              </select>
            </div>
            <div class="cp-field">
              <label>Payment Plan *</label>
              <select id="invPlan">
                <option value="full">Full Upfront Payment</option>
                <option value="installment">60 / 40 Installment Schedule</option>
              </select>
            </div>
          </div>

          <div class="cp-row3">
            <div class="cp-field"><label>Invoice Date *</label><input id="invDate" type="date" value="${todayStr}" /></div>
            <div class="cp-field"><label>Payment Due Date *</label><input id="invDueDate" type="date" value="${dueDateDefault}" /></div>
            <div class="cp-field"><label>Training Delivery Mode</label><select id="invMode"><option value="Live Interactive Onsite Class">Live Interactive Onsite Class</option><option value="Live Online Virtual Class">Live Online Virtual Class</option><option value="Hybrid (Onsite + Virtual)">Hybrid (Onsite + Virtual)</option></select></div>
          </div>

          <div class="cp-row2">
            <div class="cp-field"><label>Course Duration</label><input id="invDuration" placeholder="e.g. 5 Months" value="5 Months" /></div>
            <div class="cp-field"><label>Lecture Schedule</label><input id="invSchedule" placeholder="e.g. Weekdays (Tue &amp; Thu 10am - 1pm)" value="Weekdays" /></div>
          </div>

          <!-- Payment Account Selection (Phase 8 Configurable Banking) -->
          <div class="cp-row2" style="background:#FAFBFD; border:1px solid var(--border); border-radius:var(--radius-sm); padding:12px; margin-top:8px; margin-bottom:14px;">
            <div class="cp-field" style="margin:0;">
              <label>Designated Payment Account *</label>
              <select id="invPaymentAccount">
                ${activeAccounts.map(a => `<option value="${a.id}" ${a.id === defaultAcc.id ? 'selected' : ''}>${escapeHtml(a.bankName)} - ${escapeHtml(a.accountNumber)} (${escapeHtml(a.accountName)})${a.isDefault ? ' [DEFAULT]' : ''}</option>`).join('')}

            </div>
            <div class="cp-field" style="margin:0;">
              <label>Payment Instructions</label>
              <input id="invPaymentInstructions" value="${escapeHtml(defaultAcc.instructions || 'Please use invoice number as payment reference.')}" />
            </div>
          </div>

          <!-- Dynamic Line Items Repeater -->
          <div style="margin-top:10px; margin-bottom:16px;">
            <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:8px;">
              <label style="font-size:12px; font-weight:700; color:var(--primary); text-transform:uppercase;">Invoice Line Items (Service Description)</label>
              <button class="cp-btn secondary sm" id="btnAddLineItem" type="button">+ Add Line Item</button>
            </div>

            <div id="lineItemsContainer">
              <div class="cp-row4 line-item-row" style="margin-bottom:8px;">
                <div class="cp-field" style="margin:0;"><label style="font-size:10.5px;">Programme / Description</label><input class="item-desc" value="${escapeHtml(defaultProg.name)}" /></div>
                <div class="cp-field" style="margin:0;"><label style="font-size:10.5px;">Qty</label><input class="item-qty" type="number" value="1" min="1" /></div>
                <div class="cp-field" style="margin:0;"><label style="font-size:10.5px;">Unit Price (₦)</label><input class="item-price" type="number" value="${defaultProg.price}" /></div>
                <div class="cp-field" style="margin:0;"><label style="font-size:10.5px;">Discount (₦)</label><input class="item-disc" type="number" value="0" min="0" /></div>
                <button class="cp-btn danger sm btnRemoveLine" type="button" style="height:35px; width:35px; padding:0;" title="Remove Item">&times;</button>
              </div>
            </div>

            <div style="background:#FAFBFD; border:1px solid var(--border); border-radius:var(--radius-sm); padding:12px 16px; margin-top:12px; display:flex; justify-content:flex-end;">
              <div style="text-align:right;">
                <div style="font-size:12px; color:var(--text-secondary);">Calculated Total: <strong id="lblCalculatedTotal" style="font-size:15px; color:var(--primary);">${fmtMoney(defaultProg.price)}</strong></div>
              </div>
            </div>
          </div>

          <!-- Notes, Comments, and Terms (Phase 8 Distinct Fields) -->
          <div class="cp-row2">
            <div class="cp-field">
              <label>Customer-Facing Notes (Appears under NOTES on Invoice)</label>
              <textarea id="invNotes" rows="2" placeholder="e.g. Please note that tuition includes all examination preparatory materials and lab access."></textarea>
            </div>
            <div class="cp-field">
              <label>Contextual / Internal Comments (Appears under COMMENT on Invoice)</label>
              <textarea id="invComments" rows="2" placeholder="e.g. 60/40 installment schedule approved by Admissions Committee."></textarea>
            </div>
          </div>

          <div class="cp-field">
            <label>Standard Terms &amp; Conditions</label>
            <textarea id="invTerms" rows="2">${escapeHtml(state.financeSettings.defaultTerms || 'Payment is due according to the schedule specified above.')}</textarea>
          </div>

          <div id="invFormError" class="cp-error" style="display:none; margin-bottom:12px; color:var(--danger); font-size:12px;"></div>

          <div style="display:flex; justify-content:flex-end; gap:10px; margin-top:16px;">
            <button class="cp-btn secondary" id="btnCancelNewInv2" type="button">Cancel</button>
            <button class="cp-btn secondary" id="btnPreviewInvoice" type="button">&#x1F441;&#xFE0F; Preview Invoice</button>
            <button class="cp-btn accent" id="btnSaveInvoice" type="button">&#x2714; Issue Official Invoice</button>
          </div>
        </div>
      </div>
    `;

    document.getElementById('invCustomerSelect').addEventListener('change', (e) => {
      const name = e.target.value;
      if (name) {
        const prevInv = state.invoices.slice().reverse().find(i => i.clientName.trim() === name);
        if (prevInv) {
          document.getElementById('invClient').value = prevInv.clientName;
          if (prevInv.phone) document.getElementById('invPhone').value = prevInv.phone;
          if (prevInv.email) document.getElementById('invEmail').value = prevInv.email;
          if (prevInv.parentName) document.getElementById('invParent').value = prevInv.parentName;
          if (prevInv.programmeId) document.getElementById('invProg').value = prevInv.programmeId;
        }
      }
    });

    document.getElementById('invProg').addEventListener('change', (e) => {
      const p = state.programmes.find(pr => pr.id === e.target.value);
      if (p) {
        const firstRow = document.querySelector('.line-item-row');
        if (firstRow) {
          firstRow.querySelector('.item-desc').value = p.name;
          firstRow.querySelector('.item-price').value = p.price;
          recalcInvoiceTotals();
        }
      }
    });

    document.getElementById('invPaymentAccount').addEventListener('change', (e) => {
      const acc = state.paymentAccounts.find(a => a.id === e.target.value);
      if (acc && acc.instructions) {
        document.getElementById('invPaymentInstructions').value = acc.instructions;
      }
    });

    function recalcInvoiceTotals() {
      let grand = 0;
      document.querySelectorAll('.line-item-row').forEach(row => {
        const qty = Number(row.querySelector('.item-qty').value || 1);
        const pr = Number(row.querySelector('.item-price').value || 0);
        const dc = Number(row.querySelector('.item-disc').value || 0);
        const lineAmt = Math.max(0, safeRound((qty * pr) - dc));
        grand = safeRound(grand + lineAmt);
      });
      const lbl = document.getElementById('lblCalculatedTotal');
      if (lbl) lbl.textContent = fmtMoney(grand);
    }

    const cont = document.getElementById('lineItemsContainer');
    cont.addEventListener('input', recalcInvoiceTotals);

    document.getElementById('btnAddLineItem').addEventListener('click', () => {
      const rowDiv = document.createElement('div');
      rowDiv.className = 'cp-row4 line-item-row';
      rowDiv.style.marginBottom = '8px';
      rowDiv.innerHTML = `
        <div class="cp-field" style="margin:0;"><input class="item-desc" placeholder="Item description" /></div>
        <div class="cp-field" style="margin:0;"><input class="item-qty" type="number" value="1" min="1" /></div>
        <div class="cp-field" style="margin:0;"><input class="item-price" type="number" value="50000" /></div>
        <div class="cp-field" style="margin:0;"><input class="item-disc" type="number" value="0" min="0" /></div>
        <button class="cp-btn danger sm btnRemoveLine" type="button" style="height:35px; width:35px; padding:0;" title="Remove Item">&times;</button>
      `;
      rowDiv.querySelector('.btnRemoveLine').addEventListener('click', () => {
        rowDiv.remove();
        recalcInvoiceTotals();
      });
      cont.appendChild(rowDiv);
      recalcInvoiceTotals();
    });

    cont.querySelectorAll('.btnRemoveLine').forEach(b => {
      b.addEventListener('click', (e) => {
        if (document.querySelectorAll('.line-item-row').length > 1) {
          e.target.closest('.line-item-row').remove();
          recalcInvoiceTotals();
        } else {
          alert('Invoice must contain at least one line item.');
        }
      });
    });

    document.getElementById('btnCancelNewInv').addEventListener('click', () => { state.pendingEnquiryForInvoice = null; state.invoiceSubTab = 'list'; render(); });
    document.getElementById('btnCancelNewInv2').addEventListener('click', () => { state.pendingEnquiryForInvoice = null; state.invoiceSubTab = 'list'; render(); });

    function buildInvoicePayloadFromForm() {
      const client = document.getElementById('invClient').value.trim();
      const progId = document.getElementById('invProg').value;
      const prog = state.programmes.find(p => p.id === progId) || { id: 'prog_gen', name: 'Professional Training Programme' };
      const dateStr = document.getElementById('invDate').value;
      const dueStr = document.getElementById('invDueDate').value;
      const accId = document.getElementById('invPaymentAccount').value;
      const selAcc = state.paymentAccounts.find(a => a.id === accId) || getDefaultPaymentAccount();

      const items = [];
      let subtotal = 0;
      let totalDiscount = 0;

      document.querySelectorAll('.line-item-row').forEach(r => {
        const desc = r.querySelector('.item-desc').value.trim() || prog.name;
        const qty = Number(r.querySelector('.item-qty').value || 1);
        const unitPrice = Number(r.querySelector('.item-price').value || 0);
        const disc = Number(r.querySelector('.item-disc').value || 0);
        const lineAmt = Math.max(0, safeRound((qty * unitPrice) - disc));
        subtotal = safeRound(subtotal + (qty * unitPrice));
        totalDiscount = safeRound(totalDiscount + disc);
        items.push({ description: desc, quantity: qty, price: unitPrice, discount: disc, amount: lineAmt });
      });

      const total = Math.max(0, safeRound(subtotal - totalDiscount));

      // Payment Account Immutable Snapshot (Phase 8)
      const paymentAccountSnapshot = {
        id: selAcc.id,
        accountName: selAcc.accountName,
        bankName: selAcc.bankName,
        accountNumber: selAcc.accountNumber,
        accountType: selAcc.accountType || 'Corporate Current',
        currency: selAcc.currency || 'NGN',
        instructions: document.getElementById('invPaymentInstructions').value.trim() || selAcc.instructions
      };

      return {
        client,
        parentName: document.getElementById('invParent').value.trim(),
        phone: document.getElementById('invPhone').value.trim(),
        email: document.getElementById('invEmail').value.trim(),
        category: document.getElementById('invCat').value,
        progId: prog.id,
        progName: prog.name,
        plan: document.getElementById('invPlan').value,
        trainingMode: document.getElementById('invMode').value,
        duration: document.getElementById('invDuration').value.trim() || '5 Months',
        schedule: document.getElementById('invSchedule').value.trim() || 'Weekdays',
        dateStr,
        dueStr,
        paymentAccountId: selAcc.id,
        paymentAccountSnapshot,
        notes: document.getElementById('invNotes').value.trim(),
        comments: document.getElementById('invComments').value.trim(),
        termsAndConditions: document.getElementById('invTerms').value.trim(),
        items,
        subtotal,
        discount: totalDiscount,
        total
      };
    }

    document.getElementById('btnPreviewInvoice').addEventListener('click', () => {
      const payload = buildInvoicePayloadFromForm();
      const errEl = document.getElementById('invFormError');

      if (!payload.client || payload.items.length === 0) {
        errEl.textContent = 'Please fill client name and at least one line item.';
        errEl.style.display = 'block';
        return;
      }

      const tempInv = {
        id: 'preview_temp',
        invoiceNo: state.counters.invoice + 1,
        invoice_display_no: formatDocNo('invoice', state.counters.invoice + 1, payload.dateStr),
        clientName: payload.client,
        parentName: payload.parentName,
        phone: payload.phone,
        email: payload.email,
        category: payload.category,
        programmeId: payload.progId,
        programmeName: payload.progName,
        plan: payload.plan,
        trainingMode: payload.trainingMode,
        duration: payload.duration,
        schedule: payload.schedule,
        date: payload.dateStr,
        dueDate: payload.dueStr,
        paymentAccountId: payload.paymentAccountId,
        paymentAccountSnapshot: payload.paymentAccountSnapshot,
        notes: payload.notes,
        comments: payload.comments,
        termsAndConditions: payload.termsAndConditions,
        items: payload.items,
        subtotal: payload.subtotal,
        discount: payload.discount,
        total: payload.total,
        createdBy: state.auth.user ? state.auth.user.name : 'Super Admin'
      };

      openModal('previewInvoice', { invoice: tempInv });
    });

    document.getElementById('btnSaveInvoice').addEventListener('click', async () => {
      const payload = buildInvoicePayloadFromForm();
      const errEl = document.getElementById('invFormError');

      if (!payload.client || payload.items.length === 0) {
        errEl.textContent = 'Please fill all required fields.';
        errEl.style.display = 'block';
        return;
      }
      if (isPeriodLocked(payload.dateStr)) {
        errEl.textContent = 'This financial period is locked. Mutations blocked.';
        errEl.style.display = 'block';
        return;
      }
      if (payload.dueStr < payload.dateStr) {
        errEl.textContent = 'Due date cannot precede invoice issue date.';
        errEl.style.display = 'block';
        return;
      }

      state.counters.invoice += 1;
      const docNo = formatDocNo('invoice', state.counters.invoice, payload.dateStr);

      const inv = {
        id: 'inv_' + Date.now(),
        tenant_id: DEFAULT_TENANT_ID,
        enquiryId: state.pendingEnquiryForInvoice ? state.pendingEnquiryForInvoice.id : null,
        invoiceNo: state.counters.invoice,
        invoice_display_no: docNo,
        clientName: payload.client,
        parentName: payload.parentName,
        programmeId: payload.progId,
        programmeName: payload.progName,
        phone: payload.phone,
        email: payload.email,
        category: payload.category,
        date: payload.dateStr,
        dueDate: payload.dueStr,
        plan: payload.plan,
        trainingMode: payload.trainingMode,
        duration: payload.duration,
        schedule: payload.schedule,
        paymentAccountId: payload.paymentAccountId,
        paymentAccountSnapshot: payload.paymentAccountSnapshot,
        notes: payload.notes,
        comments: payload.comments,
        termsAndConditions: payload.termsAndConditions,
        items: payload.items,
        subtotal: payload.subtotal,
        discount: payload.discount,
        total: payload.total,
        createdAt: new Date().toISOString(),
        createdBy: state.auth.user ? state.auth.user.name : 'Super Admin'
      };

      state.invoices.push(inv);

      // Advance linked enquiry status
      if (state.pendingEnquiryForInvoice) {
        const enq = state.enquiries.find(e => e.id === state.pendingEnquiryForInvoice.id);
        if (enq) {
          enq.status = 'INVOICE_ISSUED';
          enq.updatedAt = new Date().toISOString();
          await safeSet(STORE_KEY_ENQUIRIES, state.enquiries);
        }
        state.pendingEnquiryForInvoice = null;
      }

      await safeSet(STORE_KEY_INVOICES, state.invoices);
      await safeSet(STORE_KEY_COUNTERS, state.counters);
      await logAudit('CREATE_INVOICE', 'invoice', inv.id, `Invoice #${inv.invoiceNo} (${inv.clientName})`, null, inv);

      state.invoiceSubTab = 'list';
      openModal('viewInvoice', { invoice: inv });
      render();
    });
  } else {
    const q = (state.filters.invoiceSearch || '').toLowerCase();
    const filtered = state.invoices.filter(i => i.clientName.toLowerCase().includes(q) || String(i.invoiceNo).includes(q) || (i.programmeName && i.programmeName.toLowerCase().includes(q)));

    container.innerHTML = `
      <div class="cp-card">
        <div class="cp-card-header">
          <div>
            <div class="cp-section-title">&#x1F4C4; Tuition &amp; Service Invoices</div>
            <div class="cp-section-desc">Manage, view, print, and track payment status across all issued student invoices.</div>
          </div>
          <div style="display:flex; gap:8px;">
            <button class="cp-btn sm secondary" id="btnExportInvoices">&#x1F4E5; Export CSV</button>
            ${canRecord() ? '<button class="cp-btn sm accent" id="btnNewInvBtn">+ Create Invoice</button>' : ''}
          </div>
        </div>

        <div class="cp-field" style="max-width:320px; margin-bottom:14px;">
          <input type="text" id="invoiceSearchInput" placeholder="Filter by invoice #, student, programme..." value="${escapeHtml(state.filters.invoiceSearch)}" />
        </div>

        ${filtered.length === 0 ? `
          <div class="cp-empty-state">
            <div class="cp-empty-icon">&#x1F4C4;</div>
            <div class="cp-empty-title">No invoices yet</div>
            <div class="cp-empty-desc">Create your first invoice to begin tracking student tuition and fees.</div>
            ${canRecord() ? '<button class="cp-btn accent sm" id="btnEmptyNewInvoice">+ Create Invoice</button>' : ''}
          </div>
        ` : `
          <div class="cp-table-wrap">
            <table class="cp-table">
              <thead>
                <tr>
                  <th>Invoice #</th><th>Issue Date</th><th>Due Date</th><th>Student / Client</th>
                  <th>Programme / Service</th><th style="text-align:right;">Total</th><th style="text-align:right;">Paid</th>
                  <th style="text-align:right;">Balance</th><th>Status</th><th style="text-align:center;">Actions</th>
                </tr>
              </thead>
              <tbody>
                ${filtered.slice().reverse().map(inv => {
                  const { paid, balance, total } = invoiceBalance(inv);
                  const st = invoiceStatus(inv);
                  return `
                    <tr>
                      <td style="font-weight:700; font-family:var(--font-mono);">#${inv.invoiceNo}</td>
                      <td>${fmtDate(inv.date)}</td>
                      <td>${fmtDate(inv.dueDate)}</td>
                      <td style="font-weight:600;">${escapeHtml(inv.clientName)}</td>
                      <td style="font-weight:600; color:var(--primary);">${escapeHtml(inv.programmeName || 'General Tech Programme')}</td>
                      <td style="text-align:right;">${fmtMoney(total)}</td>
                      <td style="text-align:right; color:var(--success); font-weight:600;">${fmtMoney(paid)}</td>
                      <td style="text-align:right; font-weight:700; color:${balance > 0 ? 'var(--warning)' : 'var(--success)'};">${fmtMoney(balance)}</td>
                      <td><span class="cp-pill ${st}">${st.toUpperCase()}</span></td>
                      <td style="text-align:center;">

      render();

    document.getElementById('btnExportInvoices').addEventListener('click', () => {
      exportToCSV('Invoices_Ledger', filtered.map(i => ({
        Invoice_No: i.invoiceNo, Date: i.date, Due_Date: i.dueDate, Student: i.clientName,
        Programme: i.programmeName, Total: i.total, Paid: invoiceBalance(i).paid,
        Balance: invoiceBalance(i).balance, Status: invoiceStatus(i)
      })));
    });

    const btnNew = document.getElementById('btnNewInvBtn') || document.getElementById('btnEmptyNewInvoice');
    if (btnNew) {
      btnNew.addEventListener('click', () => {
        state.invoiceSubTab = 'new';
        render();
      });
    }

    container.querySelectorAll('.btnViewInv').forEach(b => {
      b.addEventListener('click', () => {
        const inv = state.invoices.find(i => i.id === b.dataset.id);
        if (inv) openModal('viewInvoice', { invoice: inv });
      });
    });

    container.querySelectorAll('.btnRecordPay').forEach(b => {
      b.addEventListener('click', () => {
        const inv = state.invoices.find(i => i.id === b.dataset.id);
        if (inv) openModal('recordPayment', { invoice: inv });
      });
    });

    container.querySelectorAll('.btnReminder').forEach(b => {
      b.addEventListener('click', () => {
        const inv = state.invoices.find(i => i.id === b.dataset.id);
        if (inv) openModal('sendReminder', { invoice: inv });
      });
    });
  }
}

                    <td style="font-weight:600;">${escapeHtml(inv.clientName)}</td>
                    <td>Invoice #${inv.invoiceNo}</td>
                    <td>${escapeHtml(p.paymentMethod || 'Bank Transfer')}</td>
                    <td style="font-family:var(--font-mono); font-size:11.5px;">${escapeHtml(p.reference || '—')}</td>
                    <td style="text-align:right; font-weight:700; color:var(--success);">${fmtMoney(p.amount)}</td>
                    <td><span class="cp-pill paid">CONFIRMED</span></td>
                    <td style="text-align:center;">
                      <button class="cp-btn sm secondary btnViewRec" data-id="${p.id}">&#x1F9FE; View Receipt</button>
                    </td>
                  </tr>
                `;
              }).join('')}
            </tbody>
          </table>
        </div>
      `}
    </div>
  `;

  document.getElementById('paymentSearchInput').addEventListener('input', (e) => {
    state.filters.paymentSearch = e.target.value;
    render();
  });

  document.getElementById('btnExportPayments').addEventListener('click', () => {
    exportToCSV('Payments_Ledger', filtered.map(p => {
      const inv = state.invoices.find(i => i.id === p.invoiceId) || { invoiceNo: 'N/A', clientName: 'Student' };
      return { Receipt_No: p.receiptNo, Date: p.date, Student: inv.clientName, Invoice_No: inv.invoiceNo, Method: p.paymentMethod, Reference: p.reference, Amount: p.amount };

      if (unpaid) openModal('recordPayment', { invoice: unpaid });
      else alert('No outstanding invoices available.');

  container.querySelectorAll('.btnViewRec').forEach(b => {
    b.addEventListener('click', () => {

// ----------------------------------------------------
// TAB 6: STAFF & FACILITATOR PAYSLIPS (PHASE 8 MULTI-STAGE LIFECYCLE)
// ----------------------------------------------------
function renderPayslipsTab(container) {
  const q = (state.filters.payslipSearch || '').toLowerCase();
  const periodFilter = state.filters.payslipPeriod || '';
  const typeFilter = state.filters.payslipType || 'all';
  const statusFilter = state.filters.payslipStatus || 'all';

  const filtered = state.payslips.filter(ps => {
    const matchesQ = ps.employeeName.toLowerCase().includes(q) || String(ps.payslipNo).includes(q) || (ps.role && ps.role.toLowerCase().includes(q));
    const matchesPeriod = !periodFilter || ps.payPeriod === periodFilter;
    const matchesType = typeFilter === 'all' || ps.employeeType === typeFilter;
    
    let matchesStatus = true;
    if (statusFilter === 'has_query') {
      matchesStatus = ps.queries && ps.queries.some(query => query.status === 'open' || query.status === 'under_review');
    } else if (statusFilter !== 'all') {
      matchesStatus = ps.status === statusFilter;
    }

    return matchesQ && matchesPeriod && matchesType && matchesStatus;
  });

  const m = getFinancialMetrics();
  const payM = m.payroll;

        <div class="cp-kpi-val" style="font-size:18px; color:var(--text-secondary);">${fmtMoney(payM.draftPayroll)}</div>
        <div class="cp-kpi-sub">${state.payslips.filter(p => p.status === 'draft').length} Drafts</div>
      </div>
      <div class="cp-kpi-card" style="padding:12px 14px;">
        <div class="cp-kpi-label">2. Issued (Review)</div>
        <div class="cp-kpi-val" style="font-size:18px; color:var(--info);">${fmtMoney(payM.pendingAcknowledgement)}</div>
        <div class="cp-kpi-sub">${state.payslips.filter(p => p.status === 'issued').length} Awaiting Acknowledged</div>
      </div>
      <div class="cp-kpi-card" style="padding:12px 14px;">
        <div class="cp-kpi-label">3. Acknowledged</div>
        <div class="cp-kpi-val" style="font-size:18px; color:var(--primary);">${fmtMoney(payM.pendingApproval)}</div>
        <div class="cp-kpi-sub">${state.payslips.filter(p => p.status === 'acknowledged').length} Pending Approval</div>
      </div>
      <div class="cp-kpi-card" style="padding:12px 14px; border:1.5px solid var(--warning);">
        <div class="cp-kpi-label" style="color:var(--warning);">4. Awaiting Month-End Pay</div>
        <div class="cp-kpi-val" style="font-size:18px; color:var(--warning);">${fmtMoney(payM.awaitingPayment)}</div>
        <div class="cp-kpi-sub">${state.payslips.filter(p => p.status === 'approved').length} Approved Liabilities</div>
      </div>
      <div class="cp-kpi-card" style="padding:12px 14px; border:1.5px solid var(--success);">
        <div class="cp-kpi-label" style="color:var(--success);">5. Paid / Disbursed</div>
        <div class="cp-kpi-val" style="font-size:18px; color:var(--success);">${fmtMoney(payM.totalDisbursed)}</div>
        <div class="cp-kpi-sub">${state.payslips.filter(p => p.status === 'paid').length} Finalized Payments</div>
      </div>
    </div>

    ${payM.openQueriesCount > 0 ? `
      <div style="background:#FFFBEB; border:1.5px solid var(--warning); border-radius:var(--radius-sm); padding:10px 14px; margin-bottom:16px; display:flex; justify-content:space-between; align-items:center; font-size:12.5px; color:#92400E;">
        <div>
          &#x26A0;&#xFE0F; <strong>Active Payroll Queries:</strong> There are <strong>${payM.openQueriesCount}</strong> payslip(s) with open employee/facilitator queries awaiting review. Approval is blocked until queries are resolved.
        </div>
        <button class="cp-btn sm secondary" id="btnFilterOpenQueries" style="border-color:var(--warning); color:#92400E;">View Open Queries</button>
      </div>
    ` : ''}

    <div class="cp-card">
      <div class="cp-card-header">
        <div>
          <div class="cp-section-title">&#x1F4B3; Staff &amp; Facilitator Payroll Workspace</div>

        </div>
        <div style="display:flex; gap:8px;">
          <button class="cp-btn sm secondary" id="btnExportPayslips">&#x1F4E5; Export Payroll CSV</button>
          ${canRecord() ? '<button class="cp-btn sm accent" id="btnNewPayslipBtn">+ Prepare Payslip</button>' : ''}
        </div>
      </div>

      <!-- Filters -->
      <div style="display:flex; gap:10px; margin-bottom:14px; flex-wrap:wrap;">
        <div class="cp-field" style="margin:0; flex:1; max-width:280px;">
          <input type="text" id="payslipSearchInput" placeholder="Filter by employee name, role, #..." value="${escapeHtml(state.filters.payslipSearch)}" />
        </div>
        <div class="cp-field" style="margin:0; width:160px;">
          <select id="payslipTypeSelect">
            <option value="all" ${typeFilter === 'all' ? 'selected' : ''}>All Personnel Types</option>
            <option value="staff" ${typeFilter === 'staff' ? 'selected' : ''}>Staff Members</option>
            <option value="facilitator" ${typeFilter === 'facilitator' ? 'selected' : ''}>Facilitators / Trainers</option>
          </select>
        </div>
        <div class="cp-field" style="margin:0; width:220px;">
          <select id="payslipStatusSelect">
            <option value="all" ${statusFilter === 'all' ? 'selected' : ''}>All Workflow Statuses</option>
            <option value="draft" ${statusFilter === 'draft' ? 'selected' : ''}>Draft (Preparation)</option>
            <option value="issued" ${statusFilter === 'issued' ? 'selected' : ''}>Issued (Pending Review)</option>
            <option value="acknowledged" ${statusFilter === 'acknowledged' ? 'selected' : ''}>Acknowledged (Ready for Approval)</option>
            <option value="approved" ${statusFilter === 'approved' ? 'selected' : ''}>Approved (Awaiting Payment)</option>
            <option value="paid" ${statusFilter === 'paid' ? 'selected' : ''}>Paid (Disbursed)</option>
            <option value="cancelled" ${statusFilter === 'cancelled' ? 'selected' : ''}>Cancelled</option>
            <option value="has_query" ${statusFilter === 'has_query' ? 'selected' : ''}>⚠️ Under Query</option>
          </select>
        </div>
      </div>

      ${filtered.length === 0 ? `
        <div class="cp-empty-state">
          <div class="cp-empty-icon">&#x1F4B3;</div>
          <div class="cp-empty-title">No payslips match your filter</div>
          <div class="cp-empty-desc">Prepare monthly payroll statements for staff and facilitators before month-end settlement.</div>
          ${canRecord() ? '<button class="cp-btn accent sm" id="btnEmptyGeneratePayslip">+ Prepare Payslip</button>' : ''}
        </div>
      ` : `
        <div class="cp-table-wrap">
          <table class="cp-table">
            <thead>
              <tr>
                <th>Payslip #</th><th>Period &amp; Target Pay Date</th><th>Employee / Facilitator</th><th>Type</th>
                <th>Department &amp; Role</th><th style="text-align:right;">Gross Pay</th>
                <th style="text-align:right;">Deductions</th><th style="text-align:right;">Net Pay</th>
                <th>Workflow Status</th><th style="text-align:center;">Actions</th>
              </tr>
            </thead>
            <tbody>
              ${filtered.slice().reverse().map(ps => {
                const hasOpenQuery = ps.queries && ps.queries.some(q => q.status === 'open' || q.status === 'under_review');
                let statusBadge = '';
                if (ps.status === 'draft') statusBadge = '<span class="cp-pill draft">1. DRAFT</span>';
                else if (ps.status === 'issued') statusBadge = '<span class="cp-pill new">2. ISSUED</span>';
                else if (ps.status === 'acknowledged') statusBadge = '<span class="cp-pill active" style="background:#E0E7FF; color:#3730A3;">3. ACKNOWLEDGED</span>';
                else if (ps.status === 'approved') statusBadge = '<span class="cp-pill partial" style="background:#FEF3C7; color:#92400E; font-weight:800;">4. APPROVED (AWAITING PAY)</span>';
                else if (ps.status === 'paid') statusBadge = '<span class="cp-pill paid">5. PAID &amp; DISBURSED</span>';
                else if (ps.status === 'cancelled') statusBadge = '<span class="cp-pill cancelled">CANCELLED</span>';

                return `
                  <tr>
                    <td style="font-weight:700; font-family:var(--font-mono);">#${ps.payslipNo}</td>
                    <td><strong>${escapeHtml(ps.payPeriod)}</strong><br/><span style="font-size:10.5px; color:var(--text-muted);">${fmtDate(ps.payDate)}</span></td>
                    <td style="font-weight:700; color:var(--primary);">${escapeHtml(ps.employeeName)}</td>
                    <td><span class="cp-pill ${ps.employeeType === 'facilitator' ? 'category-pill' : 'new'}">${escapeHtml(ps.employeeType.toUpperCase())}</span></td>
                    <td>${escapeHtml(ps.department)}<br/><span style="font-size:11px; color:var(--text-secondary);">${escapeHtml(ps.role)}</span></td>
                    <td style="text-align:right; font-weight:600;">${fmtMoney(ps.grossPay)}</td>
                    <td style="text-align:right; color:var(--danger);">${ps.totalDeductions > 0 ? '-' + fmtMoney(ps.totalDeductions) : '₦0.00'}</td>
                    <td style="text-align:right; font-weight:800; color:var(--primary); font-size:13px;">${fmtMoney(ps.netPay)}</td>
                    <td>
                      ${statusBadge}
                      ${hasOpenQuery ? `<div style="margin-top:4px;"><span class="cp-pill prio-high" style="font-size:10px;">⚠️ Query Pending</span></div>` : ''}
                    </td>
                    <td style="text-align:center;">
                      <div class="cp-action-group" style="display:flex; justify-content:center; gap:4px; flex-wrap:wrap;">
                        <button class="cp-btn sm secondary btnViewPayslip" data-id="${ps.id}" title="View official printable payslip document">&#x1F4C4; View / Print</button>
                        
                        ${ps.status === 'draft' && canRecord() ? `
                          <button class="cp-btn sm accent btnIssuePayslip" data-id="${ps.id}" title="Issue to employee for review">Issue</button>
                        ` : ''}

                        ${ps.status === 'issued' ? `
                          <button class="cp-btn sm success btnAckPayslip" data-id="${ps.id}" title="Employee review &amp; acknowledgement">Acknowledge</button>
                          <button class="cp-btn sm secondary btnRaiseQuery" data-id="${ps.id}" title="Raise Discrepancy Query" style="color:#B45309;">Raise Query</button>
                        ` : ''}

                        ${ps.status === 'acknowledged' ? `
                          ${canApprove() ? `<button class="cp-btn sm accent btnApprovePayslip" data-id="${ps.id}" ${hasOpenQuery ? 'disabled title="Resolve open queries before approval"' : 'title="Approve for month-end disbursement"'}>Approve Payroll</button>` : ''}
                          <button class="cp-btn sm secondary btnRaiseQuery" data-id="${ps.id}" title="Raise Discrepancy Query" style="color:#B45309;">Raise Query</button>
                        ` : ''}

                        ${ps.status === 'approved' && canApprove() ? `
                          <button class="cp-btn sm success btnPayPayslip" data-id="${ps.id}" title="Disburse month-end payment &amp; create expense">Mark as Paid</button>
                        ` : ''}

                        ${hasOpenQuery ? `
                          <button class="cp-btn sm warning btnReviewQuery" data-id="${ps.id}" style="background:#FFFBEB; border-color:var(--warning); color:#92400E;">Review Query</button>
                        ` : ''}

                        ${(ps.status === 'draft' || ps.status === 'issued' || ps.status === 'acknowledged' || ps.status === 'approved') && canCancel() ? `
                          <button class="cp-btn sm danger btnCancelPayslip" data-id="${ps.id}" title="Cancel / Void Payslip">&times;</button>
                        ` : ''}
                      </div>
                    </td>
                  </tr>
                `;
              }).join('')}
            </tbody>
          </table>
        </div>
      `}
    </div>
  `;

  document.getElementById('payslipSearchInput').addEventListener('input', (e) => {
    state.filters.payslipSearch = e.target.value;
    render();
  });

  document.getElementById('payslipTypeSelect').addEventListener('change', (e) => {
    state.filters.payslipType = e.target.value;
    render();
  });

  document.getElementById('payslipStatusSelect').addEventListener('change', (e) => {
    state.filters.payslipStatus = e.target.value;
    render();
  });

  const btnFilterQueries = document.getElementById('btnFilterOpenQueries');
  if (btnFilterQueries) {
    btnFilterQueries.addEventListener('click', () => {
      state.filters.payslipStatus = 'has_query';
      render();
    });
  }

  document.getElementById('btnExportPayslips').addEventListener('click', () => {
    exportToCSV('Payroll_Ledger', filtered.map(p => ({
      Payslip_No: p.payslipNo, Period: p.payPeriod, Date: p.payDate, Employee: p.employeeName,
      Type: p.employeeType, Department: p.department, Role: p.role, Gross_Pay: p.grossPay,
      Deductions: p.totalDeductions, Net_Pay: p.netPay, Status: p.status, Method: p.paymentMethod, Reference: p.paymentReference
    })));
  });

  const btnGen = document.getElementById('btnNewPayslipBtn') || document.getElementById('btnEmptyGeneratePayslip');
  if (btnGen) btnGen.addEventListener('click', () => openModal('generatePayslip'));

  container.querySelectorAll('.btnViewPayslip').forEach(b => {
    b.addEventListener('click', () => {
      const ps = state.payslips.find(p => p.id === b.dataset.id);
      if (ps) openModal('viewPayslip', { payslip: ps });
    });
  });

  container.querySelectorAll('.btnIssuePayslip').forEach(b => {
    b.addEventListener('click', async () => {
      const ps = state.payslips.find(p => p.id === b.dataset.id);
      if (ps) {
        ps.status = 'issued';
        ps.issuedAt = new Date().toISOString();
        ps.issuedBy = state.auth.user ? state.auth.user.name : 'Finance Operations';
        await safeSet(STORE_KEY_PAYSLIPS, state.payslips);
        await logAudit('ISSUE_PAYSLIP', 'payslip', ps.id, `Issued Payslip #${ps.payslipNo} for ${ps.employeeName} review`);
        render();
      }
    });
  });

  container.querySelectorAll('.btnAckPayslip').forEach(b => {
    b.addEventListener('click', () => {
      const ps = state.payslips.find(p => p.id === b.dataset.id);
      if (ps) openModal('acknowledgePayslip', { payslip: ps });
    });
  });

  container.querySelectorAll('.btnRaiseQuery').forEach(b => {
    b.addEventListener('click', () => {
      const ps = state.payslips.find(p => p.id === b.dataset.id);
      if (ps) openModal('raisePayrollQuery', { payslip: ps });
    });
  });

  container.querySelectorAll('.btnReviewQuery').forEach(b => {
    b.addEventListener('click', () => {
      const ps = state.payslips.find(p => p.id === b.dataset.id);
      if (ps) openModal('resolvePayrollQuery', { payslip: ps });
    });
  });

  container.querySelectorAll('.btnApprovePayslip').forEach(b => {
    b.addEventListener('click', () => {
      const ps = state.payslips.find(p => p.id === b.dataset.id);
      if (ps) openModal('approvePayslip', { payslip: ps });
    });
  });

  container.querySelectorAll('.btnPayPayslip').forEach(b => {
    b.addEventListener('click', () => {
      const ps = state.payslips.find(p => p.id === b.dataset.id);
      if (ps) openModal('payPayslip', { payslip: ps });
    });
  });

  container.querySelectorAll('.btnCancelPayslip').forEach(b => {
    b.addEventListener('click', () => {
      const ps = state.payslips.find(p => p.id === b.dataset.id);
      if (ps) openModal('cancelPayslip', { payslip: ps });
    });
  });
}

                <th>Date</th><th>Expense Group</th><th>Category</th><th>Description</th>
                <th>Vendor / Beneficiary</th><th>Department</th><th style="text-align:right;">Amount</th>
                <th>Status</th><th style="text-align:center;">Actions</th>
              </tr>
            </thead>
            <tbody>
              ${filtered.slice().reverse().map(e => `
                <tr>
                  <td>${fmtDate(e.date)}</td>
                  <td style="font-weight:600;">${escapeHtml(e.categoryGroup)}</td>
                  <td>${escapeHtml(e.category)}</td>
                  <td>${escapeHtml(e.description)}</td>
                  <td>${escapeHtml(e.vendor || '—')}</td>
                  <td>${escapeHtml(e.department || 'Operations')}</td>
                  <td style="text-align:right; font-weight:700; color:var(--danger);">${fmtMoney(e.amount)}</td>
                  <td><span class="cp-pill ${e.status}">${e.status.toUpperCase()}</span></td>
                  <td style="text-align:center;">
                    ${e.status === 'pending_approval' && canApprove() ? `
                      <button class="cp-btn sm accent btnApproveExp" data-id="${e.id}">Approve</button>
                    ` : (e.status === 'recorded' && canCancel() ? `
                      <button class="cp-btn sm danger btnCancelExp" data-id="${e.id}">Cancel</button>
                    ` : '—')}
                  </td>
                </tr>
              `).join('')}
            </tbody>
          </table>
        </div>
      `}
    </div>
  `;

  document.getElementById('expenseSearchInput').addEventListener('input', (e) => {
    state.filters.expenseSearch = e.target.value;
    render();
  });

  document.getElementById('btnExportExpenses').addEventListener('click', () => {
    exportToCSV('Expenses_Ledger', filtered.map(e => ({
      Date: e.date, Group: e.categoryGroup, Category: e.category,
      Description: e.description, Vendor: e.vendor, Department: e.department,
      Amount: e.amount, Status: e.status
    })));
  });

  const btnLog = document.getElementById('btnLogExpenseBtn');
  if (btnLog) btnLog.addEventListener('click', () => openModal('recordExpense'));

  container.querySelectorAll('.btnApproveExp').forEach(b => {
    b.addEventListener('click', async () => {
      const exp = state.expenses.find(e => e.id === b.dataset.id);
      if (exp) {
        exp.status = 'approved';
        exp.approvedBy = state.auth.user ? state.auth.user.name : 'Manager';
        exp.approvedAt = new Date().toISOString();
        await safeSet(STORE_KEY_EXPENSES, state.expenses);
        await logAudit('APPROVE_EXPENSE', 'expense', exp.id, exp.description);
        render();
      }
    });
  });

  container.querySelectorAll('.btnCancelExp').forEach(b => {
    b.addEventListener('click', () => {
      const exp = state.expenses.find(e => e.id === b.dataset.id);
      if (exp) openModal('cancelExpense', { expense: exp });
    });
  });
}

                <th>Actual Spent</th><th>Remaining</th><th>Utilization</th>
              </tr>
            </thead>
            <tbody>
              ${state.budgets.map(b => {
                const actual = state.expenses
                  .filter(e => (e.status === 'recorded' || e.status === 'approved') && e.category === b.category && (e.date || '').startsWith(curPeriod))
                  .reduce((s, e) => s + Number(e.amount || 0), 0);
                const rem = safeRound(b.amount - actual);
                const util = b.amount > 0 ? Math.min(100, safeRound((actual / b.amount) * 100)) : 0;
                return `
                  <tr>
                    <td style="font-weight:700;">${escapeHtml(b.category)}</td>
                    <td>${escapeHtml(b.department || 'Operations')}</td>
                    <td>${fmtMoney(b.amount)}</td>
                    <td style="color:var(--danger); font-weight:600;">${fmtMoney(actual)}</td>
                    <td style="font-weight:700; color:${rem >= 0 ? 'var(--success)' : 'var(--danger)'};">${fmtMoney(rem)}</td>
                    <td style="width:140px;">
                      <div style="font-size:11px; font-weight:600; margin-bottom:2px;">${util}%</div>
                      <div style="height:6px; background:var(--surface-2); border-radius:3px; overflow:hidden;">
                        <div style="height:100%; width:${util}%; background:${util > 90 ? 'var(--danger)' : util > 70 ? 'var(--warning)' : 'var(--success)'};"></div>
                      </div>
                    </td>
                  </tr>
                `;
              }).join('')}
            </tbody>
          </table>
        </div>
      `}
    </div>
  `;

  const btnSet = document.getElementById('btnSetBudgetBtn');
  if (btnSet) btnSet.addEventListener('click', () => openModal('setBudget'));
}

                Directory of all Clasptek staff members and facilitators. Deactivating an employee suspends login while preserving all past payslips and financial records.
              </div>
              <button class="cp-btn sm secondary" id="btnExportPersonnel">&#x1F4E5; Export Personnel CSV</button>
            </div>

            <div class="cp-table-wrap">
              <table class="cp-table">
                <thead>
                  <tr>
                    <th>Personnel ID</th>
                    <th>Full Name &amp; Contact</th>
                    <th>Type</th>
                    <th>Department / Subject</th>
                    <th>Role / Designation</th>
                    <th>Bank &amp; Account #</th>
                    <th style="text-align:right;">Base / Fee Structure</th>
                    <th>Status</th>
                    ${canManageUsers() ? '<th style="text-align:center;">Actions</th>' : ''}
                  </tr>
                </thead>
                <tbody>
                  ${state.personnel.map(p => {
                    const isDeact = p.status === 'deactivated';
                    const isSusp = p.status === 'suspended';
                    return `
                      <tr style="${isDeact ? 'opacity:0.6; background:#F8FAFC;' : ''}">
                        <td style="font-family:var(--font-mono); font-weight:700; color:var(--primary);">${escapeHtml(p.employeeId || 'EMP-XXXX')}</td>
                        <td>
                          <strong>${escapeHtml(p.name)}</strong>
                          <div style="font-size:11px; color:var(--text-muted); font-family:var(--font-mono);">${escapeHtml(p.email)} &middot; ${escapeHtml(p.phone || 'No phone')}</div>
                        </td>
                        <td><span class="cp-pill ${p.type === 'facilitator' ? 'category-pill' : 'new'}">${escapeHtml((p.type || 'staff').toUpperCase())}</span></td>
                        <td>${escapeHtml(p.subject || p.department || 'Academics')}</td>
                        <td>${escapeHtml(p.role || p.designation || 'Staff')}</td>
                        <td>
                          <div style="font-size:11.5px; font-weight:600;">${escapeHtml(p.bankName || 'GTBank')}</div>
                          <div class="cp-acc-num" style="font-size:11.5px;">${escapeHtml(p.accountNumber || '—')}</div>
                        </td>
                        <td style="text-align:right; font-weight:700; color:var(--primary); font-size:12px;">
                          ${p.feeStructure ? `<span style="font-size:11px; font-weight:600; color:var(--text-secondary);">${escapeHtml(p.feeStructure)}</span>` : fmtMoney(p.basicPay || 0)}
                        </td>
                        <td>
                          <span class="cp-pill ${p.status === 'active' ? 'paid' : (isSusp ? 'unpaid' : 'cancelled')}">
                            ${escapeHtml((p.status || 'active').toUpperCase())}
                          </span>
                        </td>
                        ${canManageUsers() ? `
                          <td style="text-align:center;">
                            <div class="cp-action-group" style="display:flex; justify-content:center; gap:4px;">
                              <button class="cp-btn sm secondary btnEditPersonnel" data-id="${p.id}" title="Edit personal, employment, and bank info">Edit</button>
                              ${!p.userId ? `
                                <button class="cp-btn sm accent btnCreateLoginForPers" data-id="${p.id}" title="Provision login access">Create Login</button>
                              ` : ''}
                              ${!isDeact ? `
                                <button class="cp-btn sm danger btnDeactivatePersonnel" data-id="${p.id}" title="Deactivate staff while preserving all past payroll records">Deactivate</button>
                              ` : `
                                <button class="cp-btn sm success btnReactivatePersonnel" data-id="${p.id}" title="Restore active staff status">Reactivate</button>
                              `}
                            </div>
                          </td>
                        ` : ''}
                      </tr>
                    `;
                  }).join('')}
                </tbody>
              </table>
            </div>
          </div>
        ` : ''}

        ${curSub === 'security' ? `
          <div>
            <div style="display:grid; grid-template-columns:1fr 1fr; gap:16px; margin-bottom:20px;">
              <div style="background:#FAFBFD; border:1px solid var(--border); border-radius:var(--radius-sm); padding:16px;">
                <div style="font-size:14px; font-weight:700; color:var(--primary); margin-bottom:8px;">Authoritative 5-Tier Role-Based Permissions Matrix</div>
                <div style="font-size:12px; color:var(--text-secondary); line-height:1.7;">
                  &bull; <strong>Super Admin:</strong> Full Governance, User/Role Management, Settings, Period Locking, All Audits.<br/>
                  &bull; <strong>Finance Manager:</strong> Financial Approvals, Payroll Disbursement, Budgets, Invoices, Reconciliation.<br/>
                  &bull; <strong>Finance Staff:</strong> Invoicing, Payment Collection, Operational Expenses, Payroll Preparation.<br/>
                  &bull; <strong>Staff:</strong> My Workspace, Self Profile, Own Payslips &amp; Queries (Strict Data Isolation).<br/>
                  &bull; <strong>Facilitator:</strong> Facilitator Workspace, Self Profile, Own Payslips (Strict Data Isolation).
                </div>
              </div>

              <div style="background:#FAFBFD; border:1px solid var(--border); border-radius:var(--radius-sm); padding:16px;">
                <div style="font-size:14px; font-weight:700; color:var(--primary); margin-bottom:8px;">Active Session &amp; Credential Governance</div>
                <div style="font-size:12px; color:var(--text-secondary); line-height:1.7;">
                  &bull; <strong>Mandatory Authentication:</strong> Unauthenticated users are strictly barred from all internal routes.<br/>
                  &bull; <strong>Session Revocation:</strong> Administrators can immediately invalidate any user session across devices.<br/>
                  &bull; <strong>Zero Plaintext Storage:</strong> Passwords and hashes are never displayed, retrieved, or logged.<br/>
                  &bull; <strong>Forced Password Resets:</strong> First-time logins and administrative resets require immediate confidential password updates.
                </div>
              </div>
            </div>
          </div>
        ` : ''}
      </div>
    </div>
  `;

  // Subtab switching
  container.querySelectorAll('.cp-subtab-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      state.usersSubTab = btn.dataset.sub;
      render();
    });
  });

  // Action Buttons
  const btnAddStaff = document.getElementById('btnAddStaffBtn');
  if (btnAddStaff) btnAddStaff.addEventListener('click', () => openModal('addStaffModal'));

  const btnAddFac = document.getElementById('btnAddFacilitatorBtn');
  if (btnAddFac) btnAddFac.addEventListener('click', () => openModal('addFacilitatorModal'));

  const btnExpPers = document.getElementById('btnExportPersonnel');
  if (btnExpPers) {
    btnExpPers.addEventListener('click', () => {
      exportToCSV('Personnel_Directory', state.personnel.map(p => ({
        ID: p.employeeId, Name: p.name, Type: p.type, Department: p.department, Role: p.role,
        Email: p.email, Phone: p.phone, Bank: p.bankName, AccountNo: p.accountNumber, BasicPay: p.basicPay, Status: p.status
      })));
    });
  }

  // Personnel actions
  container.querySelectorAll('.btnEditPersonnel').forEach(b => {
    b.addEventListener('click', () => {
      const pers = state.personnel.find(p => p.id === b.dataset.id);
      if (pers) openModal('editPersonnelModal', { personnel: pers });
    });
  });

  container.querySelectorAll('.btnCreateLoginForPers').forEach(b => {
    b.addEventListener('click', async () => {
      const pers = state.personnel.find(p => p.id === b.dataset.id);
      if (!pers) return;
      const newUserId = 'usr_' + Date.now();
      const userRole = pers.type === 'facilitator' ? 'Facilitator' : 'Staff';
      const invToken = generateRandomToken('inv_');
      const invExpiry = Date.now() + 7 * 24 * 3600 * 1000; // 7 days
      const newUser = {
        id: newUserId,
        email: pers.email,
        name: pers.name,
        role: userRole,
        title: pers.role || pers.designation,
        status: 'invited',
        mustChangePassword: true,
        invitationToken: invToken,
        invitationExpiresAt: invExpiry,
        personnelId: pers.id,
        tenant_id: DEFAULT_TENANT_ID,
        createdAt: new Date().toISOString()
      };
      pers.userId = newUserId;
      state.users.push(newUser);
      await safeSet(STORE_KEY_PERSONNEL, state.personnel);
      await safeSet(STORE_KEY_SYSTEM_USERS, state.users);
      await logAudit('USER_INVITED', 'user', newUserId, `Provisioned invitation login for ${pers.name} (${userRole})`);
      
      const currentUrl = (typeof window !== 'undefined' && window.location ? window.location.href.split('?')[0] : 'file:///clasptek_invoice_system.html');
      const invLink = `${currentUrl}?invite=${invToken}`;
      alert(`Login invitation created for ${pers.name} (${pers.email}) with role: ${userRole}.\n\nInvitation Link (Valid for 7 days):\n${invLink}`);
      render();
    });
  });

  container.querySelectorAll('.btnDeactivatePersonnel').forEach(b => {
    b.addEventListener('click', () => {
      const pers = state.personnel.find(p => p.id === b.dataset.id);
      if (pers) openModal('deactivatePersonnelModal', { personnel: pers });
    });
  });

  container.querySelectorAll('.btnReactivatePersonnel').forEach(b => {
    b.addEventListener('click', async () => {
      const pers = state.personnel.find(p => p.id === b.dataset.id);
      if (!pers) return;
      pers.status = 'active';
      const usr = state.users.find(u => u.personnelId === pers.id || u.id === pers.userId || (u.email && u.email.toLowerCase() === pers.email.toLowerCase()));
      if (usr) usr.status = 'active';
      await safeSet(STORE_KEY_PERSONNEL, state.personnel);
      await safeSet(STORE_KEY_SYSTEM_USERS, state.users);
      await logAudit('REACTIVATE_PERSONNEL', 'personnel', pers.id, `Reactivated staff ${pers.name}`);
      alert(`${pers.name} has been reactivated.`);
      render();
    });
  });

  // User Governance Actions
  container.querySelectorAll('.btnChangeUserRole').forEach(b => {
    b.addEventListener('click', () => {
      const u = state.users.find(usr => usr.id === b.dataset.id);
      if (u) openModal('changeRoleModal', { user: u });
    });
  });

  container.querySelectorAll('.btnResetUserPwd').forEach(b => {
    b.addEventListener('click', () => {
      const u = state.users.find(usr => usr.id === b.dataset.id);
      if (u) openModal('resetPasswordModal', { user: u });
    });
  });

  container.querySelectorAll('.btnCopyInviteLink').forEach(b => {
    b.addEventListener('click', async () => {
      const u = state.users.find(usr => usr.id === b.dataset.id);
      if (!u || !u.invitationToken) return;
      const currentUrl = (typeof window !== 'undefined' && window.location ? window.location.href.split('?')[0] : 'file:///clasptek_invoice_system.html');
      const invLink = `${currentUrl}?invite=${u.invitationToken}`;
      if (navigator.clipboard && navigator.clipboard.writeText) {
        try {
          await navigator.clipboard.writeText(invLink);
          alert(`Invitation link copied to clipboard:\n${invLink}`);
        } catch (err) {
          prompt('Copy Invitation Link:', invLink);
        }
      } else {
        prompt('Copy Invitation Link:', invLink);
      }
    });
  });

  container.querySelectorAll('.btnRevokeUserSess').forEach(b => {
    b.addEventListener('click', async () => {
      const u = state.users.find(usr => usr.id === b.dataset.id);
      if (!u) return;
      if (!confirm(`Revoke all active portal sessions for ${u.name} (${u.email})? They will be prompted to re-authenticate immediately.`)) return;
      u.revokedSessionTokens = u.revokedSessionTokens || [];
      u.revokedSessionTokens.push('REVOKED_' + Date.now());
      await safeSet(STORE_KEY_SYSTEM_USERS, state.users);
      await logAudit('REVOKE_USER_SESSIONS', 'user', u.id, `Revoked active sessions for ${u.email}`);
      alert(`All active sessions for ${u.name} have been revoked.`);
      render();
    });
  });

  container.querySelectorAll('.btnDeactivateUserAccount').forEach(b => {
    b.addEventListener('click', () => {
      const u = state.users.find(usr => usr.id === b.dataset.id);
      if (u) openModal('deactivateUserModal', { user: u });
    });
  });

  container.querySelectorAll('.btnReactivateUserAccount').forEach(b => {
    b.addEventListener('click', async () => {
      const u = state.users.find(usr => usr.id === b.dataset.id);
      if (!u) return;
      u.status = 'active';
      delete u.deactivationReason;
      delete u.deactivatedAt;
      delete u.deactivatedBy;
      await safeSet(STORE_KEY_SYSTEM_USERS, state.users);
      await logAudit('REACTIVATE_USER', 'user', u.id, `Reactivated account for ${u.email}`);
      alert(`User account for ${u.name} (${u.email}) has been reactivated.`);
      render();
    });
  });

  container.querySelectorAll('.btnToggleSuspendUser').forEach(b => {
    b.addEventListener('click', async () => {
      const u = state.users.find(usr => usr.id === b.dataset.id);
      if (!u) return;
      u.status = u.status === 'suspended' ? 'active' : 'suspended';
      await safeSet(STORE_KEY_SYSTEM_USERS, state.users);
      await logAudit('TOGGLE_USER_STATUS', 'user', u.id, `Set status to ${u.status}`);
      render();
    });
  });
}

function renderFinancialControlsTab(container) {
  const curMonth = new Date().toISOString().slice(0, 7);
  const isLocked = isPeriodLocked(curMonth + '-01');

  container.innerHTML = `
    <div class="cp-card">
      <div class="cp-card-header">
        <div>
          <div class="cp-section-title">&#x1F512; Financial Controls &amp; Governance</div>
          <div class="cp-section-desc">Accounting period locks, approval threshold tiers, and bank reconciliation.</div>
        </div>
      </div>

      <div style="display:grid; grid-template-columns:1fr 1fr; gap:16px;">
        <div style="background:#FAFBFD; border:1px solid var(--border); border-radius:var(--radius-sm); padding:16px;">
          <div style="font-size:14px; font-weight:700; color:var(--primary); margin-bottom:6px;">Accounting Period Status (${curMonth})</div>
          <div style="font-size:12.5px; color:var(--text-secondary); margin-bottom:12px;">
            Status: <strong style="color:${isLocked ? 'var(--danger)' : 'var(--success)'};">${isLocked ? 'LOCKED (Modifications Prohibited)' : 'OPEN FOR TRANSACTIONS'}</strong>
          </div>
          ${canLockPeriod() ? `
            <button class="cp-btn ${isLocked ? 'accent' : 'danger'} sm" id="btnToggleLockPeriod">
              ${isLocked ? 'Reopen Financial Period' : 'Lock Current Period'}
            </button>
          ` : '<div style="font-size:11.5px; color:var(--text-muted);">Period locking restricted to Super Admin.</div>'}
        </div>

        <div style="background:#FAFBFD; border:1px solid var(--border); border-radius:var(--radius-sm); padding:16px;">
          <div style="font-size:14px; font-weight:700; color:var(--primary); margin-bottom:6px;">Approval Tiers</div>
          <div style="font-size:12px; color:var(--text-secondary); line-height:1.6;">
            Tier 1 (Under ₦100,000): <strong>Automatic Approval</strong><br/>
            Tier 2 (₦100,000 – ₦500,000): <strong>Finance Manager</strong><br/>
            Tier 3 (Over ₦500,000): <strong>Super Admin Only</strong>
          </div>
        </div>
      </div>
    </div>
  `;

  const btnLock = document.getElementById('btnToggleLockPeriod');
  if (btnLock) {
    btnLock.addEventListener('click', async () => {
      const idx = state.financePeriods.findIndex(p => p.period === curMonth);
      const newStatus = isLocked ? 'open' : 'locked';
      if (idx >= 0) state.financePeriods[idx].status = newStatus;
      else state.financePeriods.push({ period: curMonth, status: newStatus, lockedAt: new Date().toISOString() });
      await safeSet(STORE_KEY_FINANCE_PERIODS, state.financePeriods);
      await logAudit('PERIOD_LOCK_TOGGLE', 'period', curMonth, `Set to ${newStatus}`);
      render();
    });
  }
}

                    <tr>
                      <td style="font-weight:700; color:var(--primary);">${escapeHtml(emp.name)}</td>
                      <td><span class="cp-pill ${emp.type === 'facilitator' ? 'category-pill' : 'new'}">${escapeHtml(emp.type.toUpperCase())}</span></td>
                      <td>${escapeHtml(emp.department)}</td>
                      <td>${escapeHtml(emp.role)}</td>
                      <td style="font-family:var(--font-mono);">${escapeHtml(emp.email)}</td>
                      <td style="text-align:right; font-weight:700; color:var(--primary);">${fmtMoney(emp.basicPay)}</td>
                    </tr>
                  `).join('')}
                </tbody>
              </table>
            </div>
          </div>
        ` : ''}

        ${curSub === 'backups' ? `
          <div style="display:grid; grid-template-columns:1fr 1fr; gap:16px;">
            <div style="background:#FAFBFD; border:1px solid var(--border); border-radius:var(--radius-sm); padding:16px;">
              <div style="font-size:14px; font-weight:700; color:var(--primary); margin-bottom:6px;">Supabase Production REST Endpoint</div>
              <div style="font-family:var(--font-mono); font-size:12px; word-break:break-all; margin-bottom:12px;">${escapeHtml(state.supabase.endpoint)}</div>
              <button class="cp-btn secondary sm" id="btnLaunchSupabaseModal">&#x26A1; Launch Supabase &amp; Migration Diagnostic</button>
            </div>

            <div style="background:#FAFBFD; border:1px solid var(--border); border-radius:var(--radius-sm); padding:16px;">
              <div style="font-size:14px; font-weight:700; color:var(--primary); margin-bottom:6px;">Data Backup &amp; Archival</div>
              <div style="font-size:12px; color:var(--text-secondary); margin-bottom:12px;">Download complete JSON snapshot of all records.</div>
              <button class="cp-btn accent sm" id="btnDownloadBackupJson">&#x1F4E5; Export Full JSON Backup</button>
            </div>
          </div>
        ` : ''}
      </div>
    </div>
  `;

  // Subtab switching
  container.querySelectorAll('.cp-subtab-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      state.settingsSubTab = btn.dataset.sub;
      render();
    });
  });

  // Save Company Settings
  const btnSaveCo = document.getElementById('btnSaveCompanySettings');
  if (btnSaveCo) {
    btnSaveCo.addEventListener('click', async () => {
      state.financeSettings = {
        ...state.financeSettings,
        companyName: document.getElementById('setCompanyName').value.trim(),
        tradingName: document.getElementById('setTradingName').value.trim(),
        address: document.getElementById('setAddress').value.trim(),
        phone: document.getElementById('setPhone').value.trim(),
        email: document.getElementById('setEmail').value.trim(),
        website: document.getElementById('setWebsite').value.trim(),
        taxId: document.getElementById('setTaxId').value.trim(),
        registrationNumber: document.getElementById('setRegNo').value.trim(),
        invoiceFooter: document.getElementById('setFooter').value.trim()
      };
      await safeSet(STORE_KEY_FINANCE_SETTINGS, state.financeSettings);
      await logAudit('UPDATE_SETTINGS', 'finance_settings', 'company', 'Updated Company Profile');
      alert('Company profile updated successfully.');
      render();
    });
  }

  // Payment Accounts Handlers
  const btnAddAcc = document.getElementById('btnAddAccountBtn');
  if (btnAddAcc) btnAddAcc.addEventListener('click', () => openModal('addPaymentAccount'));

  container.querySelectorAll('.btnSetDefaultAcc').forEach(b => {
    b.addEventListener('click', async () => {
      const id = b.dataset.id;
      state.paymentAccounts.forEach(a => {
        a.isDefault = a.id === id;
      });
      await safeSet(STORE_KEY_PAYMENT_ACCOUNTS, state.paymentAccounts);
      await logAudit('SET_DEFAULT_ACCOUNT', 'payment_account', id, 'Set as Default Payment Account');
      render();
    });
  });

  container.querySelectorAll('.btnToggleActiveAcc').forEach(b => {
    b.addEventListener('click', async () => {
      const id = b.dataset.id;
      const acc = state.paymentAccounts.find(a => a.id === id);
      if (acc) {
        acc.isActive = acc.isActive === false ? true : false;
        await safeSet(STORE_KEY_PAYMENT_ACCOUNTS, state.paymentAccounts);
        await logAudit('TOGGLE_ACCOUNT_STATUS', 'payment_account', id, `Set active to ${acc.isActive}`);
        render();
      }
    });
  });

  container.querySelectorAll('.btnEditAcc').forEach(b => {
    b.addEventListener('click', () => {
      const acc = state.paymentAccounts.find(a => a.id === b.dataset.id);
      if (acc) openModal('addPaymentAccount', { account: acc });
    });
  });

  // Save Invoice Defaults
  const btnSaveInvDef = document.getElementById('btnSaveInvoiceDefaults');
  if (btnSaveInvDef) {
    btnSaveInvDef.addEventListener('click', async () => {
      state.financeSettings.defaultTerms = document.getElementById('setDefaultTerms').value.trim();
      const defAcc = getDefaultPaymentAccount();
      if (defAcc) {
        defAcc.instructions = document.getElementById('setDefaultInstructions').value.trim();
        await safeSet(STORE_KEY_PAYMENT_ACCOUNTS, state.paymentAccounts);
      }
      await safeSet(STORE_KEY_FINANCE_SETTINGS, state.financeSettings);
      await logAudit('UPDATE_SETTINGS', 'finance_settings', 'invoice_defaults', 'Updated Invoice Defaults');
      alert('Invoice defaults updated successfully.');
      render();
    });
  }

  // Backup & Supabase Handlers
  const btnLaunchSb = document.getElementById('btnLaunchSupabaseModal');
  if (btnLaunchSb) btnLaunchSb.addEventListener('click', () => openModal('supabaseModal'));

  const btnDlBackup = document.getElementById('btnDownloadBackupJson');
  if (btnDlBackup) {
    btnDlBackup.addEventListener('click', () => {
      const fullBackup = {
        exportedAt: new Date().toISOString(),
        tenant_id: DEFAULT_TENANT_ID,
        financeSettings: state.financeSettings,
        paymentAccounts: state.paymentAccounts,
        payslips: state.payslips,
        programmes: state.programmes,
        invoices: state.invoices,
        payments: state.payments,
        expenses: state.expenses,
        directIncome: state.directIncome,
        budgets: state.budgets,
        enquiries: state.enquiries,
        enrolments: state.enrolments,
        auditLog: state.auditLog,
        counters: state.counters
      };
      const blob = new Blob([JSON.stringify(fullBackup, null, 2)], { type: 'application/json' });
      const link = document.createElement('a');
      link.href = URL.createObjectURL(blob);
      link.download = `clasptek_finance_backup_${new Date().toISOString().slice(0, 10)}.json`;
      link.click();
    });
  }
}

function renderCanonicalInvoiceDocument(inv) {
  const { paid, balance, total } = invoiceBalance(inv);
  const st = invoiceStatus(inv);
  const payAcc = getInvoicePaymentAccount(inv);
  const fsCfg = state.financeSettings || DEFAULT_FINANCE_SETTINGS;

  const statusLabel = st === 'paid' ? 'PAID IN FULL' : (st === 'partial' ? 'PARTIALLY PAID' : (st === 'overdue' ? 'OVERDUE' : 'UNPAID'));
