            <div class="cp-modal-body">
              <div class="cp-field"><label>Date *</label><input id="mDate" type="date" value="${todayStr}" /></div>
              <div class="cp-field"><label>Category *</label><select id="mCategory">${state.incomeCategories.map(c => `<option value="${escapeHtml(c)}">${escapeHtml(c)}</option>`).join('')}</select></div>
              <div class="cp-field"><label>Source / Client</label><input id="mClient" placeholder="e.g. Chevron Ltd" /></div>
              <div class="cp-field"><label>Amount (\u20a6) *</label><input id="mAmount" type="number" min="1" placeholder="250000" /></div>
              <div class="cp-field"><label>Payment Method</label><select id="mMethod">${PAYMENT_METHODS.map(pm => `<option value="${escapeHtml(pm)}">${escapeHtml(pm)}</option>`).join('')}</select></div>
              <div class="cp-field"><label>Reference</label><input id="mRef" placeholder="e.g. NIBSS/TRX/983421" /></div>
              <div id="mError" class="cp-error" style="display:none;"></div>
            </div>
            <div class="cp-modal-footer">
              <button class="cp-btn secondary" id="mCancel">Cancel</button>
              <button class="cp-btn accent" id="mSubmit">Save Direct Income</button>
            </div>
          </div>
        </div>
      `;

      document.getElementById('mClose').addEventListener('click', closeModal);
      document.getElementById('mCancel').addEventListener('click', closeModal);
      document.getElementById('mSubmit').addEventListener('click', async () => {
        const amt = Number(document.getElementById('mAmount').value);
        const dateStr = document.getElementById('mDate').value;
        const errEl = document.getElementById('mError');

        if (!amt || amt <= 0) { errEl.textContent = 'Enter valid amount.'; errEl.style.display = 'block'; return; }
        if (isPeriodLocked(dateStr)) { errEl.textContent = 'This financial period is locked.'; errEl.style.display = 'block'; return; }

        const directItem = {
          id: 'dirinc_' + Date.now(), tenant_id: DEFAULT_TENANT_ID, date: dateStr,
          category: document.getElementById('mCategory').value, clientSource: document.getElementById('mClient').value.trim(),
          amount: amt, method: document.getElementById('mMethod').value, reference: document.getElementById('mRef').value.trim(),
          status: 'active', createdAt: new Date().toISOString(), createdBy: state.currentRole
        };

        state.directIncome.push(directItem);
        await safeSet(STORE_KEY_DIRECT_INCOME, state.directIncome);
        await logAudit('CREATE_DIRECT_INCOME', 'direct_income', directItem.id, directItem.reference, null, directItem);
        closeModal();
        render();
      });
    }

    function renderRecordExpenseModal(container) {
      const todayStr = new Date().toISOString().slice(0, 10);
      const groups = Object.keys(state.expenseCategories);
      const initialSubs = state.expenseCategories[groups[0]] || ['Miscellaneous'];

      container.innerHTML = `
        <div class="cp-modal-overlay">
          <div class="cp-modal large">
            <div class="cp-modal-header"><div class="cp-modal-title">&#x2795; Record Business Expense</div><button class="cp-modal-close" id="mClose">&times;</button></div>
            <div class="cp-modal-body">
              <div class="cp-row2">
                <div class="cp-field"><label>Date *</label><input id="mExpDate" type="date" value="${todayStr}" /></div>
                <div class="cp-field"><label>Amount (\u20a6) *</label><input id="mExpAmount" type="number" min="1" placeholder="85000" /></div>
              </div>
              <div class="cp-row2">
                <div class="cp-field"><label>Category Group *</label><select id="mExpGroup">${groups.map(g => `<option value="${escapeHtml(g)}">${escapeHtml(g)}</option>`).join('')}</select></div>
                <div class="cp-field"><label>Subcategory *</label><select id="mExpSub">${initialSubs.map(s => `<option value="${escapeHtml(s)}">${escapeHtml(s)}</option>`).join('')}</select></div>
              </div>
              <div class="cp-field"><label>Description / Purpose *</label><input id="mExpDesc" placeholder="e.g. Training facility generator diesel" /></div>
              <div class="cp-row2">
                <div class="cp-field"><label>Vendor / Payee</label><input id="mExpVendor" placeholder="e.g. TotalEnergies" /></div>
                <div class="cp-field"><label>Department</label><select id="mExpDept">${DEPARTMENTS.map(d => `<option value="${escapeHtml(d)}">${escapeHtml(d)}</option>`).join('')}</select></div>
              </div>
              <div class="cp-field"><label>Payment Method *</label><select id="mExpMethod">${PAYMENT_METHODS.map(pm => `<option value="${escapeHtml(pm)}">${escapeHtml(pm)}</option>`).join('')}</select></div>
              <div id="mExpError" class="cp-error" style="display:none;"></div>
            </div>
            <div class="cp-modal-footer">
              <button class="cp-btn secondary" id="mCancel">Cancel</button>
              <button class="cp-btn accent" id="mSubmit">Save Expense</button>
            </div>
          </div>
        </div>
      `;

      const grpSelect = document.getElementById('mExpGroup');
      const subSelect = document.getElementById('mExpSub');
      grpSelect.addEventListener('change', () => {
        const subs = state.expenseCategories[grpSelect.value] || ['Miscellaneous'];
        subSelect.innerHTML = subs.map(s => `<option value="${escapeHtml(s)}">${escapeHtml(s)}</option>`).join('');
      });

      document.getElementById('mClose').addEventListener('click', closeModal);
      document.getElementById('mCancel').addEventListener('click', closeModal);
      document.getElementById('mSubmit').addEventListener('click', async () => {
        const amt = Number(document.getElementById('mExpAmount').value);
        const desc = document.getElementById('mExpDesc').value.trim();
        const dateStr = document.getElementById('mExpDate').value;
        const errEl = document.getElementById('mExpError');

        if (!amt || !desc) { errEl.textContent = 'Fill in required fields.'; errEl.style.display = 'block'; return; }
        if (isPeriodLocked(dateStr)) { errEl.textContent = 'This financial period is locked.'; errEl.style.display = 'block'; return; }

        const reqRole = getRequiredApprovalRole(amt);
        const requiresApproval = (reqRole === 'Finance Manager' && state.currentRole === 'Finance Staff') ||
                                 (reqRole === 'Super Admin' && ['Finance Staff', 'Finance Manager'].includes(state.currentRole));
        const initialStatus = requiresApproval ? 'pending_approval' : 'recorded';

        const expense = {
          id: 'exp_' + Date.now(), tenant_id: DEFAULT_TENANT_ID, date: dateStr,
          categoryGroup: grpSelect.value, category: subSelect.value, description: desc,
          amount: amt, vendor: document.getElementById('mExpVendor').value.trim(),
          department: document.getElementById('mExpDept').value, method: document.getElementById('mExpMethod').value,
          status: initialStatus, createdAt: new Date().toISOString(), createdBy: state.currentRole
        };

        state.expenses.push(expense);
        await safeSet(STORE_KEY_EXPENSES, state.expenses);
        await logAudit('CREATE_EXPENSE', 'expense', expense.id, expense.description, null, expense);

        if (requiresApproval) alert(`Expense of ${fmtMoney(amt)} submitted for ${reqRole} approval.`);
        closeModal();
        render();
      });
    }

    function renderRecordPaymentModal(container, inv) {
      const { balance, total, paid } = invoiceBalance(inv);
      const todayStr = new Date().toISOString().slice(0, 10);

      container.innerHTML = `
        <div class="cp-modal-overlay">
          <div class="cp-modal">
            <div class="cp-modal-header"><div class="cp-modal-title">&#x1F4B5; Record Invoice Payment</div><button class="cp-modal-close" id="mClose">&times;</button></div>
            <div class="cp-modal-body">
              <div class="cp-receipt-total-box" style="margin-bottom:14px;">
                <div style="font-weight:700; color:var(--primary);">Invoice #${inv.invoiceNo} &mdash; ${escapeHtml(inv.clientName)}</div>
                <div style="display:flex; justify-content:space-between; font-size:12.5px; margin-top:4px;">
                  <span>Invoice Total: ${fmtMoney(total)}</span>
                  <span>Paid: <strong style="color:var(--success);">${fmtMoney(paid)}</strong></span>
                </div>
                <div style="font-weight:700; color:var(--warning); margin-top:2px;">Outstanding: ${fmtMoney(balance)}</div>
              </div>

              <div class="cp-row2">
                <div class="cp-field"><label>Payment Date *</label><input id="mPayDate" type="date" value="${todayStr}" /></div>
                <div class="cp-field"><label>Amount (\u20a6) *</label><input id="mPayAmount" type="number" min="1" max="${balance}" value="${balance}" /></div>
              </div>
              <div class="cp-field"><label>Payment Method *</label><select id="mPayMethod">${PAYMENT_METHODS.map(pm => `<option value="${escapeHtml(pm)}">${escapeHtml(pm)}</option>`).join('')}</select></div>
              <div class="cp-field"><label>Reference</label><input id="mPayRef" placeholder="e.g. GTB/TRF/019284" /></div>
              <div id="mPayError" class="cp-error" style="display:none;"></div>
            </div>
            <div class="cp-modal-footer">
              <button class="cp-btn secondary" id="mCancel">Cancel</button>
              <button class="cp-btn accent" id="mSubmit">Confirm Payment &amp; Issue Receipt</button>
            </div>
          </div>
        </div>
      `;

      document.getElementById('mClose').addEventListener('click', closeModal);
      document.getElementById('mCancel').addEventListener('click', closeModal);
      document.getElementById('mSubmit').addEventListener('click', async () => {
        const amt = Number(document.getElementById('mPayAmount').value);
        const dateStr = document.getElementById('mPayDate').value;
        const errEl = document.getElementById('mPayError');

        if (!amt || amt <= 0 || amt > balance) { errEl.textContent = 'Invalid payment amount.'; errEl.style.display = 'block'; return; }
        if (isPeriodLocked(dateStr)) { errEl.textContent = 'This financial period is locked.'; errEl.style.display = 'block'; return; }

        state.counters.receipt += 1;
        const payment = {
          id: 'pay_' + Date.now(), tenant_id: DEFAULT_TENANT_ID, receiptNo: state.counters.receipt,
          invoiceId: inv.id, amount: amt, paymentMethod: document.getElementById('mPayMethod').value,
          reference: document.getElementById('mPayRef').value.trim(), reconciliationStatus: 'unreconciled',
          date: dateStr, createdAt: new Date().toISOString(), createdBy: state.currentRole
        };

        state.payments.push(payment);
        await safeSet(STORE_KEY_PAYMENTS, state.payments);
        await safeSet(STORE_KEY_COUNTERS, state.counters);
        await logAudit('RECORD_PAYMENT', 'payment', payment.id, `RCP #${payment.receiptNo}`, null, payment);

        openModal('viewReceipt', { payment, invoice: inv });
        render();
      });
    }

    function renderViewReceiptModal(container, payment, invoice) {
      const inv = invoice || state.invoices.find(i => i.id === payment.invoiceId) || { invoiceNo: 'N/A', clientName: 'Student', total: payment.amount };
      const { balance } = invoiceBalance(inv);

      container.innerHTML = `
        <div class="cp-modal-overlay">
          <div class="cp-modal large">
            <div class="cp-modal-header no-print"><div class="cp-modal-title">&#x1F9FE; Official Payment Receipt</div><button class="cp-modal-close" id="mClose">&times;</button></div>
            <div class="cp-modal-body">
              <div class="cp-statement-paper cp-printable-area">
                <div class="cp-statement-header">
                  <div>
                    <div style="font-size:18px; font-weight:800; color:var(--primary);">CLASPTEK FINANCE</div>
                    <div style="font-size:12px; color:var(--text-secondary);">Official Payment Receipt</div>
                  </div>
                  <div style="text-align:right;">
                    <div style="font-size:14px; font-weight:700; color:var(--accent);">RECEIPT #${payment.receiptNo}</div>
                    <div style="font-size:11.5px; color:var(--text-secondary);">Date: ${fmtDate(payment.date)}</div>
                  </div>
                </div>

                <div class="cp-receipt-row"><span>Student / Client</span><span style="font-weight:700;">${escapeHtml(inv.clientName)}</span></div>
                <div class="cp-receipt-row"><span>Applied Invoice</span><span>Invoice #${inv.invoiceNo}</span></div>
                <div class="cp-receipt-row"><span>Payment Method</span><span>${escapeHtml(payment.paymentMethod || 'Bank Transfer')}</span></div>
                <div class="cp-receipt-row"><span>Reference</span><span style="font-family:monospace;">${escapeHtml(payment.reference || '\u2014')}</span></div>
                <div class="cp-receipt-row" style="border-top:1.5px solid var(--primary); border-bottom:1.5px solid var(--primary); padding:8px 0; font-size:15px; font-weight:800; color:var(--success);">
                  <span>AMOUNT PAID</span><span>${fmtMoney(payment.amount)}</span>
                </div>
                <div class="cp-receipt-row"><span>Remaining Balance</span><span style="font-weight:700;">${fmtMoney(balance)}</span></div>
              </div>
            </div>
            <div class="cp-modal-footer no-print">
              <button class="cp-btn secondary" id="mCloseRec">Close</button>
              <button class="cp-btn accent" onclick="window.print();">&#x1F5A8; Print Receipt</button>
            </div>
          </div>
        </div>
      `;

      document.getElementById('mClose').addEventListener('click', closeModal);
      document.getElementById('mCloseRec').addEventListener('click', closeModal);
    }

    function renderSetBudgetModal(container) {
      const curMonth = state.filters.budgetPeriod || new Date().toISOString().slice(0, 7);
      const groups = Object.keys(state.expenseCategories);

      container.innerHTML = `
        <div class="cp-modal-overlay">
          <div class="cp-modal">
            <div class="cp-modal-header"><div class="cp-modal-title">&#x1F6E1; Set Spending Budget</div><button class="cp-modal-close" id="mClose">&times;</button></div>
            <div class="cp-modal-body">
              <div class="cp-row2">
                <div class="cp-field"><label>Month *</label><input type="month" id="mBMonth" value="${curMonth}" /></div>
                <div class="cp-field"><label>Budget (\u20a6) *</label><input type="number" id="mBAmt" min="1" placeholder="500000" /></div>
              </div>
              <div class="cp-field"><label>Category Group *</label><select id="mBGroup">${groups.map(g => `<option value="${escapeHtml(g)}">${escapeHtml(g)}</option>`).join('')}</select></div>
            </div>
            <div class="cp-modal-footer">
              <button class="cp-btn secondary" id="mBCancel">Cancel</button>
              <button class="cp-btn accent" id="mBSave">Save Target</button>
            </div>
          </div>
        </div>
      `;

      document.getElementById('mClose').addEventListener('click', closeModal);
      document.getElementById('mBCancel').addEventListener('click', closeModal);
      document.getElementById('mBSave').addEventListener('click', async () => {
        const amt = Number(document.getElementById('mBAmt').value);
        const month = document.getElementById('mBMonth').value;
        if (!amt) return;

        const budget = {
          id: 'bdg_' + Date.now(), tenant_id: DEFAULT_TENANT_ID, period: month,
          categoryGroup: document.getElementById('mBGroup').value, budgetAmount: amt,
          status: 'active', createdAt: new Date().toISOString(), createdBy: state.currentRole
        };

        state.budgets.push(budget);
        await safeSet(STORE_KEY_BUDGETS, state.budgets);
        await logAudit('SET_BUDGET', 'budget', budget.id, `${budget.categoryGroup} (${budget.period})`, null, budget);
        closeModal();
        render();
      });
    }

    function renderCancelExpenseModal(container, expense) {
      container.innerHTML = `
        <div class="cp-modal-overlay">
          <div class="cp-modal">
            <div class="cp-modal-header"><div class="cp-modal-title" style="color:var(--danger);">&#x26A0; Void Expense</div><button class="cp-modal-close" id="mClose">&times;</button></div>
            <div class="cp-modal-body">
              <div style="font-size:13px; margin-bottom:12px;">Void expense of <strong>${fmtMoney(expense.amount)}</strong> (${escapeHtml(expense.description)})?</div>
              <div class="cp-field"><label>Reason *</label><textarea id="mVoidReason" rows="2" placeholder="Audit justification..."></textarea></div>
            </div>
            <div class="cp-modal-footer">
              <button class="cp-btn secondary" id="mVoidCancel">Cancel</button>
              <button class="cp-btn danger" id="mConfirmVoid">Confirm Void</button>
            </div>
          </div>
        </div>
      `;

      document.getElementById('mClose').addEventListener('click', closeModal);
      document.getElementById('mVoidCancel').addEventListener('click', closeModal);
      document.getElementById('mConfirmVoid').addEventListener('click', async () => {
        const reason = document.getElementById('mVoidReason').value.trim();
        if (!reason) return;

        expense.status = 'cancelled';
        expense.cancelledReason = reason;
        expense.cancelledAt = new Date().toISOString();
        expense.cancelledBy = state.currentRole;

        await safeSet(STORE_KEY_EXPENSES, state.expenses);
        await logAudit('CANCEL_EXPENSE', 'expense', expense.id, expense.description, 'recorded', 'cancelled', reason);
        closeModal();
        render();
      });
    }

    function renderCancelDirectIncomeModal(container, item) {
      container.innerHTML = `
        <div class="cp-modal-overlay">
          <div class="cp-modal">
            <div class="cp-modal-header"><div class="cp-modal-title" style="color:var(--danger);">&#x26A0; Void Direct Income</div><button class="cp-modal-close" id="mClose">&times;</button></div>
            <div class="cp-modal-body">
              <div style="font-size:13px; margin-bottom:12px;">Void direct income of <strong>${fmtMoney(item.amount)}</strong> (${escapeHtml(item.category)})?</div>
              <div class="cp-field"><label>Reason *</label><textarea id="mDirVoidReason" rows="2" placeholder="Audit reason..."></textarea></div>
            </div>
            <div class="cp-modal-footer">
              <button class="cp-btn secondary" id="mDirVoidCancel">Cancel</button>
              <button class="cp-btn danger" id="mConfirmDirVoid">Confirm Void</button>
            </div>
          </div>
        </div>
      `;

      document.getElementById('mClose').addEventListener('click', closeModal);
      document.getElementById('mDirVoidCancel').addEventListener('click', closeModal);
      document.getElementById('mConfirmDirVoid').addEventListener('click', async () => {
        const reason = document.getElementById('mDirVoidReason').value.trim();
        if (!reason) return;

        item.status = 'cancelled';
        item.cancelledReason = reason;
        item.cancelledAt = new Date().toISOString();
        item.cancelledBy = state.currentRole;

        await safeSet(STORE_KEY_DIRECT_INCOME, state.directIncome);
        await logAudit('CANCEL_DIRECT_INCOME', 'direct_income', item.id, item.category, 'active', 'cancelled', reason);
        closeModal();
        render();
      });
    }

    function escapeHtml(str) {
      if (!str) return '';
      return String(str).replace(/[&<>"']/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[m]));
    }

    // Initialize application
    loadAll();
  })();
  </script>
</body>
</html>
