      });

      document.getElementById('btnIgnoreDuplicate').addEventListener('click', () => {
        dupBox.style.display = 'none';
      });

      document.getElementById('mCancelEnq').addEventListener('click', closeModal);

        const name = nameInput.value.trim();
        const phone = phoneInput.value.trim();
        const progId = document.getElementById('enqProg').value;
        const prog = state.programmes.find(p => p.id === progId);
        const errEl = document.getElementById('enqFormErr');

        if (!name || !prog) { errEl.textContent = 'Please provide prospect name and programme.'; errEl.style.display = 'block'; return; }

        state.counters.enquiry = (state.counters.enquiry || 1000) + 1;
        const newEnq = {
          id: 'enq_' + Date.now(),
          tenant_id: DEFAULT_TENANT_ID,
          name,
          phone,
          email: document.getElementById('enqEmail').value.trim(),

          programmeName: prog.name,
          trainingMode: document.getElementById('enqMode').value,
          source: document.getElementById('enqSource').value,
          enquiryDate: document.getElementById('enqDate').value,
          assignedStaff: state.auth.user ? state.auth.user.name : 'Admissions Staff',
          notes: document.getElementById('enqNotes').value.trim(),
          status: 'NEW',
          createdAt: new Date().toISOString(),
          updatedAt: new Date().toISOString()
        };

        state.enquiries.push(newEnq);
        await safeSet(STORE_KEY_ENQUIRIES, state.enquiries);
        await safeSet(STORE_KEY_COUNTERS, state.counters);
        await logAudit('CREATE_ENQUIRY', 'enquiry', newEnq.id, `Enquiry for ${newEnq.name} (${newEnq.programmeName})`, null, newEnq);

        closeModal();
        openModal('enquiryDetail', { enquiry: newEnq });
        render();
      });
    }

      container.innerHTML = `

                <strong>Student:</strong> ${escapeHtml(inv.clientName)} &middot; <strong>Programme:</strong> ${escapeHtml(inv.programmeName)}<br/>
                <strong>Total Invoiced:</strong> ${fmtMoney(total)} &middot; <strong>Paid to Date:</strong> ${fmtMoney(paid)}<br/>

              <div class="cp-row2">
                <div class="cp-field"><label>Payment Date *</label><input id="payDate" type="date" value="${todayStr}" /></div>
                <div class="cp-field"><label>Payment Method *</label><select id="payMethod"><option value="Bank Transfer">Bank Transfer</option><option value="POS">POS</option><option value="Card">Card</option><option value="Online Gateway">Online Gateway</option></select></div>
              </div>
              <div class="cp-field"><label>Bank Deposit / Transaction Reference *</label><input id="payRef" placeholder="e.g. GTB/NIBSS/20260825/99812" /></div>
              <div id="payFormErr" class="cp-error" style="display:none;"></div>
            </div>
            <div class="cp-modal-footer">
              <button class="cp-btn secondary" id="mCancelPay">Cancel</button>
              <button class="cp-btn accent" id="btnSavePayment">&#x2714; Confirm &amp; Issue Receipt</button>
            </div>
          </div>
        </div>
      `;

      document.getElementById('mClose').addEventListener('click', closeModal);
      document.getElementById('mCancelPay').addEventListener('click', closeModal);

      document.getElementById('btnSavePayment').addEventListener('click', async () => {
        const amt = Number(document.getElementById('payAmount').value || 0);
        const pDate = document.getElementById('payDate').value;
        const pRef = document.getElementById('payRef').value.trim();
        const errEl = document.getElementById('payFormErr');

        if (amt <= 0) { errEl.textContent = 'Please enter a valid payment amount.'; errEl.style.display = 'block'; return; }
        if (!pRef) { errEl.textContent = 'Transaction reference is required.'; errEl.style.display = 'block'; return; }
        if (isPeriodLocked(pDate)) { errEl.textContent = 'Financial period is locked.'; errEl.style.display = 'block'; return; }

        state.counters.receipt += 1;
        const newPayment = {
          id: 'pay_' + Date.now(),
          tenant_id: DEFAULT_TENANT_ID,
          invoiceId: inv.id,
          receiptNo: state.counters.receipt,
          amount: amt,
          date: pDate,
          paymentMethod: document.getElementById('payMethod').value,
          reference: pRef,
          reconciliationStatus: 'unreconciled',
          createdAt: new Date().toISOString(),
          createdBy: state.auth.user ? state.auth.user.name : 'Staff'
        };

        state.payments.push(newPayment);
        await safeSet(STORE_KEY_PAYMENTS, state.payments);
        await safeSet(STORE_KEY_COUNTERS, state.counters);
        await logAudit('RECORD_PAYMENT', 'payment', newPayment.id, `RCP #${newPayment.receiptNo} on INV #${inv.invoiceNo}`, null, newPayment);

        closeModal();
        openModal('viewReceipt', { payment: newPayment, invoice: inv });
        render();
      });
    }

          id: 'exp_' + Date.now(),
          tenant_id: DEFAULT_TENANT_ID,
          categoryGroup: document.getElementById('expGroup').value,
          category: document.getElementById('expCat').value,
          department: document.getElementById('expDept').value,
          method: document.getElementById('expMethod').value,
          vendor: document.getElementById('expVendor').value.trim(),
          description: desc,
          amount: amt,
          date: dateStr,
          status: initialStatus,
          requiredApprovalRole: reqRole,
          createdAt: new Date().toISOString(),
          createdBy: state.auth.user ? state.auth.user.name : 'Staff'
        };

        state.expenses.push(exp);
        await safeSet(STORE_KEY_EXPENSES, state.expenses);
        await logAudit('RECORD_EXPENSE', 'expense', exp.id, exp.description, null, exp);

        closeModal();
        render();
      });
    }

    function renderRecordDirectIncomeModal(container) {

          <div class="cp-modal">
            <div class="cp-modal-header">
              <div class="cp-modal-title">&#x1F4B0; Record Direct Income</div>
              <button class="cp-modal-close" id="mClose">&times;</button>
            </div>
            <div class="cp-modal-body">
              <div class="cp-row2">
                <div class="cp-field"><label>Income Category *</label><select id="dirCat">${state.incomeCategories.map(c => `<option value="${escapeHtml(c)}">${escapeHtml(c)}</option>`).join('')}</select></div>

              </div>
              <div class="cp-row2">
                <div class="cp-field"><label>Date *</label><input id="dirDate" type="date" value="${todayStr}" /></div>

              <div class="cp-field"><label>Client / Payer Source *</label><input id="dirSource" placeholder="e.g. Corporate Client / Consulting Client" /></div>
              <div class="cp-field"><label>Transaction Reference *</label><input id="dirRef" placeholder="e.g. BANK-TRF-098234" /></div>

              <button class="cp-btn accent" id="btnSaveDir">&#x2714; Save Income</button>
            </div>
          </div>
        </div>
      `;

      document.getElementById('mClose').addEventListener('click', closeModal);
      document.getElementById('mCancelDir').addEventListener('click', closeModal);

      document.getElementById('btnSaveDir').addEventListener('click', async () => {
        const amt = Number(document.getElementById('dirAmount').value || 0);
        const source = document.getElementById('dirSource').value.trim();
        const dateStr = document.getElementById('dirDate').value;
        const errEl = document.getElementById('dirFormErr');

        if (amt <= 0 || !source) { errEl.textContent = 'Please fill all required fields.'; errEl.style.display = 'block'; return; }
        if (isPeriodLocked(dateStr)) { errEl.textContent = 'Financial period is locked.'; errEl.style.display = 'block'; return; }

        const inc = {
          id: 'inc_' + Date.now(),
          tenant_id: DEFAULT_TENANT_ID,
          category: document.getElementById('dirCat').value,
          clientSource: source,
          amount: amt,
          date: dateStr,
          method: document.getElementById('dirMethod').value,
          reference: document.getElementById('dirRef').value.trim(),
          status: 'active',
          createdAt: new Date().toISOString(),
          createdBy: state.auth.user ? state.auth.user.name : 'Staff'
        };

        state.directIncome.push(inc);
        await safeSet(STORE_KEY_DIRECT_INCOME, state.directIncome);
        await logAudit('RECORD_DIRECT_INCOME', 'direct_income', inc.id, `${inc.category} from ${inc.clientSource}`, null, inc);

        closeModal();
        render();
      });
    }

      document.getElementById('btnAddCollNoteBtn').addEventListener('click', async () => {

          });

    function renderSetBudgetModal(container) {
      const curPeriod = state.filters.budgetPeriod || new Date().toISOString().slice(0, 7);
      const allCats = Object.values(state.expenseCategories).flat();

      container.innerHTML = `
        <div class="cp-modal-overlay">
          <div class="cp-modal">
            <div class="cp-modal-header">
              <div class="cp-modal-title">&#x2696;&#xFE0F; Set Budget Allocation</div>
              <button class="cp-modal-close" id="mClose">&times;</button>
            </div>
            <div class="cp-modal-body">
              <div class="cp-field"><label>Expense Category *</label><select id="bdgCat">${allCats.map(c => `<option value="${escapeHtml(c)}">${escapeHtml(c)}</option>`).join('')}</select></div>
              <div class="cp-row2">
                <div class="cp-field"><label>Department *</label><select id="bdgDept">${DEPARTMENTS.map(d => `<option value="${escapeHtml(d)}">${escapeHtml(d)}</option>`).join('')}</select></div>
                <div class="cp-field"><label>Monthly Cap (₦) *</label><input id="bdgAmt" type="number" placeholder="250000" min="1" /></div>
              </div>
            </div>
            <div class="cp-modal-footer">
              <button class="cp-btn secondary" id="mCancelBdg">Cancel</button>
              <button class="cp-btn accent" id="btnSaveBdg">&#x2714; Save Budget</button>
            </div>
          </div>
        </div>
      `;

      document.getElementById('mClose').addEventListener('click', closeModal);
      document.getElementById('mCancelBdg').addEventListener('click', closeModal);

      document.getElementById('btnSaveBdg').addEventListener('click', async () => {
        const cat = document.getElementById('bdgCat').value;
        const dept = document.getElementById('bdgDept').value;
        const amt = Number(document.getElementById('bdgAmt').value || 0);

        if (amt > 0) {
          const idx = state.budgets.findIndex(b => b.category === cat && b.department === dept);
          if (idx >= 0) state.budgets[idx].amount = amt;
          else state.budgets.push({ id: 'bdg_' + Date.now(), category: cat, department: dept, amount: amt, period: curPeriod });
          await safeSet(STORE_KEY_BUDGETS, state.budgets);
          await logAudit('SET_BUDGET', 'budget', cat, `${cat} cap ${amt}`);
          closeModal();
          render();
        }
      });
    }
