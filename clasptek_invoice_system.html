<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Clasptek Finance — Financial Intelligence, Reconciliation &amp; Audit Assurance</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary: #14213D;
      --primary-hover: #1f325c;
      --accent: #C1272D;
      --accent-hover: #a51f25;
      --success: #107C41;
      --success-bg: #EAF7EE;
      --warning: #B25E02;
      --warning-bg: #FFF4E5;
      --danger: #D13438;
      --danger-bg: #FDE7E9;
      --info: #0078D4;
      --info-bg: #EFF6FC;
      --neutral-bg: #F8F9FA;
      --surface-0: #FFFFFF;
      --surface-1: #FFFFFF;
      --surface-2: #F4F5F7;
      --border: #E2E8F0;
      --border-strong: #CBD5E1;
      --text-primary: #0F172A;
      --text-secondary: #475569;
      --text-muted: #94A3B8;
      --radius-sm: 6px;
      --radius-md: 10px;
      --radius-lg: 14px;
      --shadow-sm: 0 1px 3px rgba(0,0,0,0.06), 0 1px 2px rgba(0,0,0,0.04);
      --shadow-md: 0 4px 6px -1px rgba(0,0,0,0.08), 0 2px 4px -1px rgba(0,0,0,0.04);
      --shadow-lg: 0 10px 15px -3px rgba(0,0,0,0.1), 0 4px 6px -2px rgba(0,0,0,0.05);
      --font-sans: 'Inter', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: var(--neutral-bg); color: var(--text-primary); font-family: var(--font-sans); line-height: 1.5; -webkit-font-smoothing: antialiased; }

    #root { font-family: var(--font-sans); color: var(--text-primary); }
    .cp-wrap { max-width: 1260px; margin: 0 auto; padding: 1.5rem 1rem; }

    /* Header */
    .cp-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 18px; flex-wrap: wrap; gap: 14px; border-bottom: 1px solid var(--border); padding-bottom: 14px; }
    .cp-brand { display: flex; align-items: center; gap: 12px; }
    .cp-mark { width: 42px; height: 42px; border-radius: var(--radius-md); background: linear-gradient(135deg, #14213D 0%, #243B6A 100%); display: flex; align-items: center; justify-content: center; color: #fff; font-weight: 800; font-size: 16.5px; letter-spacing: 0.5px; box-shadow: var(--shadow-sm); flex-shrink: 0; }
    .cp-title { font-size: 19px; font-weight: 700; color: var(--primary); letter-spacing: -0.3px; display: flex; align-items: center; gap: 8px; }
    .cp-sub { font-size: 12.5px; color: var(--text-secondary); margin-top: 1px; }
    .cp-header-actions { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }

    /* Role Selector */
    .cp-role-tag { display: flex; align-items: center; gap: 6px; background: var(--surface-2); border: 1px solid var(--border); padding: 4px 10px; border-radius: 20px; font-size: 12px; font-weight: 600; color: var(--text-secondary); }
    .cp-role-select { background: transparent; border: none; font-size: 12px; font-weight: 600; color: var(--primary); outline: none; cursor: pointer; }

    /* Navigation Tabs */
    .cp-tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--border); margin-bottom: 20px; overflow-x: auto; scrollbar-width: none; }
    .cp-tabs::-webkit-scrollbar { display: none; }
    .cp-tab { padding: 9px 12px; font-size: 12.5px; font-weight: 500; cursor: pointer; border-bottom: 2.5px solid transparent; color: var(--text-secondary); user-select: none; transition: all 0.15s ease; white-space: nowrap; display: flex; align-items: center; gap: 6px; }
    .cp-tab:hover:not(.active) { color: var(--primary); background: rgba(20, 33, 61, 0.03); border-radius: var(--radius-sm) var(--radius-sm) 0 0; }
    .cp-tab.active { color: var(--primary); border-bottom-color: var(--accent); font-weight: 600; }
    .cp-tab.highlight { background: rgba(193, 39, 45, 0.04); }

    /* Cards & Containers */
    .cp-card { background: var(--surface-1); border: 1px solid var(--border); border-radius: var(--radius-lg); padding: 20px; margin-bottom: 18px; box-shadow: var(--shadow-sm); }
    .cp-card-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; flex-wrap: wrap; gap: 10px; }
    .cp-section-title { font-size: 15px; font-weight: 600; color: var(--primary); display: flex; align-items: center; gap: 8px; }
    .cp-section-desc { font-size: 12px; color: var(--text-secondary); margin-top: 2px; }

    /* Alert Cards */
    .cp-alert-card { border-radius: var(--radius-md); padding: 14px 16px; margin-bottom: 14px; border-left: 4px solid var(--primary); background: #fff; border: 1px solid var(--border); border-left-width: 4px; box-shadow: var(--shadow-sm); }
    .cp-alert-card.danger { border-left-color: var(--danger); }
    .cp-alert-card.warning { border-left-color: var(--warning); }
    .cp-alert-card.info { border-left-color: var(--info); }
    .cp-alert-card-title { font-size: 13.5px; font-weight: 700; color: var(--primary); display: flex; align-items: center; justify-content: space-between; margin-bottom: 4px; }
    .cp-alert-card-detail { font-size: 12.5px; color: var(--text-secondary); margin-bottom: 4px; }
    .cp-alert-card-action { font-size: 12px; font-weight: 600; color: var(--primary); background: var(--surface-2); padding: 4px 8px; border-radius: var(--radius-sm); display: inline-block; margin-top: 4px; }

    /* Grids & Stats */
    .cp-grid-5 { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 12px; margin-bottom: 18px; }
    .cp-grid-4 { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 12px; margin-bottom: 18px; }
    .cp-grid-3 { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 12px; margin-bottom: 18px; }
    .cp-grid-2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 14px; margin-bottom: 18px; }

    .cp-stat { background: var(--surface-1); border: 1px solid var(--border); border-radius: var(--radius-lg); padding: 16px; position: relative; box-shadow: var(--shadow-sm); }
    .cp-stat-top { display: flex; align-items: center; justify-content: space-between; margin-bottom: 6px; }
    .cp-stat-label { font-size: 11.5px; font-weight: 600; color: var(--text-secondary); text-transform: uppercase; letter-spacing: 0.4px; }
    .cp-stat-value { font-size: 20px; font-weight: 700; color: var(--primary); letter-spacing: -0.4px; line-height: 1.2; }
    .cp-stat-sub { font-size: 11px; color: var(--text-muted); margin-top: 5px; display: flex; align-items: center; gap: 4px; }
    .cp-stat-pill { font-size: 10.5px; font-weight: 600; padding: 2px 7px; border-radius: 12px; }

    .cp-stat.accent-border { border-left: 4px solid var(--primary); }
    .cp-stat.income-border { border-left: 4px solid var(--success); }
    .cp-stat.expense-border { border-left: 4px solid var(--danger); }
    .cp-stat.receivable-border { border-left: 4px solid var(--warning); }
    .cp-stat.info-border { border-left: 4px solid var(--info); }

    /* Forms & Fields */
    .cp-field { display: flex; flex-direction: column; gap: 5px; margin-bottom: 14px; }
    .cp-field label { font-size: 11.5px; font-weight: 600; color: var(--text-secondary); text-transform: uppercase; letter-spacing: 0.3px; }
    .cp-field input, .cp-field select, .cp-field textarea {
      padding: 8.5px 12px; border: 1px solid var(--border); border-radius: var(--radius-sm); font-size: 13px;
      background: var(--surface-2); color: var(--text-primary); font-family: var(--font-sans); transition: all 0.15s ease;
    }
    .cp-field input:focus, .cp-field select:focus, .cp-field textarea:focus { outline: none; border-color: var(--primary); background: #fff; box-shadow: 0 0 0 3px rgba(20, 33, 61, 0.08); }
    .cp-row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .cp-row3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 12px; }

    /* Buttons */
    .cp-btn { background: var(--primary); color: #fff; border: 1px solid transparent; border-radius: var(--radius-sm); padding: 8px 14px; font-size: 12.5px; font-weight: 600; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; gap: 6px; transition: all 0.15s ease; text-decoration: none; font-family: var(--font-sans); }
    .cp-btn:hover { background: var(--primary-hover); }
    .cp-btn.secondary { background: var(--surface-0); color: var(--primary); border: 1px solid var(--border-strong); }
    .cp-btn.secondary:hover { background: var(--surface-2); border-color: var(--primary); }
    .cp-btn.accent { background: var(--accent); color: #fff; }
    .cp-btn.accent:hover { background: var(--accent-hover); }
    .cp-btn.danger { background: var(--surface-0); color: var(--danger); border: 1px solid var(--danger); padding: 5px 9px; font-size: 11.5px; }
    .cp-btn.danger:hover { background: var(--danger-bg); }
    .cp-btn.sm { padding: 5.5px 11px; font-size: 12px; }

    /* Toolbars & Search */
    .cp-toolbar { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 14px; flex-wrap: wrap; background: var(--surface-1); padding: 10px 14px; border-radius: var(--radius-md); border: 1px solid var(--border); }
    .cp-toolbar-group { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; flex: 1; }
    .cp-search { min-width: 180px; flex: 1; max-width: 300px; position: relative; }
    .cp-search input { width: 100%; padding: 7px 10px 7px 28px; border: 1px solid var(--border); border-radius: var(--radius-sm); font-size: 12.5px; background: var(--surface-2); font-family: var(--font-sans); }
    .cp-search input:focus { outline: none; border-color: var(--primary); background: #fff; }
    .cp-search-icon { position: absolute; left: 8px; top: 50%; transform: translateY(-50%); font-size: 11px; color: var(--text-muted); pointer-events: none; }
    .cp-select-filter { padding: 7px 9px; border: 1px solid var(--border); border-radius: var(--radius-sm); font-size: 12px; background: var(--surface-2); color: var(--text-primary); font-family: var(--font-sans); }

    /* Tables */
    .cp-table-wrap { overflow-x: auto; border: 1px solid var(--border); border-radius: var(--radius-md); background: #fff; }
    .cp-table { width: 100%; border-collapse: collapse; font-size: 12.5px; text-align: left; }
    .cp-table th { background: #FAFBFD; padding: 9px 11px; color: var(--text-secondary); font-weight: 600; font-size: 11.5px; text-transform: uppercase; letter-spacing: 0.3px; border-bottom: 1px solid var(--border); white-space: nowrap; }
    .cp-table td { padding: 10px 11px; border-bottom: 1px solid var(--border); vertical-align: middle; color: var(--text-primary); }
    .cp-table tr:last-child td { border-bottom: none; }
    .cp-table tr:hover td { background: rgba(244, 245, 247, 0.5); }
    .cp-table .cancelled-row { opacity: 0.6; background: #FFF8F8; }
    .cp-table .cancelled-row td { text-decoration: line-through; }
    .cp-table .cancelled-row td.no-strike { text-decoration: none; }

    /* Status Pills */
    .cp-pill { display: inline-flex; align-items: center; gap: 4px; padding: 2.5px 7px; border-radius: 20px; font-size: 11px; font-weight: 600; white-space: nowrap; }
    .cp-pill.paid, .cp-pill.reconciled, .cp-pill.approved { background: var(--success-bg); color: var(--success); }
    .cp-pill.partial, .cp-pill.unreconciled, .cp-pill.pending { background: var(--warning-bg); color: var(--warning); }
    .cp-pill.unpaid, .cp-pill.flagged, .cp-pill.rejected, .cp-pill.locked, .cp-pill.exception { background: var(--danger-bg); color: var(--danger); }
    .cp-pill.recorded, .cp-pill.open, .cp-pill.matched { background: var(--info-bg); color: var(--info); }
    .cp-pill.cancelled, .cp-pill.closed { background: #F2F4F7; color: #667085; text-decoration: none !important; }
    .cp-pill.category-pill { background: #F1F5F9; color: #334155; font-weight: 500; font-size: 10.5px; }

    /* Priorities */
    .cp-pill.prio-critical { background: #FCE8E6; color: #912018; font-weight: 700; border: 1px solid #FECDCA; }
    .cp-pill.prio-high { background: #FEE4E2; color: #D92D20; font-weight: 600; }
    .cp-pill.prio-medium { background: #FEF0C7; color: #B54708; font-weight: 600; }
    .cp-pill.prio-low { background: var(--success-bg); color: var(--success); }

    /* Modals & Dialogs */
    .cp-modal-overlay { position: fixed; inset: 0; background: rgba(15, 23, 42, 0.6); backdrop-filter: blur(3px); z-index: 999; display: flex; align-items: center; justify-content: center; padding: 16px; }
    .cp-modal { background: #fff; border-radius: var(--radius-lg); width: 100%; max-width: 580px; max-height: 90vh; overflow-y: auto; box-shadow: var(--shadow-lg); border: 1px solid var(--border); }
    .cp-modal.large { max-width: 820px; }
    .cp-modal-header { padding: 14px 18px; border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; background: #FAFBFD; border-radius: var(--radius-lg) var(--radius-lg) 0 0; }
    .cp-modal-title { font-size: 14.5px; font-weight: 700; color: var(--primary); }
    .cp-modal-close { background: transparent; border: none; font-size: 18px; cursor: pointer; color: var(--text-muted); padding: 4px; line-height: 1; }
    .cp-modal-body { padding: 18px; }
    .cp-modal-footer { padding: 12px 18px; border-top: 1px solid var(--border); display: flex; justify-content: flex-end; gap: 8px; background: #FAFBFD; border-radius: 0 0 var(--radius-lg) var(--radius-lg); }

    /* Statement & Receipt Paper */
    .cp-statement-paper { background: #fff; border: 1px solid var(--border-strong); border-radius: var(--radius-md); padding: 22px; color: var(--text-primary); }
    .cp-statement-header { display: flex; justify-content: space-between; align-items: flex-start; border-bottom: 2px solid var(--primary); padding-bottom: 12px; margin-bottom: 16px; }
    .cp-receipt-row { display: flex; justify-content: space-between; padding: 5px 0; border-bottom: 1px dotted var(--border); }
    .cp-receipt-total-box { background: var(--surface-2); border-radius: var(--radius-sm); padding: 10px 12px; margin-top: 12px; border: 1px solid var(--border); }

    /* Progress Bars */
    .cp-progress-bar-bg { width: 100%; height: 7px; background: var(--surface-2); border-radius: 4px; overflow: hidden; margin-top: 5px; }
    .cp-progress-bar-fill { height: 100%; border-radius: 4px; transition: width 0.3s ease; }
    .cp-progress-bar-fill.normal { background: var(--success); }
    .cp-progress-bar-fill.watch { background: var(--warning); }
    .cp-progress-bar-fill.over { background: var(--danger); }

    /* Empty states & Errors */
    .cp-empty { text-align: center; padding: 36px 18px; color: var(--text-secondary); font-size: 13px; }
    .cp-empty-title { font-size: 14.5px; font-weight: 600; color: var(--text-primary); margin-bottom: 3px; }
    .cp-error { color: var(--danger); font-size: 12px; font-weight: 500; margin-top: -4px; margin-bottom: 10px; background: var(--danger-bg); padding: 7px 10px; border-radius: var(--radius-sm); border: 1px solid rgba(209, 52, 56, 0.2); }
    .cp-subnav { display: flex; gap: 6px; margin-bottom: 14px; border-bottom: 1px solid var(--border); padding-bottom: 6px; overflow-x: auto; }
    .cp-subnav-btn { background: transparent; border: none; padding: 5px 11px; font-size: 12.5px; font-weight: 600; color: var(--text-secondary); cursor: pointer; border-radius: var(--radius-sm); font-family: var(--font-sans); white-space: nowrap; }
    .cp-subnav-btn.active { background: var(--primary); color: #fff; }

    @media print {
      body * { visibility: hidden; }
      .cp-printable-area, .cp-printable-area * { visibility: visible; }
      .cp-printable-area { position: absolute; left: 0; top: 0; width: 100%; border: none; box-shadow: none; }
      .no-print { display: none !important; }
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <script>
  (function() {
    // ----------------------------------------------------
    // STORAGE KEYS & CONFIGURATION (PHASES 1, 2, 3, 4)
    // ----------------------------------------------------
    const STORE_KEY_PROGRAMMES = 'clasptek:programmes';
    const STORE_KEY_INVOICES = 'clasptek:invoices';
    const STORE_KEY_PAYMENTS = 'clasptek:payments';
    const STORE_KEY_COUNTERS = 'clasptek:counters';
    const STORE_KEY_EXPENSES = 'clasptek:expenses';
    const STORE_KEY_DIRECT_INCOME = 'clasptek:direct_income';
    const STORE_KEY_INCOME_CATEGORIES = 'clasptek:income_categories';
    const STORE_KEY_EXPENSE_CATEGORIES = 'clasptek:expense_categories';
    const STORE_KEY_BUDGETS = 'clasptek:budgets';
    const STORE_KEY_AUDIT_LOG = 'clasptek:finance_audit_log';
    const STORE_KEY_USER_ROLE = 'clasptek:finance_user_role';
    const STORE_KEY_COLLECTION_NOTES = 'clasptek:collection_notes';
    const STORE_KEY_PAYMENT_REMINDERS = 'clasptek:payment_reminders';
    const STORE_KEY_RECURRING_EXPENSES = 'clasptek:recurring_expenses';
    const STORE_KEY_RECURRING_INVOICES = 'clasptek:recurring_invoices';
    const STORE_KEY_FINANCE_PERIODS = 'clasptek:finance_periods';
    const STORE_KEY_APPROVAL_SETTINGS = 'clasptek:finance_approval_settings';
    const STORE_KEY_RECONCILIATIONS = 'clasptek:reconciliations';
    const STORE_KEY_ANOMALIES_REVIEWED = 'clasptek:anomalies_reviewed';

    const SHARED = true;
    const DEFAULT_TENANT_ID = 'clasptek_main';

    const DEFAULT_INCOME_CATEGORIES = [
      'Student Tuition', 'IELTS', 'TOEFL', 'SAT', 'Tech Training', 'Corporate Training',
      'Consulting', 'Registration Fee', 'Application/Processing Fee', 'Other Income'
    ];

    const DEFAULT_EXPENSE_CATEGORIES = {
      'Staff & People': ['Salaries', 'Facilitator Fees', 'Staff Welfare', 'Training & Development', 'Recruitment'],
      'Marketing': ['Advertising', 'Social Media', 'Design & Content', 'Printing', 'Promotional Materials'],
      'Technology': ['Software Subscriptions', 'Hosting', 'Domains', 'Internet', 'Hardware', 'IT Services'],
      'Operations': ['Rent', 'Utilities', 'Transport', 'Repairs & Maintenance', 'Facility & Welfare', 'Office Supplies'],
      'Academic': ['Learning Materials', 'Examination Resources', 'Teaching Resources', 'Academic Services'],
      'Administration': ['Bank Charges', 'Professional Services', 'Legal', 'Accounting', 'Office Administration'],
      'Other': ['Miscellaneous']
    };

    const PAYMENT_METHODS = ['Bank Transfer', 'POS', 'Card', 'Online Payment', 'Payment Gateway', 'Other'];
    const DEPARTMENTS = ['Operations', 'Academics', 'Marketing', 'Administration', 'Technology', 'Management', 'Finance'];

    // ----------------------------------------------------
    // SAFE FINANCIAL ARITHMETIC UTILITIES
    // ----------------------------------------------------
    function safeRound(n) {
      return Math.round((Number(n) || 0) * 100) / 100;
    }

    function fmtMoney(n) {
      const v = safeRound(n);
      const absFormatted = Math.abs(v).toLocaleString('en-NG', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
      return (v < 0 ? '-\u20a6' : '\u20a6') + absFormatted;
    }

    function fmtDate(d) {
      if (!d) return '\u2014';
      try {
        const parts = String(d).split('-');
        if (parts.length === 3) {
          const dt = new Date(Number(parts[0]), Number(parts[1]) - 1, Number(parts[2]));
          return dt.toLocaleDateString('en-GB', { day: 'numeric', month: 'short', year: 'numeric' });
        }
        return d;
      } catch (e) {
        return d;
      }
    }

    // ----------------------------------------------------
    // APPLICATION STATE
    // ----------------------------------------------------
    let state = {
      tab: 'dashboard',
      currentRole: 'Super Admin',
      incomeSubTab: 'invoiced',
      invoiceSubTab: 'list',
      expensesSubTab: 'ledger',
      paymentsSubTab: 'ledger', // ledger, reconciliation, matching, analytics
      reportsSubTab: 'pnl', // pnl, cashflow, contribution, budgets, auditor, audit
      budgetsSubTab: 'budgets', // budgets, periods, approvalMatrix, integrity
      programmes: [],
      invoices: [],
      payments: [],
      expenses: [],
      directIncome: [],
      budgets: [],
      auditLog: [],
      collectionNotes: [],
      paymentReminders: [],
      recurringExpenses: [],
      recurringInvoices: [],
      financePeriods: [],
      reconciliations: [],
      anomaliesReviewed: [],
      approvalSettings: {
        tier1Limit: 100000,
        tier2Limit: 500000,
        tier2Role: 'Finance Manager',
        tier3Role: 'Super Admin'
      },
      incomeCategories: [],
      expenseCategories: {},
      counters: { invoice: 11092041, receipt: 20001 },
      loading: true,
      modal: null,
      filters: {
        datePreset: 'this_month',
        dateStart: '',
        dateEnd: '',
        incomeSearch: '',
        incomeCategory: 'all',
        incomeStatus: 'all',
        expenseSearch: '',
        expenseGroup: 'all',
        expenseDept: 'all',
        expenseMethod: 'all',
        expenseStatus: 'active',
        invoiceSearch: '',
        invoiceStatus: 'all',
        paymentSearch: '',
        paymentMethod: 'all',
        paymentReconStatus: 'all',
        receivableSearch: '',
        receivablePrio: 'all',
        accountSearch: '',
        accountFilter: 'all',
        ledgerSearch: '',
        ledgerType: 'all',
        ledgerMethod: 'all',
        budgetPeriod: new Date().toISOString().slice(0, 7)
      }
    };

    // ----------------------------------------------------
    // STORAGE & AUDIT LOG ENGINE
    // ----------------------------------------------------
    async function safeGet(key, fallback) {
      try {
        if (window.storage && typeof window.storage.get === 'function') {
          const res = await window.storage.get(key, SHARED);
          return res && res.value ? JSON.parse(res.value) : fallback;
        } else if (typeof localStorage !== 'undefined') {
          const item = localStorage.getItem(key);
          return item ? JSON.parse(item) : fallback;
        }
        return fallback;
      } catch (e) {
        console.warn('Storage read fallback for', key, e);
        return fallback;
      }
    }

    async function safeSet(key, value) {
      try {
        if (window.storage && typeof window.storage.set === 'function') {
          await window.storage.set(key, JSON.stringify(value), SHARED);
        } else if (typeof localStorage !== 'undefined') {
          localStorage.setItem(key, JSON.stringify(value));
        }
      } catch (e) {
        console.error('Storage set error for', key, e);
      }
    }

    async function logAudit(action, entityType, entityId, reference, previousValue, newValue, reason = '') {
      const entry = {
        id: 'audit_' + Date.now() + '_' + Math.floor(Math.random() * 1000),

    // ----------------------------------------------------
    // INVOICE & RECEIVABLES CALCULATION ENGINE
    // ----------------------------------------------------
    function invoiceBalance(inv) {
      const paid = safeRound(state.payments
        .filter(p => p.invoiceId === inv.id)
        .reduce((sum, p) => sum + Number(p.amount || 0), 0));
      const total = safeRound(Number(inv.total) || 0);
      const balance = Math.max(0, safeRound(total - paid));
      return { paid, balance, total };
    }

    function invoiceStatus(inv) {
      const { paid, total } = invoiceBalance(inv);
      if (paid <= 0) return 'unpaid';
      if (paid >= total && total > 0) return 'paid';
      return 'partial';
    }

    function getReceivableAgeing(inv) {
      const { balance } = invoiceBalance(inv);
      if (balance <= 0) return { days: 0, bucket: 'current', label: 'Paid in Full', priority: 'Low', prioClass: 'prio-low' };

      const todayStr = new Date().toISOString().slice(0, 10);
      const dueStr = inv.dueDate || inv.date || todayStr;
      const today = new Date(todayStr + 'T00:00:00');
      const due = new Date(dueStr + 'T00:00:00');
      const daysOverdue = Math.floor((today - due) / (1000 * 60 * 60 * 24));

      if (daysOverdue <= 0) return { days: daysOverdue, bucket: 'current', label: 'Current', priority: 'Low', prioClass: 'prio-low' };
      if (daysOverdue <= 30) return { days: daysOverdue, bucket: '1-30', label: `${daysOverdue}d (1–30d)`, priority: 'Medium', prioClass: 'prio-medium' };
      if (daysOverdue <= 60) return { days: daysOverdue, bucket: '31-60', label: `${daysOverdue}d (31–60d)`, priority: 'High', prioClass: 'prio-high' };
      if (daysOverdue <= 90) return { days: daysOverdue, bucket: '61-90', label: `${daysOverdue}d (61–90d)`, priority: 'Critical', prioClass: 'prio-critical' };
      return { days: daysOverdue, bucket: '90plus', label: `${daysOverdue}d (90+d)`, priority: 'Critical', prioClass: 'prio-critical' };
    }

    function getDateRangeBounds(preset, customStart, customEnd) {
      const now = new Date();
      const yyyy = now.getFullYear();
      const mm = now.getMonth();
      const dd = now.getDate();
      function toStr(d) { return d.toISOString().slice(0, 10); }

      switch (preset) {
        case 'today': return { start: toStr(now), end: toStr(now) };
        case 'yesterday': return { start: toStr(new Date(yyyy, mm, dd - 1)), end: toStr(new Date(yyyy, mm, dd - 1)) };
        case 'this_month': return { start: toStr(new Date(yyyy, mm, 1)), end: toStr(new Date(yyyy, mm + 1, 0)) };
        case 'last_month': return { start: toStr(new Date(yyyy, mm - 1, 1)), end: toStr(new Date(yyyy, mm, 0)) };
        case 'this_quarter': {
          const q = Math.floor(mm / 3);
          return { start: toStr(new Date(yyyy, q * 3, 1)), end: toStr(new Date(yyyy, q * 3 + 3, 0)) };
        }
        case 'this_year': return { start: toStr(new Date(yyyy, 0, 1)), end: toStr(new Date(yyyy, 11, 31)) };
        case 'custom': return { start: customStart || '1970-01-01', end: customEnd || '2099-12-31' };
        case 'all':
        default: return { start: '1970-01-01', end: '2099-12-31' };
      }
    }

    function isDateInRange(dStr, bounds) {
      if (!dStr) return false;
      const d = dStr.slice(0, 10);
      return d >= bounds.start && d <= bounds.end;
    }

    function getFinancialMetrics(dateBounds = null) {
      const bounds = dateBounds || { start: '1970-01-01', end: '2099-12-31' };

      const filteredInvoices = state.invoices.filter(i => isDateInRange(i.date, bounds));
      const totalInvoiced = safeRound(filteredInvoices.reduce((s, i) => s + Number(i.total || 0), 0));

      const filteredPayments = state.payments.filter(p => isDateInRange(p.date, bounds));
      const invoicePaymentsReceived = safeRound(filteredPayments.reduce((s, p) => s + Number(p.amount || 0), 0));

      const activeDirectIncomeList = state.directIncome.filter(d => d.status !== 'cancelled' && isDateInRange(d.date, bounds));
      const totalDirectIncome = safeRound(activeDirectIncomeList.reduce((s, d) => s + Number(d.amount || 0), 0));

      const totalIncomeReceived = safeRound(invoicePaymentsReceived + totalDirectIncome);

      const activeExpensesList = state.expenses.filter(e => e.status === 'recorded' && isDateInRange(e.date, bounds));
      const totalExpenses = safeRound(activeExpensesList.reduce((s, e) => s + Number(e.amount || 0), 0));

      const netFinancialPosition = safeRound(totalIncomeReceived - totalExpenses);
      const outstandingReceivables = safeRound(state.invoices.reduce((s, inv) => s + invoiceBalance(inv).balance, 0));

      const allTimeInvoiced = safeRound(state.invoices.reduce((s, i) => s + Number(i.total || 0), 0));
      const allTimePayments = safeRound(state.payments.reduce((s, p) => s + Number(p.amount || 0), 0));
      const collectionRate = allTimeInvoiced > 0 ? safeRound((allTimePayments / allTimeInvoiced) * 100) : 0;
      const netMargin = totalIncomeReceived > 0 ? safeRound((netFinancialPosition / totalIncomeReceived) * 100) : 0;

      // YTD metrics
      const currentYear = new Date().getFullYear().toString();
      const ytdPayments = state.payments.filter(p => (p.date || '').startsWith(currentYear)).reduce((s, p) => s + Number(p.amount || 0), 0);
      const ytdDirect = state.directIncome.filter(d => d.status !== 'cancelled' && (d.date || '').startsWith(currentYear)).reduce((s, d) => s + Number(d.amount || 0), 0);
      const ytdIncome = safeRound(ytdPayments + ytdDirect);
      const ytdExpenses = safeRound(state.expenses.filter(e => e.status === 'recorded' && (e.date || '').startsWith(currentYear)).reduce((s, e) => s + Number(e.amount || 0), 0));
      const ytdNet = safeRound(ytdIncome - ytdExpenses);

      // MTD metrics
      const curMonthKey = new Date().toISOString().slice(0, 7);
      const mtdPayments = state.payments.filter(p => (p.date || '').startsWith(curMonthKey)).reduce((s, p) => s + Number(p.amount || 0), 0);
      const mtdDirect = state.directIncome.filter(d => d.status !== 'cancelled' && (d.date || '').startsWith(curMonthKey)).reduce((s, d) => s + Number(d.amount || 0), 0);
      const mtdIncome = safeRound(mtdPayments + mtdDirect);
      const mtdExpenses = safeRound(state.expenses.filter(e => e.status === 'recorded' && (e.date || '').startsWith(curMonthKey)).reduce((s, e) => s + Number(e.amount || 0), 0));
      const mtdNet = safeRound(mtdIncome - mtdExpenses);

      return {
        totalInvoiced, invoicePaymentsReceived, totalDirectIncome, totalIncomeReceived,
        totalExpenses, netFinancialPosition, outstandingReceivables, collectionRate,
        netMargin, ytdIncome, ytdExpenses, ytdNet, mtdIncome, mtdExpenses, mtdNet, curMonthKey
      };
    }

    // ----------------------------------------------------
    // STUDENT ACCOUNTS CONSOLIDATION
    // ----------------------------------------------------
    function getStudentAccounts() {
      const map = {};
      state.invoices.forEach(inv => {
        const key = (inv.clientName || 'Student').toLowerCase().trim();
        if (!map[key]) {
          map[key] = {
            id: 'acc_' + encodeURIComponent(key),
            clientName: inv.clientName || 'Student',
            phone: inv.phone || '',
            email: inv.email || '',
            programmes: new Set(),
            invoices: [],
            payments: [],
            totalInvoiced: 0,
            totalPaid: 0,
            balance: 0
          };
        }
        const acc = map[key];
        if (inv.phone && !acc.phone) acc.phone = inv.phone;
        if (inv.email && !acc.email) acc.email = inv.email;
        if (inv.programmeName) acc.programmes.add(inv.programmeName);
        acc.invoices.push(inv);
        acc.totalInvoiced = safeRound(acc.totalInvoiced + Number(inv.total || 0));

        const invPays = state.payments.filter(p => p.invoiceId === inv.id);
        invPays.forEach(p => {
          acc.payments.push(p);
          acc.totalPaid = safeRound(acc.totalPaid + Number(p.amount || 0));
        });
      });

      return Object.values(map).map(acc => {
        acc.balance = Math.max(0, safeRound(acc.totalInvoiced - acc.totalPaid));
        acc.programmesList = Array.from(acc.programmes).join(', ') || 'N/A';
        return acc;
      });
    }

    // ----------------------------------------------------
    // UNIFIED FINANCIAL TRANSACTION LEDGER
    // ----------------------------------------------------
    function getUnifiedLedger() {
      const items = [];
      state.payments.forEach(p => {
        const inv = state.invoices.find(i => i.id === p.invoiceId) || {};
        items.push({
          id: p.id, date: p.date, type: 'invoice_payment', typeLabel: 'Invoice Payment',
          description: `Tuition Payment: ${inv.clientName || 'Student'} (${inv.programmeName || 'General'})`,
          reference: p.reference ? `${p.reference} (RCP #${p.receiptNo})` : `RCP #${p.receiptNo}`,
          income: Number(p.amount || 0), expense: 0, movement: Number(p.amount || 0),
          method: p.paymentMethod || 'Bank Transfer', status: 'recorded'
        });
      });
      state.directIncome.forEach(d => {
        const isCancelled = d.status === 'cancelled';
        items.push({
          id: d.id, date: d.date, type: 'direct_income', typeLabel: 'Direct Income',
          description: d.description || `${d.category} from ${d.clientSource || 'Client'}`,
          reference: d.reference || `DI-${d.id.slice(-4)}`,
          income: isCancelled ? 0 : Number(d.amount || 0), expense: 0, movement: isCancelled ? 0 : Number(d.amount || 0),
          method: d.method || 'Bank Transfer', status: isCancelled ? 'cancelled' : 'active'
        });
      });
      state.expenses.forEach(e => {
        const isExcluded = e.status === 'cancelled' || e.status === 'pending_approval' || e.status === 'rejected';
        items.push({
          id: e.id, date: e.date, type: 'expense', typeLabel: 'Expense',
          description: e.description || e.category,
          reference: e.reference || `EXP-${e.id.slice(-4)}`,
          income: 0, expense: isExcluded ? 0 : Number(e.amount || 0), movement: isExcluded ? 0 : -Number(e.amount || 0),
          method: e.method || 'Bank Transfer', status: e.status
        });
      });
      items.sort((a, b) => (b.date > a.date ? 1 : b.date < a.date ? -1 : 0));
      return items;
    }

    // ----------------------------------------------------
    // MULTI-HORIZON CASH FLOW FORECASTING (30/60/90 DAYS)
    // ----------------------------------------------------
    function getMultiHorizonCashForecast() {
      const now = new Date();
      const baseMetrics = getFinancialMetrics();
      const currentCash = baseMetrics.netFinancialPosition;

      // 30-day forecast
      const due30Receivables = state.invoices
        .filter(i => {
          const { balance } = invoiceBalance(i);
          return balance > 0;
        })
        .reduce((s, i) => s + invoiceBalance(i).balance, 0);

      const recurringMonthlyOutflows = state.recurringExpenses
        .filter(r => r.active)
        .reduce((s, r) => s + Number(r.amount || 0), 0);

      const exp30Inflow = safeRound(due30Receivables * 0.7); // Expected 70% collection
      const exp30Outflow = safeRound(recurringMonthlyOutflows + (baseMetrics.mtdExpenses * 0.8));
      const proj30Cash = safeRound(currentCash + exp30Inflow - exp30Outflow);

      // 60-day forecast
      const exp60Inflow = safeRound(exp30Inflow * 1.8);
      const exp60Outflow = safeRound(exp30Outflow * 2);
      const proj60Cash = safeRound(currentCash + exp60Inflow - exp60Outflow);

      // 90-day forecast
      const exp90Inflow = safeRound(exp30Inflow * 2.7);
      const exp90Outflow = safeRound(exp30Outflow * 3);
      const proj90Cash = safeRound(currentCash + exp90Inflow - exp90Outflow);

      return {
        currentCash,
        h30: { inflow: exp30Inflow, outflow: exp30Outflow, closing: proj30Cash },
        h60: { inflow: exp60Inflow, outflow: exp60Outflow, closing: proj60Cash },
        h90: { inflow: exp90Inflow, outflow: exp90Outflow, closing: proj90Cash }
      };
    }

    // ----------------------------------------------------
    // FINANCIAL ANOMALY DETECTOR
    // ----------------------------------------------------
    function detectFinancialAnomalies() {
      const anomalies = [];

      // 1. Unusually large expense (> ₦400,000)
      state.expenses.filter(e => e.status === 'recorded' && Number(e.amount) >= 400000).forEach(e => {
        anomalies.push({
          id: 'anom_exp_' + e.id,
          type: 'Unusually High Expense',
          severity: 'HIGH',
          what: `High value expense of ${fmtMoney(e.amount)} for "${e.description}"`,
          why: 'Exceeds standard operational expenditure baseline.',
          action: 'Audit invoice attached and verify budget approval.',
          entityId: e.id,
          amount: e.amount,
          date: e.date
        });
      });

      // 2. Duplicate payment amounts on the same day
      const seenPayments = {};
      state.payments.forEach(p => {
        const key = `${p.date}_${p.amount}`;
        if (seenPayments[key]) {
          anomalies.push({
            id: 'anom_dup_' + p.id,
            type: 'Potential Duplicate Payment',
            severity: 'MEDIUM',
            what: `Duplicate payment amount of ${fmtMoney(p.amount)} recorded on ${p.date}`,
            why: 'Multiple identical transactions on the same date may indicate double recording.',
            action: 'Verify bank deposit reference and student receipt.',
            entityId: p.id,
            amount: p.amount,
            date: p.date
          });
        } else {
          seenPayments[key] = p;
        }
      });

      return anomalies;
    }

    // ----------------------------------------------------
    // ADMINISTRATIVE FINANCIAL INTEGRITY CHECKER
    // ----------------------------------------------------
    function runIntegrityAudit() {
      const issues = [];

      // Check orphaned payments
      state.payments.forEach(p => {
        const inv = state.invoices.find(i => i.id === p.invoiceId);
        if (!inv) {
          issues.push({
            severity: 'CRITICAL',
            issue: `Orphaned payment RCP #${p.receiptNo} (${fmtMoney(p.amount)}) without linked invoice.`,
            remediation: 'Attach payment to valid student invoice or reassign ID.'
          });
        }
      });

      // Check payments without references
      state.payments.filter(p => !p.reference || p.reference.trim() === '').forEach(p => {
        issues.push({
          severity: 'MEDIUM',
          issue: `Payment RCP #${p.receiptNo} (${fmtMoney(p.amount)}) has no bank transaction reference.`,
          remediation: 'Obtain bank deposit slip or NIBSS session ID.'
        });
      });

      // Check over-allocated payments
      state.invoices.forEach(inv => {
        const paid = state.payments.filter(p => p.invoiceId === inv.id).reduce((s, p) => s + Number(p.amount || 0), 0);
        if (paid > Number(inv.total)) {
          issues.push({
            severity: 'CRITICAL',
            issue: `Invoice #${inv.invoiceNo} has overpayment: Paid ${fmtMoney(paid)} on total ${fmtMoney(inv.total)}.`,
            remediation: 'Issue refund or reallocate excess payment to another invoice.'
          });
        }
      });

      return issues;
    }

    // ----------------------------------------------------
    // CSV EXPORT UTILITY
    // ----------------------------------------------------
    function exportToCSV(filename, rows) {
      if (!rows || !rows.length) { alert('No records available to export.'); return; }
      const separator = ',';
      const keys = Object.keys(rows[0]);
      const headerMetadata = `# Report: ${filename.toUpperCase()}\n# Generated By: ${state.currentRole}\n# Generated At: ${new Date().toISOString()}\n# Tenant: ${DEFAULT_TENANT_ID}\n\n`;
      const csvData = keys.join(separator) + '\n' + rows.map(row => {
        return keys.map(k => {
          let cell = row[k] === null || row[k] === undefined ? '' : String(row[k]);
          cell = cell.replace(/"/g, '""');
          if (cell.search(/("|,|\n)/g) >= 0) cell = `"${cell}"`;
          return cell;
        }).join(separator);
      }).join('\n');

      const blob = new Blob([headerMetadata + csvData], { type: 'text/csv;charset=utf-8;' });
      const link = document.createElement('a');
      link.href = URL.createObjectURL(blob);
      link.download = `${filename}_${new Date().toISOString().slice(0, 10)}.csv`;
      link.click();
      logAudit('EXPORT_CSV', 'report', filename, 'CSV Data Export');
    }

            <div class="cp-tab ${state.tab === 'expenses' ? 'active' : ''}" data-tab="expenses">Expenses ${state.expenses.filter(e => e.status === 'pending_approval').length > 0 ? `(${state.expenses.filter(e => e.status === 'pending_approval').length})` : ''}</div>
            <div class="cp-tab ${state.tab === 'invoices' ? 'active' : ''}" data-tab="invoices">Invoices</div>
            <div class="cp-tab ${state.tab === 'payments' ? 'active' : ''}" data-tab="payments">Payments &amp; Reconciliation</div>
            <div class="cp-tab ${state.tab === 'ledger' ? 'active' : ''}" data-tab="ledger">&#x1F4D6; Financial Ledger</div>
            <div class="cp-tab ${state.tab === 'reports' ? 'active' : ''}" data-tab="reports">&#x1F4CA; Management Reports</div>
            <div class="cp-tab ${state.tab === 'budgets' ? 'active' : ''}" data-tab="budgets">&#x1F6E1; Budgets &amp; Controls</div>
            <div class="cp-tab ${state.tab === 'programmes' ? 'active' : ''}" data-tab="programmes">Programmes</div>
          </div>

          <!-- Tab Content Area -->
          <div id="tabContent"></div>
        </div>

        <div id="modalContainer"></div>
      `;

      // Role switcher
      document.getElementById('roleSelector').addEventListener('change', async (e) => {
        state.currentRole = e.target.value;
        await safeSet(STORE_KEY_USER_ROLE, state.currentRole);
        render();
      });

      // Tab switcher
      root.querySelectorAll('#mainTabs .cp-tab').forEach(t => {
        t.addEventListener('click', () => {
          state.tab = t.dataset.tab;
          render();
        });
      });

      // Quick Actions
      const btnDir = document.getElementById('btnQuickDirectIncome');
      if (btnDir) btnDir.addEventListener('click', () => openModal('recordDirectIncome'));
      const btnExp = document.getElementById('btnQuickExpense');
      if (btnExp) btnExp.addEventListener('click', () => openModal('recordExpense'));
      const btnInv = document.getElementById('btnQuickInvoice');
      if (btnInv) btnInv.addEventListener('click', () => { state.tab = 'invoices'; state.invoiceSubTab = 'new'; render(); });

      // Render Active Tab
      const tabEl = document.getElementById('tabContent');
      if (state.tab === 'dashboard') renderDashboard(tabEl, m);
      else if (state.tab === 'accounts') renderStudentAccounts(tabEl);
      else if (state.tab === 'receivables') renderCollectionWorkspace(tabEl, m);
      else if (state.tab === 'income') renderIncome(tabEl, m);
      else if (state.tab === 'expenses') renderExpenses(tabEl, m);
      else if (state.tab === 'invoices') renderInvoices(tabEl, m);
      else if (state.tab === 'payments') renderPaymentsAndReconciliation(tabEl, m);
      else if (state.tab === 'ledger') renderFinancialLedger(tabEl);
      else if (state.tab === 'reports') renderReports(tabEl);
      else if (state.tab === 'budgets') renderBudgetsAndControls(tabEl);
      else if (state.tab === 'programmes') renderProgrammes(tabEl);

      renderModal();
    }

    // ----------------------------------------------------

            <div class="cp-stat-value" style="color:var(--success);">${fmtMoney(m.mtdIncome)}</div>

            <div class="cp-stat-value" style="color:var(--danger);">${fmtMoney(m.mtdExpenses)}</div>

            <div class="cp-stat-value">${fmtMoney(m.netFinancialPosition)}</div>
            <div class="cp-stat-sub">Net Margin: <strong>${m.totalIncomeReceived > 0 ? m.netMargin.toFixed(1) + '%' : 'N/A'}</strong> (P&amp;L)</div>

            <div class="cp-stat-sub">Collection Rate: <strong>${m.collectionRate.toFixed(1)}%</strong> (Workspace)</div>
          </div>
        </div>

        <!-- Multi-Horizon Cash Flow Forecasting (30 / 60 / 90 Days) -->
        <div class="cp-card">
          <div class="cp-card-header">
            <div>
              <div class="cp-section-title">&#x1F4B5; Multi-Horizon Cash Flow Forecasting (30 / 60 / 90 Days)</div>
              <div class="cp-section-desc">Dynamic projections combining verified receivables due, recurring expense commitments and historical trend</div>
            </div>
            <span class="cp-pill recorded">PROJECTED MODEL</span>
          </div>

            <div class="cp-stat">
              <div class="cp-stat-label">30-Day Cash Outlook</div>
              <div class="cp-stat-value" style="color:${cashForecast.h30.closing >= 0 ? 'var(--primary)' : 'var(--danger)'}; font-size:18px;">${fmtMoney(cashForecast.h30.closing)}</div>
              <div class="cp-stat-sub">Inflow: +${fmtMoney(cashForecast.h30.inflow)} | Outflow: -${fmtMoney(cashForecast.h30.outflow)}</div>
            </div>
            <div class="cp-stat">
              <div class="cp-stat-label">60-Day Cash Outlook</div>
              <div class="cp-stat-value" style="color:${cashForecast.h60.closing >= 0 ? 'var(--primary)' : 'var(--danger)'}; font-size:18px;">${fmtMoney(cashForecast.h60.closing)}</div>
              <div class="cp-stat-sub">Inflow: +${fmtMoney(cashForecast.h60.inflow)} | Outflow: -${fmtMoney(cashForecast.h60.outflow)}</div>
            </div>
            <div class="cp-stat">
              <div class="cp-stat-label">90-Day Cash Outlook</div>
              <div class="cp-stat-value" style="color:${cashForecast.h90.closing >= 0 ? 'var(--primary)' : 'var(--danger)'}; font-size:18px;">${fmtMoney(cashForecast.h90.closing)}</div>
              <div class="cp-stat-sub">Inflow: +${fmtMoney(cashForecast.h90.inflow)} | Outflow: -${fmtMoney(cashForecast.h90.outflow)}</div>
            </div>
          </div>
        </div>

        <!-- Management Health Scorecard -->
        <div class="cp-card">
          <div class="cp-section-title">&#x1FA7A; Executive Financial Health Scorecard</div>
          <div class="cp-section-desc" style="margin-bottom:14px;">Real-time health assessment against operational benchmarks</div>

          <div class="cp-table-wrap">
            <table class="cp-table">
              <thead>
                <tr><th>Health Dimension</th><th>Observed Value</th><th>Benchmark Target</th><th>Assurance Status</th></tr>
              </thead>
              <tbody>
                <tr>
                  <td style="font-weight:600;">Collection Rate</td>
                  <td>${m.collectionRate.toFixed(1)}% invoice collection rate</td>
                  <td>&ge; 75.0% target</td>
                  <td><span class="cp-pill ${collScore === 'Healthy' ? 'paid' : collScore === 'Watch' ? 'partial' : 'unpaid'}">${collScore}</span></td>
                </tr>
                <tr>
                  <td style="font-weight:600;">Net Profit Margin</td>
                  <td>${m.totalIncomeReceived > 0 ? m.netMargin.toFixed(1) + '% net margin' : 'N/A'}</td>
                  <td>&ge; 25.0% target</td>
                  <td><span class="cp-pill ${netMarginScore === 'Healthy' ? 'paid' : netMarginScore === 'Watch' ? 'partial' : 'unpaid'}">${netMarginScore}</span></td>
                </tr>
              </tbody>
            </table>
          </div>
        </div>
      `;

      // CFO Drill-Down Click Listeners
      document.getElementById('cardDrillIncome').addEventListener('click', () => { state.tab = 'income'; render(); });
      document.getElementById('cardDrillExpenses').addEventListener('click', () => { state.tab = 'expenses'; render(); });
      document.getElementById('cardDrillPnl').addEventListener('click', () => { state.tab = 'reports'; state.reportsSubTab = 'pnl'; render(); });
      document.getElementById('cardDrillReceivables').addEventListener('click', () => { state.tab = 'receivables'; render(); });

      const btnApp = document.getElementById('btnGoToApprovals');
      if (btnApp) btnApp.addEventListener('click', () => { state.tab = 'expenses'; state.expensesSubTab = 'approvals'; render(); });

      const btnAnom = document.getElementById('btnViewAnomaliesModal');
      if (btnAnom) btnAnom.addEventListener('click', () => openModal('reviewAnomalies', { anomalies }));

    // ----------------------------------------------------
    // TAB 2: STUDENT FINANCIAL ACCOUNTS
    // ----------------------------------------------------
    function renderStudentAccounts(el) {
      let accounts = getStudentAccounts();
      const q = state.filters.accountSearch.toLowerCase().trim();

      if (q) {
        accounts = accounts.filter(a =>
          a.clientName.toLowerCase().includes(q) ||
          a.phone.toLowerCase().includes(q) ||
          a.email.toLowerCase().includes(q) ||
          a.programmesList.toLowerCase().includes(q)
        );
      }

      if (state.filters.accountFilter === 'outstanding') accounts = accounts.filter(a => a.balance > 0);
      else if (state.filters.accountFilter === 'paid') accounts = accounts.filter(a => a.balance === 0);

      el.innerHTML = `
        <div class="cp-card-header">
          <div>
            <div class="cp-section-title">&#x1F465; Student &amp; Customer Financial Accounts</div>
            <div class="cp-section-desc">Consolidated student accounts, running debit/credit ledgers and printable account statements</div>
          </div>
        </div>

        <div class="cp-toolbar">
          <div class="cp-toolbar-group">
            <div class="cp-search">
              <span class="cp-search-icon">&#x1F50D;</span>
              <input type="text" id="accSearchInput" placeholder="Search student name, phone, email..." value="${escapeHtml(state.filters.accountSearch)}" />
            </div>
            <select class="cp-select-filter" id="accFilterStatus">
              <option value="all" ${state.filters.accountFilter === 'all' ? 'selected' : ''}>All Accounts (${accounts.length})</option>
              <option value="outstanding" ${state.filters.accountFilter === 'outstanding' ? 'selected' : ''}>With Outstanding Balance</option>
              <option value="paid" ${state.filters.accountFilter === 'paid' ? 'selected' : ''}>Fully Settled</option>
            </select>
          </div>
        </div>

        <div class="cp-table-wrap">
          <table class="cp-table">
            <thead>
              <tr>
                <th>Student / Client Name</th>
                <th>Contact</th>
                <th>Enrolled Programme(s)</th>
                <th style="text-align:right;">Total Invoiced</th>
                <th style="text-align:right;">Total Paid</th>
                <th style="text-align:right;">Current Balance</th>
                <th>Status</th>
                <th>Action</th>
              </tr>
            </thead>
            <tbody>
              ${accounts.map(acc => `
                <tr>
                  <td style="font-weight:700; color:var(--primary);">${escapeHtml(acc.clientName)}</td>
                  <td style="font-size:12px;">${escapeHtml(acc.phone || acc.email || '\u2014')}</td>
                  <td>${escapeHtml(acc.programmesList)}</td>
                  <td style="text-align:right; font-weight:600;">${fmtMoney(acc.totalInvoiced)}</td>
                  <td style="text-align:right; color:var(--success); font-weight:600;">${fmtMoney(acc.totalPaid)}</td>
                  <td style="text-align:right; color:${acc.balance > 0 ? 'var(--warning)' : 'var(--text-muted)'}; font-weight:700;">${fmtMoney(acc.balance)}</td>
                  <td><span class="cp-pill ${acc.balance <= 0 ? 'paid' : 'partial'}">${acc.balance <= 0 ? 'Settled' : 'Owing'}</span></td>
                  <td>
                    <button class="cp-btn sm secondary" data-view-statement="${encodeURIComponent(acc.clientName)}">&#x1F4D1; Statement</button>
                  </td>
                </tr>
              `).join('')}
            </tbody>
          </table>
        </div>
      `;

      document.getElementById('accSearchInput').addEventListener('input', (e) => {
        state.filters.accountSearch = e.target.value;
        renderStudentAccounts(el);
      });
      document.getElementById('accFilterStatus').addEventListener('change', (e) => {
        state.filters.accountFilter = e.target.value;
        renderStudentAccounts(el);
      });

      el.querySelectorAll('[data-view-statement]').forEach(b => {
        b.addEventListener('click', () => {
          const name = decodeURIComponent(b.dataset.viewStatement);
          const accounts = getStudentAccounts();
          const acc = accounts.find(a => a.clientName.toLowerCase() === name.toLowerCase());
          if (acc) openModal('studentStatement', { account: acc });
        });
      });
    }

    // ----------------------------------------------------
    // TAB 3: RECEIVABLES COLLECTION WORKSPACE (6-TIER)
    // ----------------------------------------------------
    function renderCollectionWorkspace(el, m) {
      const unpaidInvoices = state.invoices.filter(i => invoiceBalance(i).balance > 0);
      let list = unpaidInvoices.slice();

      const q = state.filters.receivableSearch.toLowerCase().trim();
      if (q) {
        list = list.filter(i =>
          (i.clientName || '').toLowerCase().includes(q) ||
          String(i.invoiceNo || '').includes(q) ||
          (i.programmeName || '').toLowerCase().includes(q)
        );
      }

      if (state.filters.receivablePrio !== 'all') {
        list = list.filter(i => getReceivableAgeing(i).priority === state.filters.receivablePrio);
      }

      el.innerHTML = `
        <div class="cp-card-header">
          <div>
            <div class="cp-section-title">&#x23F3; Receivables Collection Workspace</div>
            <div class="cp-section-desc">6-Tier Ageing Analysis (Current, 1–30d, 31–60d, 61–90d, 90+d) with automated reminders and notes</div>

          ${canExport() ? `<button class="cp-btn sm secondary" id="btnExportCollections">&#x1F4E5; Export Queue CSV</button>` : ''}
        </div>

        <div class="cp-toolbar">
          <div class="cp-toolbar-group">
            <div class="cp-search">
              <span class="cp-search-icon">&#x1F50D;</span>
              <input type="text" id="collSearchInp" placeholder="Search collection queue..." value="${escapeHtml(state.filters.receivableSearch)}" />
            </div>
            <select class="cp-select-filter" id="collPrioFilter">
              <option value="all" ${state.filters.receivablePrio === 'all' ? 'selected' : ''}>All Priorities</option>
              <option value="Critical" ${state.filters.receivablePrio === 'Critical' ? 'selected' : ''}>Critical (61+ Days Overdue)</option>
              <option value="High" ${state.filters.receivablePrio === 'High' ? 'selected' : ''}>High (31–60 Days Overdue)</option>
              <option value="Medium" ${state.filters.receivablePrio === 'Medium' ? 'selected' : ''}>Medium (1–30 Days Overdue)</option>
              <option value="Low" ${state.filters.receivablePrio === 'Low' ? 'selected' : ''}>Low (Current)</option>
            </select>
          </div>
        </div>

        <div class="cp-table-wrap">
          <table class="cp-table">
            <thead>
              <tr>
                <th>Priority</th>
                <th>Student / Client</th>
                <th>Programme</th>
                <th>Invoice #</th>
                <th>Due Date</th>
                <th style="text-align:right;">Outstanding</th>
                <th>Days Overdue</th>
                <th>Follow-up Actions</th>
              </tr>
            </thead>
            <tbody>
              ${list.map(inv => {
                const { balance } = invoiceBalance(inv);
                const ageing = getReceivableAgeing(inv);
                const notes = state.collectionNotes.filter(n => n.invoiceId === inv.id);

                return `
                  <tr>
                    <td><span class="cp-pill ${ageing.prioClass}">${ageing.priority}</span></td>
                    <td style="font-weight:700; color:var(--primary);">${escapeHtml(inv.clientName)}</td>
                    <td>${escapeHtml(inv.programmeName)}</td>
                    <td style="font-weight:600;">#${inv.invoiceNo}</td>
                    <td>${fmtDate(inv.dueDate)}</td>
                    <td style="text-align:right; font-weight:700; color:var(--warning);">${fmtMoney(balance)}</td>
                    <td style="font-weight:600;">${ageing.days > 0 ? ageing.days + 'd' : 'On Time'}</td>
                    <td>
                      <div style="display:flex; gap:6px; flex-wrap:wrap;">
                        <button class="cp-btn sm secondary" data-reminder-inv="${inv.id}">&#x1F4E7; Reminder</button>
                        <button class="cp-btn sm secondary" data-note-inv="${inv.id}">&#x1F4DD; Note (${notes.length})</button>
                        ${canRecord() ? `<button class="cp-btn sm accent" data-pay-inv="${inv.id}">+ Pay</button>` : ''}
                      </div>
                    </td>
                  </tr>
                `;
              }).join('')}
            </tbody>
          </table>

      document.getElementById('collSearchInp').addEventListener('input', (e) => {
        state.filters.receivableSearch = e.target.value;
        renderCollectionWorkspace(el, m);
      });
      document.getElementById('collPrioFilter').addEventListener('change', (e) => {
        state.filters.receivablePrio = e.target.value;
        renderCollectionWorkspace(el, m);
      });

      const expBtn = document.getElementById('btnExportCollections');
      if (expBtn) {
        expBtn.addEventListener('click', () => {
          exportToCSV('clasptek_collection_queue', list.map(inv => {
            const { balance } = invoiceBalance(inv);
            const ageing = getReceivableAgeing(inv);
            return {
              Priority: ageing.priority,
              Student: inv.clientName,
              Programme: inv.programmeName,
              InvoiceNo: inv.invoiceNo,
              DueDate: inv.dueDate,
              Outstanding: balance,
              DaysOverdue: ageing.days
            };
          }));
        });
      }

      el.querySelectorAll('[data-reminder-inv]').forEach(b => {
        b.addEventListener('click', () => {
          const inv = state.invoices.find(i => i.id === b.dataset.reminderInv);
          if (inv) openModal('sendReminder', { invoice: inv });
        });
      });
      el.querySelectorAll('[data-note-inv]').forEach(b => {
        b.addEventListener('click', () => {
          const inv = state.invoices.find(i => i.id === b.dataset.noteInv);
          if (inv) openModal('collectionNotes', { invoice: inv });
        });
      });
      el.querySelectorAll('[data-pay-inv]').forEach(b => {
        b.addEventListener('click', () => {
          const inv = state.invoices.find(i => i.id === b.dataset.payInv);
          if (inv) openModal('recordPayment', { invoice: inv });
        });
      });

          </div>

        document.getElementById('btnSubmitNewInvoice').addEventListener('click', async () => {

          const amt = Number(document.getElementById('nInvAmount').value);

          const errEl = document.getElementById('nInvError');

          state.counters.invoice += 1;
          const inv = {
            id: 'inv_' + Date.now(),

          await safeSet(STORE_KEY_COUNTERS, state.counters);
          await logAudit('CREATE_INVOICE', 'invoice', inv.id, `#${inv.invoiceNo}`, null, inv);

            <table class="cp-table">
              <thead>
                <tr>
                  <th>Invoice #</th><th>Date</th><th>Student / Client</th><th>Programme</th>

                  const st = invoiceStatus(inv);
                  return `
                    <tr>
                      <td style="font-weight:700; color:var(--primary);">#${inv.invoiceNo}</td>

                      <td style="font-weight:600;">${escapeHtml(inv.clientName)}</td>

                }).join('')}
              </tbody>
            </table>
          </div>
        `;

        container.querySelectorAll('[data-pay-inv-id]').forEach(b => {
          b.addEventListener('click', () => {
            const inv = state.invoices.find(i => i.id === b.dataset.payInvId);
            if (inv) openModal('recordPayment', { invoice: inv });
          });
        });

    function renderProgrammeContributionReport(el) {
      const stats = state.programmes.map(p => {

                <th style="text-align:right;">Remaining (\u20a6)</th>

                <th>Status</th>
              </tr>
            </thead>

              ${budgetItems.length === 0 ? `
                <tr><td colspan="7" style="text-align:center; color:var(--text-muted); padding:20px;">No budgets established for ${curPeriod}. Click Set Budget Target to add one.</td></tr>
              ` : budgetItems.map(b => {
                const actual = safeRound(state.expenses
                  .filter(e => e.status === 'recorded' && (e.date || '').startsWith(b.period) && (e.categoryGroup === b.categoryGroup || b.categoryGroup === 'all'))
                  .reduce((s, e) => s + Number(e.amount || 0), 0));
                const budgetAmt = safeRound(Number(b.budgetAmount) || 1);
                const variance = safeRound(budgetAmt - actual);
                const remaining = Math.max(0, variance);
                const usagePct = safeRound((actual / budgetAmt) * 100);
                const isOver = actual > budgetAmt;
                const isWarning = usagePct >= 80 && !isOver;

                return `
                  <tr>
                    <td style="font-weight:700; color:var(--primary);">${escapeHtml(b.categoryGroup)}</td>
                    <td style="text-align:right; font-weight:600;">${fmtMoney(budgetAmt)}</td>

                    <td style="text-align:right; font-weight:700; color:${variance >= 0 ? 'var(--success)' : 'var(--danger)'};">${fmtMoney(variance)}</td>

                    <td><span class="cp-pill ${isOver ? 'unpaid' : isWarning ? 'partial' : 'paid'}">${isOver ? 'OVER BUDGET' : isWarning ? 'WARNING (80%)' : 'ON BUDGET'}</span></td>

        </div>

      if (bBtn) bBtn.addEventListener('click', () => openModal('setBudget'));

    // ----------------------------------------------------
    // MODALS ENGINE
    // ----------------------------------------------------
    function openModal(type, data = {}) {
      state.modal = { type, data };
      renderModal();
    }

    function closeModal() {
      state.modal = null;
      renderModal();
    }

    function renderModal() {
      const container = document.getElementById('modalContainer');
      if (!container) return;
      if (!state.modal) { container.innerHTML = ''; return; }

      const { type, data } = state.modal;
      if (type === 'recordDirectIncome') renderRecordDirectIncomeModal(container);
      else if (type === 'recordExpense') renderRecordExpenseModal(container);
      else if (type === 'recordPayment') renderRecordPaymentModal(container, data.invoice);
      else if (type === 'viewReceipt') renderViewReceiptModal(container, data.payment, data.invoice);
      else if (type === 'studentStatement') renderStudentStatementModal(container, data.account);
      else if (type === 'sendReminder') renderSendReminderModal(container, data.invoice);
      else if (type === 'collectionNotes') renderCollectionNotesModal(container, data.invoice);
      else if (type === 'closeMonthChecklist') renderCloseMonthChecklistModal(container);
      else if (type === 'setBudget') renderSetBudgetModal(container);
      else if (type === 'cancelExpense') renderCancelExpenseModal(container, data.expense);
      else if (type === 'cancelDirectIncome') renderCancelDirectIncomeModal(container, data.item);
      else if (type === 'newReconciliation') renderNewReconciliationModal(container, data.expectedBalance);
      else if (type === 'reviewAnomalies') renderReviewAnomaliesModal(container, data.anomalies);
    }

    function renderNewReconciliationModal(container, expectedBalance) {
      const curMonth = new Date().toISOString().slice(0, 7);

      container.innerHTML = `
        <div class="cp-modal-overlay">
          <div class="cp-modal">
            <div class="cp-modal-header">
              <div class="cp-modal-title">&#x2696; Record Bank Statement Reconciliation</div>
              <button class="cp-modal-close" id="mClose">&times;</button>
            </div>
            <div class="cp-modal-body">
              <div class="cp-field"><label>Reconciliation Period *</label><input id="mRecPeriod" type="month" value="${curMonth}" /></div>
              <div class="cp-field"><label>Account Name *</label><input id="mRecAccount" value="Main Corporate Bank (GTB/Access)" /></div>
              <div class="cp-field"><label>Expected System Balance (\u20a6)</label><input id="mRecExpected" value="${expectedBalance}" disabled /></div>
              <div class="cp-field"><label>Actual Bank Statement Ending Balance (\u20a6) *</label><input id="mRecActual" type="number" placeholder="Enter bank statement balance..." /></div>
              <div class="cp-field"><label>Reconciliation Notes / Exception Reasons</label><textarea id="mRecNotes" rows="2" placeholder="e.g. Cleared all deposits, no unmatched items..."></textarea></div>
            </div>
            <div class="cp-modal-footer">
              <button class="cp-btn secondary" id="mRecCancel">Cancel</button>
              <button class="cp-btn accent" id="mRecSubmit">Save &amp; Lock Reconciliation</button>
            </div>
          </div>
        </div>
      `;

      document.getElementById('mClose').addEventListener('click', closeModal);
      document.getElementById('mRecCancel').addEventListener('click', closeModal);
      document.getElementById('mRecSubmit').addEventListener('click', async () => {
        const actual = Number(document.getElementById('mRecActual').value);
        const period = document.getElementById('mRecPeriod').value;
        const exp = Number(expectedBalance) || 0;
        const variance = safeRound(actual - exp);
        const status = variance === 0 ? 'RECONCILED' : 'EXCEPTION';

        const recon = {
          id: 'recon_' + Date.now(),
          tenant_id: DEFAULT_TENANT_ID,
          period,
          account: document.getElementById('mRecAccount').value.trim(),
          expectedBalance: exp,
          actualBalance: actual,
          variance,
          status,
          notes: document.getElementById('mRecNotes').value.trim(),
          reconciledAt: new Date().toISOString(),
          reconciledBy: state.currentRole
        };

        state.reconciliations.unshift(recon);
        await safeSet(STORE_KEY_RECONCILIATIONS, state.reconciliations);
        await logAudit('SAVE_RECONCILIATION', 'reconciliation', recon.id, `${recon.period} (Variance: ${fmtMoney(variance)})`, null, recon);
        closeModal();
        render();
      });
    }
