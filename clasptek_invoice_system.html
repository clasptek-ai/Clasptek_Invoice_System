// PHASE 14.1 SUPABASE 401 AUTHENTICATION RESOLUTION & PRODUCTION SELF-TEST
// ----------------------------------------------------
async function diagnoseSupabase401() {
  const startTime = Date.now();
  const config = resolveSupabaseConfiguration();
  const ep = (state.supabase && state.supabase.endpoint) ? state.supabase.endpoint.trim() : (config.endpoint || CANONICAL_SUPABASE_REST_ENDPOINT);
  const anonKey = (state.supabase && state.supabase.anonKey) ? state.supabase.anonKey.trim() : (config.anonKey || '');

  // 1. Supabase URL Test
  const projectRefMatch = ep.match(/https:\/\/([^.]+)\.supabase\.co/i);
  const projectRefFromUrl = projectRefMatch ? projectRefMatch[1] : '';
  const isUrlFormatValid = Boolean(projectRefFromUrl && ep.includes('.supabase.co'));
  const isProjectMatch = projectRefFromUrl === CANONICAL_SUPABASE_PROJECT_REF;
  const urlTest = {
    configured: Boolean(ep),
    projectRef: projectRefFromUrl || CANONICAL_SUPABASE_PROJECT_REF,
    urlValid: isUrlFormatValid && isProjectMatch,
    canonicalMatch: isProjectMatch,
    isMatch: isProjectMatch
  };

  // 2. Public Anonymous Key Test
  const keyVal = validateSupabasePublicKey(anonKey, CANONICAL_SUPABASE_PROJECT_REF);
  let keyStatus = 'VALID';
  let keyDisplay = 'CONFIGURED';
  let isMismatch = false;

  if (!keyVal.present || !anonKey) {
    keyStatus = 'MISSING';
    keyDisplay = 'MISSING';
  } else if (keyVal.isServiceRole) {
    keyStatus = 'SERVICE_ROLE_REJECTED';
    keyDisplay = 'SERVICE_ROLE_FORBIDDEN';
  } else if (keyVal.isSecretKey) {
    keyStatus = 'SERVER_SECRET_REJECTED';
    keyDisplay = 'SERVER_SECRET_FORBIDDEN';
  } else if (!keyVal.isExpectedProject) {
    keyStatus = 'PROJECT_KEY_MISMATCH';
    isMismatch = true;
    keyDisplay = anonKey.length >= 4 ? `••••••••${anonKey.slice(-4)}` : 'PROJECT_KEY_MISMATCH';
  } else if (!keyVal.isFormatValid) {
    keyStatus = 'MALFORMED';
    keyDisplay = 'MALFORMED';
  } else if (keyVal.isExpired) {
    keyStatus = 'EXPIRED';
    keyDisplay = 'EXPIRED';
  } else {
    keyDisplay = anonKey.length >= 4 ? `••••••••${anonKey.slice(-4)}` : 'CONFIGURED';
  }

  const keyTest = {
    present: Boolean(keyVal.present && anonKey),
    keyStatus,
    status: keyStatus,
    display: keyDisplay,
    displayOnly: keyDisplay,
    isProjectMatch: keyVal.isExpectedProject && !isMismatch,
    isServiceRole: Boolean(keyVal.isServiceRole),
    isValid: keyVal.isValid && keyStatus === 'VALID' && !isMismatch
  };

  // 3. Supabase Client Construction Test
  const client = getSupabaseClient();
  const clientTest = {
    isCanonical: client === supabaseClient,
    isConfigured: client.isConfigured(),
    clientInstance: 'getSupabaseClient()'
  };

  // 4. Authentication Session Test
  let authSess = null;
  try {
    if (typeof supabaseAuth !== 'undefined' && typeof supabaseAuth.getSession === 'function') {
      authSess = await supabaseAuth.getSession();
    }
  } catch (_) {}

  const sessObj = authSess && authSess.session;
  const sessUser = sessObj ? sessObj.user : null;
  const stateUser = (state.auth && (state.auth.user || state.auth.supabaseUser)) ? (state.auth.user || state.auth.supabaseUser) : null;
  const authUser = (stateUser && (stateUser.role || stateUser.tenant_id)) ? { ...sessUser, ...stateUser } : (sessUser || stateUser);
  const authUserId = authUser ? (authUser.id || authUser.email || 'usr_masked') : null;
  const rawRole = (authUser && (authUser.role || (authUser.app_metadata && authUser.app_metadata.role) || (authUser.user_metadata && authUser.user_metadata.role))) || 'ANONYMOUS';
  const role = rawRole.toUpperCase().replace(/\s+/g, '_');
  const token = (sessObj && sessObj.access_token) || (state.auth && (state.auth.supabaseJwt || (state.auth.token && state.auth.token.startsWith('eyJ') ? state.auth.token : null)));
  const isExpired = Boolean(sessObj && sessObj.expires_at && (sessObj.expires_at * 1000) < Date.now());
  const canonicalTenant = resolveAuthoritativeTenantId();
  const tenantId = (authUser && (authUser.tenant_id || (authUser.app_metadata && authUser.app_metadata.tenant_id))) || canonicalTenant;

  const sessionTest = {
    authenticated: Boolean(authUser && (state.auth?.isAuthenticated || Boolean(sessObj))),
    userId: authUserId ? 'usr_****' : 'none',
    tenantId: `${canonicalTenant} (masked)`,
    role,
    tokenPresent: Boolean(token),
    tokenExpired: isExpired,
    tokenSanitized: true
  };

  // 5. Authorization Header Test
  const rawHeaders = client.getHeaders();
  const apiKeyHeader = rawHeaders['apikey'];
  const authHeader = rawHeaders['Authorization'];
  const hasMalformedHeader = (typeof authHeader === 'string' && (authHeader.includes('undefined') || authHeader.includes('null'))) ||
                             (typeof apiKeyHeader === 'string' && (apiKeyHeader.includes('undefined') || apiKeyHeader.includes('null')));

  const headerTest = {
    apiKeyPresent: Boolean(apiKeyHeader && apiKeyHeader !== 'undefined' && apiKeyHeader !== 'null'),
    authorizationPresent: Boolean(authHeader && authHeader !== 'Bearer undefined' && authHeader !== 'Bearer null'),
    bearerTokenPresent: Boolean(authHeader && authHeader.startsWith('Bearer ') && authHeader.length > 10 && !hasMalformedHeader),
    tokenRedacted: true,
    hasMalformedHeader
  };

  // 6 & 7. Controlled Request to programmes (GET /rest/v1/programmes?select=*&limit=1)
  let probeLatencyMs = 0;
  const probeStart = Date.now();
  let httpStatus = 0;
  let responseCategory = 'POSTGRESQL_UNREACHABLE';
  let rowCount = 0;

  if (client.isConfigured() && !isMismatch && !keyVal.isServiceRole) {
    try {
      const restEndpoint = ep.endsWith('/') ? ep : `${ep}/`;
      const testUrl = `${restEndpoint}programmes?select=*&limit=1`;
      const headers = client.getHeaders();
      const res = await (typeof mockFetch === 'function' ? mockFetch(testUrl, { method: 'GET', headers }) : fetch(testUrl, { method: 'GET', headers }));

      probeLatencyMs = Date.now() - probeStart;
      httpStatus = res.status;

      if (res.status === 200) {
        const data = await res.json().catch(() => []);
        rowCount = Array.isArray(data) ? data.length : 0;
        responseCategory = rowCount === 0 ? 'DATABASE_CONNECTED_EMPTY' : 'DATABASE_CONNECTED_DATA_PRESENT';
      } else if (res.status === 401) {
        responseCategory = 'AUTHENTICATION_FAILED';
      } else if (res.status === 403) {
        responseCategory = 'RLS_AUTHORIZATION_FAILED';
      } else if (res.status === 404) {
        responseCategory = 'SCHEMA_OR_TABLE_NOT_FOUND';
      } else if (res.status >= 500) {
        responseCategory = 'POSTGRESQL_SERVER_ERROR';
      } else {
        responseCategory = 'POSTGRESQL_UNREACHABLE';
      }
    } catch (err) {
      probeLatencyMs = Date.now() - probeStart;
      httpStatus = 0;
      responseCategory = 'POSTGRESQL_UNREACHABLE';
    }
  } else {
    probeLatencyMs = Date.now() - probeStart;
    httpStatus = 401;
    responseCategory = 'AUTHENTICATION_FAILED';
  }

  const programmesTest = {
    httpStatus,
    latencyMs: probeLatencyMs,
    responseCategory,
    rowCount,
    querySuccess: httpStatus === 200
  };

  // 8. Tenant Membership Verification
  const tenantMatch = (tenantId === canonicalTenant);
  const isAuthorizedRole = (role === 'SUPER_ADMIN' || role === 'FINANCE_MANAGER' || role === 'STAFF' || role === 'SUPER_ADMINISTRATOR' || role === 'FINANCE_STAFF' || role === 'SUPER ADMIN');
  const tenantTest = {
    verified: tenantMatch && isAuthorizedRole,
    tenantId: canonicalTenant,
    role,
    membershipAuthoritative: true
  };

  // 9. RLS Verification across Key Business Tables
  const rlsMatrix = await verifyProductionRlsMatrix();

  // 10. Production Authentication Context ASCII Box
  const asciiBox = [
    '┌───────────────────────────────────────┐',
    '│ PRODUCTION AUTHENTICATION             │',
    '├───────────────────────────────────────┤',
    `│ Supabase Project       ${isProjectMatch ? '✓ MATCHED     ' : '✖ MISMATCH    '} │`,
    `│ Public API Credential  ${keyTest.isValid ? '✓ CONFIGURED  ' : '✖ INVALID     '} │`,
    `│ Auth Session           ${sessionTest.authenticated ? '✓ ACTIVE      ' : '✖ INACTIVE    '} │`,
    `│ User                   ${sessionTest.authenticated ? '✓ AUTHENTICATED' : '✖ GUEST       '}│`,
    `│ Tenant                 ${tenantMatch ? '✓ MATCHED     ' : '✖ MISMATCH    '} │`,
    `│ Role                   ${role === 'SUPER_ADMIN' ? '✓ SUPER ADMIN ' : (isAuthorizedRole ? '✓ AUTHORIZED  ' : '✖ UNAUTHORIZED')} │`,
    `│ Access Token           ${sessionTest.tokenPresent && !sessionTest.tokenExpired ? '✓ VALID       ' : '✖ INVALID     '} │`,
    `│ PostgREST              ${httpStatus === 200 ? '✓ CONNECTED   ' : '✖ ' + responseCategory + ' '} │`,
    `│ RLS                    ${rlsMatrix.overallPassed ? '✓ ENFORCED    ' : '✖ RESTRICTED  '} │`,
    '└───────────────────────────────────────┘'
  ].join('\n');

  // 11 & 12. 12-Test Diagnostic Matrix
  const diagnosticMatrix = [
    { test: 'Supabase URL', passed: urlTest.urlValid, result: urlTest.urlValid ? '✓' : '✕' },
    { test: 'Project Match', passed: isProjectMatch, result: isProjectMatch ? '✓' : '✕' },
    { test: 'Public Key', passed: keyTest.isValid, result: keyTest.isValid ? '✓' : '✕' },
    { test: 'Auth Session', passed: sessionTest.authenticated, result: sessionTest.authenticated ? '✓' : '✕' },
    { test: 'Access Token', passed: sessionTest.tokenPresent && !sessionTest.tokenExpired, result: (sessionTest.tokenPresent && !sessionTest.tokenExpired) ? '✓' : '✕' },
    { test: 'Tenant Membership', passed: tenantTest.verified, result: tenantTest.verified ? '✓' : '✕' },
    { test: 'User Role', passed: isAuthorizedRole, result: isAuthorizedRole ? '✓' : '✕' },
    { test: 'PostgREST', passed: httpStatus === 200, result: httpStatus === 200 ? '✓' : '✕' },
    { test: 'RLS', passed: rlsMatrix.overallPassed, result: rlsMatrix.overallPassed ? '✓' : '✕' },
    { test: 'programmes Query', passed: programmesTest.querySuccess, result: programmesTest.querySuccess ? '✓' : '✕' },
    { test: 'Database Inventory', passed: httpStatus === 200, result: httpStatus === 200 ? '✓' : '✕' },
    { test: 'Authority Gate', passed: state.databaseAuthorityState === DATABASE_AUTHORITY_STATE.AUTHORITATIVE, result: state.databaseAuthorityState === DATABASE_AUTHORITY_STATE.AUTHORITATIVE ? '✓' : '✕' }
  ];

  const totalLatencyMs = Date.now() - startTime;

  return {
    urlTest,
    keyTest,
    clientTest,
    sessionTest,
    headerTest,
    programmesTest,
    tenantTest,
    rlsMatrix,
    asciiBox,
    diagnosticMatrix,
    latencyMs: totalLatencyMs,
    is401Resolved: httpStatus === 200 && keyTest.isValid && sessionTest.authenticated
  };
}

async function runProductionConnectionSelfTest() {
  const diag = await diagnoseSupabase401();
  const schemaRes = await verifyProductionSchema();

  const configuration = (diag.urlTest.urlValid && diag.keyTest.isValid) ? 'PASS' : 'FAIL';
  const projectIdentity = ((diag.urlTest.isMatch || diag.urlTest.canonicalMatch) && (diag.keyTest.isProjectMatch || diag.keyTest.isValid)) ? 'PASS' : 'FAIL';
  const publicKey = (diag.keyTest.isValid && !diag.keyTest.isServiceRole) ? 'PASS' : 'FAIL';
  const session = diag.sessionTest.authenticated ? 'PASS' : 'FAIL';
  const accessToken = (diag.sessionTest.tokenPresent && !diag.sessionTest.tokenExpired) ? 'PASS' : 'FAIL';
  const authentication = (session === 'PASS' && accessToken === 'PASS') ? 'PASS' : 'FAIL';
  const authorization = diag.rlsMatrix.overallPassed ? 'PASS' : 'FAIL';
  const tenant = diag.tenantTest.verified ? 'PASS' : 'FAIL';
  const postgrest = (diag.programmesTest.httpStatus === 200) ? 'PASS' : 'FAIL';
  const programmesRead = diag.programmesTest.querySuccess ? 'PASS' : 'FAIL';
  const schema = schemaRes.compatible ? 'PASS' : 'FAIL';

  const allPassed = (
    configuration === 'PASS' &&
    projectIdentity === 'PASS' &&
    publicKey === 'PASS' &&
    session === 'PASS' &&
    accessToken === 'PASS' &&
    authorization === 'PASS' &&
    tenant === 'PASS' &&
    postgrest === 'PASS' &&
    programmesRead === 'PASS' &&
    schema === 'PASS'
  );

  const databaseAuthority = (allPassed && state.databaseAuthorityState === DATABASE_AUTHORITY_STATE.AUTHORITATIVE) ? 'AUTHORITATIVE' : 'BLOCKED';

  return {
    configuration,
    projectIdentity,
    publicKey,
    session,
    accessToken,
    authentication,
    authorization,
    tenant,
    postgrest,
    programmesRead,
    schema,
    databaseAuthority,
    allPassed
  };
}

async function diagnoseDirectRestProbe() {
  const client = getSupabaseClient();
  const startTimeCanonical = Date.now();
  let canonicalRes = { httpStatus: 0, ok: false, data: null, latencyMs: 0, category: 'POSTGRESQL_UNREACHABLE' };

  try {
    const res = await client.from('programmes').select('*');
    const latency = Date.now() - startTimeCanonical;
    const status = res.status || (res.ok ? 200 : (res.httpStatus || 0));
    const data = res.data || res.records || [];
    let cat = 'POSTGRESQL_UNREACHABLE';
    if (status === 200) cat = data.length === 0 ? 'POSTGRESQL_CONNECTED_EMPTY' : 'POSTGRESQL_CONNECTED_DATA_PRESENT';
    else if (status === 401) cat = 'AUTHENTICATION_FAILED';
    else if (status === 403) cat = 'RLS_AUTHORIZATION_FAILED';
    else if (status === 404) cat = 'SCHEMA_OR_TABLE_NOT_FOUND';
    else if (status >= 500) cat = 'POSTGRESQL_SERVER_ERROR';

    canonicalRes = {
      httpStatus: status,
      ok: status === 200,
      data,
      latencyMs: latency,
      category: cat
    };
  } catch (err) {
    canonicalRes = {
      httpStatus: 0,
      ok: false,
      data: null,
      latencyMs: Date.now() - startTimeCanonical,
      category: 'POSTGRESQL_UNREACHABLE',
      error: err.message
    };
  }

  const startTimeDirect = Date.now();
  let directRes = { httpStatus: 0, ok: false, data: null, latencyMs: 0, category: 'POSTGRESQL_UNREACHABLE' };

  try {
    const ep = client.getEndpoint();
    const headers = client.getHeaders();
    const res = await fetch(`${ep}programmes?select=*&limit=1`, {
      method: 'GET',
      headers
    });
    const latency = Date.now() - startTimeDirect;
    let data = [];
    if (res.ok) {
      data = await res.json().catch(() => []);
    }
    let cat = 'POSTGRESQL_UNREACHABLE';
    if (res.status === 200) cat = (Array.isArray(data) && data.length === 0) ? 'POSTGRESQL_CONNECTED_EMPTY' : 'POSTGRESQL_CONNECTED_DATA_PRESENT';
    else if (res.status === 401) cat = 'AUTHENTICATION_FAILED';
    else if (res.status === 403) cat = 'RLS_AUTHORIZATION_FAILED';
    else if (res.status === 404) cat = 'SCHEMA_OR_TABLE_NOT_FOUND';
    else if (res.status >= 500) cat = 'POSTGRESQL_SERVER_ERROR';

    directRes = {
      httpStatus: res.status,
      ok: res.ok,
      data,
      latencyMs: latency,
      category: cat
    };
  } catch (err) {
    directRes = {
      httpStatus: 0,
      ok: false,
      data: null,
      latencyMs: Date.now() - startTimeDirect,
      category: 'POSTGRESQL_UNREACHABLE',
      error: err.message
    };
  }

  let comparisonResult = 'POSTGRESQL_UNREACHABLE';
  if (canonicalRes.httpStatus === 200 && directRes.httpStatus === 200) {
    comparisonResult = 'POSTGREST_CONNECTIVITY_PASS';
  } else if (directRes.httpStatus === 200 && canonicalRes.httpStatus === 401) {
    comparisonResult = 'APPLICATION_CLIENT_CONFIGURATION_ERROR';
  } else if (canonicalRes.httpStatus === 401 && directRes.httpStatus === 401) {
    comparisonResult = 'CREDENTIAL_OR_AUTHENTICATION_FAILURE';
  } else if (canonicalRes.httpStatus === 403 || directRes.httpStatus === 403) {
    comparisonResult = 'RLS_AUTHORIZATION_FAILURE';
  }

  const table = [
    { test: 'Canonical Client', http: canonicalRes.httpStatus, result: canonicalRes.category },
    { test: 'Direct REST', http: directRes.httpStatus, result: directRes.category }
  ];

  return {
    canonicalClient: canonicalRes,
    directRest: directRes,
    comparisonResult,
    table,
    httpStatus: directRes.httpStatus || canonicalRes.httpStatus,
    connected: Boolean(directRes.ok || canonicalRes.ok || directRes.httpStatus === 200 || canonicalRes.httpStatus === 200)
  };
}

// ----------------------------------------------------
// PHASE 14.7A REAL-CLOUD MIGRATION EXECUTION ARCHITECTURE
// ----------------------------------------------------
const MIGRATION_EXECUTION_MODE = {
  SIMULATION: 'SIMULATION',
  LIVE_CLOUD: 'LIVE_CLOUD'
};

const FORENSIC_TRUTH_LABEL = {
  SIMULATED_TEST_ONLY: 'SIMULATED_TEST_ONLY',
  LIVE_CLOUD_WRITE_VERIFIED: 'LIVE_CLOUD_WRITE_VERIFIED',
  LIVE_CLOUD_READ_VERIFIED: 'LIVE_CLOUD_READ_VERIFIED',
  LIVE_CLOUD_RECONCILED: 'LIVE_CLOUD_RECONCILED',
  LIVE_CLOUD_AUTHORITY_CERTIFIED: 'LIVE_CLOUD_AUTHORITY_CERTIFIED'
};

let currentMigrationExecutionMode = MIGRATION_EXECUTION_MODE.SIMULATION;

let migrationNetworkCounters = {
  networkWritesExecuted: 0,
  networkReadsExecuted: 0,
  remoteRowsWritten: 0,
  remoteRowsRead: 0,
  liveCloudVerified: false
};

const liveMigrationAuditLogs = [];

function getMigrationExecutionMode() {
  return currentMigrationExecutionMode;
}

function setMigrationExecutionMode(mode) {
  if (mode === MIGRATION_EXECUTION_MODE.LIVE_CLOUD || mode === MIGRATION_EXECUTION_MODE.SIMULATION) {
    currentMigrationExecutionMode = mode;
  }
  return currentMigrationExecutionMode;
}

function resetMigrationNetworkCounters() {
  migrationNetworkCounters = {
    networkWritesExecuted: 0,
    networkReadsExecuted: 0,
    remoteRowsWritten: 0,
    remoteRowsRead: 0,
    liveCloudVerified: false
  };
}

function getMigrationNetworkCounters() {
  return { ...migrationNetworkCounters };
}

function assertLiveCloudMigration() {
  const config = resolveSupabaseConfiguration();
  if (!config.isExpectedProject || config.projectRef !== CANONICAL_SUPABASE_PROJECT_REF) {
    throw new Error(`Live cloud migration assertion failed: Target project ref ${config.projectRef} does not match canonical ${CANONICAL_SUPABASE_PROJECT_REF}.`);
  }
  if (config.secretDetected) {
    throw new Error('Live cloud migration assertion failed: Secret credential detected in runtime configuration.');
  }
  const jwt = (state.auth && (state.auth.supabaseJwt || (state.auth.user && state.auth.user.supabaseJwt))) || null;
  if (!jwt) {
    throw new Error('Live cloud migration assertion failed: Valid authenticated Supabase user JWT required.');
  }
  return true;
}

function isRealSupabaseRequest(url, headers = {}) {
  const isCanonicalUrl = typeof url === 'string' && (url.startsWith(CANONICAL_SUPABASE_BASE_URL) || url.startsWith('https://logaawoigfxnisimfatf.supabase.co'));
  const hasApiKey = Boolean(headers.apikey || headers.apiKey || (headers.get && headers.get('apikey')));
  const hasAuthHeader = Boolean(headers.Authorization || headers.authorization || (headers.get && headers.get('Authorization')));
  return isCanonicalUrl && hasApiKey && hasAuthHeader;
}

function recordLiveMigrationRequest(reqObj) {
  const {
    table,
    operation = 'upsert',
    batchNumber = 1,
    rowCount = 0,
    httpStatus = 0,
    responseRowCount = 0,
    executionMode = currentMigrationExecutionMode,
    success = false,
    requestDuration = 0,
    error = null
  } = reqObj || {};

  const logEntry = {
    timestamp: new Date().toISOString(),
    table,
    operation,
    batchNumber,
    rowCount,
    httpStatus,
    responseRowCount,
    executionMode,
    success,
    requestDuration,
    error: error ? (error.message || String(error)) : null
  };
  liveMigrationAuditLogs.unshift(logEntry);
  if (liveMigrationAuditLogs.length > 500) liveMigrationAuditLogs.pop();
  return logEntry;
}

function getLiveMigrationAuditLogs() {
  return [...liveMigrationAuditLogs];
}

async function runLiveCloudMigrationPreflight() {
  const failures = [];
  const warnings = [];

  const config = resolveSupabaseConfiguration();
  if (!config.endpoint || !config.hasEndpoint) failures.push('Supabase endpoint URL not configured');
  if (config.projectRef !== CANONICAL_SUPABASE_PROJECT_REF) failures.push(`Project ref ${config.projectRef} does not match canonical ${CANONICAL_SUPABASE_PROJECT_REF}`);

  if (!config.key || !config.hasKey) failures.push('Supabase public publishable key not configured');
  if (!config.isExpectedProject) failures.push('Publishable key project does not match target project');
  if (config.secretDetected) failures.push('Secret server key detected in public client configuration');

  const auth = state.auth || {};
  const user = auth.user || auth.supabaseUser || {};
  const token = auth.supabaseJwt || (user && user.supabaseJwt);
  if (!auth.isAuthenticated && !token) failures.push('No authenticated Supabase user session exists');
  if (!token) failures.push('No valid Supabase user access JWT found');

  if (token) {
    const tokenParts = String(token).split('.');
    if (tokenParts.length !== 3) {
      failures.push('Access token is not a valid 3-part JWT structure');
    } else {
      try {
        const payloadStr = typeof atob === 'function' ? atob(tokenParts[1].replace(/-/g, '+').replace(/_/g, '/')) : Buffer.from(tokenParts[1], 'base64').toString('utf8');
        const payload = JSON.parse(payloadStr);
        if (payload.exp && payload.exp * 1000 < Date.now()) failures.push('Supabase access token is expired');
        if (payload.aud && payload.aud !== 'authenticated') failures.push(`Supabase token audience '${payload.aud}' is not 'authenticated'`);
        if (payload.iss && !payload.iss.includes(CANONICAL_SUPABASE_PROJECT_REF)) failures.push(`Token issuer does not match canonical project ${CANONICAL_SUPABASE_PROJECT_REF}`);
      } catch (_) {
        failures.push('Failed to parse access token JWT payload');
      }
    }
  }

  const tenantId = resolveAuthoritativeTenantId();
  if (!tenantId || tenantId === 'undefined' || tenantId === 'null') failures.push('No valid authoritative tenant UUID resolved');

  const role = String(user.role || (auth.user && auth.user.role) || '').toUpperCase();
  if (role !== 'SUPER_ADMIN' && role !== 'ADMIN' && role !== 'FINANCE_MANAGER') {
    failures.push(`User role '${role}' is not authorized to execute live cloud migration (SUPER_ADMIN required)`);
  }

  const schemaCheck = await verifyProductionSchema().catch(() => ({ compatible: false, missingTables: [] }));
  if (!schemaCheck.compatible) failures.push(`Required schema tables missing: ${schemaCheck.missingTables.join(', ')}`);

  const rlsCheck = await verifyProductionRlsMatrix().catch(() => ({ overallPassed: false }));
  if (!rlsCheck.overallPassed) failures.push('Production RLS matrix verification failed');

  const remoteInv = await inspectProductionDatabase().catch(() => ({ connected: false, totalRecords: 0 }));
  if (!remoteInv.connected) failures.push('Production database inventory failed');

  const legacyInv = await inspectLegacyLocalData().catch(() => ({ hasLegacyData: false, totalRecords: 0 }));
  if (!legacyInv || typeof legacyInv.totalRecords !== 'number') failures.push('Legacy local data inventory failed');

  if (state.databaseAuthorityState === DATABASE_AUTHORITY_STATE.AUTHORITATIVE) {
    warnings.push('Database authority is already marked AUTHORITATIVE');
  }

  const eligible = failures.length === 0;

  return {
    eligible,
    executionMode: currentMigrationExecutionMode,
    databaseTarget: currentMigrationExecutionMode === MIGRATION_EXECUTION_MODE.LIVE_CLOUD ? "SUPABASE_CLOUD" : "IN_MEMORY_MOCK",
    failures,
    warnings,
    projectRef: CANONICAL_SUPABASE_PROJECT_REF,
    role,
    legacyRecordCount: legacyInv ? legacyInv.totalRecords : 0,
    postgresRecordCount: remoteInv ? remoteInv.totalRecords : 0,
    databaseAuthority: state.databaseAuthorityState
  };
}

async function upsertProductionBatchLive(table, rows, options = {}) {
  const startTime = Date.now();
  const isLiveCloud = currentMigrationExecutionMode === MIGRATION_EXECUTION_MODE.LIVE_CLOUD;
  const items = Array.isArray(rows) ? rows : [rows];
  if (items.length === 0) return { ok: true, status: 200, count: 0, rows: [] };

  const config = resolveSupabaseConfiguration();
  if (!config.hasEndpoint || !config.hasKey) {
    const err = new Error('Supabase client is not configured');
    recordLiveMigrationRequest({ table, operation: 'upsert', rowCount: items.length, httpStatus: 0, executionMode: currentMigrationExecutionMode, success: false, error: err });
    throw err;
  }

  const endpoint = `${CANONICAL_SUPABASE_BASE_URL}/rest/v1/${table}`;
  const headers = supabaseClient.getHeaders();
  headers['Prefer'] = 'resolution=merge-duplicates,return=representation';

  if (isLiveCloud) {
    assertLiveCloudMigration();
  }

  migrationNetworkCounters.networkWritesExecuted++;

  try {
    const fetchFn = typeof fetch === 'function' ? fetch : (typeof window !== 'undefined' ? window.fetch : null);
    if (!fetchFn) throw new Error('No fetch implementation available');

    const res = await fetchFn(endpoint, {
      method: 'POST',
      headers,
      body: JSON.stringify(items)
    });

    const duration = Date.now() - startTime;
    const httpStatus = res.status;

    if (httpStatus >= 200 && httpStatus < 300) {
      let responseData = [];
      try {
        responseData = await res.json();
      } catch (_) {
        responseData = items;
      }
      const respCount = Array.isArray(responseData) ? responseData.length : items.length;
      migrationNetworkCounters.remoteRowsWritten += respCount;
      if (isLiveCloud) {
        migrationNetworkCounters.liveCloudVerified = true;
      }

      recordLiveMigrationRequest({
        table,
        operation: 'upsert',
        rowCount: items.length,
        httpStatus,
        responseRowCount: respCount,
        executionMode: currentMigrationExecutionMode,
        success: true,
        requestDuration: duration
      });

      return {
        ok: true,
        status: httpStatus,
        count: respCount,
        data: responseData,
        executionMode: currentMigrationExecutionMode,
        databaseTarget: isLiveCloud ? 'SUPABASE_CLOUD' : 'IN_MEMORY_MOCK'
      };
    } else {
      const errBody = await res.text().catch(() => '');
      const err = new Error(`PostgREST live write error on table ${table} (HTTP ${httpStatus}): ${errBody}`);
      recordLiveMigrationRequest({
        table,
        operation: 'upsert',
        rowCount: items.length,
        httpStatus,
        responseRowCount: 0,
        executionMode: currentMigrationExecutionMode,
        success: false,
        requestDuration: duration,
        error: err
      });
      throw err;
    }
  } catch (err) {
    recordLiveMigrationRequest({
      table,
      operation: 'upsert',
      rowCount: items.length,
      httpStatus: 0,
      responseRowCount: 0,
      executionMode: currentMigrationExecutionMode,
      success: false,
      requestDuration: Date.now() - startTime,
      error: err
    });
    throw err;
  }
}

async function activatePostgresAuthoritativeMode() {
  const gates = {
    supabaseConfigured: false,
    projectIdentityVerified: false,
    authenticatedSessionValid: false,
    postgreSqlReachable: false,
    postgrestReachable: false,
    requiredSchemaPresent: false,
    rlsVerified: false,
    legacyInventoryCompleted: false,
    migrationCompleted: false,
    readBackCompleted: false,
    reconciliation100Percent: false,
    noCriticalOrphans: false,
    financialArithmeticVerified: false,
    idempotencyAndSecurityPassed: false
  };

  // 1. Supabase configured
  gates.supabaseConfigured = supabaseClient.isConfigured();
  if (!gates.supabaseConfigured) {
    state.databaseAuthorityState = DATABASE_AUTHORITY_STATE.CONFIGURATION_INVALID;
    throw new Error('Authoritative Mode Activation Failed: Supabase is not configured.');
  }

  // 2. Project identity verified
  const config = resolveSupabaseConfiguration();
  gates.projectIdentityVerified = config.isExpectedProject;
  if (!gates.projectIdentityVerified) {
    state.databaseAuthorityState = DATABASE_AUTHORITY_STATE.CONFIGURATION_INVALID;
    throw new Error(`Authoritative Mode Activation Failed: Configured project ref ${config.projectRef} does not match canonical ${CANONICAL_SUPABASE_PROJECT_REF}.`);
  }

  // 3, 4, 5. Session, PostgreSQL & PostgREST reachability
  const diag = await diagnoseSupabaseProductionConnection();
  gates.authenticatedSessionValid = diag.apiKeyClassification.isValid;
  gates.postgrestReachable = diag.postgrestProbe.httpStatus !== 0;
  gates.postgreSqlReachable = diag.postgrestProbe.connected || diag.postgrestProbe.databaseState === 'DATABASE_CONNECTED' || diag.postgrestProbe.databaseState === 'DB_CONNECTED_EMPTY';

  if (!gates.postgreSqlReachable) {
    state.databaseAuthorityState = diag.postgrestProbe.httpStatus === 401
      ? DATABASE_AUTHORITY_STATE.API_KEY_INVALID
      : (diag.postgrestProbe.httpStatus === 403
        ? DATABASE_AUTHORITY_STATE.RLS_AUTHORIZATION_FAILED
        : DATABASE_AUTHORITY_STATE.DATABASE_UNAVAILABLE);
    throw new Error(`Authoritative Mode Activation Failed: PostgreSQL/PostgREST connection failed (${diag.postgrestProbe.message}).`);
  }

  // 6. Required Schema Present
  const schemaCheck = await verifyProductionSchema();
  gates.requiredSchemaPresent = schemaCheck.compatible;
  if (!gates.requiredSchemaPresent) {
    state.databaseAuthorityState = DATABASE_AUTHORITY_STATE.CONFIGURATION_INVALID;
    throw new Error(`Authoritative Mode Activation Failed: Required schema tables missing (${schemaCheck.missingTables.join(', ')}).`);
  }

  // 7. RLS Verified
  const rlsCheck = await verifyProductionRlsMatrix();
  gates.rlsVerified = rlsCheck.overallPassed;

  // 8. Legacy inventory completed
  const legacy = await inspectLegacyLocalData();
  gates.legacyInventoryCompleted = legacy && typeof legacy.totalRecords === 'number';

  // 9 & 10. Migration & Read-back completed
  const remoteInv = await inspectProductionDatabase();
  gates.migrationCompleted = (legacy.totalRecords === 0 && remoteInv.isEmpty) || (!remoteInv.isEmpty && remoteInv.totalRecords >= legacy.totalRecords);
  gates.readBackCompleted = gates.migrationCompleted;
  if (!gates.migrationCompleted && legacy.totalRecords > 0) {
    state.databaseAuthorityState = DATABASE_AUTHORITY_STATE.MIGRATION_REQUIRED;
    throw new Error('Authoritative Mode Activation Failed: Local legacy records exist but have not been migrated to PostgreSQL.');
  }

  // 11 & 12. Reconciliation = 100% and 0 critical orphans
  const recon = await reconcileProductionData();
  if (recon.authenticationRequired || recon.status === 'DATABASE_AUTHENTICATION_REQUIRED') {
    state.databaseAuthorityState = DATABASE_AUTHORITY_STATE.AUTHENTICATION_FAILED;
    throw new Error('Authoritative Mode Activation Failed: Database authentication required for reconciliation.');
  }
  gates.reconciliation100Percent = recon.reconciliationPercentage >= 100;
  gates.noCriticalOrphans = recon.criticalOrphanCount === 0;
  if (!gates.reconciliation100Percent || !gates.noCriticalOrphans) {
    state.databaseAuthorityState = DATABASE_AUTHORITY_STATE.RECONCILIATION_FAILED;
    throw new Error(`Authoritative Mode Activation Failed: Data reconciliation is ${recon.reconciliationPercentage}% with ${recon.criticalOrphanCount} critical orphans.`);
  }

  // 13. Financial arithmetic verified
  const ledgerRecon = await reconcileFinancialLedger();
  gates.financialArithmeticVerified = ledgerRecon.isBalanced;
  if (!gates.financialArithmeticVerified) {
    state.databaseAuthorityState = DATABASE_AUTHORITY_STATE.RECONCILIATION_FAILED;
    throw new Error('Authoritative Mode Activation Failed: Financial balance equations failed reconciliation check.');
  }

  // 14. Idempotency & Security scan passed
  const secAudit = runProductionSecurityAudit();
  gates.idempotencyAndSecurityPassed = Boolean(secAudit.passed || secAudit.status === 'PASS');
  if (!gates.idempotencyAndSecurityPassed) {
    state.databaseAuthorityState = DATABASE_AUTHORITY_STATE.CONFIGURATION_INVALID;
    throw new Error('Authoritative Mode Activation Failed: Production security audit failed.');
  }

  const isLiveCloud = currentMigrationExecutionMode === MIGRATION_EXECUTION_MODE.LIVE_CLOUD;
  const liveCloudVerified = isLiveCloud && migrationNetworkCounters.networkWritesExecuted > 0 && migrationNetworkCounters.networkReadsExecuted > 0 && migrationNetworkCounters.liveCloudVerified;

  if (isLiveCloud && !liveCloudVerified) {
    state.databaseAuthorityState = DATABASE_AUTHORITY_STATE.BLOCKED;
    throw new Error('Authoritative Mode Activation Failed: LIVE_CLOUD execution requires verified network writes and read-back before activating authority.');
  }

  // ALL 14 GATES PASSED
  state.databaseAuthorityState = DATABASE_AUTHORITY_STATE.AUTHORITATIVE;
  state.supabase.status = 'connected';
  state.supabase.persistenceMode = 'AUTHORITATIVE';
  state.connectionError = null;

  await logAudit('AUTHORITATIVE_MODE_ACTIVATED', 'system', 'database', 'PostgreSQL Authority', null, null, 'PostgreSQL AUTHORITATIVE MODE activated after passing all 14 production gates');

  return {
    success: true,
    authorityState: DATABASE_AUTHORITY_STATE.AUTHORITATIVE,
    message: isLiveCloud ? 'POSTGRESQL AUTHORITATIVE MODE ACTIVE (LIVE CLOUD VERIFIED)' : 'POSTGRESQL AUTHORITATIVE MODE ACTIVE (SIMULATED TEST)',
    executionMode: currentMigrationExecutionMode,
    databaseTarget: isLiveCloud ? 'SUPABASE_CLOUD' : 'IN_MEMORY_MOCK',
    truthLabel: isLiveCloud ? FORENSIC_TRUTH_LABEL.LIVE_CLOUD_AUTHORITY_CERTIFIED : FORENSIC_TRUTH_LABEL.SIMULATED_TEST_ONLY,
    networkWritesExecuted: migrationNetworkCounters.networkWritesExecuted,
    networkReadsExecuted: migrationNetworkCounters.networkReadsExecuted,
    remoteRowsWritten: migrationNetworkCounters.remoteRowsWritten,
    remoteRowsRead: migrationNetworkCounters.remoteRowsRead,
    liveCloudVerified: isLiveCloud ? liveCloudVerified : false,
    gates
  };
}

async function runSupabaseHealthCheck() {
  const configDiag = validateSupabaseConfiguration();
  if (!configDiag.hasEndpoint || !configDiag.hasKey) {
    state.databaseAuthorityState = DATABASE_AUTHORITY_STATE.CONFIGURATION_INVALID;
    return {
      success: false,
      status: 'unconfigured',
      failureClassification: DIAGNOSTIC_CLASSIFICATION.CONFIG_ERROR,
      postgrestState: DIAGNOSTIC_POSTGREST_STATE.UNCONFIGURED,
      postgresState: DIAGNOSTIC_POSTGRES_STATE.UNAVAILABLE,
      httpStatus: 0,
      latencyMs: 0,
      diagnostic: configDiag,
      message: 'Supabase URL or public anon key is not configured.'
    };
  }

  if (!configDiag.isExpectedProject) {
    state.databaseAuthorityState = DATABASE_AUTHORITY_STATE.CONFIGURATION_INVALID;
    return {
      success: false,
      status: 'config_error',
      failureClassification: DIAGNOSTIC_CLASSIFICATION.PROJECT_MISMATCH,
      postgrestState: DIAGNOSTIC_POSTGREST_STATE.ERROR,
      postgresState: DIAGNOSTIC_POSTGRES_STATE.UNAVAILABLE,
      httpStatus: 400,
      latencyMs: 0,
      diagnostic: configDiag,
      message: 'CONFIG MISMATCH: Supabase endpoint does not point to authorized project (logaawoigfxnisimfatf).'
    };
  }

  if (configDiag.isServiceRole) {
    state.databaseAuthorityState = DATABASE_AUTHORITY_STATE.API_KEY_INVALID;
    return {
      success: false,
      status: 'security_error',
      failureClassification: DIAGNOSTIC_CLASSIFICATION.CONFIG_ERROR,
      postgrestState: DIAGNOSTIC_POSTGREST_STATE.ERROR,
      postgresState: DIAGNOSTIC_POSTGRES_STATE.UNAVAILABLE,
      httpStatus: 400,
      latencyMs: 0,
      diagnostic: configDiag,
      message: 'SECURITY ERROR: Service-role key detected. Only public anon/publishable keys are permitted in browser clients.'
    };
  }

  const startTime = Date.now();
  const ep = supabaseClient.getEndpoint();

  try {
    await supabaseClient.ensureFreshSession();
    let res = await fetch(`${ep}programmes?select=id&limit=1`, {
      method: 'GET',
      headers: supabaseClient.getHeaders()
    });

    // Fallback ping table check if programmes gives 404
    if (!res.ok && res.status === 404) {
      const fallbackRes = await fetch(`${ep}schema_versions?select=version&limit=1`, {
        method: 'GET',
        headers: supabaseClient.getHeaders()
      });
      if (fallbackRes.ok) {
        res = fallbackRes;
      }
    }

    // Controlled 401 retry-once with session refresh
    if (res.status === 401) {
      try {
        const refreshed = await supabaseClient.auth.refreshSession();
        if (refreshed && refreshed.data && refreshed.data.session) {
          res = await fetch(`${ep}programmes?select=id&limit=1`, {
            method: 'GET',
            headers: supabaseClient.getHeaders()
          });
        }
      } catch (_) {}
    }

    const latencyMs = Date.now() - startTime;
    state.supabase.lastHttpStatus = res.status;
    state.supabase.lastLatencyMs = latencyMs;

    if (res.ok) {
      const data = await res.json().catch(() => []);
      state.supabase.status = 'connected';
      state.supabase.lastSuccessfulRead = new Date().toISOString();
      state.supabase.diagnosticStates = {
        auth: configDiag.authStatus,
        postgrest: DIAGNOSTIC_POSTGREST_STATE.CONNECTED,
        postgresQuery: DIAGNOSTIC_POSTGRES_STATE.QUERY_SUCCESS,
        postgresWrite: state.supabase.diagnosticStates ? state.supabase.diagnosticStates.postgresWrite : DIAGNOSTIC_POSTGRES_STATE.UNAVAILABLE
      };
      state.connectionError = null;
      return {
        success: true,
        status: 'connected',
        failureClassification: DIAGNOSTIC_CLASSIFICATION.CONNECTED,
        postgrestState: DIAGNOSTIC_POSTGREST_STATE.CONNECTED,
        postgresState: DIAGNOSTIC_POSTGRES_STATE.QUERY_SUCCESS,
        httpStatus: res.status,
        latencyMs,
        diagnostic: configDiag,
        message: `Connected (${latencyMs}ms)`
      };
    }

    const errText = await res.text().catch(() => '');
    let safeMessage = '';
    let stateEnum = DIAGNOSTIC_POSTGREST_STATE.ERROR;
    let failureClass = DIAGNOSTIC_CLASSIFICATION.HTTP_500_DATABASE_ERROR;

    if (res.status === 401) {
      stateEnum = DIAGNOSTIC_POSTGREST_STATE.UNAUTHORIZED;
      failureClass = DIAGNOSTIC_CLASSIFICATION.HTTP_401_UNAUTHORIZED;
      const isTokenErr = Boolean(errText && (errText.includes('JWT') || errText.includes('token') || errText.includes('PGRST301') || errText.includes('claim')));
      if (isTokenErr) {
        state.databaseAuthorityState = DATABASE_AUTHORITY_STATE.AUTHENTICATION_FAILED;
        safeMessage = 'Supabase user session expired or rejected. Please re-authenticate.';
        state.connectionError = '❌ HTTP 401: SUPABASE USER AUTHENTICATION EXPIRED. Your session token has expired. Database credentials are valid. Existing business data has not been modified.';
      } else {
        state.databaseAuthorityState = DATABASE_AUTHORITY_STATE.API_KEY_INVALID;
        safeMessage = 'Supabase rejected the configured public API key. Verify that the current anon/publishable key belongs to the configured Supabase project (logaawoigfxnisimfatf).';
        state.connectionError = '❌ HTTP 401: SUPABASE AUTHENTICATION / API KEY FAILURE. The configured Supabase API credential is invalid, missing, revoked, or mismatched. Existing business data has not been modified. No financial data has been changed.';
      }
    } else if (res.status === 403) {
      stateEnum = DIAGNOSTIC_POSTGREST_STATE.FORBIDDEN;
      failureClass = DIAGNOSTIC_CLASSIFICATION.HTTP_403_RLS_DENIED;
      state.databaseAuthorityState = DATABASE_AUTHORITY_STATE.RLS_AUTHORIZATION_FAILED;
      safeMessage = 'Supabase permission denied (RLS restriction). Verify tenant access permissions.';
      state.connectionError = '❌ HTTP 403: SUPABASE RLS / AUTHORIZATION FAILURE. Authentication succeeded but PostgreSQL/RLS denied access. Existing business data has not been modified. No financial data has been changed.';
    } else if (res.status === 404) {
      stateEnum = DIAGNOSTIC_POSTGREST_STATE.NOT_FOUND;
      failureClass = DIAGNOSTIC_CLASSIFICATION.HTTP_404_SCHEMA_OR_ENDPOINT;
      safeMessage = 'Supabase endpoint or table was not found. Please verify schema deployment in Supabase SQL editor.';
      state.connectionError = 'Database table not found. No financial data has been changed.';
    } else if (res.status === 409) {
      stateEnum = DIAGNOSTIC_POSTGREST_STATE.ERROR;
      failureClass = DIAGNOSTIC_CLASSIFICATION.HTTP_409_CONFLICT;
      safeMessage = 'Supabase conflict or idempotency key replay.';
      state.connectionError = 'Database conflict detected. No financial data has been changed.';
    } else if (res.status >= 500) {
      stateEnum = DIAGNOSTIC_POSTGREST_STATE.ERROR;
      failureClass = DIAGNOSTIC_CLASSIFICATION.HTTP_500_DATABASE_ERROR;
      state.databaseAuthorityState = DATABASE_AUTHORITY_STATE.DATABASE_UNAVAILABLE;
      safeMessage = `Supabase PostgreSQL server error (HTTP ${res.status}).`;
      state.connectionError = '❌ HTTP 500: POSTGRESQL / POSTGREST SERVER FAILURE. Supabase PostgreSQL server encountered an error. Existing business data has not been modified. No financial data has been changed.';
    } else {
      failureClass = DIAGNOSTIC_CLASSIFICATION.HTTP_500_DATABASE_ERROR;
      safeMessage = `HTTP ${res.status}: ${errText || res.statusText}`;
      state.connectionError = 'Database unavailable. No financial data has been changed.';
    }

    state.supabase.status = 'error';
    state.supabase.lastError = safeMessage;
    state.supabase.diagnosticStates = {
      auth: configDiag.authStatus,
      postgrest: stateEnum,
      postgresQuery: DIAGNOSTIC_POSTGRES_STATE.FAILED,
      postgresWrite: DIAGNOSTIC_POSTGRES_STATE.UNAVAILABLE
    };

    return {
      success: false,
      status: 'error',
      failureClassification: failureClass,
      postgrestState: stateEnum,
      postgresState: DIAGNOSTIC_POSTGRES_STATE.FAILED,
      httpStatus: res.status,
      latencyMs,
      diagnostic: configDiag,
      message: safeMessage
    };
  } catch (err) {
    const latencyMs = Date.now() - startTime;
    state.supabase.lastHttpStatus = 0;
    state.supabase.lastLatencyMs = latencyMs;
    const isNetwork = !err.status || (err.message && (err.message.includes('fetch') || err.message.includes('Network') || err.message.includes('Failed to fetch') || err.message.includes('ENOTFOUND') || err.message.includes('ECONNREFUSED') || err.message.includes('unreachable') || err.message.includes('ETIMEDOUT') || err.message.includes('ECONNRESET')));
    const safeMessage = isNetwork
      ? 'Unable to reach Supabase project endpoint. Check your internet connection.'
      : (err.message || 'Database connection failure');

    state.supabase.status = 'error';
    state.supabase.lastError = safeMessage;
    state.databaseAuthorityState = DATABASE_AUTHORITY_STATE.CONNECTIVITY_FAILED;
    state.supabase.diagnosticStates = {
      auth: configDiag.authStatus,
      postgrest: DIAGNOSTIC_POSTGREST_STATE.OFFLINE,
      postgresState: DIAGNOSTIC_POSTGRES_STATE.UNAVAILABLE,
      postgresWrite: DIAGNOSTIC_POSTGRES_STATE.UNAVAILABLE
    };
    state.connectionError = 'Unable to connect to the database. POSTGRESQL: DISCONNECTED — AUTHORITATIVE MODE NOT ACTIVE. Clasptek cannot currently reach its authoritative PostgreSQL database. No financial data has been changed.';

    return {
      success: false,
      status: 'network_error',
      failureClassification: isNetwork ? DIAGNOSTIC_CLASSIFICATION.NETWORK_ERROR : DIAGNOSTIC_CLASSIFICATION.HTTP_500_DATABASE_ERROR,
      postgrestState: DIAGNOSTIC_POSTGREST_STATE.OFFLINE,
      postgresState: DIAGNOSTIC_POSTGRES_STATE.UNAVAILABLE,
      httpStatus: 0,
      latencyMs,
      diagnostic: configDiag,
      message: safeMessage
    };
  }
}

async function runPersistenceProbe() {
  const health = await runSupabaseHealthCheck();
  if (!health.success) {
    return {
      success: false,
      stage: 'HEALTH_CHECK_FAILED',
      health,
      message: `Persistence probe aborted: ${health.message}`
    };
  }

  const probeId = `probe_${Date.now()}_${Math.floor(Math.random() * 10000)}`;
  const actor = state.auth && state.auth.user ? state.auth.user.name : 'Super Admin';
  const probePayload = {
    test: true,
    probeType: 'NON_DESTRUCTIVE_PERSISTENCE_VERIFICATION',
    timestamp: new Date().toISOString(),
    verifier: 'Clasptek Enterprise System'
  };

  const probeRecord = {
    id: probeId,
    tenant_id: DEFAULT_TENANT_ID,
    probe_id: probeId,
    created_at: new Date().toISOString(),
    created_by: actor,
    payload: probePayload,
    expires_at: new Date(Date.now() + 3600 * 1000).toISOString()
  };

  const startTime = Date.now();
  let writeSuccess = false;
  let readSuccess = false;
  let verifySuccess = false;
  let deleteSuccess = false;

  try {
    // 1. WRITE PROBE
    let targetTable = 'system_diagnostics';
    let insertRes = await supabaseClient.from(targetTable).insert(probeRecord);

    if (insertRes.error && insertRes.status === 404) {
      targetTable = 'management_metrics';
      const metricProbe = {
        id: probeId,
        tenant_id: DEFAULT_TENANT_ID,
        metric_name: 'PERSISTENCE_PROBE',
        metric_type: 'probe',
        period_type: 'daily',
        period_key: new Date().toISOString().slice(0, 10),
        metric_values: probePayload,
        calculated_at: new Date().toISOString()
      };
      insertRes = await supabaseClient.from(targetTable).insert(metricProbe);
    }

    if (insertRes.error) {
      throw new Error(`Probe WRITE failed on ${targetTable}: ${insertRes.error.message || JSON.stringify(insertRes.error)}`);
    }
    writeSuccess = true;

    // 2. READ BACK PROBE
    const readRes = await supabaseClient.from(targetTable).select('*');
    if (readRes.error) {
      throw new Error(`Probe READ BACK failed on ${targetTable}: ${readRes.error.message || JSON.stringify(readRes.error)}`);
    }
    readSuccess = true;

    // 3. VERIFY PROBE
    const readList = Array.isArray(readRes.data) ? readRes.data : [readRes.data].filter(Boolean);
    const foundProbe = readList.find(r => r && (r.id === probeId || r.probe_id === probeId));
    if (!foundProbe) {
      throw new Error(`Probe VERIFICATION failed: Record ${probeId} was not found in read-back dataset.`);
    }
    verifySuccess = true;

    // 4. DELETE PROBE ONLY (Non-destructive cleanup)
    const deleteRes = await supabaseClient.from(targetTable).delete({ id: probeId });
    if (deleteRes.error) {
      console.warn(`Probe cleanup notice: Delete on ${targetTable} returned:`, deleteRes.error);
    }
    deleteSuccess = true;

    const latencyMs = Date.now() - startTime;
    state.supabase.status = 'connected';
    state.supabase.persistenceMode = 'AUTHORITATIVE';
    state.supabase.lastSuccessfulRead = new Date().toISOString();
    state.supabase.lastSuccessfulWrite = new Date().toISOString();
    if (state.supabase.diagnosticStates) {
      state.supabase.diagnosticStates.postgresWrite = DIAGNOSTIC_POSTGRES_STATE.WRITE_SUCCESS;
    }
    state.connectionError = null;

    return {
      success: true,
      stages: {
        write: writeSuccess,
        read: readSuccess,
        verify: verifySuccess,
        cleanup: deleteSuccess
      },
      writeSuccess,
      readSuccess,
      verifySuccess,
      deleteSuccess,
      targetTable,
      probeId,
      latencyMs,
      postgresState: DIAGNOSTIC_POSTGRES_STATE.WRITE_SUCCESS,
      message: `Live persistence probe SUCCEEDED (${latencyMs}ms). Write ➔ Read ➔ Verify ➔ Clean Up completed with 100% data integrity. PostgreSQL persistence is AUTHORITATIVE.`
    };
  } catch (probeErr) {
    return {
      success: false,
      stages: {
        write: writeSuccess,
        read: readSuccess,
        verify: verifySuccess,
        cleanup: deleteSuccess
      },
      writeSuccess,
      readSuccess,
      verifySuccess,
      deleteSuccess,
      error: probeErr.message,
      message: `Persistence probe FAILED: ${probeErr.message}`
    };
  }
}

const dbRepo = {
  async saveRecord(storeKey, record, idField = 'id') {
    const tableName = DB_TABLE_MAPPING[storeKey];
    if (supabaseClient.isConfigured() && tableName) {
      const { data, error } = await supabaseClient.from(tableName).upsert(record, idField);
      if (error) {
        console.error(`PostgreSQL save error on table ${tableName}:`, error);
        state.supabase.lastError = `Save failed on ${tableName}: ${error.message || JSON.stringify(error)}`;
        state.connectionError = `Unable to connect to the database. Please check your connection. No financial data has been changed. (${error.message || 'Database write error'})`;
        throw new Error(state.connectionError);
      }
      state.supabase.lastSuccessfulWrite = new Date().toISOString();
      state.supabase.status = 'connected';
      state.connectionError = null;
    }
  },

  async deleteRecord(storeKey, id, idField = 'id') {
    const tableName = DB_TABLE_MAPPING[storeKey];
    if (supabaseClient.isConfigured() && tableName) {
      const { error } = await supabaseClient.from(tableName).delete({ [idField]: id });
      if (error) {
        console.error(`PostgreSQL delete error on table ${tableName}:`, error);
        state.connectionError = `Unable to delete record from database: ${error.message || 'Database error'}`;
        throw new Error(state.connectionError);
      }
      state.supabase.lastSuccessfulWrite = new Date().toISOString();
    }
  },

  async fetchAuthoritativeTable(storeKey) {
    const tableName = DB_TABLE_MAPPING[storeKey];
    if (!supabaseClient.isConfigured() || !tableName) {
      return { success: false, reason: 'unconfigured' };
    }
    const { data, error } = await supabaseClient.from(tableName).select('*');
    if (error) {
      return { success: false, reason: 'error', error };
    }
    return { success: true, data: Array.isArray(data) ? data : [data].filter(Boolean) };
  }
};

async function safeGet(key, fallback) {
  try {
    if (typeof window !== 'undefined' && window.storage && typeof window.storage.get === 'function') {
      const res = await window.storage.get(key, SHARED);
      return res && res.value ? JSON.parse(res.value) : fallback;
    } else if (typeof localStorage !== 'undefined') {
      const item = localStorage.getItem(key);
      return item ? JSON.parse(item) : fallback;
    }
    return fallback;
  } catch (e) {
    return fallback;
  }
}

async function safeSet(key, value) {
  try {
    // 1. Secondary Cache Persistence
    if (typeof window !== 'undefined' && window.storage && typeof window.storage.set === 'function') {
      await window.storage.set(key, JSON.stringify(value), SHARED);
    } else if (typeof localStorage !== 'undefined') {
      localStorage.setItem(key, JSON.stringify(value));
    }
  } catch (e) {
    // headless environment fallback
  }

  // 2. Authoritative PostgreSQL Replication
  try {
    const tableName = DB_TABLE_MAPPING[key];
    if (supabaseClient.isConfigured() && tableName && value !== null && typeof value !== 'undefined') {
      if (Array.isArray(value)) {
        if (value.length > 0) {
          await supabaseClient.from(tableName).upsert(value);
          state.supabase.lastSuccessfulWrite = new Date().toISOString();
          state.supabase.status = 'connected';
        }
      } else if (typeof value === 'object') {
        await supabaseClient.from(tableName).upsert(value);
        state.supabase.lastSuccessfulWrite = new Date().toISOString();
        state.supabase.status = 'connected';
      }
    }
  } catch (dbErr) {
    console.warn(`SafeSet DB sync non-fatal error for ${key}:`, dbErr.message);
  }
}

function sanitizeAuditPayload(val) {
  if (!val) return null;
  if (typeof val === 'string') {
    return val
      .replace(/password\s*[:=]\s*["']?[^,"'}\s]+/gi, 'password: [REDACTED]')
      .replace(/token\s*[:=]\s*["']?[^,"'}\s]+/gi, 'token: [REDACTED]')
      .replace(/key\s*[:=]\s*["']?[^,"'}\s]+/gi, 'key: [REDACTED]');
  }
  if (typeof val === 'object') {
    try {
      const clone = JSON.parse(JSON.stringify(val));
      const redactKeys = ['password', 'pwd', 'passwordhash', 'salt', 'apikey', 'anonkey', 'token', 'invitationtoken', 'resettoken', 'sessiontoken', 'secret'];
      const traverse = (obj) => {
        if (!obj || typeof obj !== 'object') return;
        Object.keys(obj).forEach(k => {
          if (redactKeys.some(rk => k.toLowerCase().includes(rk))) {
            obj[k] = '[REDACTED]';
          } else if (typeof obj[k] === 'object') {
            traverse(obj[k]);
          }
        });
      };
      traverse(clone);
      return JSON.stringify(clone);
    } catch (e) {
      return '[COMPLEX_OBJECT]';
    }
  }
  return String(val);
}

async function logAudit(action, entityType, entityId, reference, previousValue, newValue, reason = '') {
  const actorRole = state.auth && state.auth.user ? state.auth.user.role : 'System';
  const actorName = state.auth && state.auth.user ? `${state.auth.user.name} (${state.auth.user.email})` : 'System';

  const entry = {
    id: 'audit_' + Date.now() + '_' + Math.floor(Math.random() * 1000),
    tenant_id: DEFAULT_TENANT_ID,
    action,
    entityType,
    entityId,
    reference: reference || 'N/A',
    previousValue: sanitizeAuditPayload(previousValue),
    newValue: sanitizeAuditPayload(newValue),
    reason: reason || 'Standard operation',
    performedBy: actorName,
    role: actorRole,
    source: 'app_ledger',
    performedAt: new Date().toISOString()
  };
  state.auditLog.unshift(entry);
  await safeSet(STORE_KEY_AUDIT_LOG, state.auditLog);
}

function resolveAuthoritativeTenantId() {
  const supaUser = state.auth?.supabaseUser || state.auth?.supabaseSession?.user;
  if (supaUser) {
    if (supaUser.app_metadata?.tenant_id) return supaUser.app_metadata.tenant_id;
    if (supaUser.user_metadata?.tenant_id) return supaUser.user_metadata.tenant_id;
    if (supaUser.tenant_id && supaUser.tenant_id !== 'clasptek_main') return supaUser.tenant_id;
  }
  const user = state.auth?.user;
  if (user) {
    if (user.app_metadata?.tenant_id) return user.app_metadata.tenant_id;
    if (user.user_metadata?.tenant_id) return user.user_metadata.tenant_id;
    if (user.tenant_id && user.tenant_id !== 'clasptek_main') return user.tenant_id;
  }
  return state.auth?.user?.tenant_id || 'clasptek_main';
}

    const tableMap = {};
    REQUIRED_PRODUCTION_TABLES.forEach(t => {
      tableMap[t] = { table: t, status: 0, accessible: false, rowCount: null, errorClassification: 'NOT_CONFIGURED' };
    });
    return {
      connected: false,
      authenticated: false,
      isConfigured: false,
      projectRef: config.projectRef || CANONICAL_SUPABASE_PROJECT_REF,
      totalConfirmedRemoteRecords: 0,
      totalRecords: 0,
      databaseEmpty: false,
      isEmpty: false,
      inaccessibleTables: REQUIRED_PRODUCTION_TABLES.map(t => tableMap[t]),
      tablesFound: [],
      tablesMissing: REQUIRED_PRODUCTION_TABLES,
      failedQueries: REQUIRED_PRODUCTION_TABLES.length,
      hasErrors: true,
      counts: {},
      tables: tableMap,
      error: 'Supabase client is not configured'
    };
  }

  const counts = {};
  const tables = {};
  const tablesFound = [];
  const tablesMissing = [];
  const inaccessibleTables = [];
  let totalConfirmedRemoteRecords = 0;
  let failedQueries = 0;

  await Promise.all(REQUIRED_PRODUCTION_TABLES.map(async (table) => {
    try {
      const res = await supabaseClient.from(table).select('*');
      const status = res ? (res.status || (res.ok ? 200 : (res.httpStatus || 0))) : 0;
      
      if (status === 200 && Array.isArray(res.data)) {
        const count = res.data.length;
        counts[table] = count;
        totalConfirmedRemoteRecords += count;
        tablesFound.push(table);
        tables[table] = {
          table,
          status: 200,
          accessible: true,
          rowCount: count,
          errorClassification: null
        };
      } else {
        let errClass = 'POSTGRES_ERROR';
        if (status === 401) errClass = 'AUTHENTICATION_FAILED';
        else if (status === 403) errClass = 'RLS_DENIED';
        else if (status === 404) errClass = 'TABLE_NOT_FOUND';
        else if (status >= 500) errClass = 'POSTGRES_ERROR';

        counts[table] = null; // Strictly null on access denial / error
        tablesMissing.push(table);
        failedQueries++;
        const tableEntry = {
          table,
          status,
          accessible: false,
          rowCount: null,
          errorClassification: errClass
        };
        tables[table] = tableEntry;
        inaccessibleTables.push(tableEntry);
      }
    } catch (err) {
      counts[table] = null;
      tablesMissing.push(table);
      failedQueries++;
      const tableEntry = {
        table,
        status: 0,
        accessible: false,
        rowCount: null,
        errorClassification: 'NETWORK_ERROR',
        error: err.message
      };
      tables[table] = tableEntry;
      inaccessibleTables.push(tableEntry);
    }
  }));

  const allTablesAccessible = failedQueries === 0 && tablesFound.length === REQUIRED_PRODUCTION_TABLES.length;
  const databaseEmpty = allTablesAccessible && totalConfirmedRemoteRecords === 0;

  return {
    connected: tablesFound.length > 0,
    authenticated: inaccessibleTables.every(t => t.status !== 401),
    isConfigured: true,
    projectRef: config.projectRef || CANONICAL_SUPABASE_PROJECT_REF,
    totalConfirmedRemoteRecords,
    totalRecords: totalConfirmedRemoteRecords,
    databaseEmpty,
    isEmpty: databaseEmpty,
    inaccessibleTables,
    tablesFound,
    tablesMissing,
    failedQueries,
    hasErrors: failedQueries > 0,
    counts,
    tables
  };
}

  const counts = {};
