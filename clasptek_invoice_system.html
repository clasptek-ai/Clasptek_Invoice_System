<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Clasptek Portal</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      /* Primary Brand & Accent Palette */
      --primary: #14213D;
      --primary-hover: #1f325c;
      --primary-light: #F1F5F9;
      --accent: #C1272D;
      --accent-hover: #a51f25;
      --accent-light: #FEF2F2;
      
      /* Semantic Status Colors */
      --success: #107C41;
      --success-bg: #EAF7EE;
      --success-border: #BBF7D0;
      --warning: #B25E02;
      --warning-bg: #FFF4E5;
      --warning-border: #FDE68A;
      --danger: #D13438;
      --danger-bg: #FDE7E9;
      --danger-border: #FECACA;
      --info: #0078D4;
      --info-bg: #EFF6FC;
      --info-border: #BFDBFE;
      
      /* Surfaces & Neutral Backgrounds */
      --neutral-bg: #F8F9FA;
      --surface-0: #FFFFFF;
      --surface-1: #FFFFFF;
      --surface-2: #F4F5F7;
      --surface-3: #E2E8F0;
      --border: #E2E8F0;
      --border-strong: #CBD5E1;
      
      /* Content Typography Palette */
      --text-primary: #0F172A;
      --text-secondary: #475569;
      --text-muted: #94A3B8;
      
      /* Corner Radius Standards */
      --radius-xs: 4px;
      --radius-sm: 6px;
      --radius-md: 10px;
      --radius-lg: 14px;
      --radius-pill: 9999px;
      
      /* Elevation Shadows */
      --shadow-xs: 0 1px 2px rgba(0,0,0,0.04);
      --shadow-sm: 0 1px 3px rgba(0,0,0,0.06), 0 1px 2px rgba(0,0,0,0.04);
      --shadow-md: 0 4px 6px -1px rgba(0,0,0,0.08), 0 2px 4px -1px rgba(0,0,0,0.04);
      --shadow-lg: 0 10px 15px -3px rgba(0,0,0,0.1), 0 4px 6px -2px rgba(0,0,0,0.05);
      --shadow-xl: 0 20px 25px -5px rgba(0,0,0,0.15), 0 10px 10px -5px rgba(0,0,0,0.04);
      
      /* Global Design System Typography Tokens */
      --font-sans: 'Inter', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      --font-mono: 'JetBrains Mono', 'SF Mono', Consolas, Monaco, monospace;
      
      --font-size-2xs: 10px;
      --font-size-xs: 11px;
      --font-size-sm: 12px;
      --font-size-base: 13px;
      --font-size-md: 14.5px;
      --font-size-lg: 16px;
      --font-size-xl: 20px;
      --font-size-2xl: 24px;
      
      --font-weight-regular: 400;
      --font-weight-medium: 500;
      --font-weight-semibold: 600;
      --font-weight-bold: 700;
      --font-weight-extrabold: 800;
      --font-weight-black: 900;
      
      --line-height-tight: 1.25;
      --line-height-normal: 1.5;
      --line-height-relaxed: 1.65;
      
      --sidebar-width: 260px;
      --sidebar-collapsed-width: 72px;
      --header-height: 64px;
    }

    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: inherit;
    }
    
    html, body {
      background: var(--neutral-bg);
      color: var(--text-primary);
      font-family: var(--font-sans);
      font-size: var(--font-size-base);
      line-height: var(--line-height-normal);
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      text-rendering: optimizeLegibility;
    }

    button, input, select, textarea, optgroup {
      font-family: var(--font-sans);
    }
    
    code, kbd, samp, pre, .cp-mono, .cp-acc-num, .cp-ref-num, .cp-doc-no {
      font-family: var(--font-mono);
    }

    #root { min-height: 100vh; display: flex; }

    /* Main App Layout */
    .cp-layout { display: flex; width: 100%; min-height: 100vh; }

    /* Left Sidebar */
    .cp-sidebar {
      width: var(--sidebar-width);
      background: #FFFFFF;
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      position: sticky;
      top: 0;
      height: 100vh;
      transition: width 0.2s ease;
      z-index: 100;
      flex-shrink: 0;
    }

    .cp-sidebar.collapsed { width: var(--sidebar-collapsed-width); }
    .cp-sidebar.collapsed .cp-sidebar-brand-text,
    .cp-sidebar.collapsed .cp-nav-label,
    .cp-sidebar.collapsed .cp-nav-section-title,
    .cp-sidebar.collapsed .cp-user-info-text,
    .cp-sidebar.collapsed .cp-conn-text { display: none; }
    .cp-sidebar.collapsed .cp-sidebar-header { justify-content: center; padding: 16px 8px; }
    .cp-sidebar.collapsed .cp-nav-item { justify-content: center; padding: 10px; }

    .cp-sidebar-header { padding: 18px 16px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid var(--border); gap: 10px; }
    .cp-sidebar-brand { display: flex; align-items: center; gap: 10px; text-decoration: none; color: inherit; }
    .cp-sidebar-logo { height: 34px; width: auto; object-fit: contain; }
    .cp-sidebar-brand-text { display: flex; flex-direction: column; }
    .cp-brand-name { font-size: var(--font-size-base); font-weight: var(--font-weight-bold); color: var(--primary); line-height: 1.2; }
    .cp-brand-sub { font-size: var(--font-size-2xs); color: var(--text-muted); font-weight: var(--font-weight-medium); }

    .cp-collapse-btn {
      background: transparent; border: 1px solid var(--border); border-radius: var(--radius-sm);
      color: var(--text-secondary); width: 28px; height: 28px; cursor: pointer;
      display: flex; align-items: center; justify-content: center; font-size: var(--font-size-base); transition: all 0.15s ease;
    }
    .cp-collapse-btn:hover { background: var(--surface-2); color: var(--primary); }

    /* Navigation Menu */
    .cp-sidebar-nav { flex: 1; overflow-y: auto; padding: 14px 10px; }
    .cp-nav-section { margin-bottom: 16px; }
    .cp-nav-section-title { font-size: var(--font-size-2xs); font-weight: var(--font-weight-bold); color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.6px; padding: 4px 10px 6px; }

    .cp-nav-item {
      display: flex; align-items: center; gap: 10px; padding: 8.5px 12px;
      border-radius: var(--radius-sm); color: var(--text-secondary); font-size: var(--font-size-base); font-weight: var(--font-weight-medium);
      cursor: pointer; text-decoration: none; transition: all 0.15s ease; margin-bottom: 2px; user-select: none;
      position: relative;
    }
    .cp-nav-item:hover { background: var(--surface-2); color: var(--primary); }
    .cp-nav-item.active { background: var(--info-bg); color: var(--info); font-weight: var(--font-weight-semibold); }
    .cp-nav-icon { font-size: var(--font-size-lg); width: 20px; text-align: center; display: inline-flex; justify-content: center; }
    .cp-nav-label { flex: 1; white-space: nowrap; }
    .cp-nav-badge {
      background: var(--surface-2); color: var(--text-secondary); font-size: var(--font-size-xs); font-weight: var(--font-weight-bold);
      padding: 1px 6px; border-radius: 10px;
    }
    .cp-nav-item.active .cp-nav-badge { background: var(--info); color: #FFFFFF; }

    /* Sidebar Footer */
    .cp-sidebar-footer { padding: 14px; border-top: 1px solid var(--border); background: #FFFFFF; display: flex; flex-direction: column; gap: 10px; }
    .cp-conn-pill {
      display: flex; align-items: center; gap: 6px; font-size: var(--font-size-xs); color: var(--text-secondary);
      background: var(--surface-2); padding: 5px 8px; border-radius: var(--radius-sm);
    }
    .cp-conn-dot { width: 7px; height: 7px; border-radius: 50%; display: inline-block; }
    .cp-conn-dot.connected { background: var(--success); box-shadow: 0 0 0 2px var(--success-bg); }
    .cp-conn-dot.fallback { background: var(--warning); }

    .cp-user-card { display: flex; align-items: center; justify-content: space-between; }
    .cp-user-info { display: flex; align-items: center; gap: 8px; overflow: hidden; }
    .cp-user-avatar {
      width: 32px; height: 32px; border-radius: 50%; background: var(--primary); color: #FFFFFF;
      display: flex; align-items: center; justify-content: center; font-size: var(--font-size-sm); font-weight: var(--font-weight-bold); flex-shrink: 0;
    }
    .cp-user-info-text { display: flex; flex-direction: column; overflow: hidden; }
    .cp-user-name { font-size: var(--font-size-sm); font-weight: var(--font-weight-semibold); color: var(--primary); white-space: nowrap; text-overflow: ellipsis; overflow: hidden; }
    .cp-user-role { font-size: var(--font-size-2xs); color: var(--text-muted); }
    .cp-signout-btn {
      background: transparent; border: none; color: var(--text-muted); cursor: pointer;
      padding: 6px; border-radius: var(--radius-sm); font-size: var(--font-size-base);
    }
    .cp-signout-btn:hover { color: var(--danger); background: var(--danger-bg); }

    /* Main Area */
    .cp-main-area { flex: 1; display: flex; flex-direction: column; min-width: 0; }

    /* Topbar Header */
    .cp-topbar {
      height: var(--header-height);
      background: #FFFFFF;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 24px;
      position: sticky;
      top: 0;
      z-index: 90;
    }
    .cp-topbar-left { display: flex; align-items: center; gap: 16px; flex: 1; max-width: 600px; }
    .cp-breadcrumb { font-size: var(--font-size-base); color: var(--text-muted); display: flex; align-items: center; gap: 6px; white-space: nowrap; }
    .cp-breadcrumb strong { color: var(--primary); font-weight: var(--font-weight-semibold); }

    .cp-omni-search {
      position: relative; flex: 1; max-width: 440px; margin-left: 12px;
    }
    .cp-omni-input {
      width: 100%; height: 36px; background: var(--surface-2); border: 1px solid transparent;
      border-radius: var(--radius-sm); padding: 0 12px 0 34px; font-size: var(--font-size-sm); color: var(--text-primary);
      transition: all 0.15s ease;
    }
    .cp-omni-input:focus { background: #FFFFFF; border-color: var(--info); outline: none; box-shadow: 0 0 0 3px var(--info-bg); }
    .cp-omni-icon { position: absolute; left: 10px; top: 50%; transform: translateY(-50%); font-size: var(--font-size-base); color: var(--text-muted); }

    .cp-search-dropdown {
      position: absolute; top: calc(100% + 4px); left: 0; right: 0; background: #FFFFFF;
      border: 1px solid var(--border); border-radius: var(--radius-md); box-shadow: var(--shadow-lg);
      max-height: 380px; overflow-y: auto; display: none; z-index: 200;
    }
    .cp-search-dropdown.active { display: block; }
    .cp-search-result-item {
      padding: 10px 14px; border-bottom: 1px solid var(--border); cursor: pointer;
      display: flex; justify-content: space-between; align-items: center; font-size: var(--font-size-sm);
    }
    .cp-search-result-item:hover { background: var(--surface-2); }
    .cp-search-result-item:last-child { border-bottom: none; }

    .cp-topbar-right { display: flex; align-items: center; gap: 12px; }

    /* Action Dropdown */
    .cp-dropdown-wrap { position: relative; }
    .cp-dropdown-menu {
      position: absolute; right: 0; top: calc(100% + 6px); background: #FFFFFF;
      border: 1px solid var(--border); border-radius: var(--radius-md); box-shadow: var(--shadow-lg);
      min-width: 200px; padding: 6px; display: none; z-index: 200;
    }
    .cp-dropdown-menu.active { display: block; }
    .cp-dropdown-item {
      padding: 8px 12px; font-size: var(--font-size-sm); color: var(--text-primary); border-radius: var(--radius-sm);
      cursor: pointer; display: flex; align-items: center; gap: 8px; transition: background 0.1s ease;
    }
    .cp-dropdown-item:hover { background: var(--surface-2); color: var(--primary); }

    .cp-role-tag {
      display: flex; align-items: center; gap: 6px; padding: 5px 10px;
      background: var(--surface-2); border: 1px solid var(--border); border-radius: var(--radius-sm);
      font-size: var(--font-size-sm); font-weight: var(--font-weight-semibold); color: var(--primary);
    }

    /* Content Area */
    /* Mobile Navigation & Sidebar Backdrop */
    .cp-sidebar-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(15, 23, 42, 0.55);
      backdrop-filter: blur(2px);
      z-index: 1050;
      display: none;
      opacity: 0;
      transition: opacity 0.2s ease;
    }
    .cp-sidebar-backdrop.active {
      display: block;
      opacity: 1;
    }

    .cp-mobile-nav-btn {
      display: none;
      background: var(--surface-2);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      width: 36px;
      height: 36px;
      align-items: center;
      justify-content: center;
      font-size: var(--font-size-lg);
      color: var(--primary);
      cursor: pointer;
      flex-shrink: 0;
      transition: all 0.15s ease;
    }
    .cp-mobile-nav-btn:hover {
      background: var(--border);
    }

    /* Content Area */
    .cp-content-view { padding: 24px; flex: 1; }

    /* UI Cards & Tables */
    .cp-card {
      background: #FFFFFF; border: 1px solid var(--border); border-radius: var(--radius-md);
      box-shadow: var(--shadow-sm); padding: 20px; margin-bottom: 20px;
    }
    .cp-card-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; gap: 12px; }
    .cp-section-title { font-size: var(--font-size-lg); font-weight: var(--font-weight-bold); color: var(--primary); display: flex; align-items: center; gap: 8px; }
    .cp-section-desc { font-size: var(--font-size-sm); color: var(--text-secondary); margin-top: 2px; }

    .cp-grid-4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; margin-bottom: 20px; }
    .cp-grid-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; margin-bottom: 20px; }
    .cp-grid-2 { display: grid; grid-template-columns: repeat(2, 1fr); gap: 16px; margin-bottom: 20px; }

    .cp-kpi-card {
      background: #FFFFFF; border: 1px solid var(--border); border-radius: var(--radius-md);
      padding: 16px 18px; box-shadow: var(--shadow-sm); display: flex; flex-direction: column; gap: 4px;
    }
    .cp-kpi-label { font-size: var(--font-size-xs); font-weight: var(--font-weight-semibold); color: var(--text-secondary); text-transform: uppercase; letter-spacing: 0.4px; }
    .cp-kpi-val { font-size: var(--font-size-xl); font-weight: var(--font-weight-extrabold); color: var(--primary); }
    .cp-kpi-sub { font-size: var(--font-size-xs); color: var(--text-muted); }

    /* Tables */
    .cp-table-wrap {
      width: 100%;
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
    }
    .cp-table { width: 100%; border-collapse: collapse; text-align: left; font-size: var(--font-size-sm); }
    .cp-table th {
      background: var(--surface-2); color: var(--text-secondary); font-weight: var(--font-weight-bold);
      padding: 10px 14px; border-bottom: 1px solid var(--border); text-transform: uppercase; font-size: var(--font-size-xs); letter-spacing: 0.5px;
      white-space: nowrap;
    }
    .cp-table td { padding: 11px 14px; border-bottom: 1px solid var(--border); color: var(--text-primary); vertical-align: middle; }
    .cp-table tr:last-child td { border-bottom: none; }
    .cp-table tr:hover td { background: #FAFBFD; }

    /* Status Pills */
    .cp-pill {
      display: inline-flex; align-items: center; gap: 4px; padding: 3px 8px;
      border-radius: var(--radius-pill); font-size: var(--font-size-2xs); font-weight: var(--font-weight-bold); text-transform: uppercase; letter-spacing: 0.4px;
      white-space: nowrap;
    }
    .cp-pill.paid, .cp-pill.approved, .cp-pill.fully_paid, .cp-pill.active { background: var(--success-bg); color: var(--success); }
    .cp-pill.unpaid, .cp-pill.draft, .cp-pill.payment_pending { background: var(--warning-bg); color: var(--warning); }
    .cp-pill.partial, .cp-pill.partially_paid { background: #FEF3C7; color: #92400E; }
    .cp-pill.overdue, .cp-pill.cancelled, .cp-pill.lost { background: var(--danger-bg); color: var(--danger); }
    .cp-pill.new, .cp-pill.interested, .cp-pill.category-pill { background: var(--info-bg); color: var(--info); }
    .cp-pill.prio-critical { background: var(--danger-bg); color: var(--danger); }
    .cp-pill.prio-high { background: var(--warning-bg); color: var(--warning); }
    .cp-pill.prio-medium { background: #FEF3C7; color: #92400E; }
    .cp-pill.prio-low { background: var(--surface-2); color: var(--text-secondary); }

    /* Buttons */
    .cp-btn {
      display: inline-flex; align-items: center; justify-content: center; gap: 6px;
      padding: 7.5px 14px; font-size: var(--font-size-sm); font-weight: var(--font-weight-semibold); border-radius: var(--radius-sm);
      cursor: pointer; transition: all 0.15s ease; border: 1px solid transparent; text-decoration: none;
      touch-action: manipulation;
    }
    .cp-btn.primary { background: var(--primary); color: #FFFFFF; }
    .cp-btn.primary:hover { background: var(--primary-hover); }
    .cp-btn.accent { background: var(--accent); color: #FFFFFF; }
    .cp-btn.accent:hover { background: var(--accent-hover); }
    .cp-btn.secondary { background: #FFFFFF; border-color: var(--border-strong); color: var(--text-primary); }
    .cp-btn.secondary:hover { background: var(--surface-2); border-color: var(--text-secondary); }
    .cp-btn.danger { background: var(--danger-bg); color: var(--danger); border-color: #F87171; }
    .cp-btn.danger:hover { background: var(--danger); color: #FFFFFF; }
    .cp-btn.success { background: var(--success); color: #FFFFFF; }
    .cp-btn.success:hover { opacity: 0.9; }
    .cp-btn.sm { padding: 5px 10px; font-size: var(--font-size-xs); }

    /* Form Fields */
    .cp-field { margin-bottom: 12px; display: flex; flex-direction: column; gap: 4px; }
    .cp-field label { font-size: var(--font-size-xs); font-weight: var(--font-weight-semibold); color: var(--text-secondary); }
    .cp-field input, .cp-field select, .cp-field textarea {
      padding: 8px 10px; font-size: var(--font-size-sm); border: 1px solid var(--border-strong);
      border-radius: var(--radius-sm); background: #FFFFFF; color: var(--text-primary); font-family: inherit;
    }
    .cp-field input:focus, .cp-field select:focus, .cp-field textarea:focus {
      outline: none; border-color: var(--info); box-shadow: 0 0 0 3px var(--info-bg);
    }
    .cp-row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .cp-row3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 12px; }
    .cp-row4 { display: grid; grid-template-columns: 2fr 1fr 1fr 1fr auto; gap: 8px; align-items: flex-end; }

    /* Modals */
    .cp-modal-overlay {
      position: fixed; inset: 0; background: rgba(15, 23, 42, 0.6); backdrop-filter: blur(2px);
      display: flex; align-items: center; justify-content: center; z-index: 1000; padding: 20px;
    }
    .cp-modal {
      background: #FFFFFF; border-radius: var(--radius-lg); width: 100%; max-width: 600px;
      max-height: 90vh; display: flex; flex-direction: column; box-shadow: var(--shadow-lg); overflow: hidden;
    }
    .cp-modal.large { max-width: 850px; }
    .cp-modal.doc-modal { max-width: 900px; }
    .cp-modal.drawer { max-width: 540px; height: 100vh; max-height: 100vh; position: fixed; right: 0; top: 0; border-radius: 0; }
    .cp-modal-header { padding: 14px 18px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; background: #FAFBFD; }
    .cp-modal-title { font-size: var(--font-size-md); font-weight: var(--font-weight-bold); color: var(--primary); }
    .cp-modal-close { background: transparent; border: none; font-size: var(--font-size-xl); cursor: pointer; color: var(--text-muted); padding: 4px; }
    .cp-modal-close:hover { color: var(--danger); }
    .cp-modal-body { padding: 18px; overflow-y: auto; flex: 1; -webkit-overflow-scrolling: touch; }
    .cp-modal-footer { padding: 12px 18px; border-top: 1px solid var(--border); display: flex; justify-content: flex-end; gap: 10px; background: #FAFBFD; }

    /* Clean, Professional Corporate Authentication UI */
    .cp-auth-wrap {
      min-height: 100vh;
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      background: radial-gradient(circle at 50% 20%, #1E293B 0%, #0F172A 70%, #090D16 100%);
      padding: 24px 16px;
      box-sizing: border-box;
    }
    .cp-auth-card {
      background: #FFFFFF;
      border: 1px solid rgba(226, 232, 240, 0.9);
      border-radius: 12px;
      box-shadow: 0 20px 40px -5px rgba(0, 0, 0, 0.4), 0 10px 20px -5px rgba(0, 0, 0, 0.2);
      width: 100%;
      max-width: 440px;
      padding: 36px 32px 28px;
      box-sizing: border-box;
      position: relative;
    }
    .cp-auth-header {
      text-align: center;
      margin-bottom: 22px;
    }
    .cp-auth-logo-wrap {
      display: flex;
      justify-content: center;
      align-items: center;
      margin-bottom: 18px;
    }
    .cp-auth-logo {
      max-width: 250px;
      width: 100%;
      height: auto;
      max-height: 80px;
      object-fit: contain;
      display: block;
    }
    .cp-auth-title {
      font-size: var(--font-size-xl);
      font-weight: var(--font-weight-extrabold);
      color: var(--primary);
      letter-spacing: -0.3px;
      margin-bottom: 4px;
    }
    .cp-auth-sub {
      font-size: var(--font-size-base);
      color: var(--text-secondary);
      line-height: var(--line-height-normal);
    }
    .cp-auth-alert {
      padding: 10px 12px;

// ----------------------------------------------------
// CRYPTOGRAPHIC AUTHENTICATION & PASSWORD UTILITIES
// ----------------------------------------------------
async function sha256Hex(str) {
  if (typeof crypto !== 'undefined' && crypto.subtle && typeof TextEncoder !== 'undefined') {
    const msgBuffer = new TextEncoder().encode(str);
    const hashBuffer = await crypto.subtle.digest('SHA-256', msgBuffer);
    const hashArray = Array.from(new Uint8Array(hashBuffer));
    return hashArray.map(b => b.toString(16).padStart(2, '0')).join('');
  }
  if (typeof require !== 'undefined') {
    try {
      const nodeCrypto = require('crypto');
      return nodeCrypto.createHash('sha256').update(str).digest('hex');
    } catch (e) {}
  }
  // Deterministic fallback for non-crypto headless environments
  let h0 = 0x6a09e667, h1 = 0xbb67ae85, h2 = 0x3c6ef372, h3 = 0xa54ff53a;
  for (let i = 0; i < str.length; i++) {
    const code = str.charCodeAt(i);
    h0 = ((h0 << 5) - h0) + code; h0 |= 0;
    h1 = ((h1 << 5) - h1) + (code * 31); h1 |= 0;
    h2 = ((h2 << 5) - h2) + (code * 17); h2 |= 0;
    h3 = ((h3 << 5) - h3) + (code * 13); h3 |= 0;
  }
  return [h0, h1, h2, h3].map(n => Math.abs(n).toString(16).padStart(8, '0')).join('');
}

function generateRandomToken(prefix = 'tok_') {
  if (typeof crypto !== 'undefined' && crypto.getRandomValues) {
    const arr = new Uint8Array(16);
    crypto.getRandomValues(arr);
    return prefix + Array.from(arr, b => b.toString(16).padStart(2, '0')).join('');
  }
  return prefix + Math.random().toString(36).substring(2, 12) + Date.now().toString(36);
}

async function hashPasswordWithSalt(password, salt) {
  return await sha256Hex('clasptek_salt_' + salt + '_pwd_' + password);
}

function validatePasswordStrength(pwd) {
  if (!pwd || pwd.length < 8) {
    return { valid: false, message: 'Password must be at least 8 characters long.' };
  }
  const hasLetter = /[a-zA-Z]/.test(pwd);
  const hasNumber = /[0-9]/.test(pwd);
  if (!hasLetter || !hasNumber) {
    return { valid: false, message: 'Password must contain both letters and numbers.' };
  }
  return { valid: true };
}

function formatDocNo(type, num, dateStr) {
  const yr = dateStr ? dateStr.slice(0, 4) : new Date().getFullYear();
  if (type === 'invoice') return `INV-${yr}-${num}`;
  if (type === 'receipt') return `RCT-${yr}-${num}`;
  if (type === 'payslip') return `PSL-${yr}-${num}`;
  return `DOC-${yr}-${num}`;
}

function safeRound(n) {
  return Math.round((Number(n) || 0) * 100) / 100;
}

function fmtMoney(n) {
  const v = safeRound(n);
  const absFormatted = Math.abs(v).toLocaleString('en-NG', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  return (v < 0 ? '-\u20a6' : '\u20a6') + absFormatted;
}

function fmtDate(d) {
  if (!d) return '\u2014';
  try {
    const parts = String(d).split('-');
    if (parts.length === 3) {
      const dt = new Date(Number(parts[0]), Number(parts[1]) - 1, Number(parts[2]));
      return dt.toLocaleDateString('en-GB', { day: 'numeric', month: 'short', year: 'numeric' });
    }
    return d;
  } catch (e) {
    return d;
  }
}

function escapeHtml(str) {
  if (str === null || str === undefined) return '';
  return String(str)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#039;');
}

async function safeGet(key, fallback) {
  try {
    if (typeof window !== 'undefined' && window.storage && typeof window.storage.get === 'function') {
      const res = await window.storage.get(key, SHARED);
      return res && res.value ? JSON.parse(res.value) : fallback;
    } else if (typeof localStorage !== 'undefined') {
      const item = localStorage.getItem(key);
      return item ? JSON.parse(item) : fallback;
    }
    return fallback;
  } catch (e) {
    return fallback;
  }
}

async function safeSet(key, value) {
  try {
    if (typeof window !== 'undefined' && window.storage && typeof window.storage.set === 'function') {
      await window.storage.set(key, JSON.stringify(value), SHARED);
    } else if (typeof localStorage !== 'undefined') {
      localStorage.setItem(key, JSON.stringify(value));
    }
  } catch (e) {
    // node or headless environment fallback
  }
}

async function logAudit(action, entityType, entityId, reference, previousValue, newValue, reason = '') {
  const actorRole = state.auth && state.auth.user ? state.auth.user.role : 'System';
  const actorName = state.auth && state.auth.user ? `${state.auth.user.name} (${state.auth.user.email})` : 'System';

  const entry = {
    id: 'audit_' + Date.now() + '_' + Math.floor(Math.random() * 1000),
    tenant_id: DEFAULT_TENANT_ID,
    action,
    entityType,
    entityId,
    reference: reference || 'N/A',
    previousValue: previousValue ? (typeof previousValue === 'string' ? previousValue : JSON.stringify(previousValue)) : null,
    newValue: newValue ? (typeof newValue === 'string' ? newValue : JSON.stringify(newValue)) : null,
    reason: reason || 'Standard operation',
    performedBy: actorName,
    role: actorRole,
    source: 'app_ledger',
    performedAt: new Date().toISOString()
  };
  state.auditLog.unshift(entry);
  await safeSet(STORE_KEY_AUDIT_LOG, state.auditLog);
}

function canAccessTab(userOrTab, maybeTab) {
  let user, tabName;
  if (typeof userOrTab === 'string') {
    tabName = userOrTab;
    user = state.auth && state.auth.isAuthenticated ? state.auth.user : null;
  } else {
    user = userOrTab;
    tabName = maybeTab;
  }
  if (!user || !user.role) return false;
  const role = user.role;

  if (role === 'Super Admin') {
    return true;
  }
  if (role === 'Finance Manager') {
    const prohibited = ['usersRoles', 'settings'];
    return !prohibited.includes(tabName);
  }
  if (role === 'Finance Staff') {
    const allowed = ['dashboard', 'studentAccounts', 'invoices', 'payments', 'payslips', 'expenses', 'programmes', 'receivables', 'reports'];
    return allowed.includes(tabName);
  }
  if (role === 'Staff' || role === 'Facilitator') {
    const allowed = ['staffDashboard', 'myPayslips', 'myProfile', 'myQueries', 'mySecurity'];
    return allowed.includes(tabName);
  }
  if (role === 'Finance Viewer') {
    const allowed = ['dashboard', 'studentAccounts', 'invoices', 'payments', 'payslips', 'expenses', 'programmes', 'receivables', 'reports', 'financialControls', 'auditLog'];
    return allowed.includes(tabName);
  }
  return false;
}

function getDefaultTabForRole(role) {
  if (role === 'Super Admin' || role === 'Finance Manager' || role === 'Finance Viewer') {
    return 'dashboard';
  }
  if (role === 'Finance Staff') {
    return 'invoices';
  }
  if (role === 'Staff' || role === 'Facilitator') {
    return 'staffDashboard';
  }
  return 'dashboard';
}

function setTab(tabName) {
  if (!state.auth || !state.auth.isAuthenticated || !state.auth.user) {
    state.tab = 'dashboard';
    render();
    return;
  }
  if (!canAccessTab(state.auth.user, tabName)) {
    alert('Access Denied: You do not have authorization to access this workspace section.');
    state.tab = getDefaultTabForRole(state.auth.user.role);
    render();
    return;
  }
  state.tab = tabName;
  render();
}

function isPeriodLocked(dateStr) {
  if (!dateStr) return false;
  const periodKey = dateStr.slice(0, 7);
  const p = state.financePeriods.find(fp => fp.period === periodKey);
  return !!(p && (p.status === 'locked' || p.isLocked === true || p.status === 'finalized'));
}

function getRequiredApprovalRole(amount) {
  const v = Number(amount) || 0;
  if (v > state.approvalSettings.tier2Limit) return state.approvalSettings.tier3Role;
  if (v > state.approvalSettings.tier1Limit) return state.approvalSettings.tier2Role;
  return 'None';
}

  if (inv && inv.paymentAccountSnapshot && inv.paymentAccountSnapshot.accountNumber) {
    return {
      ...inv.paymentAccountSnapshot,

    };

  // 2. Linked Account ID
  if (inv && inv.paymentAccountId) {
    const found = state.paymentAccounts.find(a => a.id === inv.paymentAccountId);
    if (found) return { ...found, provenance: 'linked_account' };

  // 3. Fallback for older pre-Phase 8 invoices
  return {
    ...getDefaultPaymentAccount(),
    provenance: 'default_fallback',
    isLegacyFallback: true
  };
}

function invoiceBalance(inv) {
  const paid = safeRound(state.payments
    .filter(p => p.invoiceId === inv.id)
    .reduce((sum, p) => sum + Number(p.amount || 0), 0));
  const total = safeRound(Number(inv.total) || 0);
  const balance = Math.max(0, safeRound(total - paid));
  return { paid, balance, total };
}

function invoiceStatus(inv) {
  const { paid, total, balance } = invoiceBalance(inv);
  const todayStr = new Date().toISOString().slice(0, 10);
  if (paid >= total && total > 0) return 'paid';
  if (balance > 0 && (inv.dueDate || inv.date || todayStr) < todayStr) return 'overdue';
  if (paid > 0) return 'partial';
  return 'unpaid';
}

function getEnquiryFinancialStatus(enquiry) {
  const linkedInvoices = state.invoices.filter(i => (enquiry.id && i.enquiryId === enquiry.id) || (enquiry.name && i.clientName.trim().toLowerCase() === enquiry.name.trim().toLowerCase()));
  if (linkedInvoices.length === 0) return { status: 'NO_INVOICE', label: 'No Invoice', pillClass: 'new', total: 0, paid: 0, balance: 0 };

  let totalInv = 0;
  let totalPaid = 0;
  let isOverdue = false;
  const todayStr = new Date().toISOString().slice(0, 10);

  linkedInvoices.forEach(inv => {
    const { total, paid, balance } = invoiceBalance(inv);
    totalInv = safeRound(totalInv + total);
    totalPaid = safeRound(totalPaid + paid);
    if (balance > 0 && (inv.dueDate || inv.date || todayStr) < todayStr) {
      isOverdue = true;
    }
  });

  const balance = Math.max(0, safeRound(totalInv - totalPaid));
  if (totalPaid >= totalInv && totalInv > 0) return { status: 'FULLY_PAID', label: 'Fully Paid', pillClass: 'fully_paid', total: totalInv, paid: totalPaid, balance: 0 };
  if (isOverdue) return { status: 'OVERDUE', label: 'Overdue', pillClass: 'overdue', total: totalInv, paid: totalPaid, balance };
  if (totalPaid > 0) return { status: 'PARTIALLY_PAID', label: 'Partially Paid', pillClass: 'partially_paid', total: totalInv, paid: totalPaid, balance };
  return { status: 'PAYMENT_PENDING', label: 'Payment Pending', pillClass: 'payment_pending', total: totalInv, paid: totalPaid, balance };
}

function getEnquiryNextAction(enquiry) {
  const fin = getEnquiryFinancialStatus(enquiry);
  const isEnrolled = state.enrolments.some(en => en.enquiryId === enquiry.id || (enquiry.name && en.studentName.trim().toLowerCase() === enquiry.name.trim().toLowerCase()));

  if (enquiry.status === 'NEW') return { label: 'Contact Prospect', action: 'contact', btnClass: 'accent' };
  if (enquiry.status === 'CONTACTED' || enquiry.status === 'INTERESTED') return { label: 'Create Invoice', action: 'create_invoice', btnClass: 'accent' };
  if (enquiry.status === 'INVOICE_REQUESTED') return { label: 'Create Invoice', action: 'create_invoice', btnClass: 'accent' };
  if (fin.status === 'NO_INVOICE') return { label: 'Create Invoice', action: 'create_invoice', btnClass: 'secondary' };
  if (fin.status === 'FULLY_PAID' && !isEnrolled) return { label: 'Enrol Student', action: 'enrol', btnClass: 'success' };
  if (fin.status === 'PARTIALLY_PAID' && !isEnrolled) return { label: 'Enrol / Pay Balance', action: 'enrol_or_pay', btnClass: 'accent' };
  if (fin.status === 'PAYMENT_PENDING' || fin.status === 'OVERDUE') return { label: 'Record Payment', action: 'record_payment', btnClass: 'accent' };
  if (isEnrolled && fin.balance > 0) return { label: 'Follow Up Balance', action: 'follow_up', btnClass: 'secondary' };
  if (isEnrolled && fin.balance === 0) return { label: 'View Student Profile', action: 'view_profile', btnClass: 'secondary' };
  return { label: 'View Details', action: 'view', btnClass: 'secondary' };
}

function getReceivableAgeing(inv) {
  const { balance } = invoiceBalance(inv);
  if (balance <= 0) return { days: 0, bucket: 'current', label: 'Paid in Full', priority: 'Low', prioClass: 'prio-low' };

  const todayStr = new Date().toISOString().slice(0, 10);
  const dueStr = inv.dueDate || inv.date || todayStr;
  const today = new Date(todayStr + 'T00:00:00');
  const due = new Date(dueStr + 'T00:00:00');
  const daysOverdue = Math.floor((today - due) / (1000 * 60 * 60 * 24));

  if (daysOverdue <= 0) return { days: daysOverdue, bucket: 'current', label: 'Current', priority: 'Low', prioClass: 'prio-low' };
  if (daysOverdue <= 30) return { days: daysOverdue, bucket: '1-30', label: `${daysOverdue}d (1–30d)`, priority: 'Medium', prioClass: 'prio-medium' };
  if (daysOverdue <= 60) return { days: daysOverdue, bucket: '31-60', label: `${daysOverdue}d (31–60d)`, priority: 'High', prioClass: 'prio-high' };
  if (daysOverdue <= 90) return { days: daysOverdue, bucket: '61-90', label: `${daysOverdue}d (61–90d)`, priority: 'Critical', prioClass: 'prio-critical' };
  return { days: daysOverdue, bucket: '90plus', label: `${daysOverdue}d (90+d)`, priority: 'Critical', prioClass: 'prio-critical' };
}

function calculatePayslipTotals(basicPay, allowances = [], deductions = []) {
  const basic = Number(basicPay) || 0;
  const totalAllowances = safeRound(allowances.reduce((s, a) => s + Number(a.amount || 0), 0));
  const grossPay = safeRound(basic + totalAllowances);
  const totalDeductions = safeRound(deductions.reduce((s, d) => s + Number(d.amount || 0), 0));
  const netPay = Math.max(0, safeRound(grossPay - totalDeductions));
  return { basic, totalAllowances, grossPay, totalDeductions, netPay };
}

async function integratePayslipExpense(payslip) {
  // CRITICAL: Only create expense when payslip is actually PAID
  if (payslip.status !== 'paid') {
    console.warn('Attempted to integrate expense for unpaid payslip', payslip.payslipNo);
    return null;
  }

  const payslipRef = 'PAYSLIP-' + payslip.payslipNo;
  const existing = state.expenses.find(e => 
    (e.sourceId && e.sourceId === payslip.id) ||
    (e.sourceReference && e.sourceReference === payslipRef) ||
    (e.reference && e.reference === payslipRef) ||
    (payslip.linkedExpenseId && e.id === payslip.linkedExpenseId)
  );

  if (existing) {
    return existing;
  }

  const expenseCat = payslip.employeeType === 'facilitator' ? 'Facilitator Fees' : 'Salaries';
  const newExpense = {
    id: 'exp_psl_' + Date.now(),
    tenant_id: DEFAULT_TENANT_ID,
    sourceType: 'payslip',
    sourceId: payslip.id,
    sourceReference: payslipRef,
    reference: payslipRef,
    date: payslip.actualPaymentDate || payslip.payDate || new Date().toISOString().slice(0, 10),
    categoryGroup: 'Staff & People',
    category: expenseCat,
    description: `Payroll Disbursement: ${payslip.employeeName} (${payslip.payPeriod}) - ${payslip.role}`,
    vendor: payslip.employeeName,
    department: payslip.department || 'Academics',
    amount: payslip.paidAmount || payslip.netPay,
    paymentMethod: payslip.paymentMethod || 'Bank Transfer',
    status: 'approved',
    approvedBy: payslip.approvedBy || (state.auth.user ? state.auth.user.name : 'Finance Operations'),
    approvedAt: payslip.approvedAt || new Date().toISOString(),
    createdAt: new Date().toISOString(),
    createdBy: state.auth.user ? state.auth.user.name : 'Finance Operations'
  };

  state.expenses.push(newExpense);
  payslip.linkedExpenseId = newExpense.id;

  await safeSet(STORE_KEY_EXPENSES, state.expenses);
  await safeSet(STORE_KEY_PAYSLIPS, state.payslips);
  await logAudit('PAYSLIP_EXPENSE_INTEGRATION', 'expense', newExpense.id, `Linked ${payslipRef} as ${expenseCat} expense (₦${newExpense.amount})`, null, newExpense);

  return newExpense;
}

function getFinancialMetrics() {
  const totalInvoiced = safeRound(state.invoices.reduce((s, i) => s + Number(i.total || 0), 0));
  const totalPaymentsReceived = safeRound(state.payments.reduce((s, p) => s + Number(p.amount || 0), 0));
  const totalDirectIncome = safeRound(state.directIncome.filter(d => d.status !== 'cancelled').reduce((s, d) => s + Number(d.amount || 0), 0));
  const totalIncomeReceived = safeRound(totalPaymentsReceived + totalDirectIncome);

  const totalExpenses = safeRound(state.expenses.filter(e => e.status === 'recorded' || e.status === 'approved').reduce((s, e) => s + Number(e.amount || 0), 0));
  const netFinancialPosition = safeRound(totalIncomeReceived - totalExpenses);

  const outstandingReceivables = safeRound(state.invoices.reduce((s, inv) => {
    const { balance } = invoiceBalance(inv);
    return s + balance;
  }, 0));

  const overdueReceivables = safeRound(state.invoices.reduce((s, inv) => {
    const { balance } = invoiceBalance(inv);
    const todayStr = new Date().toISOString().slice(0, 10);
    if (balance > 0 && (inv.dueDate || inv.date || todayStr) < todayStr) return s + balance;
    return s;
  }, 0));

  const collectionRate = totalInvoiced > 0 ? safeRound((totalPaymentsReceived / totalInvoiced) * 100) : 100;

  // Multi-Stage Payroll KPI Metrics
  const totalPayrollDisbursed = safeRound(state.payslips.filter(p => p.status === 'paid').reduce((s, p) => s + Number(p.paidAmount || p.netPay || 0), 0));
  const awaitingMonthEndPayment = safeRound(state.payslips.filter(p => p.status === 'approved').reduce((s, p) => s + Number(p.netPay || 0), 0));
  const pendingApproval = safeRound(state.payslips.filter(p => p.status === 'acknowledged').reduce((s, p) => s + Number(p.netPay || 0), 0));
  const pendingAcknowledgement = safeRound(state.payslips.filter(p => p.status === 'issued').reduce((s, p) => s + Number(p.netPay || 0), 0));
  const draftPayroll = safeRound(state.payslips.filter(p => p.status === 'draft').reduce((s, p) => s + Number(p.netPay || 0), 0));
  const openQueriesCount = state.payslips.filter(p => p.queries && p.queries.some(q => q.status === 'open' || q.status === 'under_review')).length;

  // Pipeline Conversion Analytics
  const totalEnquiries = state.enquiries.length;
  const qualifiedEnquiries = state.enquiries.filter(e => e.status !== 'LOST').length || 1;
  const enquiriesWithInvoice = state.enquiries.filter(e => {
    return state.invoices.some(i => (i.enquiryId && i.enquiryId === e.id) || (e.name && i.clientName.trim().toLowerCase() === e.name.trim().toLowerCase()));
  }).length;

  const totalIssuedInvoices = state.invoices.length;
  const invoicesWithPayment = state.invoices.filter(i => invoiceBalance(i).paid > 0).length;
  const invoicesFullyPaid = state.invoices.filter(i => invoiceStatus(i) === 'paid').length;

  const totalEnrolments = state.enrolments.length;

  const convEnquiryToInvoice = safeRound((enquiriesWithInvoice / qualifiedEnquiries) * 100);
  const convInvoiceToPayment = totalIssuedInvoices > 0 ? safeRound((invoicesWithPayment / totalIssuedInvoices) * 100) : 0;
  const convInvoiceToFull = totalIssuedInvoices > 0 ? safeRound((invoicesFullyPaid / totalIssuedInvoices) * 100) : 0;
  const convPaymentToEnrol = invoicesWithPayment > 0 ? Math.min(100, safeRound((totalEnrolments / invoicesWithPayment) * 100)) : 0;
  const convOverall = totalEnquiries > 0 ? safeRound((totalEnrolments / totalEnquiries) * 100) : 0;

  return {
    totalInvoiced,
    totalPaymentsReceived,
    totalDirectIncome,
    totalIncomeReceived,
    totalExpenses,
    netFinancialPosition,
    outstandingReceivables,
    overdueReceivables,
    collectionRate,
    payroll: {
      totalDisbursed: totalPayrollDisbursed,
      awaitingPayment: awaitingMonthEndPayment,
      pendingApproval,
      pendingAcknowledgement,
      draftPayroll,
      openQueriesCount,
      paidPayslipsCount: state.payslips.filter(p => p.status === 'paid').length,
      approvedPayslipsCount: state.payslips.filter(p => p.status === 'approved').length
    },
    pipeline: {
      totalEnquiries,
      newEnquiries: state.enquiries.filter(e => e.status === 'NEW').length,
      contacted: state.enquiries.filter(e => e.status === 'CONTACTED' || e.status === 'INTERESTED').length,
      invoiceRequested: state.enquiries.filter(e => e.status === 'INVOICE_REQUESTED').length,
      invoicesIssued: totalIssuedInvoices,
      awaitingPayment: state.invoices.filter(i => invoiceStatus(i) === 'unpaid').length,
      partiallyPaid: state.invoices.filter(i => invoiceStatus(i) === 'partial').length,
      fullyPaid: invoicesFullyPaid,
      enrolledStudents: totalEnrolments,
      convEnquiryToInvoice,
      convInvoiceToPayment,
      convInvoiceToFull,
      convPaymentToEnrol,
      convOverall
    }
  };
}

function getStudentAccountSummaries() {
  const studentMap = {};

  state.enquiries.forEach(enq => {
    const key = enq.name.trim();
    if (key && !studentMap[key]) {
      studentMap[key] = {
        clientName: key, phone: enq.phone || '', email: enq.email || '', parentName: '',
        invoices: [], payments: [], enrolments: [], enquiries: [enq], followups: [],
        totalInvoiced: 0, totalPaid: 0, balance: 0, programmes: new Set([enq.programmeName].filter(Boolean))
      };
    } else if (key && studentMap[key]) {
      studentMap[key].enquiries.push(enq);
      if (enq.programmeName) studentMap[key].programmes.add(enq.programmeName);
    }
  });

  state.invoices.forEach(inv => {
    const key = inv.clientName.trim();
    if (!studentMap[key]) {
      studentMap[key] = {
        clientName: key, phone: inv.phone || '', email: inv.email || '', parentName: inv.parentName || '',
        invoices: [], payments: [], enrolments: [], enquiries: [], followups: [],
        totalInvoiced: 0, totalPaid: 0, balance: 0, programmes: new Set()
      };
    }
    studentMap[key].invoices.push(inv);
    studentMap[key].totalInvoiced = safeRound(studentMap[key].totalInvoiced + Number(inv.total || 0));
    if (inv.phone && !studentMap[key].phone) studentMap[key].phone = inv.phone;
    if (inv.email && !studentMap[key].email) studentMap[key].email = inv.email;
    if (inv.parentName) studentMap[key].parentName = inv.parentName;
    if (inv.programmeName) studentMap[key].programmes.add(inv.programmeName);
  });

  state.payments.forEach(p => {
    const inv = state.invoices.find(i => i.id === p.invoiceId);
    if (inv) {
      const key = inv.clientName.trim();
      if (studentMap[key]) {
        studentMap[key].payments.push(p);
        studentMap[key].totalPaid = safeRound(studentMap[key].totalPaid + Number(p.amount || 0));
      }
    }
  });

  state.enrolments.forEach(en => {
    const key = en.studentName.trim();
    if (studentMap[key]) {
      studentMap[key].enrolments.push(en);
      if (en.programmeName) studentMap[key].programmes.add(en.programmeName);
    }
  });

  state.collectionNotes.forEach(cn => {
    const inv = state.invoices.find(i => i.id === cn.invoiceId);
    if (inv) {
      const key = inv.clientName.trim();
      if (studentMap[key]) studentMap[key].followups.push(cn);
    }
  });

  return Object.values(studentMap).map(acc => {
    acc.balance = Math.max(0, safeRound(acc.totalInvoiced - acc.totalPaid));
    acc.programmesList = Array.from(acc.programmes).join(', ') || 'General';
    acc.isEnrolled = acc.enrolments.length > 0;
    acc.financialStatus = acc.balance === 0 && acc.totalInvoiced > 0 ? 'FULLY_PAID' : (acc.totalPaid > 0 ? 'PARTIALLY_PAID' : (acc.totalInvoiced > 0 ? 'PAYMENT_PENDING' : 'NO_INVOICE'));
    acc.status = acc.balance === 0 && acc.totalInvoiced > 0 ? 'Fully Paid' : (acc.totalPaid > 0 ? 'Partial Balance' : (acc.totalInvoiced > 0 ? 'Outstanding' : 'Prospect'));
    return acc;
  });
}

function exportToCSV(filename, rows) {
  if (!rows || !rows.length) { alert('No records available to export.'); return; }
  const separator = ',';
  const keys = Object.keys(rows[0]);
  const actorInfo = state.auth.user ? `${state.auth.user.name} (${state.auth.user.role})` : 'System';
  const headerMetadata = `# Report: ${filename.toUpperCase()}\n# Generated By: ${actorInfo}\n# Generated At: ${new Date().toISOString()}\n# Tenant: ${DEFAULT_TENANT_ID}\n\n`;
  const csvData = keys.join(separator) + '\n' + rows.map(row => {
    return keys.map(k => {
      let cell = row[k] === null || row[k] === undefined ? '' : String(row[k]);
      cell = cell.replace(/"/g, '""');
      if (cell.search(/("|,|\n)/g) >= 0) cell = `"${cell}"`;
      return cell;
    }).join(separator);
  }).join('\n');

  const blob = new Blob([headerMetadata + csvData], { type: 'text/csv;charset=utf-8;' });
  const link = document.createElement('a');
  link.href = URL.createObjectURL(blob);
  link.download = `${filename}_${new Date().toISOString().slice(0, 10)}.csv`;
  link.click();
  logAudit('EXPORT_CSV', 'report', filename, 'CSV Data Export');
}

function searchGlobalEntities(query) {
  if (!query || query.trim().length < 2) return [];
  const q = query.trim().toLowerCase();
  const results = [];

  // 1. Search Enquiries
  state.enquiries.filter(e => e.name.toLowerCase().includes(q) || (e.phone && e.phone.includes(q)) || (e.email && e.email.toLowerCase().includes(q))).slice(0, 3).forEach(e => {
    const fin = getEnquiryFinancialStatus(e);
    results.push({
      type: 'Enquiry',
      title: e.name,
      subtitle: `Programme: ${e.programmeName || 'General'} &middot; Status: ${e.status}`,
      tag: fin.label,
      tagClass: fin.pillClass,
      action: () => { state.tab = 'enquiries'; openModal('enquiryDetail', { enquiry: e }); render(); }
    });
  });

  // 2. Search Students / Accounts
  const students = getStudentAccountSummaries();
  students.filter(s => s.clientName.toLowerCase().includes(q) || s.phone.includes(q) || s.email.toLowerCase().includes(q)).slice(0, 3).forEach(s => {
    results.push({
      type: 'Student',
      title: s.clientName,
      subtitle: `Phone: ${s.phone || 'N/A'} &middot; Balance: ${fmtMoney(s.balance)}`,
      tag: s.status,
      tagClass: s.balance === 0 ? 'paid' : 'partial',
      action: () => { state.tab = 'studentAccounts'; openModal('studentProfile', { account: s }); render(); }
    });
  });

  // 3. Search Invoices
  state.invoices.filter(i => String(i.invoiceNo).includes(q) || (i.invoice_display_no && i.invoice_display_no.toLowerCase().includes(q)) || i.clientName.toLowerCase().includes(q)).slice(0, 3).forEach(inv => {
    const { balance, total } = invoiceBalance(inv);
    results.push({
      type: 'Invoice',
      title: `Invoice #${inv.invoiceNo} &mdash; ${inv.clientName}`,
      subtitle: `Programme: ${inv.programmeName} &middot; Due: ${fmtMoney(balance)}`,
      tag: invoiceStatus(inv).toUpperCase(),
      tagClass: invoiceStatus(inv),
      action: () => { state.tab = 'invoices'; openModal('viewInvoice', { invoice: inv }); render(); }
    });
  });

  // 4. Search Payments / Receipts
  state.payments.filter(p => String(p.receiptNo).includes(q) || (p.reference && p.reference.toLowerCase().includes(q)) || String(p.amount).includes(q)).slice(0, 3).forEach(p => {
    const inv = state.invoices.find(i => i.id === p.invoiceId);
    results.push({
      type: 'Receipt',
      title: `Receipt #${p.receiptNo} &mdash; ${fmtMoney(p.amount)}`,
      subtitle: `Student: ${inv ? inv.clientName : 'Direct'} &middot; Ref: ${p.reference || 'N/A'}`,
      tag: p.paymentMethod || 'Bank Transfer',
      tagClass: 'category-pill',
      action: () => { state.tab = 'payments'; openModal('viewReceipt', { payment: p, invoice: inv }); render(); }
    });
  });

  // 5. Search Payslips (Phase 8)
  state.payslips.filter(ps => String(ps.payslipNo).includes(q) || ps.employeeName.toLowerCase().includes(q) || (ps.role && ps.role.toLowerCase().includes(q))).slice(0, 3).forEach(ps => {
    results.push({
      type: 'Payslip',
      title: `Payslip #${ps.payslipNo} &mdash; ${ps.employeeName}`,
      subtitle: `Period: ${ps.payPeriod} &middot; Net Pay: ${fmtMoney(ps.netPay)}`,
      tag: ps.status.toUpperCase(),
      tagClass: ps.status,
      action: () => { state.tab = 'payslips'; openModal('viewPayslip', { payslip: ps }); render(); }
    });
  });

  // 6. Search Programmes
  state.programmes.filter(pr => pr.name.toLowerCase().includes(q) || pr.id.toLowerCase().includes(q)).slice(0, 2).forEach(pr => {
    results.push({
      type: 'Programme',
      title: pr.name,
      subtitle: `Standard Tuition: ${fmtMoney(pr.price)}`,
      tag: 'Academic',
      tagClass: 'category-pill',
      action: () => { state.tab = 'programmes'; render(); }
    });
  });

  return results;
}

function printCanonicalDocument(docHtml) {
  let printRoot = document.getElementById('print-root');
  if (!printRoot) {
    printRoot = document.createElement('div');
    printRoot.id = 'print-root';
    document.body.appendChild(printRoot);
  }
  printRoot.innerHTML = docHtml;
  window.print();
}

let authViewState = {
  mode: 'login', // 'login' | 'forgot' | 'force_reset' | 'invitation'
  email: '',
  targetUser: null,
  inviteToken: '',
  resetToken: '',
  alertMsg: '',
  alertType: 'error'
};

function checkUrlAuthParams() {
  if (typeof window !== 'undefined' && window.location && window.location.search) {
    const params = new URLSearchParams(window.location.search);
    const invite = params.get('invite');
    const reset = params.get('reset');
    if (invite) {
      const u = state.users.find(user => user.invitationToken === invite);
      if (u) {
        if (u.status !== 'invited') {
          authViewState.alertMsg = 'This invitation link has already been used. Please sign in.';
          authViewState.alertType = 'warning';
          authViewState.mode = 'login';
        } else if (u.invitationExpiresAt && u.invitationExpiresAt < Date.now()) {
          authViewState.alertMsg = 'This invitation link has expired. Please request a new invitation from your administrator.';
          authViewState.alertType = 'error';
          authViewState.mode = 'login';
        } else {
          authViewState.mode = 'invitation';
          authViewState.inviteToken = invite;
          authViewState.targetUser = u;
        }
      } else {
        authViewState.alertMsg = 'Invalid invitation token.';
        authViewState.alertType = 'error';
      }
    } else if (reset) {
      const u = state.users.find(user => user.resetToken === reset);
      if (u) {
        if (u.resetExpiresAt && u.resetExpiresAt < Date.now()) {
          authViewState.alertMsg = 'This password reset link has expired. Please request a new reset.';
          authViewState.alertType = 'error';
          authViewState.mode = 'login';
        } else {
          authViewState.mode = 'force_reset';
          authViewState.resetToken = reset;
          authViewState.targetUser = u;
        }
      } else {
        authViewState.alertMsg = 'Invalid password reset token.';
        authViewState.alertType = 'error';
      }
    }
  }
}

          expiresAt: sessionExpiry

      if (!strCheck.valid) {
        alertEl.textContent = strCheck.message;
        alertEl.style.display = 'block';
        return;

      const salt = generateRandomToken('salt_');
      const hash = await hashPasswordWithSalt(newPwd, salt);

      user.passwordSalt = salt;
      user.passwordHash = hash;
      user.status = 'active';
      user.mustChangePassword = false;
      user.invitationToken = null;
      user.invitationExpiresAt = null;

      await safeSet(STORE_KEY_SYSTEM_USERS, state.users);

      const sessionToken = generateRandomToken('sess_');
      const sessionExpiry = Date.now() + 24 * 3600 * 1000;

      state.auth = {
        isAuthenticated: true,

      };
      await safeSet(STORE_KEY_AUTH_SESSION, state.auth);

}


// ----------------------------------------------------
// MAIN APPLICATION LAYOUT & NAVIGATION
// ----------------------------------------------------
function render() {
  const root = document.getElementById('root');
  if (state.loading) {
    root.innerHTML = '<div class="cp-empty-state" style="margin:40px auto; max-width:400px;"><div class="cp-empty-title">Loading Clasptek Portal...</div></div>';
    return;
  }

  // Authoritative Mandatory Login Gate
  if (!state.auth || !state.auth.isAuthenticated || !state.auth.user) {
    renderLoginScreen(root);
    return;
  }

  // Ensure active user is still active and not deactivated or suspended
  const activeUser = state.users.find(u => u.id === state.auth.user.id);
  if (!activeUser || activeUser.status !== 'active' || (activeUser.revokedSessionTokens || []).includes(state.auth.token)) {
    state.auth = { isAuthenticated: false, user: null };
    safeSet(STORE_KEY_AUTH_SESSION, null);
    authViewState.alertMsg = activeUser && activeUser.status === 'deactivated' ? 'Your account has been deactivated.' : 'Your session has expired or was revoked. Please sign in again.';
    authViewState.alertType = 'error';
    renderLoginScreen(root);
    return;
  }

  // Force Password Reset check
  if (activeUser.mustChangePassword || activeUser.forcePasswordReset) {
    authViewState.mode = 'force_reset';
    authViewState.targetUser = activeUser;
    renderLoginScreen(root);
    return;
  }

  // Authoritative Tab Access Check
  if (!canAccessTab(activeUser, state.tab)) {
    state.tab = getDefaultTabForRole(activeUser.role);
  }

  const user = state.auth.user;
  const initials = (user.name || 'User').split(' ').map(n => n[0]).join('').substring(0, 2).toUpperCase();
  const isEmployee = isEmployeePortal();

  // Role validation on tab routing
  if (isEmployee && !['staffDashboard', 'myPayslips', 'myProfile', 'myQueries', 'mySecurity'].includes(state.tab)) {
    state.tab = 'staffDashboard';
  } else if (!isEmployee && ['staffDashboard', 'myPayslips', 'myProfile', 'myQueries', 'mySecurity'].includes(state.tab)) {
    state.tab = 'dashboard';
  }

  const overdueCount = isEmployee ? 0 : state.invoices.filter(i => {

          <!-- Navigation Menu -->

              <div class="cp-nav-section">
                <div class="cp-nav-section-title">${user.role === 'Facilitator' ? 'Facilitator Workspace' : 'My Workspace'}</div>
                <div class="cp-nav-item ${state.tab === 'staffDashboard' ? 'active' : ''}" data-tab="staffDashboard">
                  <span class="cp-nav-icon">&#x1F4CA;</span><span class="cp-nav-label">${user.role === 'Facilitator' ? 'Facilitator Dashboard' : 'My Dashboard'}</span>
                </div>
                <div class="cp-nav-item ${state.tab === 'myPayslips' ? 'active' : ''}" data-tab="myPayslips">
                  <span class="cp-nav-icon">&#x1F4B3;</span><span class="cp-nav-label">My Payslips</span>
                  ${myPendingAckCount > 0 ? `<span class="cp-nav-badge" style="background:var(--warning); color:#fff;">${myPendingAckCount}</span>` : `<span class="cp-nav-badge">${myPayslips.length}</span>`}
                </div>
                <div class="cp-nav-item ${state.tab === 'myProfile' ? 'active' : ''}" data-tab="myProfile">
                  <span class="cp-nav-icon">&#x1F464;</span><span class="cp-nav-label">${user.role === 'Facilitator' ? 'Profile &amp; Engagements' : 'My Profile &amp; Bank'}</span>
                </div>
                <div class="cp-nav-item ${state.tab === 'myQueries' ? 'active' : ''}" data-tab="myQueries">
                  <span class="cp-nav-icon">&#x2753;</span><span class="cp-nav-label">My Payroll Queries</span>
                  ${myOpenQueriesCount > 0 ? `<span class="cp-nav-badge" style="background:var(--warning-bg); color:var(--warning);">${myOpenQueriesCount}</span>` : ''}
                </div>
                <div class="cp-nav-item ${state.tab === 'mySecurity' ? 'active' : ''}" data-tab="mySecurity">
                  <span class="cp-nav-icon">&#x1F512;</span><span class="cp-nav-label">Account Security</span>

            ` : `

              <div class="cp-nav-section">
                <div class="cp-nav-section-title">Workspace</div>
                <div class="cp-nav-item ${state.tab === 'dashboard' ? 'active' : ''}" data-tab="dashboard">

                </div>
                <div class="cp-nav-item ${state.tab === 'enquiries' ? 'active' : ''}" data-tab="enquiries">
                  <span class="cp-nav-icon">&#x1F4E5;</span><span class="cp-nav-label">Admissions &amp; Enquiries</span>
                  ${activeEnquiriesCount > 0 ? `<span class="cp-nav-badge">${activeEnquiriesCount}</span>` : ''}
                </div>
                <div class="cp-nav-item ${state.tab === 'studentAccounts' ? 'active' : ''}" data-tab="studentAccounts">
                  <span class="cp-nav-icon">&#x1F465;</span><span class="cp-nav-label">Students &amp; Clients</span>

                <div class="cp-nav-item ${state.tab === 'invoices' ? 'active' : ''}" data-tab="invoices">

                <div class="cp-nav-item ${state.tab === 'expenses' ? 'active' : ''}" data-tab="expenses">

                <div class="cp-nav-item ${state.tab === 'budgets' ? 'active' : ''}" data-tab="budgets">

                <div class="cp-nav-item ${state.tab === 'reports' ? 'active' : ''}" data-tab="reports">

          </nav>
        </div>

        <!-- Sidebar Footer -->
        <div class="cp-sidebar-footer">
          <div class="cp-conn-pill" id="sidebarSupabaseStatus" style="cursor:pointer;">
            <span class="cp-conn-dot ${state.supabase.status === 'connected' ? 'connected' : 'fallback'}"></span>

          <div class="cp-user-card">

              <div class="cp-user-avatar" style="${isEmployee ? (user.role === 'Facilitator' ? 'background:#6D28D9;' : 'background:#1D4ED8;') : ''}">${escapeHtml(initials)}</div>
              <div class="cp-user-info-text">

                <span class="cp-user-role">${escapeHtml(user.role)}</span>
              </div>
            </div>
            <button class="cp-signout-btn" id="btnSidebarSignOut" title="Sign out">&#x1F6AA;</button>
          </div>
        </div>
      </aside>

      <!-- Main Viewport Area -->
      <div class="cp-main-area">
        <header class="cp-topbar">
          <div class="cp-topbar-left">
            <button class="cp-mobile-nav-btn" id="btnMobileNavToggle" title="Open Navigation Menu">&#x2630;</button>
            <div class="cp-breadcrumb">
              <span>${isEmployee ? 'My Portal' : 'Workspace'}</span> / <strong>${tabLabels[state.tab] || 'Dashboard'}</strong>
            </div>

            <div class="cp-omni-search">
              <span class="cp-omni-icon">&#x1F50D;</span>
              <input type="text" class="cp-omni-input" id="globalSearchInput" placeholder="${isEmployee ? 'Search my payslips, pay periods, queries...' : 'Search enquiries, students, invoices, receipts, programmes...'}" autocomplete="off" />
              <div class="cp-search-dropdown" id="searchDropdown"></div>
            </div>
          </div>

          <div class="cp-topbar-right">
            ${isEmployee ? `
              <button class="cp-btn sm secondary" id="btnEmployeeRaiseQuery" style="color:#B45309; border-color:var(--warning);">&#x26A0;&#xFE0F; Raise Query</button>
            ` : `
              ${canRecord() ? `
                <div class="cp-dropdown-wrap">
                  <button class="cp-btn sm accent" id="btnQuickActionToggle">+ New Transaction &#x25BE;</button>
                  <div class="cp-dropdown-menu" id="quickActionDropdown">
                    <div class="cp-dropdown-item" id="qaNewEnquiry">&#x1F4E5; New Enquiry</div>
                    <div class="cp-dropdown-item" id="qaNewInvoice">&#x1F4C4; Issue Invoice</div>
                    <div class="cp-dropdown-item" id="qaRecordPayment">&#x1F9FE; Record Payment</div>
                    <div class="cp-dropdown-item" id="qaGeneratePayslip">&#x1F4B3; Prepare Payslip</div>
                    <div class="cp-dropdown-item" id="qaRecordExpense">&#x1F4B8; Log Expense</div>
                    <div class="cp-dropdown-item" id="qaRecordDirectIncome">&#x1F4B0; Direct Income</div>
                  </div>
                </div>
              ` : ''}
            `}

            <div class="cp-role-tag">
              <span class="cp-pill ${isEmployee ? (user.role === 'Facilitator' ? 'category-pill' : 'new') : 'paid'}" style="font-size:10.5px;">${escapeHtml(user.role.toUpperCase())}</span>
              <span style="color:var(--text-secondary); font-size:11.5px;">${escapeHtml(user.name)}</span>
            </div>
          </div>
        </header>

        <main class="cp-content-view" id="contentView"></main>
      </div>
    </div>

    <div id="modalRoot"></div>
  `;

  // Attach Global Event Listeners
  const appSidebar = document.getElementById('appSidebar');
  const sidebarBackdrop = document.getElementById('sidebarBackdrop');
  const btnMobileNavToggle = document.getElementById('btnMobileNavToggle');

  if (btnMobileNavToggle && appSidebar && sidebarBackdrop) {
    btnMobileNavToggle.addEventListener('click', () => {
      appSidebar.classList.toggle('mobile-open');
      sidebarBackdrop.classList.toggle('active');
    });
    sidebarBackdrop.addEventListener('click', () => {
      appSidebar.classList.remove('mobile-open');
      sidebarBackdrop.classList.remove('active');
    });
  }

  document.getElementById('btnToggleSidebar').addEventListener('click', () => {
    state.sidebarCollapsed = !state.sidebarCollapsed;
    render();
  });

  document.getElementById('brandLogoLink').addEventListener('click', (e) => {
    e.preventDefault();
    state.tab = isEmployee ? 'staffDashboard' : 'dashboard';
    render();
  });

  document.getElementById('btnSidebarSignOut').addEventListener('click', async () => {
    state.auth = { isAuthenticated: false, user: null };
    await safeSet(STORE_KEY_AUTH_SESSION, null);
    render();
  });

  document.getElementById('sidebarSupabaseStatus').addEventListener('click', () => {
    if (!isEmployee) openModal('supabaseModal');
  });

  document.querySelectorAll('.cp-nav-item').forEach(item => {
    item.addEventListener('click', () => {
      state.tab = item.dataset.tab;
      if (appSidebar && sidebarBackdrop) {
        appSidebar.classList.remove('mobile-open');
        sidebarBackdrop.classList.remove('active');
      }
      render();
    });
  });

  const btnEmployeeQuery = document.getElementById('btnEmployeeRaiseQuery');
  if (btnEmployeeQuery) {
    btnEmployeeQuery.addEventListener('click', () => {
      const psls = getAccessiblePayslips();
      if (psls.length === 0) {
        alert('No payslip records available yet to raise a query against.');
        return;
      }
      openModal('raisePayrollQuery', { payslip: psls[0] });
    });
  }

  // Quick Action dropdown for admins
  const btnQA = document.getElementById('btnQuickActionToggle');
  const qaMenu = document.getElementById('quickActionDropdown');
  if (btnQA && qaMenu) {
    btnQA.addEventListener('click', (e) => {
      e.stopPropagation();
      qaMenu.classList.toggle('active');
    });

    document.addEventListener('click', () => qaMenu.classList.remove('active'));

    const qaNewEnquiry = document.getElementById('qaNewEnquiry');
    if (qaNewEnquiry) qaNewEnquiry.addEventListener('click', () => openModal('newEnquiry'));
    const qaNewInvoice = document.getElementById('qaNewInvoice');
    if (qaNewInvoice) qaNewInvoice.addEventListener('click', () => { state.tab = 'invoices'; state.invoiceSubTab = 'new'; render(); });
    const qaRecordPayment = document.getElementById('qaRecordPayment');
    if (qaRecordPayment) qaRecordPayment.addEventListener('click', () => {
      const unpaidInv = state.invoices.find(i => invoiceBalance(i).balance > 0);
      if (unpaidInv) openModal('recordPayment', { invoice: unpaidInv });
      else alert('No outstanding invoices found to apply payment against.');
    });
    const qaGeneratePayslip = document.getElementById('qaGeneratePayslip');
    if (qaGeneratePayslip) qaGeneratePayslip.addEventListener('click', () => openModal('generatePayslip'));
    const qaRecordExpense = document.getElementById('qaRecordExpense');
    if (qaRecordExpense) qaRecordExpense.addEventListener('click', () => openModal('recordExpense'));
    const qaRecordDirectIncome = document.getElementById('qaRecordDirectIncome');
    if (qaRecordDirectIncome) qaRecordDirectIncome.addEventListener('click', () => openModal('recordDirectIncome'));
  }

  // Omni-Search Listener
  const omniInput = document.getElementById('globalSearchInput');
  const searchDropdown = document.getElementById('searchDropdown');
  if (omniInput && searchDropdown) {
    omniInput.addEventListener('input', (e) => {
      const val = e.target.value.trim();
      if (val.length < 2) {
        searchDropdown.classList.remove('active');
        searchDropdown.innerHTML = '';
        return;
      }

      const results = searchGlobalEntities(val);
      if (results.length === 0) {
        searchDropdown.innerHTML = '<div style="padding:14px; text-align:center; color:var(--text-muted); font-size:12px;">No matching records found.</div>';
        searchDropdown.classList.add('active');
      } else {
        searchDropdown.innerHTML = results.map((r, idx) => `
          <div class="cp-search-result-item" data-idx="${idx}">
            <div>
              <div style="font-weight:700; color:var(--primary);">${escapeHtml(r.title)}</div>
              <div style="font-size:11px; color:var(--text-secondary);">${r.subtitle}</div>
            </div>
            <span class="cp-pill ${r.tagClass}" style="font-size:10.5px;">${escapeHtml(r.type)}: ${escapeHtml(r.tag)}</span>
          </div>
        `).join('');
        searchDropdown.classList.add('active');

        searchDropdown.querySelectorAll('.cp-search-result-item').forEach(itemEl => {
          itemEl.addEventListener('click', () => {
            const idx = Number(itemEl.dataset.idx);
            if (results[idx] && results[idx].action) {
              searchDropdown.classList.remove('active');
              omniInput.value = '';
              results[idx].action();
            }
          });
        });
      }
    });

    if (typeof document !== 'undefined' && typeof document.addEventListener === 'function') {
      document.addEventListener('click', (e) => {
        if (!omniInput.contains(e.target) && !searchDropdown.contains(e.target)) {
          searchDropdown.classList.remove('active');
        }
      });
    }
  }

  // Render View Routing
  const contentView = document.getElementById('contentView');
  if (isEmployee) {
    if (state.tab === 'staffDashboard') renderStaffDashboardTab(contentView);
    else if (state.tab === 'myPayslips') renderMyPayslipsTab(contentView);
    else if (state.tab === 'myProfile') renderMyProfileTab(contentView);
    else if (state.tab === 'myQueries') renderMyQueriesTab(contentView);
    else if (state.tab === 'mySecurity') renderMySecurityTab(contentView);
  } else {
    if (state.tab === 'dashboard') renderDashboardTab(contentView);
    else if (state.tab === 'enquiries') renderEnquiriesTab(contentView);
    else if (state.tab === 'studentAccounts') renderStudentAccountsTab(contentView);
    else if (state.tab === 'invoices') renderInvoicesTab(contentView);
    else if (state.tab === 'payments') renderPaymentsTab(contentView);
    else if (state.tab === 'payslips') renderPayslipsTab(contentView);
    else if (state.tab === 'expenses') renderExpensesTab(contentView);
    else if (state.tab === 'programmes') renderProgrammesTab(contentView);
    else if (state.tab === 'receivables') renderReceivablesTab(contentView);
    else if (state.tab === 'budgets') renderBudgetsTab(contentView);
    else if (state.tab === 'reports') renderReportsTab(contentView);
    else if (state.tab === 'usersRoles') renderUsersRolesTab(contentView);
    else if (state.tab === 'financialControls') renderFinancialControlsTab(contentView);
    else if (state.tab === 'auditLog') renderAuditLogTab(contentView);
    else if (state.tab === 'settings') renderSettingsTab(contentView);
  }

  if (state.modal) {
    renderModal(state.modal.type, state.modal.data);
  }
}

// Modal Control Helpers
function openModal(type, data = {}) {
  state.modal = { type, data };
  render();
}

function closeModal() {
  state.modal = null;
  render();
}

function renderModal(type, data) {
  const container = document.getElementById('modalRoot');
  if (!container) return;

  if (type === 'newEnquiry') renderNewEnquiryModal(container);
  else if (type === 'enquiryDetail') renderEnquiryDetailModal(container, data.enquiry);
  else if (type === 'enrolStudent') renderEnrolStudentModal(container, data);
  else if (type === 'studentProfile') renderStudentProfileModal(container, data.account);
  else if (type === 'viewInvoice') renderViewInvoiceModal(container, data.invoice);
  else if (type === 'previewInvoice') renderPreviewInvoiceModal(container, data.invoice);
  else if (type === 'recordPayment') renderRecordPaymentModal(container, data.invoice);
  else if (type === 'viewReceipt') renderViewReceiptModal(container, data.payment, data.invoice);
  else if (type === 'generatePayslip') renderGeneratePayslipModal(container, data);
  else if (type === 'viewPayslip') renderViewPayslipModal(container, data.payslip);
  else if (type === 'acknowledgePayslip') renderAcknowledgePayslipModal(container, data.payslip);
  else if (type === 'raisePayrollQuery') renderRaisePayrollQueryModal(container, data.payslip);
  else if (type === 'resolvePayrollQuery') renderResolvePayrollQueryModal(container, data.payslip);
  else if (type === 'approvePayslip') renderApprovePayslipModal(container, data.payslip);
  else if (type === 'payPayslip') renderPayPayslipModal(container, data.payslip);
  else if (type === 'cancelPayslip') renderCancelPayslipModal(container, data.payslip);
  else if (type === 'recordExpense') renderRecordExpenseModal(container);
  else if (type === 'cancelExpense') renderCancelExpenseModal(container, data.expense);
  else if (type === 'recordDirectIncome') renderRecordDirectIncomeModal(container);
  else if (type === 'addProgramme') renderAddProgrammeModal(container);
  else if (type === 'editProgramme') renderEditProgrammeModal(container, data.programme);
  else if (type === 'setBudget') renderSetBudgetModal(container);
  else if (type === 'sendReminder') renderSendReminderModal(container, data.invoice);
  else if (type === 'collectionNotes') renderCollectionNotesModal(container, data.invoice);
  else if (type === 'addPaymentAccount') renderAddPaymentAccountModal(container, data.account);
  else if (type === 'supabaseModal') renderSupabaseModal(container);
  // User Management Modals
  else if (type === 'addStaffModal') renderAddStaffModal(container);
  else if (type === 'addFacilitatorModal') renderAddFacilitatorModal(container);
  else if (type === 'editPersonnelModal') renderEditPersonnelModal(container, data.personnel);
  else if (type === 'deactivatePersonnelModal') renderDeactivatePersonnelModal(container, data.personnel);
  else if (type === 'deactivateUserModal') renderDeactivateUserModal(container, data.user);
  else if (type === 'resetPasswordModal') renderResetPasswordModal(container, data.user);
  else if (type === 'changeRoleModal') renderChangeRoleModal(container, data.user);
}

// ----------------------------------------------------
// TAB 1: DASHBOARD (ADMINISTRATIVE MANAGEMENT VIEW)
// ----------------------------------------------------
function renderDashboardTab(container) {
  const m = getFinancialMetrics();
  const pipe = m.pipeline;

  // Detailed Journey Counts
  const countLeads = state.enquiries.filter(e => e.status === 'NEW').length;
  const countScreening = state.enquiries.filter(e => e.status === 'CONTACTED').length;
  const countQualified = state.enquiries.filter(e => e.status === 'INTERESTED' || e.status === 'INVOICE_REQUESTED').length;
  const countInvoiced = state.invoices.length;
  const countPaid = state.payments.length;
  const countEnrolled = state.enrolments.length;
  const countActiveStudents = state.enrolments.filter(e => e.status !== 'graduated' && e.status !== 'withdrawn').length || countEnrolled;

  container.innerHTML = `
    <!-- Top KPI Financial Grid -->
    <div class="cp-grid-4">
      <div class="cp-kpi-card">
        <div class="cp-kpi-label">Revenue Collected</div>
        <div class="cp-kpi-val" style="color:var(--success);">${fmtMoney(m.totalIncomeReceived)}</div>
        <div class="cp-kpi-sub">Ledger Payments: ${fmtMoney(m.totalPaymentsReceived)}</div>
      </div>
      <div class="cp-kpi-card">
        <div class="cp-kpi-label">Operational Expenses</div>
        <div class="cp-kpi-val" style="color:var(--danger);">${fmtMoney(m.totalExpenses)}</div>
        <div class="cp-kpi-sub">Disbursed Operating Cashflow</div>
      </div>

  const pipeAssess = document.getElementById('pipeStageAssess');

  const pipeInterest = document.getElementById('pipeStageInterest');

  if (pipeEnrol) pipeEnrol.addEventListener('click', () => { state.tab = 'studentAccounts'; render(); });

  const pipeActive = document.getElementById('pipeStageActive');
  if (pipeActive) pipeActive.addEventListener('click', () => { state.tab = 'studentAccounts'; render(); });
}

  const pendingAck = myPayslips.filter(p => p.status === 'issued');
  const myQueries = myPayslips.flatMap(p => (p.queries || []).map(q => ({ ...q, payslipNo: p.payslipNo, payslipId: p.id })));
  const openQueries = myQueries.filter(q => q.status === 'open' || q.status === 'under_review');

  const totalPaidEarnings = safeRound(myPayslips.filter(p => p.status === 'paid').reduce((s, p) => s + Number(p.paidAmount || p.netPay || 0), 0));

  container.innerHTML = `
    <!-- Welcome Header -->
    <div style="background:#FFFFFF; border:1px solid var(--border); border-radius:var(--radius-md); padding:20px 24px; margin-bottom:20px; box-shadow:var(--shadow-sm); display:flex; justify-content:space-between; align-items:center;">

        <div>
          <div style="font-size:14px; font-weight:800; color:#92400E; display:flex; align-items:center; gap:6px;">

        <div class="cp-kpi-label">Latest Statement Status</div>
        <div class="cp-kpi-val" style="font-size:18px;">
          <span class="cp-pill ${latestPayslip ? (latestPayslip.status === 'paid' ? 'paid' : (latestPayslip.status === 'approved' ? 'partial' : 'new')) : 'draft'}">
            ${latestPayslip ? escapeHtml(latestPayslip.status.toUpperCase()) : 'NO STATEMENTS'}

        </div>
        <div class="cp-kpi-sub">${latestPayslip ? `Payslip #${latestPayslip.payslipNo}` : 'Awaiting Period Run'}</div>
      </div>
      <div class="cp-kpi-card">
        <div class="cp-kpi-label">Pending Acknowledgements</div>

          <div class="cp-empty-state" style="padding:20px 0;">
            <div class="cp-empty-desc">No queries raised. If you notice any discrepancy on a payslip, you can submit a query directly.</div>
          </div>
        ` : `
          <div style="font-size:12px;">
            ${myQueries.slice().reverse().slice(0, 3).map(q => `
              <div style="padding:10px 0; border-bottom:1px solid var(--border);">

                  <strong style="color:var(--primary); font-size:12.5px;">${escapeHtml(q.queryReason)}</strong>

            `).join('')}

    </div>

  document.getElementById('btnViewAllMyPayslips').addEventListener('click', () => { state.tab = 'myPayslips'; render(); });
  document.getElementById('btnViewAllMyQueries').addEventListener('click', () => { state.tab = 'myQueries'; render(); });
