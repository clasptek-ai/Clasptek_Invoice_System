                  <div style="font-size:12px; color:var(--text-secondary);">Programme(s): ${escapeHtml(acc.programmesList)}</div>
                </div>

                <div class="cp-table-wrap" style="margin-bottom:16px;">
                  <table class="cp-table">
                    <thead>
                      <tr>
                        <th>Date</th><th>Reference</th><th>Description</th>
                        <th style="text-align:right;">Charge / Debit</th><th style="text-align:right;">Payment / Credit</th><th style="text-align:right;">Running Balance</th>
                      </tr>
                    </thead>
                    <tbody>
                      ${rows.map(r => `
                        <tr>
                          <td>${fmtDate(r.date)}</td>
                          <td style="font-family:monospace; font-size:11.5px;">${escapeHtml(r.ref)}</td>
                          <td>${escapeHtml(r.desc)}</td>
                          <td style="text-align:right;">${r.debit > 0 ? fmtMoney(r.debit) : '\u2014'}</td>
                          <td style="text-align:right; color:var(--success);">${r.credit > 0 ? fmtMoney(r.credit) : '\u2014'}</td>
                          <td style="text-align:right; font-weight:700; color:${r.balance > 0 ? 'var(--warning)' : 'var(--success)'};">${fmtMoney(r.balance)}</td>
                        </tr>
                      `).join('')}
                    </tbody>
                  </table>
                </div>

                <div style="display:flex; justify-content:space-between; align-items:center; background:var(--surface-2); padding:12px; border-radius:var(--radius-sm);">
                  <div style="font-size:14px; font-weight:700; color:var(--primary);">Closing Outstanding Balance:</div>
                  <div style="font-size:16px; font-weight:800; color:${acc.balance > 0 ? 'var(--warning)' : 'var(--success)'};">${fmtMoney(acc.balance)}</div>
                </div>
              </div>
            </div>
            <div class="cp-modal-footer no-print">
              <button class="cp-btn secondary" id="mCloseStmt">Close</button>
              <button class="cp-btn accent" onclick="window.print();">&#x1F5A8; Print Statement</button>
            </div>
          </div>
        </div>
      `;

      document.getElementById('mClose').addEventListener('click', closeModal);
      document.getElementById('mCloseStmt').addEventListener('click', closeModal);
    }

    function renderSendReminderModal(container, inv) {
      const { balance } = invoiceBalance(inv);
      const ageing = getReceivableAgeing(inv);
      const defaultMsg = `Dear ${inv.clientName},\n\nThis is an official reminder from Clasptek Finance Management System regarding Invoice #${inv.invoiceNo} for ${inv.programmeName}.\nOutstanding Balance: ${fmtMoney(balance)}\nDue Date: ${fmtDate(inv.dueDate)}\n\nPlease ensure payment is completed promptly. Thank you for choosing Clasptek!`;

      container.innerHTML = `
        <div class="cp-modal-overlay">
          <div class="cp-modal">
            <div class="cp-modal-header"><div class="cp-modal-title">&#x1F4E7; Payment Reminder Generator</div><button class="cp-modal-close" id="mClose">&times;</button></div>
            <div class="cp-modal-body">
              <div style="font-size:13px; margin-bottom:10px;">Recipient: <strong>${escapeHtml(inv.clientName)}</strong> &middot; Priority: <span class="cp-pill ${ageing.prioClass}">${ageing.priority}</span></div>
              <div class="cp-field"><label>Reminder Channel</label><select id="mRemChannel"><option value="WhatsApp">WhatsApp</option><option value="Email">Email</option><option value="SMS">SMS</option></select></div>
              <div class="cp-field"><label>Reminder Message</label><textarea id="mRemMsg" rows="6">${escapeHtml(defaultMsg)}</textarea></div>
            </div>
            <div class="cp-modal-footer">
              <button class="cp-btn secondary" id="mRemClose">Cancel</button>
              <button class="cp-btn secondary" id="mBtnCopyRem">&#x1F4CB; Copy Message</button>
              <button class="cp-btn accent" id="mBtnLogRem">Log Reminder Sent</button>
            </div>
          </div>
        </div>
      `;

      document.getElementById('mClose').addEventListener('click', closeModal);
      document.getElementById('mRemClose').addEventListener('click', closeModal);
      document.getElementById('mBtnCopyRem').addEventListener('click', () => {
        navigator.clipboard.writeText(document.getElementById('mRemMsg').value);
        alert('Reminder message copied to clipboard!');
      });
      document.getElementById('mBtnLogRem').addEventListener('click', async () => {
        const reminder = {
          id: 'rem_' + Date.now(), tenant_id: DEFAULT_TENANT_ID, invoiceId: inv.id,
          channel: document.getElementById('mRemChannel').value, message: document.getElementById('mRemMsg').value,
          sentBy: state.currentRole, sentAt: new Date().toISOString()
        };
        state.paymentReminders.push(reminder);
        await safeSet(STORE_KEY_PAYMENT_REMINDERS, state.paymentReminders);
        await logAudit('SEND_REMINDER', 'reminder', reminder.id, `Invoice #${inv.invoiceNo} (${reminder.channel})`);
        alert('Reminder logged in audit trail!');
        closeModal();
      });
    }

    function renderCollectionNotesModal(container, inv) {
      const notes = state.collectionNotes.filter(n => n.invoiceId === inv.id);

      container.innerHTML = `
        <div class="cp-modal-overlay">
          <div class="cp-modal">
            <div class="cp-modal-header"><div class="cp-modal-title">&#x1F4DD; Collection Follow-up Notes</div><button class="cp-modal-close" id="mClose">&times;</button></div>
            <div class="cp-modal-body">
              <div style="font-size:13px; margin-bottom:12px;">Invoice <strong>#${inv.invoiceNo}</strong> &mdash; ${escapeHtml(inv.clientName)}</div>
              <div class="cp-field"><label>Add Follow-up Note</label><textarea id="mNewNoteText" rows="2" placeholder="e.g. Student promised transfer on Friday..."></textarea></div>
              <button class="cp-btn sm accent" id="btnAddNoteSubmit" style="margin-bottom:14px;">Save Note</button>
              <div style="font-weight:700; font-size:12.5px; margin-bottom:6px;">Historical Notes:</div>
              ${notes.length === 0 ? '<div style="font-size:12px; color:var(--text-muted);">No notes recorded.</div>' : `
                <div style="max-height:160px; overflow-y:auto; display:flex; flex-direction:column; gap:8px;">
                  ${notes.map(n => `
                    <div style="background:var(--surface-2); padding:8px 10px; border-radius:var(--radius-sm); font-size:12px;">
                      <div>${escapeHtml(n.note)}</div>
                      <div style="font-size:10.5px; color:var(--text-muted); margin-top:4px;">${fmtDate(n.createdAt.slice(0,10))} &middot; by ${escapeHtml(n.createdBy)}</div>
                    </div>
                  `).join('')}
                </div>
              `}
            </div>
            <div class="cp-modal-footer"><button class="cp-btn secondary" id="mNotesClose">Close</button></div>
          </div>
        </div>
      `;

      document.getElementById('mClose').addEventListener('click', closeModal);
      document.getElementById('mNotesClose').addEventListener('click', closeModal);
      document.getElementById('btnAddNoteSubmit').addEventListener('click', async () => {
        const text = document.getElementById('mNewNoteText').value.trim();
        if (!text) return;
        const note = { id: 'note_' + Date.now(), tenant_id: DEFAULT_TENANT_ID, invoiceId: inv.id, note: text, createdBy: state.currentRole, createdAt: new Date().toISOString() };
        state.collectionNotes.push(note);
        await safeSet(STORE_KEY_COLLECTION_NOTES, state.collectionNotes);
        await logAudit('ADD_COLLECTION_NOTE', 'collection_note', note.id, `Invoice #${inv.invoiceNo}`);
        openModal('collectionNotes', { invoice: inv });
      });
    }

    function renderCloseMonthChecklistModal(container) {
      const curMonth = new Date().toISOString().slice(0, 7);
      const unrec = state.payments.filter(p => (p.reconciliationStatus || 'unreconciled') === 'unreconciled').length;

      container.innerHTML = `
        <div class="cp-modal-overlay">
          <div class="cp-modal large">
            <div class="cp-modal-header"><div class="cp-modal-title">&#x1F512; 12-Step Month-End Financial Close: ${curMonth}</div><button class="cp-modal-close" id="mClose">&times;</button></div>
            <div class="cp-modal-body">
              <div style="font-size:13px; margin-bottom:12px;">Pre-close compliance verification checklist:</div>
              <div style="display:grid; grid-template-columns:1fr 1fr; gap:8px; font-size:12.5px;">
                <label><input type="checkbox" checked /> 1. All revenue &amp; income recorded</label>
                <label><input type="checkbox" checked /> 2. Operating expenses reviewed</label>
                <label><input type="checkbox" checked /> 3. Outstanding invoices checked</label>
                <label><input type="checkbox" checked /> 4. Receivables ageing audited</label>
                <label><input type="checkbox" ${unrec === 0 ? 'checked' : ''} /> 5. Payments reconciled (${unrec} unrec)</label>
                <label><input type="checkbox" checked /> 6. Expenses approved</label>
                <label><input type="checkbox" checked /> 7. Reversals &amp; adjustments audited</label>
                <label><input type="checkbox" checked /> 8. Budget variances reviewed</label>
                <label><input type="checkbox" checked /> 9. Exceptions resolved</label>
                <label><input type="checkbox" checked /> 10. Management reports prepared</label>
                <label><input type="checkbox" checked /> 11. Audit logs inspected</label>
                <label><input type="checkbox" checked /> 12. Final period locking authorization</label>
              </div>
              ${unrec > 0 ? `<div class="cp-error" style="margin-top:12px;">Warning: ${unrec} payment(s) remain unreconciled. Super Admin override required if proceeding.</div>` : ''}
            </div>
            <div class="cp-modal-footer">
              <button class="cp-btn secondary" id="mCloseClose">Cancel</button>
              <button class="cp-btn accent" id="mConfirmCloseMonth">Verify &amp; Lock Period</button>
            </div>
          </div>
        </div>
      `;

      document.getElementById('mClose').addEventListener('click', closeModal);
      document.getElementById('mCloseClose').addEventListener('click', closeModal);
      document.getElementById('mConfirmCloseMonth').addEventListener('click', async () => {
        let fp = state.financePeriods.find(p => p.period === curMonth);
        if (!fp) { fp = { id: 'fp_' + Date.now(), tenant_id: DEFAULT_TENANT_ID, period: curMonth }; state.financePeriods.push(fp); }
        fp.status = 'locked'; fp.closedAt = new Date().toISOString(); fp.closedBy = state.currentRole; fp.lockedAt = new Date().toISOString(); fp.lockedBy = state.currentRole;
        await safeSet(STORE_KEY_FINANCE_PERIODS, state.financePeriods);
        await logAudit('CLOSE_MONTH_12STEP', 'period', curMonth, `12-Step Closed & Locked ${curMonth}`);
        closeModal();
        render();
      });
    }

    function renderSetBudgetModal(container) {
      const curMonth = state.filters.budgetPeriod || new Date().toISOString().slice(0, 7);
      const groups = Object.keys(state.expenseCategories);

      container.innerHTML = `
        <div class="cp-modal-overlay">
          <div class="cp-modal">
            <div class="cp-modal-header"><div class="cp-modal-title">&#x1F6E1; Set Spending Budget</div><button class="cp-modal-close" id="mClose">&times;</button></div>
            <div class="cp-modal-body">
              <div class="cp-row2">
                <div class="cp-field"><label>Month *</label><input type="month" id="mBMonth" value="${curMonth}" /></div>
                <div class="cp-field"><label>Budget (\u20a6) *</label><input type="number" id="mBAmt" min="1" placeholder="500000" /></div>
              </div>
              <div class="cp-field"><label>Category Group *</label><select id="mBGroup">${groups.map(g => `<option value="${escapeHtml(g)}">${escapeHtml(g)}</option>`).join('')}</select></div>
            </div>
            <div class="cp-modal-footer">
              <button class="cp-btn secondary" id="mBCancel">Cancel</button>
              <button class="cp-btn accent" id="mBSave">Save Target</button>
            </div>
          </div>
        </div>
      `;

      document.getElementById('mClose').addEventListener('click', closeModal);
      document.getElementById('mBCancel').addEventListener('click', closeModal);
      document.getElementById('mBSave').addEventListener('click', async () => {
        const amt = Number(document.getElementById('mBAmt').value);
        const month = document.getElementById('mBMonth').value;
        if (!amt) return;

        const budget = {
          id: 'bdg_' + Date.now(), tenant_id: DEFAULT_TENANT_ID, period: month,
          categoryGroup: document.getElementById('mBGroup').value, budgetAmount: amt,
          status: 'active', createdAt: new Date().toISOString(), createdBy: state.currentRole
        };

        state.budgets.push(budget);
        await safeSet(STORE_KEY_BUDGETS, state.budgets);
        await logAudit('SET_BUDGET', 'budget', budget.id, `${budget.categoryGroup} (${budget.period})`, null, budget);
        closeModal();
        render();
      });
    }

    function renderCancelExpenseModal(container, expense) {
      container.innerHTML = `
        <div class="cp-modal-overlay">
          <div class="cp-modal">
            <div class="cp-modal-header"><div class="cp-modal-title" style="color:var(--danger);">&#x26A0; Void Expense</div><button class="cp-modal-close" id="mClose">&times;</button></div>
            <div class="cp-modal-body">
              <div style="font-size:13px; margin-bottom:12px;">Void expense of <strong>${fmtMoney(expense.amount)}</strong> (${escapeHtml(expense.description)})?</div>
              <div class="cp-field"><label>Reason *</label><textarea id="mVoidReason" rows="2" placeholder="Audit justification..."></textarea></div>
            </div>
            <div class="cp-modal-footer">
              <button class="cp-btn secondary" id="mVoidCancel">Cancel</button>
              <button class="cp-btn danger" id="mConfirmVoid">Confirm Void</button>
            </div>
          </div>
        </div>
      `;

      document.getElementById('mClose').addEventListener('click', closeModal);
      document.getElementById('mVoidCancel').addEventListener('click', closeModal);
      document.getElementById('mConfirmVoid').addEventListener('click', async () => {
        const reason = document.getElementById('mVoidReason').value.trim();
        if (!reason) return;

        expense.status = 'cancelled';
        expense.cancelledReason = reason;
        expense.cancelledAt = new Date().toISOString();
        expense.cancelledBy = state.currentRole;

        await safeSet(STORE_KEY_EXPENSES, state.expenses);
        await logAudit('CANCEL_EXPENSE', 'expense', expense.id, expense.description, 'recorded', 'cancelled', reason);
        closeModal();
        render();
      });
    }

    function renderCancelDirectIncomeModal(container, item) {
      container.innerHTML = `
        <div class="cp-modal-overlay">
          <div class="cp-modal">
            <div class="cp-modal-header"><div class="cp-modal-title" style="color:var(--danger);">&#x26A0; Void Direct Income</div><button class="cp-modal-close" id="mClose">&times;</button></div>
            <div class="cp-modal-body">
              <div style="font-size:13px; margin-bottom:12px;">Void direct income of <strong>${fmtMoney(item.amount)}</strong> (${escapeHtml(item.category)})?</div>
              <div class="cp-field"><label>Reason *</label><textarea id="mDirVoidReason" rows="2" placeholder="Audit reason..."></textarea></div>
            </div>
            <div class="cp-modal-footer">
              <button class="cp-btn secondary" id="mDirVoidCancel">Cancel</button>
              <button class="cp-btn danger" id="mConfirmDirVoid">Confirm Void</button>
            </div>
          </div>
        </div>
      `;

      document.getElementById('mClose').addEventListener('click', closeModal);
      document.getElementById('mDirVoidCancel').addEventListener('click', closeModal);
      document.getElementById('mConfirmDirVoid').addEventListener('click', async () => {
        const reason = document.getElementById('mDirVoidReason').value.trim();
        if (!reason) return;

        item.status = 'cancelled';
        item.cancelledReason = reason;
        item.cancelledAt = new Date().toISOString();
        item.cancelledBy = state.currentRole;

        await safeSet(STORE_KEY_DIRECT_INCOME, state.directIncome);
        await logAudit('CANCEL_DIRECT_INCOME', 'direct_income', item.id, item.category, 'active', 'cancelled', reason);
        closeModal();
        render();
      });
    }

    function renderNewReconciliationModal(container, expectedBalance) {
      const curMonth = new Date().toISOString().slice(0, 7);

      container.innerHTML = `
        <div class="cp-modal-overlay">
          <div class="cp-modal">
            <div class="cp-modal-header">
              <div class="cp-modal-title">&#x2696; Record Bank Statement Reconciliation</div>
              <button class="cp-modal-close" id="mClose">&times;</button>
            </div>
            <div class="cp-modal-body">
              <div class="cp-field"><label>Reconciliation Period *</label><input id="mRecPeriod" type="month" value="${curMonth}" /></div>
              <div class="cp-field"><label>Account Name *</label><input id="mRecAccount" value="Main Corporate Bank (GTB/Access)" /></div>
              <div class="cp-field"><label>Expected System Balance (\u20a6)</label><input id="mRecExpected" value="${expectedBalance}" disabled /></div>
              <div class="cp-field"><label>Actual Bank Statement Ending Balance (\u20a6) *</label><input id="mRecActual" type="number" placeholder="Enter bank statement balance..." /></div>
              <div class="cp-field"><label>Reconciliation Notes / Exception Reasons</label><textarea id="mRecNotes" rows="2" placeholder="e.g. Cleared all deposits, no unmatched items..."></textarea></div>
            </div>
            <div class="cp-modal-footer">
              <button class="cp-btn secondary" id="mRecCancel">Cancel</button>
              <button class="cp-btn accent" id="mRecSubmit">Save &amp; Lock Reconciliation</button>
            </div>
          </div>
        </div>
      `;

      document.getElementById('mClose').addEventListener('click', closeModal);
      document.getElementById('mRecCancel').addEventListener('click', closeModal);
      document.getElementById('mRecSubmit').addEventListener('click', async () => {
        const actual = Number(document.getElementById('mRecActual').value);
        const period = document.getElementById('mRecPeriod').value;
        const exp = Number(expectedBalance) || 0;
        const variance = safeRound(actual - exp);
        const status = variance === 0 ? 'RECONCILED' : 'EXCEPTION';

        const recon = {
          id: 'recon_' + Date.now(),
          tenant_id: DEFAULT_TENANT_ID,
          period,
          account: document.getElementById('mRecAccount').value.trim(),
          expectedBalance: exp,
          actualBalance: actual,
          variance,
          status,
          notes: document.getElementById('mRecNotes').value.trim(),
          reconciledAt: new Date().toISOString(),
          reconciledBy: state.currentRole
        };

        state.reconciliations.unshift(recon);
        await safeSet(STORE_KEY_RECONCILIATIONS, state.reconciliations);
        await logAudit('SAVE_RECONCILIATION', 'reconciliation', recon.id, `${recon.period} (Variance: ${fmtMoney(variance)})`, null, recon);
        closeModal();
        render();
      });
    }

    function renderReviewAnomaliesModal(container, anomalies) {
      container.innerHTML = `
        <div class="cp-modal-overlay">
          <div class="cp-modal large">
            <div class="cp-modal-header">
              <div class="cp-modal-title">&#x26A0; Financial Anomaly Review &amp; Clearance</div>
              <button class="cp-modal-close" id="mClose">&times;</button>
            </div>
            <div class="cp-modal-body">
              <div style="display:flex; flex-direction:column; gap:10px;">
                ${anomalies.map(anom => `
                  <div style="background:var(--surface-2); padding:12px; border-radius:var(--radius-sm); border:1px solid var(--border);">
                    <div style="display:flex; justify-content:space-between; align-items:center;">
                      <span class="cp-pill ${anom.severity === 'HIGH' ? 'unpaid' : 'partial'}">${anom.severity}: ${escapeHtml(anom.type)}</span>
                      <span style="font-size:12px; color:var(--text-muted);">${fmtDate(anom.date)}</span>
                    </div>
                    <div style="font-weight:700; margin-top:6px; color:var(--primary);">${escapeHtml(anom.what)}</div>
                    <div style="font-size:12px; color:var(--text-secondary); margin-top:2px;">${escapeHtml(anom.why)}</div>
                  </div>
                `).join('')}
              </div>
            </div>
            <div class="cp-modal-footer">
              <button class="cp-btn secondary" id="mAnomClose">Close</button>
            </div>
          </div>
        </div>
      `;

      document.getElementById('mClose').addEventListener('click', closeModal);
      document.getElementById('mAnomClose').addEventListener('click', closeModal);
    }

    function escapeHtml(str) {
      if (!str) return '';
      return String(str).replace(/[&<>"']/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[m]));
    }

    // Initialize application
    loadAll();
  })();
  </script>
</body>
</html>
