  const btnAddFac = document.getElementById('btnAddFacilitatorBtn');
  if (btnAddFac) btnAddFac.addEventListener('click', () => openModal('addFacilitatorModal'));

  const btnExpPers = document.getElementById('btnExportPersonnel');
  if (btnExpPers) {
    btnExpPers.addEventListener('click', () => {
      exportToCSV('Personnel_Directory', state.personnel.map(p => ({
        ID: p.employeeId, Name: p.name, Type: p.type, Department: p.department, Role: p.role,
        Email: p.email, Phone: p.phone, Bank: p.bankName, AccountNo: p.accountNumber, BasicPay: p.basicPay, Status: p.status
      })));
    });
  }

  // Personnel actions
  container.querySelectorAll('.btnEditPersonnel').forEach(b => {
    b.addEventListener('click', () => {
      const pers = state.personnel.find(p => p.id === b.dataset.id);
      if (pers) openModal('editPersonnelModal', { personnel: pers });
    });
  });

  container.querySelectorAll('.btnCreateLoginForPers').forEach(b => {
    b.addEventListener('click', async () => {
      const pers = state.personnel.find(p => p.id === b.dataset.id);
      if (!pers) return;
      const newUserId = 'usr_' + Date.now();
      const userRole = pers.type === 'facilitator' ? 'Facilitator' : 'Staff';
      const invToken = generateRandomToken('inv_');
      const invExpiry = Date.now() + 7 * 24 * 3600 * 1000; // 7 days
      const newUser = {
        id: newUserId,
        email: pers.email,
        name: pers.name,
        role: userRole,
        title: pers.role || pers.designation,
        status: 'invited',
        mustChangePassword: true,
        invitationToken: invToken,
        invitationExpiresAt: invExpiry,
        personnelId: pers.id,
        tenant_id: DEFAULT_TENANT_ID,
        createdAt: new Date().toISOString()
      };
      pers.userId = newUserId;
      state.users.push(newUser);
      await safeSet(STORE_KEY_PERSONNEL, state.personnel);
      await safeSet(STORE_KEY_SYSTEM_USERS, state.users);
      await logAudit('USER_INVITED', 'user', newUserId, `Provisioned invitation login for ${pers.name} (${userRole})`);
      
      const currentUrl = (typeof window !== 'undefined' && window.location ? window.location.href.split('?')[0] : 'file:///clasptek_invoice_system.html');
      const invLink = `${currentUrl}?invite=${invToken}`;
      alert(`Login invitation created for ${pers.name} (${pers.email}) with role: ${userRole}.\n\nInvitation Link (Valid for 7 days):\n${invLink}`);
      render();
    });
  });

  container.querySelectorAll('.btnDeactivatePersonnel').forEach(b => {
    b.addEventListener('click', () => {
      const pers = state.personnel.find(p => p.id === b.dataset.id);
      if (pers) openModal('deactivatePersonnelModal', { personnel: pers });
    });
  });

  container.querySelectorAll('.btnReactivatePersonnel').forEach(b => {
    b.addEventListener('click', async () => {
      const pers = state.personnel.find(p => p.id === b.dataset.id);
      if (!pers) return;
      pers.status = 'active';
      const usr = state.users.find(u => u.personnelId === pers.id || u.id === pers.userId || (u.email && u.email.toLowerCase() === pers.email.toLowerCase()));
      if (usr) usr.status = 'active';
      await safeSet(STORE_KEY_PERSONNEL, state.personnel);
      await safeSet(STORE_KEY_SYSTEM_USERS, state.users);
      await logAudit('REACTIVATE_PERSONNEL', 'personnel', pers.id, `Reactivated staff ${pers.name}`);
      alert(`${pers.name} has been reactivated.`);
      render();
    });
  });

  // User Governance Actions
  container.querySelectorAll('.btnChangeUserRole').forEach(b => {
    b.addEventListener('click', () => {
      const u = state.users.find(usr => usr.id === b.dataset.id);
      if (u) openModal('changeRoleModal', { user: u });
    });
  });

  container.querySelectorAll('.btnResetUserPwd').forEach(b => {
    b.addEventListener('click', () => {
      const u = state.users.find(usr => usr.id === b.dataset.id);
      if (u) openModal('resetPasswordModal', { user: u });
    });
  });

  container.querySelectorAll('.btnCopyInviteLink').forEach(b => {
    b.addEventListener('click', async () => {
      const u = state.users.find(usr => usr.id === b.dataset.id);
      if (!u || !u.invitationToken) return;
      const currentUrl = (typeof window !== 'undefined' && window.location ? window.location.href.split('?')[0] : 'file:///clasptek_invoice_system.html');
      const invLink = `${currentUrl}?invite=${u.invitationToken}`;
      if (navigator.clipboard && navigator.clipboard.writeText) {
        try {
          await navigator.clipboard.writeText(invLink);
          alert(`Invitation link copied to clipboard:\n${invLink}`);
        } catch (err) {
          prompt('Copy Invitation Link:', invLink);
        }
      } else {
        prompt('Copy Invitation Link:', invLink);
      }
    });
  });

  container.querySelectorAll('.btnRevokeUserSess').forEach(b => {
    b.addEventListener('click', async () => {
      const u = state.users.find(usr => usr.id === b.dataset.id);
      if (!u) return;
      if (!confirm(`Revoke all active portal sessions for ${u.name} (${u.email})? They will be prompted to re-authenticate immediately.`)) return;
      u.revokedSessionTokens = u.revokedSessionTokens || [];
      u.revokedSessionTokens.push('REVOKED_' + Date.now());
      await safeSet(STORE_KEY_SYSTEM_USERS, state.users);
      await logAudit('REVOKE_USER_SESSIONS', 'user', u.id, `Revoked active sessions for ${u.email}`);
      alert(`All active sessions for ${u.name} have been revoked.`);
      render();
    });
  });

  container.querySelectorAll('.btnDeactivateUserAccount').forEach(b => {
    b.addEventListener('click', () => {
      const u = state.users.find(usr => usr.id === b.dataset.id);
      if (u) openModal('deactivateUserModal', { user: u });
    });
  });

  container.querySelectorAll('.btnReactivateUserAccount').forEach(b => {
    b.addEventListener('click', async () => {
      const u = state.users.find(usr => usr.id === b.dataset.id);
      if (!u) return;
      u.status = 'active';
      delete u.deactivationReason;
      delete u.deactivatedAt;
      delete u.deactivatedBy;
      await safeSet(STORE_KEY_SYSTEM_USERS, state.users);
      await logAudit('REACTIVATE_USER', 'user', u.id, `Reactivated account for ${u.email}`);
      alert(`User account for ${u.name} (${u.email}) has been reactivated.`);
      render();
    });
  });

  container.querySelectorAll('.btnToggleSuspendUser').forEach(b => {
    b.addEventListener('click', async () => {
      const u = state.users.find(usr => usr.id === b.dataset.id);
      if (!u) return;
      u.status = u.status === 'suspended' ? 'active' : 'suspended';
      await safeSet(STORE_KEY_SYSTEM_USERS, state.users);
      await logAudit('TOGGLE_USER_STATUS', 'user', u.id, `Set status to ${u.status}`);
      render();
    });
  });
}

  container.innerHTML = `
    <div class="cp-card">
      <div class="cp-card-header">
        <div>
          <div class="cp-section-title">&#x1F512; Financial Controls &amp; Governance</div>

      </div>

      <div style="display:grid; grid-template-columns:1fr 1fr; gap:16px;">
        <div style="background:#FAFBFD; border:1px solid var(--border); border-radius:var(--radius-sm); padding:16px;">
          <div style="font-size:14px; font-weight:700; color:var(--primary); margin-bottom:6px;">Accounting Period Status (${curMonth})</div>
          <div style="font-size:12.5px; color:var(--text-secondary); margin-bottom:12px;">
            Status: <strong style="color:${isLocked ? 'var(--danger)' : 'var(--success)'};">${isLocked ? 'LOCKED (Modifications Prohibited)' : 'OPEN FOR TRANSACTIONS'}</strong>
          </div>
          ${canLockPeriod() ? `
            <button class="cp-btn ${isLocked ? 'accent' : 'danger'} sm" id="btnToggleLockPeriod">
              ${isLocked ? 'Reopen Financial Period' : 'Lock Current Period'}
            </button>
          ` : '<div style="font-size:11.5px; color:var(--text-muted);">Period locking restricted to Super Admin.</div>'}
        </div>

        <div style="background:#FAFBFD; border:1px solid var(--border); border-radius:var(--radius-sm); padding:16px;">
          <div style="font-size:14px; font-weight:700; color:var(--primary); margin-bottom:6px;">Approval Tiers</div>
          <div style="font-size:12px; color:var(--text-secondary); line-height:1.6;">
            Tier 1 (Under ₦100,000): <strong>Automatic Approval</strong><br/>
            Tier 2 (₦100,000 – ₦500,000): <strong>Finance Manager</strong><br/>
            Tier 3 (Over ₦500,000): <strong>Super Admin Only</strong>
          </div>
        </div>
      </div>
    </div>
  `;

  const btnLock = document.getElementById('btnToggleLockPeriod');
  if (btnLock) {
    btnLock.addEventListener('click', async () => {
      const idx = state.financePeriods.findIndex(p => p.period === curMonth);
      const newStatus = isLocked ? 'open' : 'locked';
      if (idx >= 0) state.financePeriods[idx].status = newStatus;
      else state.financePeriods.push({ period: curMonth, status: newStatus, lockedAt: new Date().toISOString() });
      await safeSet(STORE_KEY_FINANCE_PERIODS, state.financePeriods);
      await logAudit('PERIOD_LOCK_TOGGLE', 'period', curMonth, `Set to ${newStatus}`);
      render();
    });
  }
}

      state.settingsSubTab = btn.dataset.sub;
      render();
    });

  if (btnSaveCo) {
    btnSaveCo.addEventListener('click', async () => {
      state.financeSettings = {
        ...state.financeSettings,
        companyName: document.getElementById('setCompanyName').value.trim(),
        tradingName: document.getElementById('setTradingName').value.trim(),
        address: document.getElementById('setAddress').value.trim(),
        phone: document.getElementById('setPhone').value.trim(),
        email: document.getElementById('setEmail').value.trim(),
        website: document.getElementById('setWebsite').value.trim(),
        taxId: document.getElementById('setTaxId').value.trim(),
        registrationNumber: document.getElementById('setRegNo').value.trim(),
        invoiceFooter: document.getElementById('setFooter').value.trim()

      alert('Company profile updated successfully.');
      render();
    });

  // Payment Accounts Handlers
  const btnAddAcc = document.getElementById('btnAddAccountBtn');
  if (btnAddAcc) btnAddAcc.addEventListener('click', () => openModal('addPaymentAccount'));

  container.querySelectorAll('.btnSetDefaultAcc').forEach(b => {
    b.addEventListener('click', async () => {
      const id = b.dataset.id;
      state.paymentAccounts.forEach(a => {
        a.isDefault = a.id === id;
      });
      await safeSet(STORE_KEY_PAYMENT_ACCOUNTS, state.paymentAccounts);
      await logAudit('SET_DEFAULT_ACCOUNT', 'payment_account', id, 'Set as Default Payment Account');
      render();
    });
  });

  container.querySelectorAll('.btnToggleActiveAcc').forEach(b => {
    b.addEventListener('click', async () => {
      const id = b.dataset.id;
      const acc = state.paymentAccounts.find(a => a.id === id);
      if (acc) {
        acc.isActive = acc.isActive === false ? true : false;
        await safeSet(STORE_KEY_PAYMENT_ACCOUNTS, state.paymentAccounts);
        await logAudit('TOGGLE_ACCOUNT_STATUS', 'payment_account', id, `Set active to ${acc.isActive}`);
        render();
      }
    });
  });

  container.querySelectorAll('.btnEditAcc').forEach(b => {
    b.addEventListener('click', () => {
      const acc = state.paymentAccounts.find(a => a.id === b.dataset.id);
      if (acc) openModal('addPaymentAccount', { account: acc });
    });
  });

  // Save Invoice Defaults
  const btnSaveInvDef = document.getElementById('btnSaveInvoiceDefaults');

    btnSaveInvDef.addEventListener('click', async () => {
      state.financeSettings.defaultTerms = document.getElementById('setDefaultTerms').value.trim();

        defAcc.instructions = document.getElementById('setDefaultInstructions').value.trim();

      }
      await safeSet(STORE_KEY_FINANCE_SETTINGS, state.financeSettings);

      alert('Invoice defaults updated successfully.');
      render();
    });
  }

  // Backup & Supabase Handlers
  const btnLaunchSb = document.getElementById('btnLaunchSupabaseModal');
  if (btnLaunchSb) btnLaunchSb.addEventListener('click', () => openModal('supabaseModal'));

  const btnDlBackup = document.getElementById('btnDownloadBackupJson');
  if (btnDlBackup) {
    btnDlBackup.addEventListener('click', () => {
      const fullBackup = {
        exportedAt: new Date().toISOString(),
        tenant_id: DEFAULT_TENANT_ID,
        financeSettings: state.financeSettings,
        paymentAccounts: state.paymentAccounts,
        payslips: state.payslips,
        programmes: state.programmes,
        invoices: state.invoices,
        payments: state.payments,
        expenses: state.expenses,
        directIncome: state.directIncome,
        budgets: state.budgets,
        enquiries: state.enquiries,
        enrolments: state.enrolments,
        auditLog: state.auditLog,
        counters: state.counters
      };
      const blob = new Blob([JSON.stringify(fullBackup, null, 2)], { type: 'application/json' });
      const link = document.createElement('a');
      link.href = URL.createObjectURL(blob);
      link.download = `clasptek_finance_backup_${new Date().toISOString().slice(0, 10)}.json`;
      link.click();
    });
  }
}

// CANONICAL DOCUMENT RENDERERS (SCREEN & PRINT 100% IDENTICAL)

function renderCanonicalInvoiceDocument(inv) {
  const { paid, balance, total } = invoiceBalance(inv);
  const st = invoiceStatus(inv);
  const payAcc = getInvoicePaymentAccount(inv);
  const fsCfg = state.financeSettings || DEFAULT_FINANCE_SETTINGS;

  const statusLabel = st === 'paid' ? 'PAID IN FULL' : (st === 'partial' ? 'PARTIALLY PAID' : (st === 'overdue' ? 'OVERDUE' : 'UNPAID'));
  const statusPillClass = st === 'paid' ? 'paid' : (st === 'partial' ? 'partial' : (st === 'overdue' ? 'overdue' : 'unpaid'));

  const isInstallment = inv.plan === 'installment';
  const firstInstAmt = isInstallment ? safeRound(total * 0.6) : total;
  const secondInstAmt = isInstallment ? safeRound(total * 0.4) : 0;
  const firstDueDate = inv.date;
  const secondDueDate = inv.dueDate;

  const items = (inv.items && inv.items.length) ? inv.items : [{
    description: inv.programmeName || 'Professional Training Programme',
    quantity: 1,
    price: total,
    discount: 0,
    amount: total
  }];

  const hasNotes = Boolean(inv.notes || inv.comments);

  return `
    <div class="cp-doc-paper" id="canonical-invoice-${inv.id}">
      <!-- 1. Header: Clasptek Logo on Left, Company Contact on Right -->
      <div class="cp-doc-header">
        <div class="cp-doc-brand">
          <img src="assets/clasptek_logo.png" alt="Clasptek" class="cp-doc-logo" />
        </div>
        <div class="cp-doc-company-block">
          <div class="cp-doc-company-title">${escapeHtml(fsCfg.companyName)}</div>
          <div class="cp-doc-company-meta">
            ${escapeHtml(fsCfg.address)}<br/>
            Phone: ${escapeHtml(fsCfg.phone)} &middot; Email: ${escapeHtml(fsCfg.email)}<br/>
            ${fsCfg.taxId ? `TIN: ${escapeHtml(fsCfg.taxId)} &middot; ` : ''}${fsCfg.registrationNumber ? `RC: ${escapeHtml(fsCfg.registrationNumber)} &middot; ` : ''}Web: ${escapeHtml(fsCfg.website)}
          </div>
        </div>
      </div>

      <!-- 2. Invoice Title & Meta Row -->
      <div class="cp-doc-title-row">
        <div>
          <h1 class="cp-doc-main-title">INVOICE</h1>
          <div class="cp-doc-no">Invoice No: #${inv.invoice_display_no || formatDocNo('invoice', inv.invoiceNo, inv.date)}</div>
        </div>
        <div class="cp-doc-badge-col">
          <span class="cp-pill ${statusPillClass}" style="font-size:11px; padding:3px 10px;">${statusLabel}</span>
        </div>
      </div>

      <!-- 3. Compact Two-Column Bill To & Invoice Info Grid -->
      <div class="cp-doc-meta-grid">
        <div class="cp-doc-meta-block">
          <div class="cp-doc-section-label">BILL TO</div>
          <div class="cp-doc-client-name">${escapeHtml(inv.clientName)}</div>
          ${inv.parentName ? `<div class="cp-doc-meta-line">Parent / Guardian: <strong>${escapeHtml(inv.parentName)}</strong></div>` : ''}
          <div class="cp-doc-meta-line">
            ${inv.phone ? `Phone: <strong>${escapeHtml(inv.phone)}</strong>` : ''}
            ${inv.phone && inv.email ? ' &middot; ' : ''}
            ${inv.email ? `Email: <strong>${escapeHtml(inv.email)}</strong>` : ''}
          </div>
          ${inv.address ? `<div class="cp-doc-meta-line">Address: ${escapeHtml(inv.address)}</div>` : ''}
        </div>

        <div class="cp-doc-meta-block">
          <div class="cp-doc-section-label">INVOICE SPECIFICATION</div>
          <div class="cp-doc-meta-row"><span>Issue Date:</span><strong>${fmtDate(inv.date)}</strong></div>
          <div class="cp-doc-meta-row"><span>Due Date:</span><strong style="color:${st === 'overdue' ? 'var(--danger)' : 'inherit'};">${fmtDate(inv.dueDate)}</strong></div>
          <div class="cp-doc-meta-row"><span>Payment Structure:</span><strong>${isInstallment ? '60 / 40 Installment Plan' : 'Full Upfront Payment'}</strong></div>
          <div class="cp-doc-meta-row"><span>Delivery Mode:</span><strong>${escapeHtml(inv.trainingMode || 'Live Interactive Class')}</strong></div>
        </div>
      </div>

      <!-- 4. Programme / Service Line Items Table -->
      <div class="cp-doc-table-wrap">
        <table class="cp-doc-table">
          <thead>
            <tr>
              <th style="width:30px; text-align:center;">#</th>
              <th>Programme / Service Description</th>
              <th style="width:85px; text-align:center;">Duration</th>
              <th style="width:80px; text-align:center;">Schedule</th>
              <th style="width:45px; text-align:center;">Qty</th>
              <th style="width:105px; text-align:right;">Unit Price</th>
              <th style="width:85px; text-align:right;">Discount</th>
              <th style="width:115px; text-align:right;">Amount (₦)</th>
            </tr>
          </thead>
          <tbody>
            ${items.map((it, idx) => `
              <tr>
                <td style="text-align:center; color:var(--text-muted);">${idx + 1}</td>
                <td>
                  <strong style="color:var(--primary); font-size:12.5px;">${escapeHtml(it.description || inv.programmeName)}</strong>
                  ${(it.notes || (inv.programmeName && it.description !== inv.programmeName)) ? `<div style="font-size:10.5px; color:var(--text-secondary); margin-top:1px;">${escapeHtml(it.notes || inv.programmeName)}</div>` : ''}
                </td>
                <td style="text-align:center; font-size:11px;">${escapeHtml(inv.duration || 'Standard')}</td>
                <td style="text-align:center; font-size:11px;">${escapeHtml(inv.schedule || 'Flexible')}</td>

                <td style="text-align:right;">${fmtMoney(it.price || 0)}</td>

                <td style="text-align:right; font-weight:700; color:var(--primary);">${fmtMoney(it.amount || 0)}</td>

        <!-- Left Column: Payment Plan Schedule (or Summary Box) -->
        <div>
          ${isInstallment ? `
            <div class="cp-doc-plan-box" style="margin:0; height:100%; box-sizing:border-box;">
              <div class="cp-doc-section-label">PAYMENT PLAN SCHEDULE</div>
              <table class="cp-doc-mini-table">
                <thead>
                  <tr>
                    <th>Installment</th>
                    <th>%</th>
                    <th>Due Date</th>
                    <th style="text-align:right;">Amount (₦)</th>
                    <th style="text-align:center;">Status</th>
                  </tr>
                </thead>
                <tbody>
                  <tr>
                    <td><strong>1st Deposit</strong></td>
                    <td>60%</td>
                    <td>${fmtDate(firstDueDate)}</td>
                    <td style="text-align:right; font-weight:700;">${fmtMoney(firstInstAmt)}</td>
                    <td style="text-align:center;"><span class="cp-pill ${paid >= firstInstAmt ? 'paid' : 'unpaid'}" style="font-size:9.5px; padding:2px 6px;">${paid >= firstInstAmt ? 'PAID' : 'DUE'}</span></td>
                  </tr>
                  <tr>
                    <td><strong>2nd Balance</strong></td>
                    <td>40%</td>
                    <td>${fmtDate(secondDueDate)}</td>
                    <td style="text-align:right; font-weight:700;">${fmtMoney(secondInstAmt)}</td>
                    <td style="text-align:center;"><span class="cp-pill ${paid >= total ? 'paid' : 'unpaid'}" style="font-size:9.5px; padding:2px 6px;">${paid >= total ? 'PAID' : 'PENDING'}</span></td>
                  </tr>
                </tbody>
              </table>
            </div>
          ` : `
            <div class="cp-doc-box payment-info-box" style="margin:0; height:100%; box-sizing:border-box;">
              <div class="cp-doc-section-label" style="color:var(--primary);">PAYMENT INSTRUCTIONS</div>
              <div class="cp-doc-bank-grid">
                <div>
                  <span class="cp-meta-label">Bank:</span> <strong>${escapeHtml(payAcc.bankName)}</strong><br/>
                  <span class="cp-meta-label">Account Name:</span> <strong>${escapeHtml(payAcc.accountName)}</strong>
                </div>
                <div>
                  <span class="cp-meta-label">Account Number:</span> <strong class="cp-acc-num">${escapeHtml(payAcc.accountNumber)}</strong><br/>
                  <span class="cp-meta-label">Payment Ref:</span> <strong class="cp-ref-num">INV-${inv.invoiceNo}</strong>
                </div>

              ${payAcc.instructions ? `<div class="cp-doc-instructions" style="margin-top:6px; padding-top:6px;">${escapeHtml(payAcc.instructions)}</div>` : ''}

            <div class="cp-doc-total-row">
              <span>Subtotal</span>
              <span>${fmtMoney(inv.subtotal || total)}</span>
            </div>
            ${Number(inv.discount || 0) > 0 ? `
              <div class="cp-doc-total-row">
                <span>Discount</span>
                <span style="color:var(--danger);">- ${fmtMoney(inv.discount)}</span>

            <div class="cp-doc-total-row grand">
              <span>TOTAL DUE</span>
              <span>${fmtMoney(total)}</span>
            </div>
            <div class="cp-doc-total-row">
              <span>Amount Paid</span>
              <span style="color:var(--success); font-weight:700;">${fmtMoney(paid)}</span>
            </div>
            <div class="cp-doc-total-row balance-row">
              <span>Outstanding Balance</span>
              <span>${fmtMoney(balance)}</span>
            </div>

function renderRecordPaymentModal(container, inv) {
  const { balance } = invoiceBalance(inv);
  const todayStr = new Date().toISOString().slice(0, 10);

  container.innerHTML = `
    <div class="cp-modal-overlay">
      <div class="cp-modal">
        <div class="cp-modal-header">
          <div class="cp-modal-title">Record Payment &mdash; Invoice #${inv.invoiceNo}</div>
          <button class="cp-modal-close" id="btnClosePayMod">&times;</button>
        </div>

        <div class="cp-modal-body">
          <div style="background:#FAFBFD; border:1px solid var(--border); border-radius:var(--radius-sm); padding:12px; margin-bottom:14px; font-size:12.5px;">
            <div>Student: <strong>${escapeHtml(inv.clientName)}</strong></div>
            <div>Programme: <strong>${escapeHtml(inv.programmeName)}</strong></div>
            <div style="margin-top:4px;">Outstanding Due: <strong style="color:var(--warning); font-size:14px;">${fmtMoney(balance)}</strong></div>
          </div>

          <div class="cp-field"><label>Payment Amount (₦) *</label><input type="number" id="payAmount" value="${balance}" max="${balance}" /></div>
          <div class="cp-field"><label>Payment Date *</label><input type="date" id="payDate" value="${todayStr}" /></div>
          <div class="cp-field"><label>Payment Method *</label><select id="payMethod">${PAYMENT_METHODS.filter(m => m !== 'Cash').map(m => `<option value="${m}">${m}</option>`).join('')}</select></div>
          <div class="cp-field"><label>Bank Transaction Reference / Deposit Slip No *</label><input id="payRef" placeholder="e.g. GTB/NIBSS/2026082601" /></div>
          <div class="cp-field"><label>Internal Notes / Confirmation Remarks</label><textarea id="payNotes" rows="2" placeholder="Confirmed via GTBank Corporate Statement."></textarea></div>

          <div id="payFormErr" style="color:var(--danger); font-size:12px; display:none;"></div>
        </div>

        <div class="cp-modal-footer">
          <button class="cp-btn secondary" id="btnCancelPay">Cancel</button>
          <button class="cp-btn accent" id="btnConfirmPay">&#x2714; Record &amp; Issue Receipt</button>
        </div>
      </div>
    </div>
  `;

  document.getElementById('btnClosePayMod').addEventListener('click', closeModal);
  document.getElementById('btnCancelPay').addEventListener('click', closeModal);

  document.getElementById('btnConfirmPay').addEventListener('click', async () => {
    const amt = Number(document.getElementById('payAmount').value || 0);
    const dateStr = document.getElementById('payDate').value;
    const method = document.getElementById('payMethod').value;
    const ref = document.getElementById('payRef').value.trim();
    const notes = document.getElementById('payNotes').value.trim();
    const errEl = document.getElementById('payFormErr');

    if (amt <= 0 || amt > balance) {
      errEl.textContent = `Please enter a valid amount up to ${fmtMoney(balance)}.`;
      errEl.style.display = 'block';
      return;
    }
    if (isPeriodLocked(dateStr)) {
      errEl.textContent = 'Financial period is locked. Modifications prohibited.';
      errEl.style.display = 'block';
      return;
    }

    state.counters.receipt += 1;
    const rctNo = formatDocNo('receipt', state.counters.receipt, dateStr);

    const payment = {
      id: 'pay_' + Date.now(),
      tenant_id: DEFAULT_TENANT_ID,
      invoiceId: inv.id,
      receiptNo: state.counters.receipt,
      receipt_display_no: rctNo,
      amount: amt,
      date: dateStr,
      paymentMethod: method,
      reference: ref,
      notes,
      reconciliationStatus: 'unreconciled',
      recordedBy: state.auth.user ? state.auth.user.name : 'Super Admin',
      recordedAt: new Date().toISOString()
    };

    try {
      await dbRepo.saveRecord(STORE_KEY_PAYMENTS, payment);
    } catch (dbErr) {
      errEl.textContent = dbErr.message;
      errEl.style.display = 'block';
      return;
    }

    state.payments.push(payment);
    await syncPaymentToEnrolmentAndCustomer(payment, inv);
    await safeSet(STORE_KEY_PAYMENTS, state.payments);
    await safeSet(STORE_KEY_COUNTERS, state.counters);
    await logAudit('RECORD_PAYMENT', 'payment', payment.id, `Payment #${payment.receiptNo} of ₦${payment.amount} for Invoice #${inv.invoiceNo}`, null, payment);

    openModal('viewReceipt', { payment, invoice: inv });
  });
}

              <div style="font-size:11px; font-weight:700; color:var(--text-muted); text-transform:uppercase;">CALCULATED NET PAY</div>

      document.getElementById('pslName').value = emp.name;
      document.getElementById('pslDept').value = emp.department;
      document.getElementById('pslRole').value = emp.role;
      document.getElementById('pslBasic').value = emp.basicPay;
      recalcPayslipTotals();
    }
  });

    const basic = Number(document.getElementById('pslBasic').value || 0);

    document.querySelectorAll('.allowance-row').forEach(r => {
      allowTotal = safeRound(allowTotal + Number(r.querySelector('.allow-amt').value || 0));

    let dedTotal = 0;
    document.querySelectorAll('.deduction-row').forEach(r => {
      dedTotal = safeRound(dedTotal + Number(r.querySelector('.ded-amt').value || 0));
    });
    const net = Math.max(0, safeRound(gross - dedTotal));

    document.getElementById('lblGrossPay').textContent = fmtMoney(gross);
    document.getElementById('lblTotalDeductions').textContent = fmtMoney(dedTotal);
    document.getElementById('lblNetPay').textContent = fmtMoney(net);
  }

  document.getElementById('pslBasic').addEventListener('input', recalcPayslipTotals);

  // Dynamic repeater listeners
  const allowCont = document.getElementById('allowancesContainer');
  allowCont.addEventListener('input', recalcPayslipTotals);
  document.getElementById('btnAddAllowance').addEventListener('click', () => {
    const r = document.createElement('div');
    r.className = 'cp-row3 allowance-row';
    r.style.marginBottom = '6px';
    r.innerHTML = `
      <div class="cp-field" style="margin:0;"><input class="allow-desc" placeholder="Allowance description" /></div>
      <div class="cp-field" style="margin:0;"><input class="allow-amt" type="number" placeholder="Amount (₦)" value="0" /></div>
      <button class="cp-btn danger sm btnRemAllow" type="button" style="width:35px; height:35px;">&times;</button>
    `;
    r.querySelector('.btnRemAllow').addEventListener('click', () => { r.remove(); recalcPayslipTotals(); });
    allowCont.appendChild(r);
  });
  allowCont.querySelectorAll('.btnRemAllow').forEach(b => b.addEventListener('click', (e) => { e.target.closest('.allowance-row').remove(); recalcPayslipTotals(); }));

  const dedCont = document.getElementById('deductionsContainer');
  dedCont.addEventListener('input', recalcPayslipTotals);
  document.getElementById('btnAddDeduction').addEventListener('click', () => {
    const r = document.createElement('div');
    r.className = 'cp-row3 deduction-row';
    r.style.marginBottom = '6px';
    r.innerHTML = `
      <div class="cp-field" style="margin:0;"><input class="ded-desc" placeholder="Deduction description" /></div>
      <div class="cp-field" style="margin:0;"><input class="ded-amt" type="number" placeholder="Amount (₦)" value="0" /></div>
      <button class="cp-btn danger sm btnRemDed" type="button" style="width:35px; height:35px;">&times;</button>
    `;
    r.querySelector('.btnRemDed').addEventListener('click', () => { r.remove(); recalcPayslipTotals(); });
    dedCont.appendChild(r);
  });
  dedCont.querySelectorAll('.btnRemDed').forEach(b => b.addEventListener('click', (e) => { e.target.closest('.deduction-row').remove(); recalcPayslipTotals(); }));

  async function handleSavePayslip(targetStatus) {
    const name = document.getElementById('pslName').value.trim();
    const type = document.getElementById('pslType').value;
    const dept = document.getElementById('pslDept').value;
    const role = document.getElementById('pslRole').value.trim();
    const period = document.getElementById('pslPeriod').value;
    const dateStr = document.getElementById('pslDate').value;
    const basic = Number(document.getElementById('pslBasic').value || 0);
    const errEl = document.getElementById('pslFormErr');

    if (!name || !role || basic <= 0) {
      errEl.textContent = 'Please fill all required personnel and compensation fields.';
      errEl.style.display = 'block';
      return;
    }
    if (isPeriodLocked(dateStr)) {
      errEl.textContent = 'Financial period is locked. Modifications prohibited.';
      errEl.style.display = 'block';
      return;
    }

    const allowances = [];
    document.querySelectorAll('.allowance-row').forEach(r => {
      const desc = r.querySelector('.allow-desc').value.trim();
      const amt = Number(r.querySelector('.allow-amt').value || 0);
      if (desc && amt > 0) allowances.push({ description: desc, amount: amt });
    });

    const deductions = [];
    document.querySelectorAll('.deduction-row').forEach(r => {
      const desc = r.querySelector('.ded-desc').value.trim();
      const amt = Number(r.querySelector('.ded-amt').value || 0);
      if (desc && amt > 0) deductions.push({ description: desc, amount: amt });
    });

    const totals = calculatePayslipTotals(basic, allowances, deductions);
    const pers = state.personnel.find(p => p.name.trim().toLowerCase() === name.toLowerCase());

    state.counters.payslip += 1;
    const pslNo = formatDocNo('payslip', state.counters.payslip, dateStr);

    const payslip = {
      id: 'psl_' + Date.now(),
      tenant_id: DEFAULT_TENANT_ID,
      payslipNo: state.counters.payslip,
      payslip_display_no: pslNo,
      personnelId: pers ? pers.id : null,
      employeeId: pers ? (pers.employeeId || pers.id) : 'EMP-XXXX',
      employeeName: name,
      employeeType: type,
      department: dept,
      role,
      payPeriod: period,
      payDate: dateStr,
      basicPay: totals.basic,
      allowances,
      totalAllowances: totals.totalAllowances,
      grossPay: totals.grossPay,
      deductions,
      totalDeductions: totals.totalDeductions,
      netPay: totals.netPay,
      paymentMethod: 'Bank Transfer',
      notes: document.getElementById('pslNotes').value.trim(),
      status: targetStatus,
      statementVersion: 1,
      issuedAt: targetStatus === 'issued' ? new Date().toISOString() : null,
      issuedBy: targetStatus === 'issued' ? (state.auth.user ? state.auth.user.name : 'Finance Operations') : null,
      queries: [],
      createdAt: new Date().toISOString(),
      createdBy: state.auth.user ? state.auth.user.name : 'Finance Operations'
    };

    try {
      await dbRepo.saveRecord(STORE_KEY_PAYSLIPS, payslip);
    } catch (dbErr) {
      alert(dbErr.message);
      return;
    }

    state.payslips.push(payslip);
    await safeSet(STORE_KEY_PAYSLIPS, state.payslips);
    await safeSet(STORE_KEY_COUNTERS, state.counters);
    await logAudit(targetStatus === 'issued' ? 'ISSUE_PAYSLIP' : 'CREATE_PAYSLIP_DRAFT', 'payslip', payslip.id, `${targetStatus === 'issued' ? 'Issued' : 'Drafted'} Payslip #${payslip.payslipNo} for ${payslip.employeeName} (${payslip.payPeriod})`, null, payslip);

    openModal('viewPayslip', { payslip });
  }

  document.getElementById('btnSaveDraftOnly').addEventListener('click', () => handleSavePayslip('draft'));
  document.getElementById('btnSaveAndIssue').addEventListener('click', () => handleSavePayslip('issued'));
}

function renderRaisePayrollQueryModal(container, payslip) {
  container.innerHTML = `
    <div class="cp-modal-overlay">
      <div class="cp-modal">
        <div class="cp-modal-header">
          <div class="cp-modal-title">&#x26A0;&#xFE0F; Raise Payroll Discrepancy Query &mdash; #${payslip.payslipNo}</div>
          <button class="cp-modal-close" id="btnCloseQryMod">&times;</button>
        </div>
        <div class="cp-modal-body">
          <div style="background:#FFFBEB; border:1px solid var(--warning); border-radius:var(--radius-sm); padding:10px 14px; font-size:12px; color:#92400E; margin-bottom:12px;">
            Raising a query flags this payslip for finance review. The payslip cannot proceed to final Finance Approval until the discrepancy is formally resolved.
          </div>

          <div class="cp-field">
            <label>Query Reason / Category *</label>
            <select id="qryReason">
              <option value="Missing Facilitator Session">Missing Facilitator Session / Course Count</option>
              <option value="Incorrect Allowance / Bonus">Incorrect Allowance / Bonus Calculation</option>
              <option value="Base Compensation Error">Base Compensation / Agreed Rate Error</option>
              <option value="Statutory Deduction Discrepancy">Statutory Deduction (Tax/Pension) Discrepancy</option>
              <option value="Unauthorized Deduction">Unauthorized Advance / Deduction</option>
              <option value="Other Discrepancy">Other Discrepancy</option>
            </select>
          </div>

          <div class="cp-field">
            <label>Detailed Explanation / Discrepancy Note *</label>
            <textarea id="qryComment" rows="3" placeholder="e.g. Conducted 4 weekend IELTS Masterclass sessions in August but only 3 were captured on this draft statement."></textarea>
          </div>

          <div id="qryErr" style="color:var(--danger); font-size:12px; display:none;"></div>
        </div>
        <div class="cp-modal-footer">
          <button class="cp-btn secondary" id="btnCancelQry">Cancel</button>
          <button class="cp-btn accent" id="btnSubmitQuery">&#x26A0;&#xFE0F; Submit Payroll Query</button>
        </div>
      </div>
    </div>
  `;

  document.getElementById('btnCloseQryMod').addEventListener('click', closeModal);
  document.getElementById('btnCancelQry').addEventListener('click', closeModal);

  document.getElementById('btnSubmitQuery').addEventListener('click', async () => {
    const reason = document.getElementById('qryReason').value;
    const comment = document.getElementById('qryComment').value.trim();
    const errEl = document.getElementById('qryErr');

    if (!comment) {
      errEl.textContent = 'Please enter a detailed explanation of the discrepancy.';
      errEl.style.display = 'block';
      return;
    }

    payslip.queries = payslip.queries || [];
    const query = {
      id: 'qry_' + Date.now(),
      queryReason: reason,
      queryComment: comment,
      status: 'open',
      createdAt: new Date().toISOString(),
      createdBy: state.auth.user ? state.auth.user.name : payslip.employeeName
    };
    payslip.queries.push(query);

    await safeSet(STORE_KEY_PAYSLIPS, state.payslips);
    await logAudit('RAISE_PAYROLL_QUERY', 'payslip', payslip.id, `Raised query on #${payslip.payslipNo}: ${reason}`);

    alert('Payroll query submitted. Finance team has been notified.');
    openModal('viewPayslip', { payslip });
  });
}

function renderResolvePayrollQueryModal(container, payslip) {
  const queries = payslip.queries || [];

  container.innerHTML = `
    <div class="cp-modal-overlay">
      <div class="cp-modal large">
        <div class="cp-modal-header">
          <div class="cp-modal-title">Review &amp; Resolve Payroll Queries &mdash; #${payslip.payslipNo}</div>
          <button class="cp-modal-close" id="btnCloseResMod">&times;</button>
        </div>
        <div class="cp-modal-body">
          <div style="font-size:12.5px; color:var(--text-secondary); margin-bottom:14px;">
            Personnel: <strong>${escapeHtml(payslip.employeeName)}</strong> &middot; Period: <strong>${escapeHtml(payslip.payPeriod)}</strong> &middot; Net Pay: <strong>${fmtMoney(payslip.netPay)}</strong>
          </div>

          ${queries.length === 0 ? '<div style="color:var(--text-muted);">No queries recorded on this payslip.</div>' : `
            <div style="display:flex; flex-direction:column; gap:12px;">
              ${queries.map((q, idx) => `
                <div style="background:#FAFBFD; border:1px solid var(--border); border-left:3.5px solid ${q.status === 'open' ? 'var(--warning)' : (q.status === 'resolved' ? 'var(--success)' : 'var(--danger)')}; border-radius:var(--radius-sm); padding:12px 14px;">
                  <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:4px;">
                    <strong style="color:var(--primary); font-size:13px;">${escapeHtml(q.queryReason)}</strong>
                    <span class="cp-pill ${q.status === 'open' ? 'unpaid' : (q.status === 'resolved' ? 'paid' : 'cancelled')}">${escapeHtml(q.status.toUpperCase())}</span>
                  </div>
                  <div style="font-size:12px; color:var(--text-secondary); margin-bottom:6px;">${escapeHtml(q.queryComment)}</div>
                  <div style="font-size:10.5px; color:var(--text-muted);">Raised by ${escapeHtml(q.createdBy)} on ${new Date(q.createdAt).toLocaleString('en-GB')}</div>

                  ${q.status === 'open' || q.status === 'under_review' ? `
                    <div style="margin-top:10px; padding-top:8px; border-top:1px dashed var(--border);">
                      <div class="cp-field" style="margin-bottom:6px;">
                        <label style="font-size:11px;">Resolution Notes *</label>
                        <input id="resNote_${idx}" placeholder="e.g. Verified with Academic registry; 4th session allowance added." />
                      </div>
                      <div style="display:flex; gap:8px; justify-content:flex-end;">
                        <button class="cp-btn sm danger btnRejectQry" data-idx="${idx}">Reject Query</button>
                        <button class="cp-btn sm success btnResolveQry" data-idx="${idx}">Resolve Query</button>
                      </div>
                    </div>
                  ` : `
                    <div style="margin-top:6px; font-size:11.5px; color:var(--success); background:#F0FDF4; padding:6px 8px; border-radius:4px;">
                      ✔ <strong>Resolved:</strong> ${escapeHtml(q.resolutionNote || 'Resolved')} &middot; By: ${escapeHtml(q.resolvedBy || 'Finance')} on ${new Date(q.resolvedAt).toLocaleDateString('en-GB')}
                    </div>
                  `}
                </div>
              `).join('')}
            </div>
          `}
        </div>
        <div class="cp-modal-footer">
          <button class="cp-btn secondary" id="btnCloseResMod2">Close</button>
        </div>
      </div>
    </div>
  `;

  document.getElementById('btnCloseResMod').addEventListener('click', closeModal);
  document.getElementById('btnCloseResMod2').addEventListener('click', closeModal);

  container.querySelectorAll('.btnResolveQry').forEach(b => {
    b.addEventListener('click', async () => {
      const idx = Number(b.dataset.idx);
      const note = (document.getElementById(`resNote_${idx}`).value || '').trim();
      if (!note) { alert('Please provide resolution notes.'); return; }

      payslip.queries[idx].status = 'resolved';
      payslip.queries[idx].resolutionNote = note;
      payslip.queries[idx].resolvedAt = new Date().toISOString();
      payslip.queries[idx].resolvedBy = state.auth.user ? state.auth.user.name : 'Finance Operations';

      await safeSet(STORE_KEY_PAYSLIPS, state.payslips);
      await logAudit('RESOLVE_PAYROLL_QUERY', 'payslip', payslip.id, `Resolved query #${idx + 1} on #${payslip.payslipNo}: ${note}`);
      renderResolvePayrollQueryModal(container, payslip);
    });
  });

  container.querySelectorAll('.btnRejectQry').forEach(b => {
    b.addEventListener('click', async () => {
      const idx = Number(b.dataset.idx);
      const note = (document.getElementById(`resNote_${idx}`).value || '').trim();

      await safeSet(STORE_KEY_PAYSLIPS, state.payslips);
      await logAudit('REJECT_PAYROLL_QUERY', 'payslip', payslip.id, `Rejected query #${idx + 1} on #${payslip.payslipNo}: ${note}`);
      renderResolvePayrollQueryModal(container, payslip);
    });
  });
}

    const dateStr = document.getElementById('pslPayDate').value;
    const method = document.getElementById('pslPayMethod').value;
    const ref = document.getElementById('pslPayRef').value.trim();
    const errEl = document.getElementById('pslPayErr');

    // Strict Payment Validation
    if (paidAmt <= 0) {
      errEl.textContent = 'Payment amount must be greater than zero.';
      errEl.style.display = 'block';
      return;
    }
    if (safeRound(paidAmt) !== safeRound(payslip.netPay)) {
      errEl.textContent = `Payment amount (₦${paidAmt}) must equal approved Net Pay (₦${payslip.netPay}).`;
      errEl.style.display = 'block';
      return;
    }
    if (!ref) {
      errEl.textContent = 'Please enter a valid bank transaction reference.';
      errEl.style.display = 'block';
      return;
    }
    if (isPeriodLocked(dateStr)) {
      errEl.textContent = 'Financial period is locked. Modifications prohibited.';
      errEl.style.display = 'block';
      return;
    }

    payslip.status = 'paid';
    payslip.paidAmount = paidAmt;
    payslip.actualPaymentDate = dateStr;
    payslip.paymentMethod = method;
    payslip.paymentReference = ref;
    payslip.paidBy = state.auth.user ? state.auth.user.name : 'Finance Operations';
    payslip.paidAt = new Date().toISOString();

    // Trigger Idempotent Expense Integration
    const exp = await integratePayslipExpense(payslip);

    try {
      if (exp) await dbRepo.saveRecord(STORE_KEY_EXPENSES, exp);
      await dbRepo.saveRecord(STORE_KEY_PAYSLIPS, payslip);
    } catch (dbErr) {
      errEl.textContent = dbErr.message;
      errEl.style.display = 'block';
      return;
    }

    await safeSet(STORE_KEY_PAYSLIPS, state.payslips);
    await logAudit('DISBURSE_PAYSLIP', 'payslip', payslip.id, `Disbursed month-end pay of ₦${paidAmt} to ${payslip.employeeName} (Ref: ${ref})`, null, payslip);

    openModal('viewPayslip', { payslip });
  });
}

          </p>
          <div class="cp-field"><label>Reason for Cancellation *</label><textarea id="pslCanReason" rows="2" placeholder="e.g. Replaced by revised statement."></textarea></div>
          <div id="pslCanErr" style="color:var(--danger); font-size:12px; display:none;"></div>
        </div>
        <div class="cp-modal-footer">
          <button class="cp-btn secondary" id="btnCancelCanPsl">Back</button>
          <button class="cp-btn danger" id="btnConfirmCancelPsl">&#x2714; Cancel Payslip</button>
        </div>
      </div>

  `;

  document.getElementById('btnCloseCanPsl').addEventListener('click', closeModal);
  document.getElementById('btnCancelCanPsl').addEventListener('click', closeModal);
  document.getElementById('btnConfirmCancelPsl').addEventListener('click', async () => {
    const reason = document.getElementById('pslCanReason').value.trim();
    if (!reason) {
      document.getElementById('pslCanErr').textContent = 'Please provide reason for cancellation.';
      document.getElementById('pslCanErr').style.display = 'block';
      return;
    }

    payslip.status = 'cancelled';
    payslip.cancelReason = reason;
    payslip.cancelledBy = state.auth.user ? state.auth.user.name : 'Super Admin';
    payslip.cancelledAt = new Date().toISOString();

    // If linked to an expense, cancel the expense as well
    if (payslip.linkedExpenseId) {
      const exp = state.expenses.find(e => e.id === payslip.linkedExpenseId);
      if (exp) {
        exp.status = 'cancelled';
        exp.cancelReason = `Payslip #${payslip.payslipNo} cancelled`;
        await safeSet(STORE_KEY_EXPENSES, state.expenses);
      }
    }

    await safeSet(STORE_KEY_PAYSLIPS, state.payslips);
    await logAudit('CANCEL_PAYSLIP', 'payslip', payslip.id, `Cancelled Payslip #${payslip.payslipNo}: ${reason}`);
    closeModal();
  });
}

  if (payslip.status === 'issued') { statusLabel = '2. ISSUED — PENDING REVIEW'; statusClass = 'new'; }
  else if (payslip.status === 'acknowledged') { statusLabel = '3. ACKNOWLEDGED'; statusClass = 'active'; }
  else if (payslip.status === 'approved') { statusLabel = '4. APPROVED — AWAITING PAYMENT'; statusClass = 'partial'; }
  else if (payslip.status === 'paid') { statusLabel = 'PAID IN FULL'; statusClass = 'paid'; }

          </div>

        </div>
        <div class="cp-modal-footer">
          <button class="cp-btn secondary" id="btnCancelExp">Cancel</button>
          <button class="cp-btn accent" id="btnSaveExp">&#x2714; Record Expense</button>
        </div>
      </div>

    const grp = e.target.value;

    const catSel = document.getElementById('expCategory');
    catSel.innerHTML = cats.map(c => `<option value="${escapeHtml(c)}">${escapeHtml(c)}</option>`).join('');

    const grp = document.getElementById('expGroup').value;
    const cat = document.getElementById('expCategory').value;
    const desc = document.getElementById('expDesc').value.trim();
    const amt = Number(document.getElementById('expAmount').value || 0);
    const dateStr = document.getElementById('expDate').value;
    const vendor = document.getElementById('expVendor').value.trim();
    const dept = document.getElementById('expDept').value;
    const method = document.getElementById('expMethod').value;
    const errEl = document.getElementById('expFormErr');

    if (!desc || amt <= 0) {
      errEl.textContent = 'Please fill all required fields.';
      errEl.style.display = 'block';
      return;
    }
    if (isPeriodLocked(dateStr)) {
      errEl.textContent = 'Financial period is locked. Modifications prohibited.';
      errEl.style.display = 'block';
      return;
    }

    const reqRole = getRequiredApprovalRole(amt);
    const initialStatus = reqRole === 'None' ? 'recorded' : 'pending_approval';

    const exp = {
      id: 'exp_' + Date.now(),
      tenant_id: DEFAULT_TENANT_ID,
      categoryGroup: grp,
      category: cat,
      description: desc,
      amount: amt,
      date: dateStr,
      vendor,
      department: dept,
      paymentMethod: method,
      status: initialStatus,
      createdBy: state.auth.user ? state.auth.user.name : 'Super Admin',
      createdAt: new Date().toISOString()
    };

    try {
      await dbRepo.saveRecord(STORE_KEY_EXPENSES, exp);
    } catch (dbErr) {
      errEl.textContent = dbErr.message;
      errEl.style.display = 'block';
      return;
    }

    state.expenses.push(exp);
    await safeSet(STORE_KEY_EXPENSES, state.expenses);
    await logAudit('RECORD_EXPENSE', 'expense', exp.id, `${exp.description} (₦${exp.amount})`, null, exp);
    closeModal();
  });
}

function renderAddPaymentAccountModal(container, existingAcc) {

        <div class="cp-modal-header">
          <div class="cp-modal-title">${isEdit ? 'Edit Payment Account' : 'Add New Payment Account'}</div>

        </div>
        <div class="cp-modal-body">
          <div class="cp-field"><label>Bank Name *</label><input id="accBank" placeholder="e.g. Guaranty Trust Bank (GTBank)" value="${escapeHtml(isEdit ? existingAcc.bankName : '')}" /></div>
          <div class="cp-field"><label>Account Name *</label><input id="accName" placeholder="e.g. Clasptek Coaching Limited" value="${escapeHtml(isEdit ? existingAcc.accountName : 'Clasptek Coaching Limited')}" /></div>
          <div class="cp-row2">
            <div class="cp-field"><label>Account Number (10 Digits) *</label><input id="accNumber" placeholder="0849201938" value="${escapeHtml(isEdit ? existingAcc.accountNumber : '')}" /></div>
            <div class="cp-field"><label>Account Type</label><select id="accType"><option value="Corporate Current" ${isEdit && existingAcc.accountType === 'Corporate Current' ? 'selected' : ''}>Corporate Current</option><option value="Corporate Savings" ${isEdit && existingAcc.accountType === 'Corporate Savings' ? 'selected' : ''}>Corporate Savings</option><option value="Domiciliary (USD)" ${isEdit && existingAcc.accountType === 'Domiciliary (USD)' ? 'selected' : ''}>Domiciliary (USD)</option><option value="Domiciliary (GBP)" ${isEdit && existingAcc.accountType === 'Domiciliary (GBP)' ? 'selected' : ''}>Domiciliary (GBP)</option></select></div>
          </div>
          <div class="cp-field"><label>Currency</label><select id="accCurrency"><option value="NGN" ${isEdit && existingAcc.currency === 'NGN' ? 'selected' : ''}>NGN (Nigerian Naira)</option><option value="USD" ${isEdit && existingAcc.currency === 'USD' ? 'selected' : ''}>USD (US Dollar)</option><option value="GBP" ${isEdit && existingAcc.currency === 'GBP' ? 'selected' : ''}>GBP (British Pound)</option></select></div>
          <div class="cp-field"><label>Default Invoice Instructions</label><input id="accInstructions" placeholder="Please use invoice number as your payment reference." value="${escapeHtml(isEdit ? existingAcc.instructions : 'Please use invoice number as your payment reference.')}" /></div>
          <div class="cp-field" style="margin-top:6px;">
            <label style="display:flex; align-items:center; gap:6px; cursor:pointer;">
              <input type="checkbox" id="accIsDefault" ${isEdit && existingAcc.isDefault ? 'checked' : ''} />
              <span>Set as default account on new invoices</span>
            </label>
          </div>
          <div id="accFormErr" style="color:var(--danger); font-size:12px; display:none;"></div>
        </div>
        <div class="cp-modal-footer">
          <button class="cp-btn secondary" id="btnCancelAcc">Cancel</button>
          <button class="cp-btn accent" id="btnSaveAcc">&#x2714; ${isEdit ? 'Save Changes' : 'Add Payment Account'}</button>
        </div>
      </div>
    </div>
  `;

  document.getElementById('btnCloseAccMod').addEventListener('click', closeModal);
  document.getElementById('btnCancelAcc').addEventListener('click', closeModal);

  document.getElementById('btnSaveAcc').addEventListener('click', async () => {
    const bank = document.getElementById('accBank').value.trim();
    const name = document.getElementById('accName').value.trim();
    const num = document.getElementById('accNumber').value.trim();
    const type = document.getElementById('accType').value;
    const curr = document.getElementById('accCurrency').value;
    const inst = document.getElementById('accInstructions').value.trim();
    const isDef = document.getElementById('accIsDefault').checked;
    const errEl = document.getElementById('accFormErr');

    if (!bank || !name || !num) {
      errEl.textContent = 'Please fill bank name, account name, and account number.';
      errEl.style.display = 'block';
      return;
    }

    if (isDef) {
      state.paymentAccounts.forEach(a => { a.isDefault = false; });
    }

    if (isEdit) {
      existingAcc.bankName = bank;
      existingAcc.accountName = name;
      existingAcc.accountNumber = num;
      existingAcc.accountType = type;
      existingAcc.currency = curr;
      existingAcc.instructions = inst;
      if (isDef) existingAcc.isDefault = true;
      await logAudit('EDIT_PAYMENT_ACCOUNT', 'payment_account', existingAcc.id, `Updated ${bank} account`);
    } else {
      const newAcc = {
        id: 'acc_' + Date.now(),
        tenant_id: DEFAULT_TENANT_ID,
        bankName: bank,
        accountName: name,
        accountNumber: num,
        accountType: type,
        currency: curr,
        instructions: inst,
        isActive: true,
        isDefault: isDef || state.paymentAccounts.length === 0,
        createdAt: new Date().toISOString(),
        createdBy: state.auth.user ? state.auth.user.name : 'Super Admin'
      };
      state.paymentAccounts.push(newAcc);
      await logAudit('ADD_PAYMENT_ACCOUNT', 'payment_account', newAcc.id, `Added ${bank} account`);
    }

    await safeSet(STORE_KEY_PAYMENT_ACCOUNTS, state.paymentAccounts);
    closeModal();
  });
}

  });

            <!-- Specific 401 Diagnosis Warning Banner if 401 active -->
            ${state.databaseAuthorityState === 'API_KEY_INVALID' ? `
              <div style="margin-top:12px; padding:12px; background:#FEF2F2; border:1.5px solid var(--danger); border-radius:4px; font-size:12px; font-family:var(--font-mono); color:#991B1B; white-space:pre-wrap;">❌ SUPABASE API KEY INVALID
Project: ${CANONICAL_SUPABASE_PROJECT_REF}
Endpoint: Verified
API Credential: Rejected by Supabase (HTTP 401)
Authentication: Not established
PostgreSQL: Not verified
Authoritative Mode: LOCKED
Action: Update the application's Supabase public API key in the field above and click 'Save Credentials &amp; Quick Ping'.</div>
            ` : (state.connectionError || state.supabase.lastError ? `
              <div style="margin-top:12px; padding:10px 12px; background:#FEF2F2; border:1px solid #FCA5A5; border-radius:4px; font-size:12px;">
                <strong style="color:#991B1B;">Database Status / Diagnostics:</strong>

                </div>
              </div>
            ` : `
              <div style="margin-top:12px; padding:10px 12px; background:#F0FDF4; border:1px solid #86EFAC; border-radius:4px; font-size:12px; color:#166534;">
                <strong>✔ System Operational:</strong> All database connections and authorization tokens are verified and clean.
              </div>

          <!-- Persistence Testing & Migration Action Controls -->
          <div style="background:#FFFFFF; border:1.5px solid var(--primary); border-radius:var(--radius-sm); padding:14px; margin-bottom:12px;">

            <div id="probeResultBox" style="display:none; margin-top:8px; padding:8px 10px; font-size:11.5px; border-radius:4px;"></div>

          <!-- Phase 14 Migration with Strict Migration Gate -->
          <div style="background:#F0FDF4; border:1px solid var(--success); border-radius:var(--radius-sm); padding:14px;">
            <div style="font-weight:700; color:var(--success); font-size:13px; margin-bottom:4px;">🚀 Safe Historical Data Migration to PostgreSQL</div>
            
            ${isMigrationLocked ? `
              <div style="background:#FEF2F2; border:1px solid var(--danger); padding:8px 12px; border-radius:4px; font-size:12px; color:#991B1B; margin-bottom:10px;">
                <strong>🔒 Migration Locked</strong> — PostgreSQL connection has not been successfully verified. No local data has been modified.
              </div>
            ` : `
              <div style="background:#F0FDF4; border:1px solid var(--success); padding:8px 12px; border-radius:4px; font-size:12px; color:#166534; margin-bottom:10px;">
                <strong>✔ Migration Available</strong> — PostgreSQL connection is verified and ready for migration.
              </div>
            `}
            
            <div style="display:grid; grid-template-columns:repeat(4, 1fr); gap:6px; background:#FFFFFF; border:1px solid var(--border); border-radius:var(--radius-sm); padding:10px; font-size:11.5px; margin-bottom:10px;">
              <div>Programmes: <strong>${state.programmes.length}</strong></div>
              <div>Customers: <strong>${state.customers.length}</strong></div>
              <div>Enquiries: <strong>${state.enquiries.length}</strong></div>
              <div>Enrolments: <strong>${state.enrolments.length}</strong></div>
              <div>Invoices: <strong>${state.invoices.length}</strong></div>
              <div>Payments: <strong>${state.payments.length}</strong></div>
              <div>Expenses: <strong>${state.expenses.length}</strong></div>
              <div>Direct Income: <strong>${state.directIncome.length}</strong></div>
              <div>Personnel: <strong>${state.personnel.length}</strong></div>
              <div>Payslips: <strong>${state.payslips.length}</strong></div>
              <div>Budgets: <strong>${state.budgets.length}</strong></div>
              <div>Settings: <strong>${state.financeSettings && state.financeSettings.companyName ? 1 : 0}</strong></div>
            </div>

            <div style="font-size:11.5px; color:var(--text-secondary); margin-bottom:10px;">
              Migration is ID-preserving, conflict-safe, and auditable. Source records are safely preserved without deletion.
            </div>
            
            <button class="cp-btn success sm" id="btnRunMigration" ${isMigrationLocked ? 'disabled style="opacity:0.5; cursor:not-allowed;" title="PostgreSQL connection must be verified before migration"' : ''}>&#x1F4E4; Migrate Local Records to PostgreSQL</button>
            <div id="migrationResultBox" style="display:none; margin-top:8px; padding:8px 10px; font-size:11.5px; border-radius:4px;"></div>
          </div>
        </div>
        <div class="cp-modal-footer" style="display:flex; justify-content:space-between; align-items:center;">
          <div style="font-size:11px; color:var(--text-secondary);">Application: <strong>15.0.0</strong> &middot; Schema: <strong>13.0.0</strong> &middot; Connectivity: <strong>15.0.0</strong></div>
          <button class="cp-btn secondary" id="btnCancelSb">Close</button>
        </div>
      </div>
    </div>
  `;

  document.getElementById('btnCloseSbMod').addEventListener('click', closeModal);
  document.getElementById('btnCancelSb').addEventListener('click', closeModal);

  // 1. Revalidate Configuration Handler
  document.getElementById('btnRevalidateConfig').addEventListener('click', async () => {
    const box = document.getElementById('connectivityProbeResultBox');
    box.style.display = 'block';
    box.style.background = '#EFF6FF';
    box.style.color = '#1E40AF';
    box.innerHTML = 'Reloading canonical configuration, resolving environment variables, and inspecting public keys...';

    const resolved = resolveSupabaseConfiguration();
    state.supabase.endpoint = resolved.supabaseUrl;
    state.supabase.anonKey = resolved.supabaseAnonKey;
    state.supabase.configSource = resolved.configurationSource;
    await safeSet(STORE_KEY_SUPABASE_CONFIG, state.supabase);

    const val = validateSupabasePublicKey(state.supabase.anonKey, CANONICAL_SUPABASE_PROJECT_REF);
    if (!val.isValid) {
      box.style.background = '#FEF2F2';
      box.style.color = '#991B1B';
      box.innerHTML = `<strong>✖ CONFIGURATION INVALID</strong>: ${escapeHtml(val.failureReason)}`;
      state.databaseAuthorityState = DATABASE_AUTHORITY_STATE.CONFIGURATION_INVALID;
    } else {
      box.style.background = '#F0FDF4';
      box.style.color = '#166534';
      box.innerHTML = `<strong>✔ CONFIGURATION RESOLVED</strong> &middot; Project: <code>${escapeHtml(resolved.projectRef)}</code> &middot; Source: <strong>${escapeHtml(resolved.configurationSource)}</strong> &middot; Key: <code>${escapeHtml(val.maskedKey)}</code>`;
    }
    renderSupabaseModal(container);
  });

  // 2. Dedicated 5-Stage Connectivity Probe Handler
  document.getElementById('btnRunConnectivityProbe').addEventListener('click', async () => {
    const box = document.getElementById('connectivityProbeResultBox');
    box.style.display = 'block';
    box.style.background = '#EFF6FF';
    box.style.color = '#1E40AF';
    box.innerHTML = 'Executing 5-Stage Progressive Supabase Connectivity Probe (Project ➔ PostgREST ➔ Auth Read ➔ Tenant ➔ Read/Write)...';

    const probe = await probeSupabaseConnectivity();
    state.supabase.lastHttpStatus = probe.httpStatus;
    state.supabase.lastLatencyMs = probe.latencyMs;

    if (probe.databaseAvailable && probe.authenticated) {
      state.supabase.status = 'connected';
      state.databaseAuthorityState = DATABASE_AUTHORITY_STATE.AUTHORITATIVE;
      state.connectionError = null;
      box.style.background = '#F0FDF4';
      box.style.color = '#166534';
      box.innerHTML = `
        <strong>🟢 SUPABASE POSTGRESQL CONNECTED (${probe.latencyMs}ms)</strong><br/>
        &middot; Probe 1 (Project Reachable): <strong>✔ PASSED</strong><br/>
        &middot; Probe 2 (PostgREST Service): <strong>✔ PASSED (200 OK)</strong><br/>
        &middot; Probe 3 (Authenticated Database Read): <strong>✔ PASSED</strong><br/>
        &middot; Probe 4 (Tenant Verification: ${DEFAULT_TENANT_ID}): <strong>✔ PASSED</strong><br/>
        &middot; Probe 5 (Read/Write Capability): <strong>${probe.persistenceVerified ? '✔ PASSED' : 'STANDBY'}</strong><br/>
        PostgreSQL authoritative mode is now ACTIVE. Migration gate is UNLOCKED.
      `;
    } else {
      state.supabase.status = 'error';
      box.style.background = '#FEF2F2';
      box.style.color = '#991B1B';
      box.innerHTML = `
        <strong>✖ CONNECTIVITY PROBE FAILED</strong> &middot; Classification: <code>${escapeHtml(probe.classification)}</code><br/>
        <div style="font-family:var(--font-mono); margin-top:4px; font-size:11px; white-space:pre-wrap;">${escapeHtml(probe.diagnosticMessage)}</div>
      `;
    }
    renderSupabaseModal(container);
  });

  // 3. Quick Save Credentials & Test Handler
  document.getElementById('btnTestSb').addEventListener('click', async () => {
    state.supabase.endpoint = document.getElementById('sbUrl').value.trim();
    state.supabase.anonKey = document.getElementById('sbKey').value.trim();
    state.supabase.configSource = 'LOCAL_STORAGE';
    await safeSet(STORE_KEY_SUPABASE_CONFIG, state.supabase);
    const health = await runSupabaseHealthCheck();
    if (health.success) {
      state.supabase.status = 'connected';
      state.databaseAuthorityState = DATABASE_AUTHORITY_STATE.AUTHORITATIVE;
      state.connectionError = null;
      alert(`Supabase Connected Successfully!\nLatency: ${health.latencyMs}ms\nPostgREST: 200 OK\nPostgreSQL: Authoritative`);
    } else {
      state.supabase.status = 'error';
      state.supabase.lastError = health.message;
      alert(`Supabase Connection Check:\n[${health.failureClassification || 'ERROR'}]\n${health.message}`);
    }
    renderSupabaseModal(container);
  });

  // 4. Live Persistence Probe Handler
  document.getElementById('btnRunPersistenceProbe').addEventListener('click', async () => {
    const probeBox = document.getElementById('probeResultBox');
    probeBox.style.display = 'block';
    probeBox.style.background = '#EFF6FF';
    probeBox.style.color = '#1E40AF';
    probeBox.textContent = 'Executing non-destructive Write ➔ Read Back ➔ Verify ➔ Clean Up probe cycle against PostgreSQL...';

    const probeRes = await runPersistenceProbe();

    if (probeRes.success) {
      probeBox.style.background = '#F0FDF4';
      probeBox.style.color = '#166534';
      probeBox.innerHTML = `
        <div style="font-weight:700; margin-bottom:4px;">✔ LIVE PERSISTENCE CYCLE PASSED (${probeRes.latencyMs}ms)</div>
        <div style="display:grid; grid-template-columns:1fr 1fr; gap:4px; font-size:11px; margin-bottom:4px;">
          <div>1. Write Probe Record: <strong>✔ PASSED</strong></div>
          <div>2. Read Back Record: <strong>✔ PASSED</strong></div>
          <div>3. Payload Verification: <strong>✔ PASSED</strong></div>
          <div>4. Clean Up &amp; Deletion: <strong>✔ PASSED</strong></div>
        </div>
        <div style="font-size:11px; font-weight:600;">Target Table: <code>${escapeHtml(probeRes.targetTable)}</code> &middot; Status: <strong>POSTGRESQL AUTHORITATIVE (VERIFIED)</strong></div>
      `;
      state.supabase.persistenceMode = 'AUTHORITATIVE';
    } else {
      probeBox.style.background = '#FEF2F2';
      probeBox.style.color = '#991B1B';
      probeBox.innerHTML = `
        <div style="font-weight:700; margin-bottom:4px;">✖ PERSISTENCE PROBE FAILED</div>
        <div>${escapeHtml(probeRes.message || 'Write/read persistence verification failed.')}</div>
      `;
    }
  });

  // 5. Safe Migration Handler with Strict Gate Check
  document.getElementById('btnRunMigration').addEventListener('click', async () => {
    const migBox = document.getElementById('migrationResultBox');
    migBox.style.display = 'block';
    migBox.style.background = '#EFF6FF';
    migBox.style.color = '#1E40AF';
    migBox.textContent = 'Initiating dependency-ordered, conflict-safe migration of local records to PostgreSQL with read-back verification...';

    if (isMigrationLocked) {
      migBox.style.background = '#FEF2F2';
      migBox.style.color = '#991B1B';
      migBox.innerHTML = '<strong>🔒 Migration Locked</strong>: PostgreSQL connection must be verified before migration can proceed.';
      return;
    }

    try {
      const migRes = await migrateLegacyDataToPostgres();
      migBox.style.background = migRes.success ? '#F0FDF4' : '#FFFBEB';
      migBox.style.color = migRes.success ? '#166534' : '#92400E';
      migBox.innerHTML = `
        ✔ <strong>MIGRATION COMPLETED ${migRes.success ? 'WITH 100% RECONCILIATION' : 'WITH EXCEPTIONS'}</strong><br/>
        &middot; Run ID: <code>${escapeHtml(migRes.runId)}</code><br/>
        &middot; Records Detected: <strong>${migRes.stats.detected}</strong><br/>
        &middot; Migrated to PostgreSQL: <strong>${migRes.stats.migrated}</strong><br/>
        &middot; Pre-existing in PostgreSQL: <strong>${migRes.stats.alreadyExisting}</strong><br/>
        &middot; Reconciliation Status: <strong>${escapeHtml(migRes.reconciliation.status)}</strong> (${migRes.reconciliation.criticalOrphanCount} critical orphans)<br/>
        All local business records remain safe. PostgreSQL authority state: <strong>${escapeHtml(state.databaseAuthorityState)}</strong>.
      `;
      state.supabase.lastSuccessfulWrite = new Date().toISOString();
      state.connectionError = null;
    } catch (migErr) {
      migBox.style.background = '#FEF2F2';
      migBox.style.color = '#991B1B';
      migBox.innerHTML = `✖ <strong>MIGRATION ENCOUNTERED ERROR</strong>: ${escapeHtml(migErr.message)}`;
    }
  });
}

          </div>

          <div class="cp-field">
            <label>Reason for Deactivation / Offboarding *</label>
            <textarea id="deactReason" rows="3" placeholder="e.g. End of contract term / resigned on mutual agreement"></textarea>

        </div>
        <div class="cp-modal-footer">
          <button class="cp-btn secondary" id="btnCancelDeact">Cancel</button>
          <button class="cp-btn danger" id="btnConfirmDeact">&#x1F512; Confirm Deactivation</button>
        </div>
      </div>
    </div>
  `;

  document.getElementById('btnCloseDeactMod').addEventListener('click', closeModal);
  document.getElementById('btnCancelDeact').addEventListener('click', closeModal);

  document.getElementById('btnConfirmDeact').addEventListener('click', async () => {
    const reason = document.getElementById('deactReason').value.trim();
    if (!reason) {
      const err = document.getElementById('deactErr');
      err.textContent = 'Please provide a deactivation reason for audit purposes.';
      err.style.display = 'block';
      return;
    }

    pers.status = 'deactivated';
    pers.deactivatedAt = new Date().toISOString();
    pers.deactivatedBy = state.auth.user ? state.auth.user.name : 'Super Admin';
    pers.deactivationReason = reason;

    // Suspend associated user login account
    const usr = state.users.find(u => u.personnelId === pers.id || u.id === pers.userId || u.email.toLowerCase() === pers.email.toLowerCase());
    if (usr) {
      usr.status = 'deactivated';
    }

    await safeSet(STORE_KEY_PERSONNEL, state.personnel);
    await safeSet(STORE_KEY_SYSTEM_USERS, state.users);
    await logAudit('DEACTIVATE_PERSONNEL', 'personnel', pers.id, `Deactivated ${pers.name}: ${reason}`);

    alert(`${pers.name} has been deactivated. Historical records have been preserved.`);
    closeModal();
  });
}
