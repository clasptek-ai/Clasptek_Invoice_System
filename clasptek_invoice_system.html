// TAB 4: INVOICES (PHASE 8 ENHANCED: PROGRAMME, ACCOUNTS, NOTES, COMMENTS, TERMS)
// ----------------------------------------------------
function renderInvoicesTab(container) {
  if (state.invoiceSubTab === 'new') {
    const todayStr = new Date().toISOString().slice(0, 10);
    const dueDateDefault = new Date(Date.now() + 7 * 24 * 60 * 60 * 1000).toISOString().slice(0, 10);

    const pendingEnq = state.pendingEnquiryForInvoice;
    const initialClient = pendingEnq ? pendingEnq.name : '';
    const initialPhone = pendingEnq ? pendingEnq.phone : '';
    const initialEmail = pendingEnq ? pendingEnq.email : '';
    const initialProgId = pendingEnq ? pendingEnq.programmeId : (state.programmes[0] ? state.programmes[0].id : '');

    const defaultProg = state.programmes.find(p => p.id === initialProgId) || state.programmes[0] || { id: 'prog_1', name: 'General Tech Programme', price: 150000 };
    const activeAccounts = getActivePaymentAccounts();
    const defaultAcc = getDefaultPaymentAccount();

    const uniqueCustomers = Array.from(new Set(state.invoices.map(i => i.clientName.trim()))).filter(Boolean);

    container.innerHTML = `
      <div class="cp-card">
        <div class="cp-card-header">
          <div>
            <div class="cp-section-title">&#x1F4C4; Create Professional Tuition / Service Invoice</div>
            <div class="cp-section-desc">Generate an official corporate training invoice with configurable banking details, installment schedules, and notes.</div>
          </div>
          <button class="cp-btn sm secondary" id="btnCancelNewInv">&larr; Back to Invoices List</button>
        </div>

        ${pendingEnq ? `
          <div style="background:var(--info-bg); border:1px solid var(--info); padding:10px 14px; border-radius:var(--radius-sm); margin-bottom:14px; font-size:12.5px; color:var(--info);">
            &#x1F4E5; <strong>Creating Invoice for Lead:</strong> ${escapeHtml(pendingEnq.name)} (${escapeHtml(pendingEnq.programmeName || 'General')}) &mdash; Details pre-filled automatically.
          </div>
        ` : ''}

        <div style="max-width:820px;">
          <div class="cp-field">
            <label>Select Existing Customer Profile (Optional Pre-fill)</label>
            <select id="invCustomerSelect">
              <option value="">-- Choose existing student/client or enter new below --</option>
              ${uniqueCustomers.map(c => `<option value="${escapeHtml(c)}">${escapeHtml(c)}</option>`).join('')}
            </select>
          </div>

          <div class="cp-row2">
            <div class="cp-field"><label>Student / Client Name *</label><input id="invClient" value="${escapeHtml(initialClient)}" placeholder="e.g. Samuel Adebayo" /></div>
            <div class="cp-field"><label>Parent / Guardian Name (Optional)</label><input id="invParent" placeholder="e.g. Mr. &amp; Mrs. Adebayo" /></div>
          </div>

          <div class="cp-row3">
            <div class="cp-field"><label>Phone Number *</label><input id="invPhone" value="${escapeHtml(initialPhone)}" placeholder="08031234567" /></div>
            <div class="cp-field"><label>Email Address</label><input id="invEmail" type="email" value="${escapeHtml(initialEmail)}" placeholder="student@example.com" /></div>
            <div class="cp-field"><label>Billing Category</label><select id="invCat">${state.incomeCategories.map(c => `<option value="${escapeHtml(c)}">${escapeHtml(c)}</option>`).join('')}</select></div>
          </div>

          <div class="cp-row2">
            <div class="cp-field">
              <label>Target Programme / Curriculum *</label>
              <select id="invProg">
                ${state.programmes.map(p => `<option value="${p.id}" ${p.id === initialProgId ? 'selected' : ''}>${escapeHtml(p.name)} (${fmtMoney(p.price)})</option>`).join('')}
              </select>
            </div>
            <div class="cp-field">
              <label>Payment Plan *</label>
              <select id="invPlan">
                <option value="full">Full Upfront Payment</option>
                <option value="installment">60 / 40 Installment Schedule</option>
              </select>
            </div>
          </div>

          <div class="cp-row3">
            <div class="cp-field"><label>Invoice Date *</label><input id="invDate" type="date" value="${todayStr}" /></div>
            <div class="cp-field"><label>Payment Due Date *</label><input id="invDueDate" type="date" value="${dueDateDefault}" /></div>
            <div class="cp-field"><label>Training Delivery Mode</label><select id="invMode"><option value="Live Interactive Onsite Class">Live Interactive Onsite Class</option><option value="Live Online Virtual Class">Live Online Virtual Class</option><option value="Hybrid (Onsite + Virtual)">Hybrid (Onsite + Virtual)</option></select></div>
          </div>

          <div class="cp-row2">
            <div class="cp-field"><label>Course Duration</label><input id="invDuration" placeholder="e.g. 5 Months" value="5 Months" /></div>
            <div class="cp-field"><label>Lecture Schedule</label><input id="invSchedule" placeholder="e.g. Weekdays (Tue &amp; Thu 10am - 1pm)" value="Weekdays" /></div>
          </div>

          <!-- Payment Account Selection (Phase 8 Configurable Banking) -->
          <div class="cp-row2" style="background:#FAFBFD; border:1px solid var(--border); border-radius:var(--radius-sm); padding:12px; margin-top:8px; margin-bottom:14px;">
            <div class="cp-field" style="margin:0;">
              <label>Designated Payment Account *</label>
              <select id="invPaymentAccount">
                ${activeAccounts.map(a => `<option value="${a.id}" ${a.id === defaultAcc.id ? 'selected' : ''}>${escapeHtml(a.bankName)} - ${escapeHtml(a.accountNumber)} (${escapeHtml(a.accountName)})${a.isDefault ? ' [DEFAULT]' : ''}</option>`).join('')}
              </select>
            </div>
            <div class="cp-field" style="margin:0;">
              <label>Payment Instructions</label>
              <input id="invPaymentInstructions" value="${escapeHtml(defaultAcc.instructions || 'Please use invoice number as payment reference.')}" />
            </div>
          </div>

          <!-- Dynamic Line Items Repeater -->
          <div style="margin-top:10px; margin-bottom:16px;">
            <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:8px;">
              <label style="font-size:12px; font-weight:700; color:var(--primary); text-transform:uppercase;">Invoice Line Items (Service Description)</label>
              <button class="cp-btn secondary sm" id="btnAddLineItem" type="button">+ Add Line Item</button>
            </div>

            <div id="lineItemsContainer">
              <div class="cp-row4 line-item-row" style="margin-bottom:8px;">
                <div class="cp-field" style="margin:0;"><label style="font-size:10.5px;">Programme / Description</label><input class="item-desc" value="${escapeHtml(defaultProg.name)}" /></div>
                <div class="cp-field" style="margin:0;"><label style="font-size:10.5px;">Qty</label><input class="item-qty" type="number" value="1" min="1" /></div>
                <div class="cp-field" style="margin:0;"><label style="font-size:10.5px;">Unit Price (₦)</label><input class="item-price" type="number" value="${defaultProg.price}" /></div>
                <div class="cp-field" style="margin:0;"><label style="font-size:10.5px;">Discount (₦)</label><input class="item-disc" type="number" value="0" min="0" /></div>
                <button class="cp-btn danger sm btnRemoveLine" type="button" style="height:35px; width:35px; padding:0;" title="Remove Item">&times;</button>
              </div>
            </div>

            <div style="background:#FAFBFD; border:1px solid var(--border); border-radius:var(--radius-sm); padding:12px 16px; margin-top:12px; display:flex; justify-content:flex-end;">
              <div style="text-align:right;">
                <div style="font-size:12px; color:var(--text-secondary);">Calculated Total: <strong id="lblCalculatedTotal" style="font-size:15px; color:var(--primary);">${fmtMoney(defaultProg.price)}</strong></div>
              </div>
            </div>
          </div>

          <!-- Notes, Comments, and Terms (Phase 8 Distinct Fields) -->
          <div class="cp-row2">
            <div class="cp-field">
              <label>Customer-Facing Notes (Appears under NOTES on Invoice)</label>
              <textarea id="invNotes" rows="2" placeholder="e.g. Please note that tuition includes all examination preparatory materials and lab access."></textarea>
            </div>
            <div class="cp-field">
              <label>Contextual / Internal Comments (Appears under COMMENT on Invoice)</label>
              <textarea id="invComments" rows="2" placeholder="e.g. 60/40 installment schedule approved by Admissions Committee."></textarea>
            </div>
          </div>

          <div class="cp-field">
            <label>Standard Terms &amp; Conditions</label>
            <textarea id="invTerms" rows="2">${escapeHtml(state.financeSettings.defaultTerms || 'Payment is due according to the schedule specified above.')}</textarea>
          </div>

          <div id="invFormError" class="cp-error" style="display:none; margin-bottom:12px; color:var(--danger); font-size:12px;"></div>

          <div style="display:flex; justify-content:flex-end; gap:10px; margin-top:16px;">
            <button class="cp-btn secondary" id="btnCancelNewInv2" type="button">Cancel</button>
            <button class="cp-btn secondary" id="btnPreviewInvoice" type="button">&#x1F441;&#xFE0F; Preview Invoice</button>
            <button class="cp-btn accent" id="btnSaveInvoice" type="button">&#x2714; Issue Official Invoice</button>
          </div>
        </div>
      </div>
    `;

    document.getElementById('invCustomerSelect').addEventListener('change', (e) => {
      const name = e.target.value;
      if (name) {
        const prevInv = state.invoices.slice().reverse().find(i => i.clientName.trim() === name);
        if (prevInv) {
          document.getElementById('invClient').value = prevInv.clientName;
          if (prevInv.phone) document.getElementById('invPhone').value = prevInv.phone;
          if (prevInv.email) document.getElementById('invEmail').value = prevInv.email;
          if (prevInv.parentName) document.getElementById('invParent').value = prevInv.parentName;
          if (prevInv.programmeId) document.getElementById('invProg').value = prevInv.programmeId;
        }
      }
    });

    document.getElementById('invProg').addEventListener('change', (e) => {
      const p = state.programmes.find(pr => pr.id === e.target.value);
      if (p) {
        const firstRow = document.querySelector('.line-item-row');
        if (firstRow) {
          firstRow.querySelector('.item-desc').value = p.name;
          firstRow.querySelector('.item-price').value = p.price;
          recalcInvoiceTotals();
        }
      }
    });

    document.getElementById('invPaymentAccount').addEventListener('change', (e) => {
      const acc = state.paymentAccounts.find(a => a.id === e.target.value);
      if (acc && acc.instructions) {
        document.getElementById('invPaymentInstructions').value = acc.instructions;
      }
    });

    function recalcInvoiceTotals() {
      let grand = 0;
      document.querySelectorAll('.line-item-row').forEach(row => {
        const qty = Number(row.querySelector('.item-qty').value || 1);
        const pr = Number(row.querySelector('.item-price').value || 0);
        const dc = Number(row.querySelector('.item-disc').value || 0);
        const lineAmt = Math.max(0, safeRound((qty * pr) - dc));
        grand = safeRound(grand + lineAmt);
      });
      const lbl = document.getElementById('lblCalculatedTotal');
      if (lbl) lbl.textContent = fmtMoney(grand);
    }

    const cont = document.getElementById('lineItemsContainer');
    cont.addEventListener('input', recalcInvoiceTotals);

    document.getElementById('btnAddLineItem').addEventListener('click', () => {
      const rowDiv = document.createElement('div');
      rowDiv.className = 'cp-row4 line-item-row';
      rowDiv.style.marginBottom = '8px';
      rowDiv.innerHTML = `
        <div class="cp-field" style="margin:0;"><input class="item-desc" placeholder="Item description" /></div>
        <div class="cp-field" style="margin:0;"><input class="item-qty" type="number" value="1" min="1" /></div>
        <div class="cp-field" style="margin:0;"><input class="item-price" type="number" value="50000" /></div>
        <div class="cp-field" style="margin:0;"><input class="item-disc" type="number" value="0" min="0" /></div>
        <button class="cp-btn danger sm btnRemoveLine" type="button" style="height:35px; width:35px; padding:0;" title="Remove Item">&times;</button>
      `;
      rowDiv.querySelector('.btnRemoveLine').addEventListener('click', () => {
        rowDiv.remove();
        recalcInvoiceTotals();
      });
      cont.appendChild(rowDiv);
      recalcInvoiceTotals();
    });

    cont.querySelectorAll('.btnRemoveLine').forEach(b => {
      b.addEventListener('click', (e) => {
        if (document.querySelectorAll('.line-item-row').length > 1) {
          e.target.closest('.line-item-row').remove();
          recalcInvoiceTotals();
        } else {
          alert('Invoice must contain at least one line item.');
        }
      });
    });

    document.getElementById('btnCancelNewInv').addEventListener('click', () => { state.pendingEnquiryForInvoice = null; state.invoiceSubTab = 'list'; render(); });
    document.getElementById('btnCancelNewInv2').addEventListener('click', () => { state.pendingEnquiryForInvoice = null; state.invoiceSubTab = 'list'; render(); });

    function buildInvoicePayloadFromForm() {
      const client = document.getElementById('invClient').value.trim();
      const progId = document.getElementById('invProg').value;
      const prog = state.programmes.find(p => p.id === progId) || { id: 'prog_gen', name: 'Professional Training Programme' };
      const dateStr = document.getElementById('invDate').value;
      const dueStr = document.getElementById('invDueDate').value;
      const accId = document.getElementById('invPaymentAccount').value;
      const selAcc = state.paymentAccounts.find(a => a.id === accId) || getDefaultPaymentAccount();

      const items = [];
      let subtotal = 0;
      let totalDiscount = 0;

      document.querySelectorAll('.line-item-row').forEach(r => {
        const desc = r.querySelector('.item-desc').value.trim() || prog.name;
        const qty = Number(r.querySelector('.item-qty').value || 1);
        const unitPrice = Number(r.querySelector('.item-price').value || 0);
        const disc = Number(r.querySelector('.item-disc').value || 0);
        const lineAmt = Math.max(0, safeRound((qty * unitPrice) - disc));
        subtotal = safeRound(subtotal + (qty * unitPrice));
        totalDiscount = safeRound(totalDiscount + disc);
        items.push({ description: desc, quantity: qty, price: unitPrice, discount: disc, amount: lineAmt });
      });

      const total = Math.max(0, safeRound(subtotal - totalDiscount));

      // Payment Account Immutable Snapshot (Phase 8)
      const paymentAccountSnapshot = {
        id: selAcc.id,
        accountName: selAcc.accountName,
        bankName: selAcc.bankName,
        accountNumber: selAcc.accountNumber,
        accountType: selAcc.accountType || 'Corporate Current',
        currency: selAcc.currency || 'NGN',
        instructions: document.getElementById('invPaymentInstructions').value.trim() || selAcc.instructions
      };

      return {
        client,
        parentName: document.getElementById('invParent').value.trim(),
        phone: document.getElementById('invPhone').value.trim(),
        email: document.getElementById('invEmail').value.trim(),
        category: document.getElementById('invCat').value,
        progId: prog.id,
        progName: prog.name,
        plan: document.getElementById('invPlan').value,
        trainingMode: document.getElementById('invMode').value,
        duration: document.getElementById('invDuration').value.trim() || '5 Months',
        schedule: document.getElementById('invSchedule').value.trim() || 'Weekdays',
        dateStr,
        dueStr,
        paymentAccountId: selAcc.id,
        paymentAccountSnapshot,
        notes: document.getElementById('invNotes').value.trim(),
        comments: document.getElementById('invComments').value.trim(),
        termsAndConditions: document.getElementById('invTerms').value.trim(),
        items,
        subtotal,
        discount: totalDiscount,
        total
      };
    }

    document.getElementById('btnPreviewInvoice').addEventListener('click', () => {
      const payload = buildInvoicePayloadFromForm();
      const errEl = document.getElementById('invFormError');

      if (!payload.client || payload.items.length === 0) {
        errEl.textContent = 'Please fill client name and at least one line item.';
        errEl.style.display = 'block';
        return;
      }

      const tempInv = {
        id: 'preview_temp',
        invoiceNo: state.counters.invoice + 1,
        invoice_display_no: formatDocNo('invoice', state.counters.invoice + 1, payload.dateStr),
        clientName: payload.client,
        parentName: payload.parentName,
        phone: payload.phone,
        email: payload.email,
        category: payload.category,
        programmeId: payload.progId,
        programmeName: payload.progName,
        plan: payload.plan,
        trainingMode: payload.trainingMode,
        duration: payload.duration,
        schedule: payload.schedule,
        date: payload.dateStr,
        dueDate: payload.dueStr,
        paymentAccountId: payload.paymentAccountId,
        paymentAccountSnapshot: payload.paymentAccountSnapshot,
        notes: payload.notes,
        comments: payload.comments,
        termsAndConditions: payload.termsAndConditions,
        items: payload.items,
        subtotal: payload.subtotal,
        discount: payload.discount,
        total: payload.total,
        createdBy: state.auth.user ? state.auth.user.name : 'Super Admin'
      };

      openModal('previewInvoice', { invoice: tempInv });
    });

    document.getElementById('btnSaveInvoice').addEventListener('click', async () => {
      const payload = buildInvoicePayloadFromForm();
      const errEl = document.getElementById('invFormError');

      if (!payload.client || payload.items.length === 0) {
        errEl.textContent = 'Please fill all required fields.';
        errEl.style.display = 'block';
        return;
      }
      if (isPeriodLocked(payload.dateStr)) {
        errEl.textContent = 'This financial period is locked. Mutations blocked.';
        errEl.style.display = 'block';
        return;
      }
      if (payload.dueStr < payload.dateStr) {
        errEl.textContent = 'Due date cannot precede invoice issue date.';
        errEl.style.display = 'block';
        return;
      }

      state.counters.invoice += 1;
      const docNo = formatDocNo('invoice', state.counters.invoice, payload.dateStr);

      const inv = {
        id: 'inv_' + Date.now(),
        tenant_id: DEFAULT_TENANT_ID,
        enquiryId: state.pendingEnquiryForInvoice ? state.pendingEnquiryForInvoice.id : null,
        invoiceNo: state.counters.invoice,
        invoice_display_no: docNo,
        clientName: payload.client,
        parentName: payload.parentName,
        programmeId: payload.progId,
        programmeName: payload.progName,
        phone: payload.phone,
        email: payload.email,
        category: payload.category,
        date: payload.dateStr,
        dueDate: payload.dueStr,
        plan: payload.plan,
        trainingMode: payload.trainingMode,
        duration: payload.duration,
        schedule: payload.schedule,
        paymentAccountId: payload.paymentAccountId,
        paymentAccountSnapshot: payload.paymentAccountSnapshot,
        notes: payload.notes,
        comments: payload.comments,
        termsAndConditions: payload.termsAndConditions,
        items: payload.items,
        subtotal: payload.subtotal,
        discount: payload.discount,
        total: payload.total,
        createdAt: new Date().toISOString(),
        createdBy: state.auth.user ? state.auth.user.name : 'Super Admin'
      };

      state.invoices.push(inv);

      // Advance linked enquiry status
      if (state.pendingEnquiryForInvoice) {
        const enq = state.enquiries.find(e => e.id === state.pendingEnquiryForInvoice.id);
        if (enq) {
          enq.status = 'INVOICE_ISSUED';
          enq.updatedAt = new Date().toISOString();
          await safeSet(STORE_KEY_ENQUIRIES, state.enquiries);
        }
        state.pendingEnquiryForInvoice = null;
      }

      await safeSet(STORE_KEY_INVOICES, state.invoices);
      await safeSet(STORE_KEY_COUNTERS, state.counters);
      await logAudit('CREATE_INVOICE', 'invoice', inv.id, `Invoice #${inv.invoiceNo} (${inv.clientName})`, null, inv);

      state.invoiceSubTab = 'list';
      openModal('viewInvoice', { invoice: inv });
      render();
    });
  } else {
    const q = (state.filters.invoiceSearch || '').toLowerCase();
    const filtered = state.invoices.filter(i => i.clientName.toLowerCase().includes(q) || String(i.invoiceNo).includes(q) || (i.programmeName && i.programmeName.toLowerCase().includes(q)));

    container.innerHTML = `
      <div class="cp-card">
        <div class="cp-card-header">
          <div>
            <div class="cp-section-title">&#x1F4C4; Tuition &amp; Service Invoices</div>
            <div class="cp-section-desc">Manage, view, print, and track payment status across all issued student invoices.</div>
          </div>
          <div style="display:flex; gap:8px;">
            <button class="cp-btn sm secondary" id="btnExportInvoices">&#x1F4E5; Export CSV</button>
            ${canRecord() ? '<button class="cp-btn sm accent" id="btnNewInvBtn">+ Create Invoice</button>' : ''}
          </div>
        </div>

        <div class="cp-field" style="max-width:320px; margin-bottom:14px;">
          <input type="text" id="invoiceSearchInput" placeholder="Filter by invoice #, student, programme..." value="${escapeHtml(state.filters.invoiceSearch)}" />
        </div>

        ${filtered.length === 0 ? `
          <div class="cp-empty-state">
            <div class="cp-empty-icon">&#x1F4C4;</div>
            <div class="cp-empty-title">No invoices yet</div>
            <div class="cp-empty-desc">Create your first invoice to begin tracking student tuition and fees.</div>
            ${canRecord() ? '<button class="cp-btn accent sm" id="btnEmptyNewInvoice">+ Create Invoice</button>' : ''}
          </div>
        ` : `
          <div class="cp-table-wrap">
            <table class="cp-table">
              <thead>
                <tr>
                  <th>Invoice #</th><th>Issue Date</th><th>Due Date</th><th>Student / Client</th>
                  <th>Programme / Service</th><th style="text-align:right;">Total</th><th style="text-align:right;">Paid</th>
                  <th style="text-align:right;">Balance</th><th>Status</th><th style="text-align:center;">Actions</th>
                </tr>
              </thead>
              <tbody>
                ${filtered.slice().reverse().map(inv => {
                  const { paid, balance, total } = invoiceBalance(inv);
                  const st = invoiceStatus(inv);
                  return `
                    <tr>
                      <td style="font-weight:700; font-family:monospace;">#${inv.invoiceNo}</td>
                      <td>${fmtDate(inv.date)}</td>
                      <td>${fmtDate(inv.dueDate)}</td>
                      <td style="font-weight:600;">${escapeHtml(inv.clientName)}</td>
                      <td style="font-weight:600; color:var(--primary);">${escapeHtml(inv.programmeName || 'General Tech Programme')}</td>
                      <td style="text-align:right;">${fmtMoney(total)}</td>
                      <td style="text-align:right; color:var(--success); font-weight:600;">${fmtMoney(paid)}</td>
                      <td style="text-align:right; font-weight:700; color:${balance > 0 ? 'var(--warning)' : 'var(--success)'};">${fmtMoney(balance)}</td>
                      <td><span class="cp-pill ${st}">${st.toUpperCase()}</span></td>
                      <td style="text-align:center;">
                        <div class="cp-action-group">
                          <button class="cp-btn sm secondary btnViewInv" data-id="${inv.id}" title="View official printable invoice">&#x1F4C4; View / PDF</button>
                          ${balance > 0 && canRecord() ? `<button class="cp-btn sm accent btnRecordPay" data-id="${inv.id}">+ Pay</button>` : ''}
                          <button class="cp-btn sm secondary btnReminder" data-id="${inv.id}" title="Send Reminder">&#x1F4E7;</button>
                        </div>
                      </td>
                    </tr>
                  `;
                }).join('')}
              </tbody>
            </table>
          </div>
        `}
      </div>
    `;

    document.getElementById('invoiceSearchInput').addEventListener('input', (e) => {
      state.filters.invoiceSearch = e.target.value;
      render();
    });

    document.getElementById('btnExportInvoices').addEventListener('click', () => {
      exportToCSV('Invoices_Ledger', filtered.map(i => ({
        Invoice_No: i.invoiceNo, Date: i.date, Due_Date: i.dueDate, Student: i.clientName,
        Programme: i.programmeName, Total: i.total, Paid: invoiceBalance(i).paid,
        Balance: invoiceBalance(i).balance, Status: invoiceStatus(i)
      })));

    const btnNew = document.getElementById('btnNewInvBtn') || document.getElementById('btnEmptyNewInvoice');
    if (btnNew) {

        const inv = state.invoices.find(i => i.id === b.dataset.id);
        if (inv) openModal('sendReminder', { invoice: inv });
      });

}

    const matchesPeriod = !periodFilter || ps.payPeriod === periodFilter;
    const matchesType = typeFilter === 'all' || ps.employeeType === typeFilter;
    
    let matchesStatus = true;
    if (statusFilter === 'has_query') {
      matchesStatus = ps.queries && ps.queries.some(query => query.status === 'open' || query.status === 'under_review');

                const hasOpenQuery = ps.queries && ps.queries.some(q => q.status === 'open' || q.status === 'under_review');
                let statusBadge = '';
                if (ps.status === 'draft') statusBadge = '<span class="cp-pill draft">1. DRAFT</span>';
                else if (ps.status === 'issued') statusBadge = '<span class="cp-pill new">2. ISSUED</span>';
                else if (ps.status === 'acknowledged') statusBadge = '<span class="cp-pill active" style="background:#E0E7FF; color:#3730A3;">3. ACKNOWLEDGED</span>';
                else if (ps.status === 'approved') statusBadge = '<span class="cp-pill partial" style="background:#FEF3C7; color:#92400E; font-weight:800;">4. APPROVED (AWAITING PAY)</span>';
                else if (ps.status === 'paid') statusBadge = '<span class="cp-pill paid">5. PAID &amp; DISBURSED</span>';
                else if (ps.status === 'cancelled') statusBadge = '<span class="cp-pill cancelled">CANCELLED</span>';

                return `
                  <tr>
                    <td style="font-weight:700; font-family:monospace;">#${ps.payslipNo}</td>
                    <td><strong>${escapeHtml(ps.payPeriod)}</strong><br/><span style="font-size:10.5px; color:var(--text-muted);">${fmtDate(ps.payDate)}</span></td>
                    <td style="font-weight:700; color:var(--primary);">${escapeHtml(ps.employeeName)}</td>
                    <td><span class="cp-pill ${ps.employeeType === 'facilitator' ? 'category-pill' : 'new'}">${escapeHtml(ps.employeeType.toUpperCase())}</span></td>
                    <td>${escapeHtml(ps.department)}<br/><span style="font-size:11px; color:var(--text-secondary);">${escapeHtml(ps.role)}</span></td>
                    <td style="text-align:right; font-weight:600;">${fmtMoney(ps.grossPay)}</td>
                    <td style="text-align:right; color:var(--danger);">${ps.totalDeductions > 0 ? '-' + fmtMoney(ps.totalDeductions) : '₦0.00'}</td>
                    <td style="text-align:right; font-weight:800; color:var(--primary); font-size:13px;">${fmtMoney(ps.netPay)}</td>
                    <td>
                      ${statusBadge}
                      ${hasOpenQuery ? `<div style="margin-top:4px;"><span class="cp-pill prio-high" style="font-size:10px;">⚠️ Query Pending</span></div>` : ''}
                    </td>
                    <td style="text-align:center;">
                      <div class="cp-action-group" style="display:flex; justify-content:center; gap:4px; flex-wrap:wrap;">
                        <button class="cp-btn sm secondary btnViewPayslip" data-id="${ps.id}" title="View official printable payslip document">&#x1F4C4; View / Print</button>
                        
                        ${ps.status === 'draft' && canRecord() ? `
                          <button class="cp-btn sm accent btnIssuePayslip" data-id="${ps.id}" title="Issue to employee for review">Issue</button>
                        ` : ''}

                        ${ps.status === 'issued' ? `
                          <button class="cp-btn sm success btnAckPayslip" data-id="${ps.id}" title="Employee review &amp; acknowledgement">Acknowledge</button>
                          <button class="cp-btn sm secondary btnRaiseQuery" data-id="${ps.id}" title="Raise Discrepancy Query" style="color:#B45309;">Raise Query</button>
                        ` : ''}

                        ${ps.status === 'acknowledged' ? `
                          ${canApprove() ? `<button class="cp-btn sm accent btnApprovePayslip" data-id="${ps.id}" ${hasOpenQuery ? 'disabled title="Resolve open queries before approval"' : 'title="Approve for month-end disbursement"'}>Approve Payroll</button>` : ''}
                          <button class="cp-btn sm secondary btnRaiseQuery" data-id="${ps.id}" title="Raise Discrepancy Query" style="color:#B45309;">Raise Query</button>
                        ` : ''}

                        ${ps.status === 'approved' && canApprove() ? `
                          <button class="cp-btn sm success btnPayPayslip" data-id="${ps.id}" title="Disburse month-end payment &amp; create expense">Mark as Paid</button>
                        ` : ''}

                        ${hasOpenQuery ? `
                          <button class="cp-btn sm warning btnReviewQuery" data-id="${ps.id}" style="background:#FFFBEB; border-color:var(--warning); color:#92400E;">Review Query</button>
                        ` : ''}

                        ${(ps.status === 'draft' || ps.status === 'issued' || ps.status === 'acknowledged' || ps.status === 'approved') && canCancel() ? `
                          <button class="cp-btn sm danger btnCancelPayslip" data-id="${ps.id}" title="Cancel / Void Payslip">&times;</button>
                        ` : ''}
                      </div>
                    </td>
                  </tr>
                `;
              }).join('')}
            </tbody>
          </table>
        </div>
      `}
    </div>
  `;

  document.getElementById('payslipSearchInput').addEventListener('input', (e) => {
    state.filters.payslipSearch = e.target.value;
    render();
  });

  document.getElementById('payslipTypeSelect').addEventListener('change', (e) => {
    state.filters.payslipType = e.target.value;
    render();
  });

  document.getElementById('payslipStatusSelect').addEventListener('change', (e) => {
    state.filters.payslipStatus = e.target.value;
    render();
  });

  const btnFilterQueries = document.getElementById('btnFilterOpenQueries');
  if (btnFilterQueries) {
    btnFilterQueries.addEventListener('click', () => {
      state.filters.payslipStatus = 'has_query';
      render();
    });
  }

  document.getElementById('btnExportPayslips').addEventListener('click', () => {
    exportToCSV('Payroll_Ledger', filtered.map(p => ({
      Payslip_No: p.payslipNo, Period: p.payPeriod, Date: p.payDate, Employee: p.employeeName,
      Type: p.employeeType, Department: p.department, Role: p.role, Gross_Pay: p.grossPay,
      Deductions: p.totalDeductions, Net_Pay: p.netPay, Status: p.status, Method: p.paymentMethod, Reference: p.paymentReference
    })));
  });

  const btnGen = document.getElementById('btnNewPayslipBtn') || document.getElementById('btnEmptyGeneratePayslip');
  if (btnGen) btnGen.addEventListener('click', () => openModal('generatePayslip'));

  container.querySelectorAll('.btnViewPayslip').forEach(b => {
    b.addEventListener('click', () => {
      const ps = state.payslips.find(p => p.id === b.dataset.id);
      if (ps) openModal('viewPayslip', { payslip: ps });
    });
  });

  container.querySelectorAll('.btnIssuePayslip').forEach(b => {
    b.addEventListener('click', async () => {
      const ps = state.payslips.find(p => p.id === b.dataset.id);
      if (ps) {
        ps.status = 'issued';
        ps.issuedAt = new Date().toISOString();
        ps.issuedBy = state.auth.user ? state.auth.user.name : 'Finance Operations';
        await safeSet(STORE_KEY_PAYSLIPS, state.payslips);
        await logAudit('ISSUE_PAYSLIP', 'payslip', ps.id, `Issued Payslip #${ps.payslipNo} for ${ps.employeeName} review`);
        render();
      }
    });
  });

  container.querySelectorAll('.btnAckPayslip').forEach(b => {
    b.addEventListener('click', () => {
      const ps = state.payslips.find(p => p.id === b.dataset.id);
      if (ps) openModal('acknowledgePayslip', { payslip: ps });
    });
  });

  container.querySelectorAll('.btnRaiseQuery').forEach(b => {
    b.addEventListener('click', () => {
      const ps = state.payslips.find(p => p.id === b.dataset.id);
      if (ps) openModal('raisePayrollQuery', { payslip: ps });
    });
  });

  container.querySelectorAll('.btnReviewQuery').forEach(b => {
    b.addEventListener('click', () => {
      const ps = state.payslips.find(p => p.id === b.dataset.id);
      if (ps) openModal('resolvePayrollQuery', { payslip: ps });
    });
  });

  container.querySelectorAll('.btnApprovePayslip').forEach(b => {
    b.addEventListener('click', () => {
      const ps = state.payslips.find(p => p.id === b.dataset.id);
      if (ps) openModal('approvePayslip', { payslip: ps });
    });
  });

  container.querySelectorAll('.btnPayPayslip').forEach(b => {
    b.addEventListener('click', () => {
      const ps = state.payslips.find(p => p.id === b.dataset.id);
      if (ps) openModal('payPayslip', { payslip: ps });
    });
  });

  container.querySelectorAll('.btnCancelPayslip').forEach(b => {
    b.addEventListener('click', () => {
      const ps = state.payslips.find(p => p.id === b.dataset.id);
      if (ps) openModal('cancelPayslip', { payslip: ps });
    });
  });
}

      ${state.budgets.length === 0 ? `

                <th>Actual Spent</th><th>Remaining</th><th>Utilization</th>
              </tr>

            <tbody>
              ${state.budgets.map(b => {
                const actual = state.expenses
                  .filter(e => (e.status === 'recorded' || e.status === 'approved') && e.category === b.category && (e.date || '').startsWith(curPeriod))
                  .reduce((s, e) => s + Number(e.amount || 0), 0);
                const rem = safeRound(b.amount - actual);
                const util = b.amount > 0 ? Math.min(100, safeRound((actual / b.amount) * 100)) : 0;
                return `
                  <tr>
                    <td style="font-weight:700;">${escapeHtml(b.category)}</td>
                    <td>${escapeHtml(b.department || 'Operations')}</td>
                    <td>${fmtMoney(b.amount)}</td>
                    <td style="color:var(--danger); font-weight:600;">${fmtMoney(actual)}</td>
                    <td style="font-weight:700; color:${rem >= 0 ? 'var(--success)' : 'var(--danger)'};">${fmtMoney(rem)}</td>
                    <td style="width:140px;">
                      <div style="font-size:11px; font-weight:600; margin-bottom:2px;">${util}%</div>
                      <div style="height:6px; background:var(--surface-2); border-radius:3px; overflow:hidden;">
                        <div style="height:100%; width:${util}%; background:${util > 90 ? 'var(--danger)' : util > 70 ? 'var(--warning)' : 'var(--success)'};"></div>
                      </div>
                    </td>
                  </tr>
                `;
              }).join('')}
            </tbody>
          </table>
        </div>
      `}
    </div>
  `;

  const btnSet = document.getElementById('btnSetBudgetBtn');
  if (btnSet) btnSet.addEventListener('click', () => openModal('setBudget'));
}

function renderFinancialControlsTab(container) {
  const curMonth = new Date().toISOString().slice(0, 7);
  const isLocked = isPeriodLocked(curMonth + '-01');

  container.innerHTML = `
    <div class="cp-card">
      <div class="cp-card-header">
        <div>
          <div class="cp-section-title">&#x1F512; Financial Controls &amp; Governance</div>
          <div class="cp-section-desc">Accounting period locks, approval threshold tiers, and bank reconciliation.</div>
        </div>
      </div>

      <div style="display:grid; grid-template-columns:1fr 1fr; gap:16px;">
        <div style="background:#FAFBFD; border:1px solid var(--border); border-radius:var(--radius-sm); padding:16px;">
          <div style="font-size:14px; font-weight:700; color:var(--primary); margin-bottom:6px;">Accounting Period Status (${curMonth})</div>
          <div style="font-size:12.5px; color:var(--text-secondary); margin-bottom:12px;">
            Status: <strong style="color:${isLocked ? 'var(--danger)' : 'var(--success)'};">${isLocked ? 'LOCKED (Modifications Prohibited)' : 'OPEN FOR TRANSACTIONS'}</strong>
          </div>
          ${canLockPeriod() ? `
            <button class="cp-btn ${isLocked ? 'accent' : 'danger'} sm" id="btnToggleLockPeriod">
              ${isLocked ? 'Reopen Financial Period' : 'Lock Current Period'}
            </button>
          ` : '<div style="font-size:11.5px; color:var(--text-muted);">Period locking restricted to Super Admin.</div>'}
        </div>

        <div style="background:#FAFBFD; border:1px solid var(--border); border-radius:var(--radius-sm); padding:16px;">
          <div style="font-size:14px; font-weight:700; color:var(--primary); margin-bottom:6px;">Approval Tiers</div>
          <div style="font-size:12px; color:var(--text-secondary); line-height:1.6;">
            Tier 1 (Under ₦100,000): <strong>Automatic Approval</strong><br/>
            Tier 2 (₦100,000 – ₦500,000): <strong>Finance Manager</strong><br/>
            Tier 3 (Over ₦500,000): <strong>Super Admin Only</strong>
          </div>
        </div>
      </div>
    </div>
  `;

  const btnLock = document.getElementById('btnToggleLockPeriod');
  if (btnLock) {
    btnLock.addEventListener('click', async () => {
      const idx = state.financePeriods.findIndex(p => p.period === curMonth);
      const newStatus = isLocked ? 'open' : 'locked';
      if (idx >= 0) state.financePeriods[idx].status = newStatus;
      else state.financePeriods.push({ period: curMonth, status: newStatus, lockedAt: new Date().toISOString() });
      await safeSet(STORE_KEY_FINANCE_PERIODS, state.financePeriods);
      await logAudit('PERIOD_LOCK_TOGGLE', 'period', curMonth, `Set to ${newStatus}`);
      render();
    });
  }
}

function renderRecordPaymentModal(container, inv) {
  const { balance } = invoiceBalance(inv);
  const todayStr = new Date().toISOString().slice(0, 10);

  container.innerHTML = `
    <div class="cp-modal-overlay">
      <div class="cp-modal">
        <div class="cp-modal-header">
          <div class="cp-modal-title">Record Payment &mdash; Invoice #${inv.invoiceNo}</div>
          <button class="cp-modal-close" id="btnClosePayMod">&times;</button>
        </div>

        <div class="cp-modal-body">
          <div style="background:#FAFBFD; border:1px solid var(--border); border-radius:var(--radius-sm); padding:12px; margin-bottom:14px; font-size:12.5px;">
            <div>Student: <strong>${escapeHtml(inv.clientName)}</strong></div>
            <div>Programme: <strong>${escapeHtml(inv.programmeName)}</strong></div>
            <div style="margin-top:4px;">Outstanding Due: <strong style="color:var(--warning); font-size:14px;">${fmtMoney(balance)}</strong></div>
          </div>

          <div class="cp-field"><label>Payment Amount (₦) *</label><input type="number" id="payAmount" value="${balance}" max="${balance}" /></div>
          <div class="cp-field"><label>Payment Date *</label><input type="date" id="payDate" value="${todayStr}" /></div>
          <div class="cp-field"><label>Payment Method *</label><select id="payMethod">${PAYMENT_METHODS.map(m => `<option value="${m}">${m}</option>`).join('')}</select></div>
          <div class="cp-field"><label>Bank Transaction Reference / Deposit Slip No *</label><input id="payRef" placeholder="e.g. GTB/NIBSS/2026082601" /></div>
          <div class="cp-field"><label>Internal Notes / Confirmation Remarks</label><textarea id="payNotes" rows="2" placeholder="Confirmed via GTBank Corporate Statement."></textarea></div>

          <div id="payFormErr" style="color:var(--danger); font-size:12px; display:none;"></div>
        </div>

        <div class="cp-modal-footer">
          <button class="cp-btn secondary" id="btnCancelPay">Cancel</button>
          <button class="cp-btn accent" id="btnConfirmPay">&#x2714; Record &amp; Issue Receipt</button>
        </div>
      </div>
    </div>
  `;

  document.getElementById('btnClosePayMod').addEventListener('click', closeModal);
  document.getElementById('btnCancelPay').addEventListener('click', closeModal);

  document.getElementById('btnConfirmPay').addEventListener('click', async () => {
    const amt = Number(document.getElementById('payAmount').value || 0);
    const dateStr = document.getElementById('payDate').value;
    const method = document.getElementById('payMethod').value;
    const ref = document.getElementById('payRef').value.trim();
    const notes = document.getElementById('payNotes').value.trim();
    const errEl = document.getElementById('payFormErr');

    if (amt <= 0 || amt > balance) {
      errEl.textContent = `Please enter a valid amount up to ${fmtMoney(balance)}.`;
      errEl.style.display = 'block';
      return;
    }
    if (isPeriodLocked(dateStr)) {
      errEl.textContent = 'Financial period is locked. Modifications prohibited.';
      errEl.style.display = 'block';
      return;
    }

    state.counters.receipt += 1;
    const rctNo = formatDocNo('receipt', state.counters.receipt, dateStr);

    const payment = {
      id: 'pay_' + Date.now(),
      tenant_id: DEFAULT_TENANT_ID,
      invoiceId: inv.id,
      receiptNo: state.counters.receipt,
      receipt_display_no: rctNo,
      amount: amt,
      date: dateStr,
      paymentMethod: method,
      reference: ref,
      notes,
      reconciliationStatus: 'unreconciled',
      recordedBy: state.auth.user ? state.auth.user.name : 'Super Admin',
      recordedAt: new Date().toISOString()
    };

    state.payments.push(payment);
    await safeSet(STORE_KEY_PAYMENTS, state.payments);
    await safeSet(STORE_KEY_COUNTERS, state.counters);
    await logAudit('RECORD_PAYMENT', 'payment', payment.id, `Payment #${payment.receiptNo} of ₦${payment.amount} for Invoice #${inv.invoiceNo}`, null, payment);

    openModal('viewReceipt', { payment, invoice: inv });
  });
}

      </div>
    </div>
  `;

  document.getElementById('btnCloseGenPsl').addEventListener('click', closeModal);
  document.getElementById('btnCancelGenPsl').addEventListener('click', closeModal);

  document.getElementById('pslEmpSelect').addEventListener('change', (e) => {
    const emp = state.personnel.find(p => p.id === e.target.value);
    if (emp) {
      document.getElementById('pslType').value = emp.type;
      document.getElementById('pslName').value = emp.name;
      document.getElementById('pslDept').value = emp.department;
      document.getElementById('pslRole').value = emp.role;
      document.getElementById('pslBasic').value = emp.basicPay;
      recalcPayslipTotals();
    }
  });

  function recalcPayslipTotals() {
    const basic = Number(document.getElementById('pslBasic').value || 0);
    let allowTotal = 0;
    document.querySelectorAll('.allowance-row').forEach(r => {
      allowTotal = safeRound(allowTotal + Number(r.querySelector('.allow-amt').value || 0));
    });
    const gross = safeRound(basic + allowTotal);

    let dedTotal = 0;
    document.querySelectorAll('.deduction-row').forEach(r => {
      dedTotal = safeRound(dedTotal + Number(r.querySelector('.ded-amt').value || 0));
    });
    const net = Math.max(0, safeRound(gross - dedTotal));

    document.getElementById('lblGrossPay').textContent = fmtMoney(gross);
    document.getElementById('lblTotalDeductions').textContent = fmtMoney(dedTotal);
    document.getElementById('lblNetPay').textContent = fmtMoney(net);
  }

  document.getElementById('pslBasic').addEventListener('input', recalcPayslipTotals);

  // Dynamic repeater listeners
  const allowCont = document.getElementById('allowancesContainer');
  allowCont.addEventListener('input', recalcPayslipTotals);
  document.getElementById('btnAddAllowance').addEventListener('click', () => {
    const r = document.createElement('div');
    r.className = 'cp-row3 allowance-row';
    r.style.marginBottom = '6px';
    r.innerHTML = `
      <div class="cp-field" style="margin:0;"><input class="allow-desc" placeholder="Allowance description" /></div>
      <div class="cp-field" style="margin:0;"><input class="allow-amt" type="number" placeholder="Amount (₦)" value="0" /></div>
      <button class="cp-btn danger sm btnRemAllow" type="button" style="width:35px; height:35px;">&times;</button>
    `;
    r.querySelector('.btnRemAllow').addEventListener('click', () => { r.remove(); recalcPayslipTotals(); });
    allowCont.appendChild(r);
  });
  allowCont.querySelectorAll('.btnRemAllow').forEach(b => b.addEventListener('click', (e) => { e.target.closest('.allowance-row').remove(); recalcPayslipTotals(); }));

  const dedCont = document.getElementById('deductionsContainer');
  dedCont.addEventListener('input', recalcPayslipTotals);
  document.getElementById('btnAddDeduction').addEventListener('click', () => {
    const r = document.createElement('div');
    r.className = 'cp-row3 deduction-row';
    r.style.marginBottom = '6px';
    r.innerHTML = `
      <div class="cp-field" style="margin:0;"><input class="ded-desc" placeholder="Deduction description" /></div>
      <div class="cp-field" style="margin:0;"><input class="ded-amt" type="number" placeholder="Amount (₦)" value="0" /></div>
      <button class="cp-btn danger sm btnRemDed" type="button" style="width:35px; height:35px;">&times;</button>
    `;
    r.querySelector('.btnRemDed').addEventListener('click', () => { r.remove(); recalcPayslipTotals(); });
    dedCont.appendChild(r);
  });
  dedCont.querySelectorAll('.btnRemDed').forEach(b => b.addEventListener('click', (e) => { e.target.closest('.deduction-row').remove(); recalcPayslipTotals(); }));

  async function handleSavePayslip(targetStatus) {
    const name = document.getElementById('pslName').value.trim();
    const type = document.getElementById('pslType').value;
    const dept = document.getElementById('pslDept').value;
    const role = document.getElementById('pslRole').value.trim();
    const period = document.getElementById('pslPeriod').value;
    const dateStr = document.getElementById('pslDate').value;
    const basic = Number(document.getElementById('pslBasic').value || 0);
    const errEl = document.getElementById('pslFormErr');

    if (!name || !role || basic <= 0) {
      errEl.textContent = 'Please fill all required personnel and compensation fields.';
      errEl.style.display = 'block';
      return;
    }
    if (isPeriodLocked(dateStr)) {
      errEl.textContent = 'Financial period is locked. Modifications prohibited.';
      errEl.style.display = 'block';
      return;
    }

    const allowances = [];
    document.querySelectorAll('.allowance-row').forEach(r => {
      const desc = r.querySelector('.allow-desc').value.trim();
      const amt = Number(r.querySelector('.allow-amt').value || 0);
      if (desc && amt > 0) allowances.push({ description: desc, amount: amt });
    });

    const deductions = [];
    document.querySelectorAll('.deduction-row').forEach(r => {
      const desc = r.querySelector('.ded-desc').value.trim();
      const amt = Number(r.querySelector('.ded-amt').value || 0);
      if (desc && amt > 0) deductions.push({ description: desc, amount: amt });
    });

    const totals = calculatePayslipTotals(basic, allowances, deductions);

    state.counters.payslip += 1;
    const pslNo = formatDocNo('payslip', state.counters.payslip, dateStr);

    const payslip = {
      id: 'psl_' + Date.now(),
      tenant_id: DEFAULT_TENANT_ID,
      payslipNo: state.counters.payslip,
      payslip_display_no: pslNo,
      employeeName: name,
      employeeType: type,
      department: dept,
      role,
      payPeriod: period,
      payDate: dateStr,
      basicPay: totals.basic,
      allowances,
      totalAllowances: totals.totalAllowances,
      grossPay: totals.grossPay,
      deductions,
      totalDeductions: totals.totalDeductions,
      netPay: totals.netPay,
      paymentMethod: 'Bank Transfer',
      notes: document.getElementById('pslNotes').value.trim(),
      status: targetStatus,
      issuedAt: targetStatus === 'issued' ? new Date().toISOString() : null,
      issuedBy: targetStatus === 'issued' ? (state.auth.user ? state.auth.user.name : 'Finance Operations') : null,
      queries: [],
      createdAt: new Date().toISOString(),
      createdBy: state.auth.user ? state.auth.user.name : 'Finance Operations'
    };

    state.payslips.push(payslip);
    await safeSet(STORE_KEY_PAYSLIPS, state.payslips);
    await safeSet(STORE_KEY_COUNTERS, state.counters);
    await logAudit(targetStatus === 'issued' ? 'ISSUE_PAYSLIP' : 'CREATE_PAYSLIP_DRAFT', 'payslip', payslip.id, `${targetStatus === 'issued' ? 'Issued' : 'Drafted'} Payslip #${payslip.payslipNo} for ${payslip.employeeName} (${payslip.payPeriod})`, null, payslip);

    openModal('viewPayslip', { payslip });
  }

  document.getElementById('btnSaveDraftOnly').addEventListener('click', () => handleSavePayslip('draft'));
  document.getElementById('btnSaveAndIssue').addEventListener('click', () => handleSavePayslip('issued'));
}

function renderRaisePayrollQueryModal(container, payslip) {
  container.innerHTML = `
    <div class="cp-modal-overlay">
      <div class="cp-modal">
        <div class="cp-modal-header">
          <div class="cp-modal-title">&#x26A0;&#xFE0F; Raise Payroll Discrepancy Query &mdash; #${payslip.payslipNo}</div>
          <button class="cp-modal-close" id="btnCloseQryMod">&times;</button>
        </div>
        <div class="cp-modal-body">
          <div style="background:#FFFBEB; border:1px solid var(--warning); border-radius:var(--radius-sm); padding:10px 14px; font-size:12px; color:#92400E; margin-bottom:12px;">
            Raising a query flags this payslip for finance review. The payslip cannot proceed to final Finance Approval until the discrepancy is formally resolved.
          </div>

          <div class="cp-field">
            <label>Query Reason / Category *</label>
            <select id="qryReason">
              <option value="Missing Facilitator Session">Missing Facilitator Session / Course Count</option>
              <option value="Incorrect Allowance / Bonus">Incorrect Allowance / Bonus Calculation</option>
              <option value="Base Compensation Error">Base Compensation / Agreed Rate Error</option>
              <option value="Statutory Deduction Discrepancy">Statutory Deduction (Tax/Pension) Discrepancy</option>
              <option value="Unauthorized Deduction">Unauthorized Advance / Deduction</option>
              <option value="Other Discrepancy">Other Discrepancy</option>
            </select>
          </div>

          <div class="cp-field">
            <label>Detailed Explanation / Discrepancy Note *</label>
            <textarea id="qryComment" rows="3" placeholder="e.g. Conducted 4 weekend IELTS Masterclass sessions in August but only 3 were captured on this draft statement."></textarea>
          </div>

          <div id="qryErr" style="color:var(--danger); font-size:12px; display:none;"></div>
        </div>
        <div class="cp-modal-footer">
          <button class="cp-btn secondary" id="btnCancelQry">Cancel</button>
          <button class="cp-btn accent" id="btnSubmitQuery">&#x26A0;&#xFE0F; Submit Payroll Query</button>
        </div>
      </div>
    </div>
  `;

  document.getElementById('btnCloseQryMod').addEventListener('click', closeModal);
  document.getElementById('btnCancelQry').addEventListener('click', closeModal);

  document.getElementById('btnSubmitQuery').addEventListener('click', async () => {
    const reason = document.getElementById('qryReason').value;
    const comment = document.getElementById('qryComment').value.trim();
    const errEl = document.getElementById('qryErr');

    if (!comment) {
      errEl.textContent = 'Please enter a detailed explanation of the discrepancy.';
      errEl.style.display = 'block';
      return;
    }

    payslip.queries = payslip.queries || [];
    const query = {
      id: 'qry_' + Date.now(),
      queryReason: reason,
      queryComment: comment,
      status: 'open',
      createdAt: new Date().toISOString(),
      createdBy: state.auth.user ? state.auth.user.name : payslip.employeeName
    };
    payslip.queries.push(query);

    await safeSet(STORE_KEY_PAYSLIPS, state.payslips);
    await logAudit('RAISE_PAYROLL_QUERY', 'payslip', payslip.id, `Raised query on #${payslip.payslipNo}: ${reason}`);

    alert('Payroll query submitted. Finance team has been notified.');
    openModal('viewPayslip', { payslip });
  });
}

function renderResolvePayrollQueryModal(container, payslip) {
  const queries = payslip.queries || [];

  container.innerHTML = `
    <div class="cp-modal-overlay">
      <div class="cp-modal large">
        <div class="cp-modal-header">
          <div class="cp-modal-title">Review &amp; Resolve Payroll Queries &mdash; #${payslip.payslipNo}</div>
          <button class="cp-modal-close" id="btnCloseResMod">&times;</button>
        </div>
        <div class="cp-modal-body">
          <div style="font-size:12.5px; color:var(--text-secondary); margin-bottom:14px;">
            Personnel: <strong>${escapeHtml(payslip.employeeName)}</strong> &middot; Period: <strong>${escapeHtml(payslip.payPeriod)}</strong> &middot; Net Pay: <strong>${fmtMoney(payslip.netPay)}</strong>
          </div>

          ${queries.length === 0 ? '<div style="color:var(--text-muted);">No queries recorded on this payslip.</div>' : `
            <div style="display:flex; flex-direction:column; gap:12px;">
              ${queries.map((q, idx) => `
                <div style="background:#FAFBFD; border:1px solid var(--border); border-left:3.5px solid ${q.status === 'open' ? 'var(--warning)' : (q.status === 'resolved' ? 'var(--success)' : 'var(--danger)')}; border-radius:var(--radius-sm); padding:12px 14px;">
                  <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:4px;">
                    <strong style="color:var(--primary); font-size:13px;">${escapeHtml(q.queryReason)}</strong>
                    <span class="cp-pill ${q.status === 'open' ? 'unpaid' : (q.status === 'resolved' ? 'paid' : 'cancelled')}">${escapeHtml(q.status.toUpperCase())}</span>
                  </div>
                  <div style="font-size:12px; color:var(--text-secondary); margin-bottom:6px;">${escapeHtml(q.queryComment)}</div>
                  <div style="font-size:10.5px; color:var(--text-muted);">Raised by ${escapeHtml(q.createdBy)} on ${new Date(q.createdAt).toLocaleString('en-GB')}</div>

                  ${q.status === 'open' || q.status === 'under_review' ? `
                    <div style="margin-top:10px; padding-top:8px; border-top:1px dashed var(--border);">
                      <div class="cp-field" style="margin-bottom:6px;">
                        <label style="font-size:11px;">Resolution Notes *</label>
                        <input id="resNote_${idx}" placeholder="e.g. Verified with Academic registry; 4th session allowance added." />
                      </div>
                      <div style="display:flex; gap:8px; justify-content:flex-end;">
                        <button class="cp-btn sm danger btnRejectQry" data-idx="${idx}">Reject Query</button>
                        <button class="cp-btn sm success btnResolveQry" data-idx="${idx}">Resolve Query</button>
                      </div>
                    </div>
                  ` : `
                    <div style="margin-top:6px; font-size:11.5px; color:var(--success); background:#F0FDF4; padding:6px 8px; border-radius:4px;">
                      ✔ <strong>Resolved:</strong> ${escapeHtml(q.resolutionNote || 'Resolved')} &middot; By: ${escapeHtml(q.resolvedBy || 'Finance')} on ${new Date(q.resolvedAt).toLocaleDateString('en-GB')}
                    </div>
                  `}
                </div>
              `).join('')}
            </div>
          `}
        </div>
        <div class="cp-modal-footer">
          <button class="cp-btn secondary" id="btnCloseResMod2">Close</button>
        </div>
      </div>
    </div>
  `;

  document.getElementById('btnCloseResMod').addEventListener('click', closeModal);
  document.getElementById('btnCloseResMod2').addEventListener('click', closeModal);

  container.querySelectorAll('.btnResolveQry').forEach(b => {
    b.addEventListener('click', async () => {
      const idx = Number(b.dataset.idx);
      const note = (document.getElementById(`resNote_${idx}`).value || '').trim();
      if (!note) { alert('Please provide resolution notes.'); return; }

      payslip.queries[idx].status = 'resolved';
      payslip.queries[idx].resolutionNote = note;
      payslip.queries[idx].resolvedAt = new Date().toISOString();
      payslip.queries[idx].resolvedBy = state.auth.user ? state.auth.user.name : 'Finance Operations';

      await safeSet(STORE_KEY_PAYSLIPS, state.payslips);
      await logAudit('RESOLVE_PAYROLL_QUERY', 'payslip', payslip.id, `Resolved query #${idx + 1} on #${payslip.payslipNo}: ${note}`);
      renderResolvePayrollQueryModal(container, payslip);
    });
  });

  container.querySelectorAll('.btnRejectQry').forEach(b => {
    b.addEventListener('click', async () => {
      const idx = Number(b.dataset.idx);
      const note = (document.getElementById(`resNote_${idx}`).value || '').trim();
      if (!note) { alert('Please provide reason for rejecting query.'); return; }

      payslip.queries[idx].status = 'rejected';
      payslip.queries[idx].resolutionNote = note;
      payslip.queries[idx].resolvedAt = new Date().toISOString();
      payslip.queries[idx].resolvedBy = state.auth.user ? state.auth.user.name : 'Finance Operations';

      await safeSet(STORE_KEY_PAYSLIPS, state.payslips);
      await logAudit('REJECT_PAYROLL_QUERY', 'payslip', payslip.id, `Rejected query #${idx + 1} on #${payslip.payslipNo}: ${note}`);
      renderResolvePayrollQueryModal(container, payslip);
    });
  });
}

function renderPayPayslipModal(container, payslip) {
  const todayStr = new Date().toISOString().slice(0, 10);

  container.innerHTML = `
    <div class="cp-modal-overlay">
      <div class="cp-modal">
        <div class="cp-modal-header">
          <div class="cp-modal-title">Disburse Month-End Payment &mdash; Payslip #${payslip.payslipNo}</div>
          <button class="cp-modal-close" id="btnClosePayPsl">&times;</button>
        </div>
        <div class="cp-modal-body">
          <div style="background:#FAFBFD; border:1px solid var(--border); border-radius:var(--radius-sm); padding:12px; margin-bottom:14px; font-size:13px;">
            <div>Beneficiary: <strong>${escapeHtml(payslip.employeeName)}</strong> (${escapeHtml(payslip.role)})</div>
            <div>Period: <strong>${escapeHtml(payslip.payPeriod)}</strong></div>
            <div style="margin-top:4px; font-size:16px; font-weight:800; color:var(--success);">Approved Net Pay: ${fmtMoney(payslip.netPay)}</div>
          </div>

          <div class="cp-row2">
            <div class="cp-field"><label>Actual Payment Amount (₦) *</label><input type="number" id="pslPaidAmt" value="${payslip.netPay}" /></div>
            <div class="cp-field"><label>Actual Payment Date *</label><input type="date" id="pslPayDate" value="${todayStr}" /></div>
          </div>

          <div class="cp-field"><label>Payment Method *</label><select id="pslPayMethod">${PAYMENT_METHODS.filter(m => m !== 'Cash').map(m => `<option value="${m}">${m}</option>`).join('')}</select></div>
          <div class="cp-field"><label>Bank Transaction Reference / NIBSS Session ID *</label><input id="pslPayRef" placeholder="e.g. GTB/NIBSS/SAL/2026082701" /></div>

          <div style="background:var(--info-bg); border:1px solid var(--info); border-radius:var(--radius-sm); padding:10px 12px; font-size:12px; color:var(--info); margin-top:10px;">
            &#x1F4CA; <strong>Idempotent Expense Integration:</strong> Confirming this payment will create exactly one operational expense record in the general ledger under <strong>${payslip.employeeType === 'facilitator' ? 'Facilitator Fees' : 'Salaries'}</strong> with zero duplicate counting.
          </div>
          <div id="pslPayErr" style="color:var(--danger); font-size:12px; display:none; margin-top:8px;"></div>
        </div>
        <div class="cp-modal-footer">
          <button class="cp-btn secondary" id="btnCancelPayPsl">Cancel</button>
          <button class="cp-btn success" id="btnConfirmPayPsl">&#x2714; Confirm Month-End Payment</button>
        </div>
      </div>
    </div>
  `;

  document.getElementById('btnClosePayPsl').addEventListener('click', closeModal);
  document.getElementById('btnCancelPayPsl').addEventListener('click', closeModal);

  document.getElementById('btnConfirmPayPsl').addEventListener('click', async () => {
    const paidAmt = Number(document.getElementById('pslPaidAmt').value || 0);
    const dateStr = document.getElementById('pslPayDate').value;
    const method = document.getElementById('pslPayMethod').value;
    const ref = document.getElementById('pslPayRef').value.trim();
    const errEl = document.getElementById('pslPayErr');

    // Strict Payment Validation
    if (paidAmt <= 0) {
      errEl.textContent = 'Payment amount must be greater than zero.';
      errEl.style.display = 'block';
      return;
    }
    if (safeRound(paidAmt) !== safeRound(payslip.netPay)) {
      errEl.textContent = `Payment amount (₦${paidAmt}) must equal approved Net Pay (₦${payslip.netPay}).`;
      errEl.style.display = 'block';
      return;
    }
    if (!ref) {
      errEl.textContent = 'Please enter a valid bank transaction reference.';
      errEl.style.display = 'block';
      return;
    }
    if (isPeriodLocked(dateStr)) {
      errEl.textContent = 'Financial period is locked. Modifications prohibited.';
      errEl.style.display = 'block';
      return;
    }

    payslip.status = 'paid';
    payslip.paidAmount = paidAmt;
    payslip.actualPaymentDate = dateStr;
    payslip.paymentMethod = method;
    payslip.paymentReference = ref;
    payslip.paidBy = state.auth.user ? state.auth.user.name : 'Finance Operations';
    payslip.paidAt = new Date().toISOString();

    // Trigger Idempotent Expense Integration
    await integratePayslipExpense(payslip);

    await safeSet(STORE_KEY_PAYSLIPS, state.payslips);
    await logAudit('DISBURSE_PAYSLIP', 'payslip', payslip.id, `Disbursed month-end pay of ₦${paidAmt} to ${payslip.employeeName} (Ref: ${ref})`, null, payslip);

    openModal('viewPayslip', { payslip });
  });
}

function renderCancelPayslipModal(container, payslip) {
  container.innerHTML = `
    <div class="cp-modal-overlay">
      <div class="cp-modal">
        <div class="cp-modal-header">
          <div class="cp-modal-title">Cancel Payslip #${payslip.payslipNo}</div>
          <button class="cp-modal-close" id="btnCloseCanPsl">&times;</button>
        </div>
        <div class="cp-modal-body">
          <p style="font-size:13px; color:var(--text-secondary); margin-bottom:12px;">
            Are you sure you want to cancel payslip for <strong>${escapeHtml(payslip.employeeName)}</strong>? This will void this payroll entry.
          </p>
          <div class="cp-field"><label>Reason for Cancellation *</label><textarea id="pslCanReason" rows="2" placeholder="e.g. Replaced by revised statement."></textarea></div>
          <div id="pslCanErr" style="color:var(--danger); font-size:12px; display:none;"></div>
        </div>
        <div class="cp-modal-footer">
          <button class="cp-btn secondary" id="btnCancelCanPsl">Back</button>
          <button class="cp-btn danger" id="btnConfirmCancelPsl">&#x2714; Cancel Payslip</button>
        </div>
      </div>
    </div>
  `;

  document.getElementById('btnCloseCanPsl').addEventListener('click', closeModal);
  document.getElementById('btnCancelCanPsl').addEventListener('click', closeModal);
  document.getElementById('btnConfirmCancelPsl').addEventListener('click', async () => {
    const reason = document.getElementById('pslCanReason').value.trim();
    if (!reason) {
      document.getElementById('pslCanErr').textContent = 'Please provide reason for cancellation.';
      document.getElementById('pslCanErr').style.display = 'block';
      return;
    }

    payslip.status = 'cancelled';
    payslip.cancelReason = reason;
    payslip.cancelledBy = state.auth.user ? state.auth.user.name : 'Super Admin';
    payslip.cancelledAt = new Date().toISOString();

    // If linked to an expense, cancel the expense as well
    if (payslip.linkedExpenseId) {
      const exp = state.expenses.find(e => e.id === payslip.linkedExpenseId);
      if (exp) {
        exp.status = 'cancelled';
        exp.cancelReason = `Payslip #${payslip.payslipNo} cancelled`;
        await safeSet(STORE_KEY_EXPENSES, state.expenses);
      }
    }

    await safeSet(STORE_KEY_PAYSLIPS, state.payslips);
    await logAudit('CANCEL_PAYSLIP', 'payslip', payslip.id, `Cancelled Payslip #${payslip.payslipNo}: ${reason}`);
    closeModal();
  });
}

            <button class="cp-btn secondary" id="btnQueryFromDoc" style="color:#B45309;">Raise Query</button>
          ` : ''}

          ${payslip.status === 'approved' && canApprove() ? `
            <button class="cp-btn success" id="btnPayFromDoc">Mark as Paid</button>
          ` : ''}

          <button class="cp-btn accent" id="btnPrintPayslip">&#x1F5A8;&#xFE0F; Print / Save as PDF</button>
        </div>
      </div>
    </div>
  `;

  document.getElementById('btnCloseViewPsl').addEventListener('click', closeModal);
  document.getElementById('btnCloseViewPsl2').addEventListener('click', closeModal);
  document.getElementById('btnPrintPayslip').addEventListener('click', () => window.print());

  const btnAck = document.getElementById('btnAckFromDoc');
  if (btnAck) btnAck.addEventListener('click', () => openModal('acknowledgePayslip', { payslip }));

  const btnQry = document.getElementById('btnQueryFromDoc');
  if (btnQry) btnQry.addEventListener('click', () => openModal('raisePayrollQuery', { payslip }));

  const btnApp = document.getElementById('btnApproveFromDoc');
  if (btnApp) btnApp.addEventListener('click', () => openModal('approvePayslip', { payslip }));

  const btnPay = document.getElementById('btnPayFromDoc');
  if (btnPay) btnPay.addEventListener('click', () => openModal('payPayslip', { payslip }));
}

    catSel.innerHTML = cats.map(c => `<option value="${escapeHtml(c)}">${escapeHtml(c)}</option>`).join('');

    const cat = document.getElementById('expCategory').value;
    const desc = document.getElementById('expDesc').value.trim();
    const amt = Number(document.getElementById('expAmount').value || 0);

    const dept = document.getElementById('expDept').value;
    const method = document.getElementById('expMethod').value;
    const errEl = document.getElementById('expFormErr');

    if (!desc || amt <= 0) {
      errEl.textContent = 'Please fill all required fields.';
      errEl.style.display = 'block';
      return;
    }
    if (isPeriodLocked(dateStr)) {
      errEl.textContent = 'Financial period is locked. Modifications prohibited.';
      errEl.style.display = 'block';

      paymentMethod: method,
      status: initialStatus,
      createdBy: state.auth.user ? state.auth.user.name : 'Super Admin',
      createdAt: new Date().toISOString()
    };

    state.expenses.push(exp);
    await safeSet(STORE_KEY_EXPENSES, state.expenses);
    await logAudit('RECORD_EXPENSE', 'expense', exp.id, `${exp.description} (₦${exp.amount})`, null, exp);
    closeModal();
  });

            <div class="cp-field"><label>Programme *</label><select id="enrolProg">${state.programmes.map(p => `<option value="${p.id}" ${enquiry && enquiry.programmeId === p.id ? 'selected' : ''}>${escapeHtml(p.name)}</option>`).join('')}</select></div>
            <div class="cp-field"><label>Assigned Cohort / Batch *</label><input id="enrolCohort" value="${cohortDefault}" /></div>
          </div>

          <div class="cp-row2">
            <div class="cp-field"><label>Enrolment Date *</label><input type="date" id="enrolDate" value="${todayStr}" /></div>
            <div class="cp-field"><label>Student ID Tag</label><input id="enrolTag" value="CLP-${curYear}-${state.counters.student + 1}" readonly /></div>
          </div>

          <div class="cp-field"><label>Admissions Notes</label><textarea id="enrolNotes" rows="2" placeholder="Enrolment finalized after tuition settlement."></textarea></div>
          <div id="enrolFormErr" style="color:var(--danger); font-size:12px; display:none;"></div>
        </div>
        <div class="cp-modal-footer">
          <button class="cp-btn secondary" id="btnCancelEnrol">Cancel</button>
          <button class="cp-btn success" id="btnConfirmEnrol">&#x2714; Enrol Student</button>
        </div>
      </div>
    </div>
  `;

  document.getElementById('btnCloseEnrolMod').addEventListener('click', closeModal);
  document.getElementById('btnCancelEnrol').addEventListener('click', closeModal);

  document.getElementById('btnConfirmEnrol').addEventListener('click', async () => {
    const name = document.getElementById('enrolName').value.trim();
    const progId = document.getElementById('enrolProg').value;
    const prog = state.programmes.find(p => p.id === progId) || { name: 'General Tech Programme' };
    const cohort = document.getElementById('enrolCohort').value.trim();
    const dateStr = document.getElementById('enrolDate').value;
    const tag = document.getElementById('enrolTag').value;
    const notes = document.getElementById('enrolNotes').value.trim();

    if (!name || !cohort) {
      document.getElementById('enrolFormErr').textContent = 'Please fill student name and cohort batch.';
      document.getElementById('enrolFormErr').style.display = 'block';
      return;
    }

    state.counters.student += 1;

    const enrolment = {
      id: 'enr_' + Date.now(),
      tenant_id: DEFAULT_TENANT_ID,
      studentId: tag,
      enquiryId: enquiry ? enquiry.id : null,
      studentName: name,
      programmeId: progId,
      programmeName: prog.name,
      cohort,
      enrolmentDate: dateStr,
      notes,
      enrolledBy: state.auth.user ? state.auth.user.name : 'Admissions Officer',
      createdAt: new Date().toISOString()
    };

    state.enrolments.push(enrolment);

    if (enquiry) {
      const enq = state.enquiries.find(e => e.id === enquiry.id);
      if (enq) {
        enq.status = 'ENROLLED';
        enq.timeline = enq.timeline || [];
        enq.timeline.push({ stage: 'ENROLLED', note: `Enrolled in ${cohort} (${tag})`, timestamp: new Date().toISOString(), actor: state.auth.user ? state.auth.user.name : 'Admissions' });
        await safeSet(STORE_KEY_ENQUIRIES, state.enquiries);
      }
    }

    await safeSet(STORE_KEY_ENROLMENTS, state.enrolments);
    await safeSet(STORE_KEY_COUNTERS, state.counters);
    await logAudit('ENROL_STUDENT', 'enrolment', enrolment.id, `Enrolled ${enrolment.studentName} (${tag}) in ${cohort}`, null, enrolment);

    closeModal();
  });
}

          </div>

          <div class="cp-field"><label>Default Invoice Instructions</label><input id="accInstructions" placeholder="Please use invoice number as your payment reference." value="${escapeHtml(isEdit ? existingAcc.instructions : 'Please use invoice number as your payment reference.')}" /></div>
          <div class="cp-field" style="margin-top:6px;">
            <label style="display:flex; align-items:center; gap:6px; cursor:pointer;">
              <input type="checkbox" id="accIsDefault" ${isEdit && existingAcc.isDefault ? 'checked' : ''} />
              <span>Set as default account on new invoices</span>
            </label>
          </div>
          <div id="accFormErr" style="color:var(--danger); font-size:12px; display:none;"></div>
        </div>
        <div class="cp-modal-footer">
          <button class="cp-btn secondary" id="btnCancelAcc">Cancel</button>
          <button class="cp-btn accent" id="btnSaveAcc">&#x2714; ${isEdit ? 'Save Changes' : 'Add Payment Account'}</button>
        </div>
      </div>
    </div>
  `;

  document.getElementById('btnCloseAccMod').addEventListener('click', closeModal);
  document.getElementById('btnCancelAcc').addEventListener('click', closeModal);

  document.getElementById('btnSaveAcc').addEventListener('click', async () => {
    const bank = document.getElementById('accBank').value.trim();
    const name = document.getElementById('accName').value.trim();
    const num = document.getElementById('accNumber').value.trim();
    const type = document.getElementById('accType').value;
    const curr = document.getElementById('accCurrency').value;
    const inst = document.getElementById('accInstructions').value.trim();
    const isDef = document.getElementById('accIsDefault').checked;
    const errEl = document.getElementById('accFormErr');

    if (!bank || !name || !num) {
      errEl.textContent = 'Please fill bank name, account name, and account number.';
      errEl.style.display = 'block';
      return;
    }

    if (isDef) {
      state.paymentAccounts.forEach(a => { a.isDefault = false; });
    }

    if (isEdit) {
      existingAcc.bankName = bank;
      existingAcc.accountName = name;
      existingAcc.accountNumber = num;
      existingAcc.accountType = type;
      existingAcc.currency = curr;
      existingAcc.instructions = inst;
      if (isDef) existingAcc.isDefault = true;
      await logAudit('EDIT_PAYMENT_ACCOUNT', 'payment_account', existingAcc.id, `Updated ${bank} account`);
    } else {
      const newAcc = {
        id: 'acc_' + Date.now(),
        tenant_id: DEFAULT_TENANT_ID,
        bankName: bank,
        accountName: name,
        accountNumber: num,
        accountType: type,
        currency: curr,
        instructions: inst,
        isActive: true,
        isDefault: isDef || state.paymentAccounts.length === 0,
        createdAt: new Date().toISOString(),
        createdBy: state.auth.user ? state.auth.user.name : 'Super Admin'
      };
      state.paymentAccounts.push(newAcc);
      await logAudit('ADD_PAYMENT_ACCOUNT', 'payment_account', newAcc.id, `Added ${bank} account`);
    }

    await safeSet(STORE_KEY_PAYMENT_ACCOUNTS, state.paymentAccounts);
    closeModal();
  });
}

      await logAudit('ADD_COLLECTION_NOTE', 'collection_note', inv.id, text);
      renderCollectionNotesModal(container, inv);
    }
  });
}

function renderSupabaseModal(container) {
  container.innerHTML = `
    <div class="cp-modal-overlay">
      <div class="cp-modal">
        <div class="cp-modal-header">
          <div class="cp-modal-title">&#x26A1; Supabase Cloud Database &amp; Health Check</div>

        </div>
        <div class="cp-modal-body">
          <div class="cp-field"><label>REST URL Endpoint</label><input id="sbUrl" value="${escapeHtml(state.supabase.endpoint)}" /></div>
          <div class="cp-field"><label>Anonymous API Key</label><input id="sbKey" type="password" placeholder="eyJhbGciOiJIUzI1NiIsIn..." value="${escapeHtml(state.supabase.anonKey || '')}" /></div>
          <div id="sbStatusBox" style="background:#FAFBFD; border:1px solid var(--border); border-radius:var(--radius-sm); padding:12px; font-size:12px; color:var(--text-secondary); margin-top:10px;">
            Connection Status: <strong>${state.supabase.status === 'connected' ? 'Connected (Cloud Postgres)' : 'Local Offline Mode'}</strong>
          </div>
        </div>
        <div class="cp-modal-footer">

          <button class="cp-btn accent" id="btnTestSb">&#x2714; Save &amp; Test Connection</button>
        </div>
      </div>
    </div>
  `;

  document.getElementById('btnCloseSbMod').addEventListener('click', closeModal);
  document.getElementById('btnCancelSb').addEventListener('click', closeModal);
  document.getElementById('btnTestSb').addEventListener('click', async () => {
    state.supabase.endpoint = document.getElementById('sbUrl').value.trim();
    state.supabase.anonKey = document.getElementById('sbKey').value.trim();
    await safeSet(STORE_KEY_SUPABASE_CONFIG, state.supabase);
    alert('Supabase configuration updated.');
    closeModal();
  });
}



  // ----------------------------------------------------
  // INITIALIZATION ON DOM READY
  // ----------------------------------------------------
  if (typeof window !== 'undefined') {
    window.addEventListener('DOMContentLoaded', () => {
      loadAll();
    });
  }

  // Export module for unit testing in Node environment
  if (typeof module !== 'undefined' && module.exports) {
    module.exports = {
      state,
      safeRound,
      fmtMoney,
      formatDocNo,
      invoiceBalance,
      invoiceStatus,
      getEnquiryFinancialStatus,
      getEnquiryNextAction,
      getReceivableAgeing,
      getInvoicePaymentAccount,
      calculatePayslipTotals,
      integratePayslipExpense,
      getFinancialMetrics,
      getStudentAccountSummaries,
      searchGlobalEntities,
      DEFAULT_FINANCE_SETTINGS,
      DEFAULT_PAYMENT_ACCOUNTS,
      DEFAULT_PERSONNEL_DIRECTORY
    };
  }
})();
</script>
